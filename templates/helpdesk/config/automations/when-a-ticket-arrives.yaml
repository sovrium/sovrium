# The moment a ticket lands — from the public form or added by the team:
#
# 1. It is stamped with when it arrived and when its first reply is due, four
#    hours later. The Queue and All tickets read both.
# 2. The team's inbox is told, with who wrote in and about what.
#
# The requester is deliberately not emailed here. Their address comes from a
# public form, so anyone can type someone else's: an automatic copy would let a
# stranger make your domain mail their text to any inbox. The confirmation page
# tells the requester the ticket arrived; a person replies by email later.
# Replace support@example.com with your own team's address.
#
# A form submission's record trigger carries the answers only, so the ticket's
# id is read back from the table before it is updated.
name: when-a-ticket-arrives
label: New ticket — set its due time and tell the team
description: Stamp a new ticket with its arrival and first-reply due time, then tell the team's inbox.
enabled: true
trigger:
  type: record
  table: tickets
  events:
    - create
actions:
  - name: arrivedAt
    type: date
    operator: now
    props: {}
  - name: replyDue
    type: date
    operator: add
    props:
      input: '{{arrivedAt.instant}}'
      hours: 4
  - name: stampTicket
    type: record
    operator: update
    props:
      table: tickets
      filter:
        conditions:
          - field: id
            operator: equals
            value: '{{trigger.data.record.id}}'
      data:
        opened_at: '{{arrivedAt.instant}}'
        first_reply_due: '{{replyDue.instant}}'
  - name: emailTeam
    type: email
    operator: send
    props:
      to: support@example.com
      subject: 'New ticket: {{trigger.data.record.subject}}'
      body: |
        <p><strong>{{trigger.data.record.subject}}</strong> came in from
        {{trigger.data.record.requester_name}} ({{trigger.data.record.requester_email}}).</p>
        <p>Its first reply is due in four hours. It waits in the Queue.</p>
