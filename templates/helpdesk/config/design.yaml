# Tallyline Support — the design system of this app.
#
# `baseline: extend` keeps Sovrium's built-in design system and changes only
# what is declared here. Type stays on the two faces the platform already
# self-hosts (IBM Plex Sans and JetBrains Mono): no family is pulled from a
# font CDN, which would leak every visitor's address to a third party.
#
# Two people meet here without ever seeing the same screen: someone with a
# problem, and the person who answers it. The public side is quiet and
# reassuring; the team side is a working queue that spends its emphasis on
# the few tickets that are late.
#
# One accent, a rose. Rose sits next to the usual "this failed" red, so the
# error colour moves to a darker, browner brick: sending a ticket and a failed
# send are never the same colour.
baseline: extend

# Follow the operating system's light or dark preference. `darkColors` below is
# what the dark scheme paints; without `colorScheme` it would never render.
colorScheme: system

# Role keys repaint the prestyled components (the board, the grid, the KPI
# cards, buttons, badges and the public form) with no class changes anywhere
# else in the config.
#
# Every role is spelled out in BOTH schemes. `primary` and friends derive a
# white `-foreground` companion in the light scheme only, which reads wrong on
# a pale dark-mode accent — so the dark block names every companion itself.
# `primary-active` is declared too: left out, a pressed button would fall back
# to the platform's achromatic default for a frame.
colors:
  primary: oklch(0.52 0.16 10)
  primary-hover: oklch(0.46 0.15 10)
  primary-active: oklch(0.42 0.14 10)
  primary-foreground: oklch(0.985 0.003 10)
  primary-subtle: oklch(0.95 0.03 10)
  primary-subtle-foreground: oklch(0.38 0.12 10)
  ring: oklch(0.6 0.16 10)
  background: oklch(0.985 0.003 10)
  background-subtle: oklch(0.967 0.005 10)
  background-raised: oklch(1 0 0)
  background-overlay: oklch(1 0 0)
  background-inset: oklch(0.925 0.008 10)
  foreground: oklch(0.21 0.008 10)
  foreground-muted: oklch(0.45 0.012 10)
  foreground-subtle: oklch(0.51 0.012 10)
  foreground-disabled: oklch(0.71 0.012 10)
  foreground-inverse: oklch(0.985 0.003 10)
  border: oklch(0.925 0.008 10)
  success: oklch(0.52 0.12 155)
  warning: oklch(0.5 0.12 75)
  error: oklch(0.53 0.17 38)
  destructive-foreground: oklch(0.985 0.003 10)

darkColors:
  primary: oklch(0.78 0.12 10)
  primary-hover: oklch(0.83 0.09 10)
  primary-active: oklch(0.87 0.07 10)
  primary-foreground: oklch(0.16 0.006 10)
  primary-subtle: oklch(0.28 0.06 10)
  primary-subtle-foreground: oklch(0.9 0.06 10)
  ring: oklch(0.72 0.13 10)
  background: oklch(0.16 0.006 10)
  background-subtle: oklch(0.19 0.007 10)
  background-raised: oklch(0.21 0.008 10)
  background-overlay: oklch(0.23 0.008 10)
  background-inset: oklch(0.13 0.005 10)
  foreground: oklch(0.95 0.005 10)
  foreground-muted: oklch(0.75 0.01 10)
  foreground-subtle: oklch(0.68 0.012 10)
  foreground-disabled: oklch(0.45 0.01 10)
  foreground-inverse: oklch(0.16 0.006 10)
  border: oklch(0.3 0.01 10)
  success: oklch(0.75 0.12 155)
  warning: oklch(0.8 0.12 75)
  error: oklch(0.72 0.14 38)
  destructive-foreground: oklch(0.16 0.006 10)

# What each colour is for. Writing the usage down is what stops the accent from
# becoming a status colour, and an outcome colour from becoming decoration.
colorRoles:
  primary:
    usage: The one accent. Primary action fill, the current nav entry, the focus ring, the Send ticket button. Never a status and never a priority.
    pairsWith: primary-foreground
  primary-subtle:
    usage: Selected and current states on quiet surfaces — the current page, the queue tab in use, the column a ticket is dragged over.
    pairsWith: primary-subtle-foreground
  success:
    usage: A ticket marked Resolved, a submission received, and nothing else.
    pairsWith: foreground
  warning:
    usage: A first response due within the hour.
    pairsWith: foreground
  error:
    usage: A first response overdue, an Urgent ticket still open, a failed submission, a destructive action.
    pairsWith: foreground

# Sans for every sentence, mono for ticket numbers, times, counts and
# overlines, so a column of times lines up.
typeScale:
  families:
    sans:
      family: "'IBM Plex Sans Variable', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    mono:
      family: "'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
  steps:
    display: { size: 2rem, lineHeight: 1.1, weight: 600, letterSpacing: -0.02em }
    h1: { size: 1.375rem, lineHeight: 1.2, weight: 600, letterSpacing: -0.01em }
    h2: { size: 1.0625rem, lineHeight: 1.3, weight: 600 }
    h3: { size: 0.875rem, lineHeight: 1.35, weight: 600 }
    lead: { size: 0.9375rem, lineHeight: 1.5 }
    body: { size: 0.875rem, lineHeight: 1.5 }
    bodySmall: { size: 0.8125rem, lineHeight: 1.45 }
    caption: { size: 0.75rem, lineHeight: 1.4 }
    overline: { size: 0.6875rem, lineHeight: 1.3, weight: 500, letterSpacing: 0.04em, font: mono }

# Soft corners: a friendly desk for someone with a problem, not a ledger.
radius:
  sm: 0.5rem
  md: 0.75rem
  lg: 1rem
  full: 9999px

# Cards carry a one-pixel lift; overlays float clearly above the page.
elevation:
  none: none
  sm: 0 1px 2px rgb(20 20 30 / 0.06)
  md: 0 4px 12px rgb(20 20 30 / 0.08)
  lg: 0 12px 32px rgb(20 20 30 / 0.14)

# Who sees which page. The three team pages are the product; everything else —
# the public form, the confirmation, the rating page and sign-in — is the
# public side, which also refuses internal words. The most specific pattern
# wins, and `everything else` comes last.
zones:
  - pattern: /triage
    zone: product
    accentBudget: product
  - pattern: /tickets
    zone: product
    accentBudget: product
  - pattern: /reports
    zone: product
    accentBudget: product
  - pattern: everything else
    zone: marketing
    accentBudget: public
    voice:
      avoid:
        - No internal vocabulary on the public side — no "triage", no "queue", no "SLA".

# A coloured option is an outlined chip with a dot of its colour, so a column
# of states stays quiet and only the dot tells them apart.
badgeForm: outline-dot

# An agent reads a card for four facts — subject, requester, who holds it,
# when it is due — so the team pages run at `cozy`; a stranger reads the
# public form once, so the public side runs at `roomy`. The three steps are the
# platform's own values, written out so one number can be tuned.
density:
  default: cozy
  steps:
    compact: { rowY: 5px, controlH: 36px, buttonH: 28px, gap: 7px, text: 11px }
    cozy: { rowY: 8px, controlH: 40px, buttonH: 32px, gap: 10px, text: 13px }
    roomy: { rowY: 14px, controlH: 44px, buttonH: 36px, gap: 16px, text: 14px }
  byZone:
    product: cozy
    marketing: roomy

# How the app speaks. Nothing reads these at runtime; they are the brief anyone
# writing a label, an empty state or an error message for this app follows.
voice:
  personality:
    - reassuring
    - precise
    - human
  pronoun: you
  prefer:
    - 'Lead a button with its verb: Send ticket, Assign to me, Mark resolved.'
    - Say when the requester will hear back, and keep the promise the app can keep.
    - Every empty state names the one next action.
  avoid:
    - No exclamation marks, no "Oops", no ticket-as-case-number jargon on the public side.
    - Never promise a reply channel the app does not have (no "just reply to this email").
    - Never blame the requester for a missing detail; ask for it.
  tone:
    empty: Say what this queue will hold, then the one action that fills it.
    loading: Name what is loading — the queue, the tickets — never a bare spinner.
    error: State what did not send and the one thing that fixes it; keep what the person typed.
    success: Confirm in past tense what happened and when they will hear back.
    destructive: Name the ticket and whether it comes back.

principles:
  - The requester always knows what happens next and when.
  - Every open ticket shows who holds it and when its answer is due.
  - Colour means an outcome — resolved, due soon, overdue — or it is not used.
  - The queue is understood without a tour.
