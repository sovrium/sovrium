# One question once a ticket is resolved. The resolution email links to
# `/rate?ticket=<id>`; the ticket rides into the rating from the link, so the
# requester only picks a score.
#
# Treat the rating as a signal, not a proof. The requester has no account, and
# ticket ids are sequential numbers, so the link is not a secret: anyone can
# open `/rate?ticket=5` and rate ticket 5. A ticket takes one rating only
# (`unique` on `ratings.ticket`), which stops a link passed around from
# piling up scores, but it also means whoever rates first is the one counted.
# The form cannot check that the person rating is the person who wrote in, or
# that the ticket is resolved yet. So the team reads each rating next to the
# ticket it rates, and the honeypot drops naive bots.
id: 2
name: rate-answer
title: How did we do?
description: Your ticket is resolved. Tell us whether the answer worked — it takes one click.
access:
  require: all
submitTo:
  table: ratings
antiSpam:
  honeypot: true
display:
  submitLabel: Send rating
onSuccess:
  type: successPage
  title: Thank you
  message: Your rating is with the team. It helps us answer the next ticket better.
prefill:
  ticket: $query.ticket
fields:
  - kind: table-field
    column: ticket
    hidden: true
  - kind: table-field
    column: score
    required: true
    label: How did we do?
    helpText: 1 is poor, 5 is excellent.
  - kind: table-field
    column: comment
    label: Anything we should know?
