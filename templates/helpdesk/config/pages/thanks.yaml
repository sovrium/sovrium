# Where the public form lands after sending: what was received, and when the
# answer comes.
name: thanks
path: /thanks
meta:
  title: We have your ticket · Tallyline
  description: Your ticket is with the team. A person replies by email within one business day.
components:
  - type: container
    props:
      className: flex min-h-screen flex-col bg-background text-foreground
    children:
      - $ref: ./_site-header.yaml
      - type: container
        element: main
        props:
          className: mx-auto flex w-full max-w-[620px] flex-1 flex-col gap-4 px-6 pt-16 pb-10 max-md:px-4 max-md:pt-8
        children:
          - type: icon
            props:
              name: circle-check
              size: 28
              className: text-success
          - type: text
            element: h1
            props:
              className: text-[30px] font-semibold leading-tight tracking-tight text-foreground max-md:text-2xl
            content: We have your ticket
          - type: text
            element: p
            props:
              className: text-[15px] text-foreground-muted
            content: It is in the team's queue, and a person will reply to the address you gave within one business day.
          - type: container
            children:
              - type: link
                props:
                  href: /
                  className: inline-flex h-8 items-center gap-1.5 rounded-md border border-border px-3 text-[13px] font-medium text-foreground hover:bg-background-subtle
                content: Send another ticket
      - $ref: ./_site-footer.yaml
