# The Queue: every ticket by status, each with who asked, how urgent it is and
# who holds it. Three tabs narrow the board — the tickets nobody holds yet, the
# ones you hold, and all of them — and one filter bar narrows whichever tab is
# open. Every agent lands here after signing in.
name: triage
path: /triage
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Queue · Tallyline Support
  description: Every open ticket by status, with who asked, its priority and who holds it.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Queue
          - type: container
            props:
              className: flex flex-col gap-3 px-5 pb-5 pt-4
            children:
              # Four counts, read on every visit. Urgent counts only the tickets
              # still open: a resolved urgent ticket asks nothing of anyone.
              - type: grid
                props:
                  className: grid grid-cols-2 gap-3 lg:grid-cols-4
                children:
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Open tickets
                    dataSource:
                      table: tickets
                      filter:
                        - { field: status, operator: in, value: [New, Open, Waiting on customer] }
                    kpiAggregate: { function: count }
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Unassigned
                    dataSource:
                      table: tickets
                      filter:
                        - { field: status, operator: in, value: [New, Open, Waiting on customer] }
                        - { field: unassigned, operator: eq, value: 1 }
                    kpiAggregate: { function: count }
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Urgent, still open
                    dataSource:
                      table: tickets
                      filter:
                        - { field: status, operator: in, value: [New, Open, Waiting on customer] }
                        - { field: priority, operator: eq, value: Urgent }
                    kpiAggregate: { function: count }
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Waiting on the customer
                    dataSource:
                      table: tickets
                      filter:
                        - { field: status, operator: eq, value: Waiting on customer }
                    kpiAggregate: { function: count }
              - type: filter-bar
                publishes:
                  bindTo: queue-filter
                fields:
                  - { name: subject, label: Search tickets, kind: text }
                  - name: priority
                    label: Priority
                    kind: select
                    options:
                      - { value: Urgent, label: Urgent }
                      - { value: High, label: High }
                      - { value: Normal, label: Normal }
                      - { value: Low, label: Low }
                  - name: category
                    label: Topic
                    kind: select
                    options:
                      - { value: Question, label: Question }
                      - { value: Bug report, label: Bug report }
                      - { value: Billing, label: Billing }
                      - { value: Feature request, label: Feature request }
              - type: tabs
                defaultTab: all
                panels:
                  - { id: unassigned, label: Unassigned }
                  - { id: mine, label: Mine }
                  - { id: all, label: All open }
                # One board per tab: nobody holds it yet, you hold it, and
                # everything. Dragging a card to another column changes its status.
                children:
                  - type: kanban
                    dataSource:
                      table: tickets
                      bindTo: queue-filter
                      sharedFilter: {}
                      filter:
                        - { field: unassigned, operator: eq, value: 1 }
                    kanbanGroupBy:
                      field: status
                      # Resolved and closed tickets are done; they stay one click away.
                      collapsed: [Resolved, Closed]
                      columnSizing: fill
                      columnWidths: { Resolved: 9rem, Closed: 9rem }
                    drag:
                      enabled: true
                      persistAction:
                        type: crud
                        operation: update
                        table: tickets
                    emptyColumnMessage: No tickets here.
                    card:
                      children:
                        - type: text
                          element: h3
                          props:
                            className: text-[13px] font-medium leading-[18px] text-foreground
                          content: $record.subject
                        - type: text
                          element: p
                          props:
                            className: text-xs text-foreground-muted
                          content: $record.requester_name · $record.company
                      footer:
                        - { field: priority, format: badge }
                        - { field: assignee }
                  - type: kanban
                    dataSource:
                      table: tickets
                      bindTo: queue-filter
                      sharedFilter: {}
                      filter:
                        - { field: assignee, operator: eq, value: $currentUser.id }
                    kanbanGroupBy:
                      field: status
                      collapsed: [Resolved, Closed]
                      columnSizing: fill
                      columnWidths: { Resolved: 9rem, Closed: 9rem }
                    drag:
                      enabled: true
                      persistAction:
                        type: crud
                        operation: update
                        table: tickets
                    emptyColumnMessage: No tickets here.
                    card:
                      children:
                        - type: text
                          element: h3
                          props:
                            className: text-[13px] font-medium leading-[18px] text-foreground
                          content: $record.subject
                        - type: text
                          element: p
                          props:
                            className: text-xs text-foreground-muted
                          content: $record.requester_name · $record.company
                      footer:
                        - { field: priority, format: badge }
                        - { field: assignee }
                  - type: kanban
                    dataSource:
                      table: tickets
                      bindTo: queue-filter
                      sharedFilter: {}
                    kanbanGroupBy:
                      field: status
                      collapsed: [Resolved, Closed]
                      columnSizing: fill
                      columnWidths: { Resolved: 9rem, Closed: 9rem }
                    drag:
                      enabled: true
                      persistAction:
                        type: crud
                        operation: update
                        table: tickets
                    emptyColumnMessage: No tickets here.
                    card:
                      children:
                        - type: text
                          element: h3
                          props:
                            className: text-[13px] font-medium leading-[18px] text-foreground
                          content: $record.subject
                        - type: text
                          element: p
                          props:
                            className: text-xs text-foreground-muted
                          content: $record.requester_name · $record.company
                      footer:
                        - { field: priority, format: badge }
                        - { field: assignee }
