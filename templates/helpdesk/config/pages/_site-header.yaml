# The bar on every public page: the product's name, the support form and the
# way in for the team. On a phone the form is the page, so only sign-in stays. No internal words here — a requester never sees the
# queue.
type: container
element: header
props:
  className: border-b border-border bg-background
children:
  - type: container
    props:
      className: mx-auto flex h-14 max-w-[1100px] items-center gap-6 px-6 max-md:px-4
    children:
      - type: container
        props:
          className: flex items-center gap-2.5 whitespace-nowrap text-sm font-semibold text-foreground
        children:
          - type: icon
            props:
              name: message-square
              size: 14
              className: box-content rounded-sm bg-primary p-1 text-primary-foreground
          - type: text
            element: span
            content: Tallyline Support
      - type: container
        props:
          className: grow
      - type: container
        element: nav
        props:
          aria-label: Site
          className: flex items-center gap-5 text-sm
        children:
          - type: link
            props:
              href: /
              className: font-medium text-foreground max-md:hidden
            content: Contact support
          - type: link
            props:
              href: /sign-in
              className: whitespace-nowrap text-foreground-muted hover:text-foreground
            content: Team sign-in
