# The page the resolution email links to, `/rate?ticket=<id>`: one question
# about the answer, no account. The form is config/forms/rate-answer.yaml.
name: rate
path: /rate
meta:
  title: Rate this answer · Tallyline
  description: One question about the answer you got from the Tallyline support team.
  favicon: ./favicon.svg
components:
  - type: container
    props:
      className: flex min-h-screen flex-col bg-background text-foreground
    children:
      - $ref: ./_site-header.yaml
      - type: container
        element: div
        props:
          className: mx-auto flex w-full max-w-[620px] flex-1 flex-col gap-5 px-6 pt-12 pb-10 max-md:px-4 max-md:pt-8
        children:
          - type: form
            formRef: rate-answer
            # The form is the whole page, so its title is the page heading.
            props:
              headingLevel: h1
      - $ref: ./_site-footer.yaml
