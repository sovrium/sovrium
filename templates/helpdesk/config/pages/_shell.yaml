# The team's persistent navigation, included at the top of every team page.
#
# A column holding the app's name, the `sidebar` and a sign-out control. The
# sidebar is drawn twice, once per role, and `visibility` keeps exactly one of
# them in each response: an admin also gets Reports, a member does not — and
# the Reports page refuses a member too (`access` on reports.yaml). Both end
# with the public support form, the page requesters see.
#
# On a laptop narrower than `lg` the sidebar shrinks to a column of icons, and
# on a phone (below `md`) it leaves the layout: a menu button opens the same
# entries in a drawer, so the page gets the whole width of the screen.
type: container
element: aside
props:
  className: flex w-[232px] flex-none flex-col gap-0.5 border-r border-border bg-background-subtle px-2.5 py-3 max-lg:w-auto max-md:contents
children:
  - type: container
    props:
      className: mb-2.5 flex h-9 items-center gap-2.5 px-2 text-sm font-semibold text-foreground max-lg:hidden
    children:
      - type: icon
        props:
          name: message-square
          size: 14
          className: box-content rounded-sm bg-primary p-1 text-primary-foreground
      - type: text
        element: span
        content: Tallyline Support
  - type: sidebar
    visibility:
      roles: [admin]
    rail:
      below: lg
    drawer:
      below: md
      label: Menu
    # Sidebar clicks swap only the main region; revisited views open from cache.
    clientSideNavigation: true
    props:
      # Row metrics tuned to a short navigation: 32px rows, 13.5px labels, the
      # current page on the accent's quiet ground, and the Public heading as a
      # small monospace overline.
      className: flex min-h-0 flex-col gap-0.5 md:flex-1
    # Each key names a part the sidebar draws (its rows, group heading and
    # count), so the look survives a change to the engine's markup.
    classes:
      parts:
        link: h-8 gap-2.5 rounded-md px-2.5 text-[13.5px] leading-[var(--text-md--line-height)] text-foreground-muted
        groupLabel: px-2.5 pt-0 pb-1.5 font-mono text-[10.5px] leading-[14px] uppercase tracking-wider text-foreground-subtle
        badge: bg-transparent px-0 font-mono text-[11.5px]
      states:
        current:
          link: bg-primary-subtle font-medium text-primary-subtle-foreground
    groups:
      - landmark: Workspace
        items:
          - label: Queue
            href: /triage
            icon: kanban
            badge:
              endpoint: /api/tables/tickets/records?limit=1&view=open_queue
              valuePath: pagination.total
          - label: All tickets
            href: /tickets
            icon: table
            badge:
              endpoint: /api/tables/tickets/records?limit=1
              valuePath: pagination.total
          - { label: Reports, href: /reports, icon: chart-column }
      - label: Public
        landmark: Workspace
        headingLevel: 2
        items:
          - { label: Support form, href: /, icon: globe }
  - type: sidebar
    visibility:
      roles: [member]
    rail:
      below: lg
    drawer:
      below: md
      label: Menu
    # Sidebar clicks swap only the main region; revisited views open from cache.
    clientSideNavigation: true
    props:
      className: flex min-h-0 flex-col gap-0.5 md:flex-1
    # Each key names a part the sidebar draws (its rows, group heading and
    # count), so the look survives a change to the engine's markup.
    classes:
      parts:
        link: h-8 gap-2.5 rounded-md px-2.5 text-[13.5px] leading-[var(--text-md--line-height)] text-foreground-muted
        groupLabel: px-2.5 pt-0 pb-1.5 font-mono text-[10.5px] leading-[14px] uppercase tracking-wider text-foreground-subtle
        badge: bg-transparent px-0 font-mono text-[11.5px]
      states:
        current:
          link: bg-primary-subtle font-medium text-primary-subtle-foreground
    groups:
      - landmark: Workspace
        items:
          - label: Queue
            href: /triage
            icon: kanban
            badge:
              endpoint: /api/tables/tickets/records?limit=1&view=open_queue
              valuePath: pagination.total
          - label: All tickets
            href: /tickets
            icon: table
            badge:
              endpoint: /api/tables/tickets/records?limit=1
              valuePath: pagination.total
      - label: Public
        landmark: Workspace
        headingLevel: 2
        items:
          - { label: Support form, href: /, icon: globe }
  - type: container
    props:
      className: mt-auto flex items-center justify-end gap-2.5 border-t border-border px-2 py-2.5 text-sm text-foreground-muted max-lg:hidden
    children:
      - type: button
        variant: ghost
        props:
          className: h-7 px-2 text-xs
        content: Sign out
        action:
          type: auth
          method: logout
          onSuccess:
            navigate: /sign-in
