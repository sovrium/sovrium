# Sample leads for the automation demo.
#
# `key` is file-local — it exists so other seed files can name a row before it
# has a database id, and it is never written to a column. Nothing links to leads
# here, but the key is still what every refusal message quotes, so it is worth
# making it readable.
#
# `source` is spread across all four options and `status` across all four on
# purpose: both columns are declared `filterable` on /activity, and a filter
# control over a column where every row holds the same value demonstrates
# nothing about filtering.
#
# There are no dates in this file. `created_at` is a `created-at` field — the
# engine stamps it on insert and a seeded value would be discarded — so every
# row's "Captured" column reads as the moment the seed ran. That is the honest
# behaviour, not an omission.
records:
  - key: nadia-okonkwo
    fields:
      name: Nadia Okonkwo
