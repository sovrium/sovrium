# One week of runs, oldest first: 17 lines across three of the four recipes.
#
# Each line has the shape the recipes write. Recipes 1, 2 and 3 add their own
# line when they succeed; recipe 2 marks a run Retried when its email needed a
# second try; recipe 4 writes the line of a run that failed after its last
# retry. That is why no line names `alert-on-failure`: it writes the failed
# run's line, not one of its own.
#
# What a live line cannot carry: the run id (`reference`) and the duration.
# No step can read its own run's id or timing, so those two columns are filled
# only here, copied from the admin console where every run is kept in full.
#
# The week in figures, which the four figures on Activity recompute from this
# table: 17 runs, 15 succeeded, 1 retried then succeeded, 1 failed after 3
# attempts (lead #6, Sofia Ricci: the mailbox rejected the sender), the oldest
# on Thursday a week ago. Times are relative to the moment the seed runs.
