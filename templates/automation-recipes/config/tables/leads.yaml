# The leads the recipes capture. A lead arrives by the webhook (recipe 1), by
# an import, or is typed in by hand; every new row, whatever its source, runs
# recipe 2.
id: 1
name: leads
fields:
  - id: 1
    name: name
    type: single-line-text
    required: true
  - id: 2
    name: email
    type: email
  - id: 3
    name: company
    type: single-line-text
  - id: 4
    name: source
    type: single-select
    options:
      - Webhook
      - Import
      - Referral
    default: Webhook
  # When the lead reached the app. A seeded lead carries the moment it came in;
  # a lead the webhook writes takes the time of the request.
  - id: 5
    name: captured_at
    type: datetime

# Members read and add leads; only an admin deletes one.
permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
    - member
  delete:
    - admin
