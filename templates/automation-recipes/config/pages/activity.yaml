# What ran: four figures over the whole log, then every run, newest first,
# with its recipe, its outcome and one line of why. The run that needed a
# second try reads Retried; the run that ran out of tries reads Failed, with
# the error its failing step returned.
#
# `/activity?record=<id>` opens one run in a drawer over the list — its
# attempts, its duration, the lead it concerned and the error word for word —
# so a failed run can be sent to someone as a link.
name: activity
path: /activity
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Activity · Kerlo Automations
  description: Every run of the recipes, with its outcome and why.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: font-mono text-[15px] font-semibold text-foreground
                content: Activity
              - type: container
                props:
                  className: grow
              # Runs recipe 5 (config/automations/review-recent-leads.yaml):
              # one line per lead lands in the list below.
              - type: button
                content: Review latest leads
                variant: outline
                props:
                  className: h-7 px-3 text-[13px]
                action:
                  type: automation
                  name: review-recent-leads
                  onSuccess:
                    toast:
                      message: The latest leads were reviewed. Each has its line in the log.
                      variant: success
              # The platform keeps every run in full — each step, its input and
              # output — in the admin console. Admins only.
              - type: link
                props:
                  href: /_admin/automations
                  className: inline-flex h-7 items-center gap-1.5 rounded-md border border-border bg-background-raised px-3 text-[13px] font-medium text-foreground no-underline hover:bg-background-subtle
                content: Open the admin history
          - type: container
            props:
              className: flex flex-col gap-3 px-5 pb-5 pt-4
            children:
              # Four figures, recomputed from the log on every visit. A failed
              # run keeps its own figure, so a green total never hides it.
              - type: grid
                props:
                  className: grid grid-cols-2 gap-3 lg:grid-cols-4
                children:
                  - type: kpi
                    label: Runs in the log
                    dataSource:
                      table: activity_log
                    kpiAggregate: { function: count }
                    kpiFormat: { type: number }
                  - type: kpi
                    label: Succeeded
                    dataSource:
                      table: activity_log
                      filter:
                        - { field: outcome, operator: eq, value: Succeeded }
                    kpiAggregate: { function: count }
                    kpiFormat: { type: number }
                  - type: kpi
                    label: Succeeded after a retry
                    dataSource:
                      table: activity_log
                      filter:
                        - { field: outcome, operator: eq, value: Retried }
                    kpiAggregate: { function: count }
                    kpiFormat: { type: number }
                  - type: kpi
                    label: Failed after retries
                    dataSource:
                      table: activity_log
                      filter:
                        - { field: outcome, operator: eq, value: Failed }
                    kpiAggregate: { function: count }
                    kpiFormat: { type: number }
              - type: filter-bar
                publishes:
                  bindTo: runs-filter
                fields:
                  - { name: reference, label: Run id, kind: text }
                  - name: recipe
                    label: Recipe
                    kind: select
                    options:
                      - { value: capture-lead-from-webhook, label: capture-lead-from-webhook }
                      - { value: log-new-lead, label: log-new-lead }
                      - { value: daily-digest, label: daily-digest }
                      - { value: alert-on-failure, label: alert-on-failure }
                  - name: outcome
                    label: Outcome
                    kind: select
                    options:
                      - { value: Succeeded, label: Succeeded }
                      - { value: Retried, label: Retried }
                      - { value: Failed, label: Failed }
              - type: text
                element: h2
                props:
                  className: pt-1 font-mono text-[11px] font-medium uppercase tracking-wider text-foreground-muted
                content: Runs, newest first
              - type: list
                dataSource:
                  table: activity_log
                  bindTo: runs-filter
                  sort:
                    - { field: logged_at, direction: desc }
                  limit: 20
                listDisplay:
                  loadMore: button
                  emptyMessage: Each run of a recipe appears here with its outcome and why. POST a lead to the webhook to run the first two recipes.
                  itemTemplate:
                    title: $record.recipe
                    badge: $record.outcome
                    subtitle: $record.detail
                    metadata:
                      - { field: reference, format: text }
                      - { field: logged_at, format: datetime }
          # One run, opened over the list.
          - type: drawer
            id: run-detail
            drawerSide: right
            drawerSize: md
            canEdit: false
            dataSource:
              table: activity_log
            props:
              title: $record.recipe
            recordFields:
              - { name: recipe, type: single-select, label: Recipe }
              - { name: outcome, type: single-select, label: Outcome }
              - { name: attempts, type: integer, label: Attempts }
              - { name: error, type: single-line-text, label: Error }
              - { name: detail, type: single-line-text, label: What happened }
              - { name: lead, type: relationship, label: Lead }
              - { name: logged_at, type: datetime, label: Logged }
              - { name: duration_ms, type: integer, label: Duration (ms) }
              - { name: reference, type: single-line-text, label: Run id }
