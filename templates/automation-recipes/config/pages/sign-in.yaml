# The way in. Sign-up is closed (config/auth.yaml), so this page only signs
# people in; an admin adds new accounts with `sovrium admin create`. Everyone
# lands on Activity, the runs being the first thing an operator checks.
name: sign-in
path: /sign-in
meta:
  title: Sign in · Kerlo Automations
  description: Sign in to Kerlo Automations.
components:
  - type: container
    element: main
    props:
      className: flex min-h-screen items-center justify-center bg-background-subtle px-5 py-12
    children:
      - type: container
        props:
          className: flex w-full max-w-sm flex-col gap-6 rounded-lg border border-border bg-background-raised p-6 shadow-sm
        children:
          - type: container
            props:
              className: flex items-center gap-2.5 text-sm font-semibold text-foreground
            children:
              - type: icon
                props:
                  name: zap
                  size: 14
                  className: box-content rounded-sm bg-primary p-1 text-primary-foreground
              - type: text
                element: span
                content: Kerlo Automations
          - type: text
            element: h1
            props:
              className: text-[22px] font-semibold tracking-tight text-foreground
            content: Sign in
          - type: form
            props:
              id: sign-in-form
            action:
              type: auth
              method: login
              strategy: email
              onSuccess:
                navigate: /activity
