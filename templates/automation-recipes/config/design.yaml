# Kerlo Automations — the design system of this app.
#
# `baseline: extend` keeps Sovrium's built-in design system and changes only
# what is declared here. Type stays on the two faces the platform already
# self-hosts (IBM Plex Sans and JetBrains Mono): no family is pulled from a
# font CDN, which would leak every visitor's address to a third party.
#
# The accent is an olive lime, and it is spent on actions only: the primary
# button, the current page, the focus ring. Colour otherwise means a run
# outcome — succeeded, retried, failed — and nothing else. `success` sits on a
# different hue from the accent on purpose: a run that worked must never read
# as the brand colour.
baseline: extend

# Follow the operating system's light or dark preference. `darkColors` below is
# what the dark scheme paints.
colorScheme: system

# Role keys repaint the prestyled components (list, grid, drawer, cards,
# buttons, badges) with no class changes anywhere else in the config.
#
# Every role is spelled out in BOTH schemes. `primary` and friends derive a
# white `-foreground` companion in the light scheme only, which reads wrong on
# a pale dark-mode accent, so the dark block names every companion itself.
# The `background-*` spellings are used rather than `card`, `popover` or
# `muted`, which would derive a white companion too. `primary-active` and
# `destructive-foreground` are declared as well: left out, a pressed button
# would fall back to the platform's default.
colors:
  primary: oklch(0.52 0.16 125)
  primary-hover: oklch(0.46 0.15 125)
  primary-active: oklch(0.42 0.14 125)
  primary-foreground: oklch(0.985 0.003 125)
  primary-subtle: oklch(0.95 0.03 125)
  primary-subtle-foreground: oklch(0.38 0.12 125)
  ring: oklch(0.6 0.16 125)
  background: oklch(0.985 0.003 125)
  background-subtle: oklch(0.967 0.005 125)
  background-raised: oklch(1 0 0)
  background-overlay: oklch(1 0 0)
  background-inset: oklch(0.925 0.008 125)
  foreground: oklch(0.21 0.008 125)
  foreground-muted: oklch(0.45 0.012 125)
  foreground-subtle: oklch(0.51 0.012 125)
  foreground-disabled: oklch(0.71 0.012 125)
  foreground-inverse: oklch(0.985 0.003 125)
  border: oklch(0.925 0.008 125)
  success: oklch(0.52 0.1 170)
  warning: oklch(0.55 0.12 70)
  error: oklch(0.53 0.17 25)
  destructive-foreground: oklch(0.985 0.003 125)

darkColors:
  primary: oklch(0.78 0.12 125)
  primary-hover: oklch(0.83 0.09 125)
  primary-active: oklch(0.87 0.07 125)
  primary-foreground: oklch(0.16 0.006 125)
  primary-subtle: oklch(0.28 0.06 125)
  primary-subtle-foreground: oklch(0.9 0.06 125)
  ring: oklch(0.72 0.13 125)
  background: oklch(0.16 0.006 125)
  background-subtle: oklch(0.19 0.007 125)
  background-raised: oklch(0.21 0.008 125)
  background-overlay: oklch(0.23 0.008 125)
  background-inset: oklch(0.13 0.005 125)
  foreground: oklch(0.95 0.005 125)
  foreground-muted: oklch(0.75 0.01 125)
  foreground-subtle: oklch(0.68 0.012 125)
  foreground-disabled: oklch(0.45 0.01 125)
  foreground-inverse: oklch(0.16 0.006 125)
  border: oklch(0.3 0.01 125)
  success: oklch(0.75 0.1 170)
  warning: oklch(0.8 0.12 75)
  error: oklch(0.72 0.14 25)
  destructive-foreground: oklch(0.16 0.006 125)

# What each colour is for. Writing the usage down is what stops the accent from
# drifting onto a run outcome, and an outcome colour from becoming decoration.
colorRoles:
  primary:
    usage: The one accent. Primary action fill, active nav item, focus ring, the enabled switch. Never a run outcome.
    pairsWith: primary-foreground
  primary-subtle:
    usage: Selected and current states — the current page, the selected run, the recipe being read.
    pairsWith: primary-subtle-foreground
  success:
    usage: A run that succeeded, and nothing else.
    pairsWith: foreground
  warning:
    usage: A run that failed and is waiting to retry.
    pairsWith: foreground
  error:
    usage: A run that failed after its last retry, a paused recipe after a failure, a destructive action.
    pairsWith: foreground

# Mono-forward: the headings, captions and overlines are set in the mono face,
# because what they name here is configuration — recipe names, triggers, run
# ids, cron expressions. Body text stays in the sans.
typeScale:
  families:
    sans:
      family: "'IBM Plex Sans Variable', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    mono:
      family: "'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
  steps:
    display: { size: 2rem, lineHeight: 1.1, weight: 600, letterSpacing: -0.03em, font: mono }
    h1: { size: 1.375rem, lineHeight: 1.2, weight: 600, letterSpacing: -0.02em, font: mono }
    h2: { size: 1.0625rem, lineHeight: 1.3, weight: 600, font: mono }
    h3: { size: 0.875rem, lineHeight: 1.35, weight: 600 }
    lead: { size: 0.9375rem, lineHeight: 1.5 }
    body: { size: 0.875rem, lineHeight: 1.5 }
    bodySmall: { size: 0.8125rem, lineHeight: 1.45 }
    caption: { size: 0.75rem, lineHeight: 1.4, font: mono }
    overline: { size: 0.6875rem, lineHeight: 1.3, weight: 500, letterSpacing: 0.04em, font: mono }

# The recipe declarations on the public page are code blocks; a light theme
# keeps them on the page's own inset surface instead of a black slab, and the
# dark scheme gets a dark one.
codeBlock:
  theme: github-light
  darkTheme: github-dark

# Standard corners: 4px for controls, 8px for cards, 12px for overlays.
radius:
  sm: 0.25rem
  md: 0.5rem
  lg: 0.75rem
  full: 9999px

# Flat: borders separate things; only overlays (a drawer, a menu) lift.
elevation:
  none: none
  sm: none
  md: 0 0 0 1px rgb(28 40 16 / 0.08)
  lg: 0 12px 32px rgb(28 40 16 / 0.14)

# A coloured option is an outlined chip with a dot of its colour, so a column
# of states stays quiet and only the dot tells them apart.
badgeForm: outline-dot

# A run line carries its outcome, its id, its duration and one line of why, so
# the app runs at the middle step. The three steps are the platform's own
# values, written out so one number can be tuned.
density:
  default: cozy
  steps:
    compact: { rowY: 5px, controlH: 36px, buttonH: 28px, gap: 7px, text: 11px }
    cozy: { rowY: 8px, controlH: 40px, buttonH: 32px, gap: 10px, text: 13px }
    roomy: { rowY: 14px, controlH: 44px, buttonH: 36px, gap: 16px, text: 14px }

# How the app speaks. Nothing reads these at runtime; they are the brief anyone
# writing a label, an empty state or an error message for this app follows.
voice:
  personality:
    - matter-of-fact
    - precise
    - quietly reassuring
  pronoun: you
  prefer:
    - 'Name the trigger and the action: "When a lead arrives by webhook, create a row".'
    - Show the exact value — the cron expression, the run id, the retry count.
    - Every empty state names the one next action.
  avoid:
    - 'No exclamation marks, no "magic", no "zaps".'
    - No claim about another product the page cannot prove.
    - Never hide a failed run behind a green total.
  tone:
    empty: Say what this view will hold, then the one action that fills it.
    loading: Name what is loading — runs, recipes — never a bare spinner.
    error: State which step failed, with its message, and what happens next (retry at, or stopped).
    success: State what ran and what it wrote, in past tense.
    destructive: Name the recipe and say whether its history is kept.

principles:
  - 'A recipe is shown as what it is: a trigger, its steps and the config that declares them.'
  - Every run leaves a line — succeeded, retrying or failed — and the line says why.
  - Colour means a run outcome, or it is not used.
  - The public page explains; the gated page proves.

# Where the accent may be spent. The recipe page and the sign-in page are public
# and explain; the run history and the leads are gated and prove.
zones:
  - pattern: /
    zone: public
    accentBudget: public
  - pattern: /sign-in
    zone: public
    accentBudget: public
  - pattern: /activity
    zone: product
    accentBudget: product
  - pattern: /leads
    zone: product
    accentBudget: product
