# Recipe 4 — a run that failed after its last retry is written down.
#
# Sovrium already emails the people who operate the app when a run fails after
# its retries: every admin, plus the addresses in `SOVRIUM_NOTIFY_TO`. So this
# recipe does not send a second email. It adds the failed run to the activity
# log, with the recipe, the number of attempts and the error the failing step
# returned, so the failure is on the Activity page next to the runs that
# worked. A failure handler never fires for another failure handler, so this
# cannot loop.
name: alert-on-failure
label: Failure → alert
description: Write every run that failed after its retries into the activity log.
enabled: true
trigger:
  type: automation-failure
actions:
  - name: logFailure
    type: record
    operator: create
    props:
      table: activity_log
      data:
        logged_at: '{{now}}'
        recipe: '{{trigger.data.body.automationName}}'
        outcome: Failed
        attempts: '{{trigger.data.body.attempt}}'
        reference: '{{trigger.data.body.runId}}'
        error: '{{trigger.data.body.error}}'
        detail: 'Failed after {{trigger.data.body.attempt}} attempts; the operators were emailed'
