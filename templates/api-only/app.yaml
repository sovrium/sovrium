# The Task API — a backend in one config file.
#
# Two tables, projects and tasks, behind a REST API the engine generates from
# them: list, filter, sort and page, create, update, soft delete and restore,
# and the history of every record. Scripts call it with an API key on the
# `x-api-key` header; each table's `permissions` block decides what an admin, a
# member and a viewer may do, and a call that is not allowed answers 404.
#
# There is one page, at `/`: what the API is, the command that starts it, one
# call that works as pasted, and the tables it serves. Everything else is the
# API itself, and the admin console at `/_admin` for the people who hold the
# keys.
#
# The Task API is a fictional team's backlog; rename it, replace the tables,
# and it is yours. This is the file you diff, fork and redeploy.
name: task-api
version: 1.0.0
description: >-
  A headless API: projects and tasks behind a REST API, called with an API key,
  with per-role rules on every table and one page that says how to call it.

auth:
  $ref: ./config/auth.yaml

# All optional: the app boots and serves the API the same without any of them.
# The first two switch on the signed task webhook and the signed call out when
# a task is done (config/automations/); the last two mirror each new task into
# a Linear team (library/recipe/record-to-linear-issue.yaml).
env:
  - key: TASK_WEBHOOK_SECRET
    description: Shared secret that signs the task webhook in and the done-task call out.
    required: false
  - key: TASK_EVENTS_URL
    description: Address that receives a signed call each time a task is marked done.
    required: false
  - key: LINEAR_API_KEY
    description: API key of your Linear workspace, to mirror each new task as an issue.
    required: false
  - key: LINEAR_TEAM_ID
    description: Id of the Linear team the mirrored issues are created in.
    required: false

design:
  $ref: ./config/design.yaml

tables:
  - $ref: ./config/tables/projects.yaml
  - $ref: ./config/tables/tasks.yaml

pages:
  - $ref: ./config/pages/home.yaml

# The page's footer carries its own "Built with Sovrium" line, so the engine's
# badge is switched off.
badge: false

connections:
  - $ref: ./library/connection/linear.yaml

# A signed webhook that files a task, a signed call out when one is done, and
# the library recipe that mirrors each new task into Linear.
automations:
  - $ref: ./config/automations/task-intake.yaml
  - $ref: ./config/automations/task-done-call-out.yaml
  - $ref: ./library/recipe/record-to-linear-issue.yaml
