      description: Portal screens approved by support and by legal.
      project: '@projects.beacon'
      priority: Medium
      done: true
      due_date: '{{today-16d}}'

  - key: relay-rate-card-parser
    fields:
      title: Parse the third carrier's rate card
      description: They publish a fixed-width text file with a header that changes shape by region. Ask whether an API exists before writing a parser for it.
      project: '@projects.relay'
