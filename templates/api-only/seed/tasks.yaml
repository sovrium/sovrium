# Sample tasks, linked to projects by their file-local key.
#
# `@projects.<key>` resolves to the id the projects file's row was written with.
# Cross-file keys only resolve within a single `sovrium seed` run — the token is
# not stored, so seeding one table in isolation with `--table tasks` against an
# empty database has nothing to point at.
#
# `due_date` uses relative-date tokens rather than fixed dates, so the data set
# never ages into a wall of overdue work. Every token in one run renders against
# the same instant, so a set seeded either side of midnight stays internally
# consistent. Dates straddle today deliberately: a client filtering
# `?due_date[lte]=…` needs overdue, due-now and upcoming rows to filter between.
#
# `assigned_to` is absent throughout, and left that way deliberately. It is a
# `user` field holding an auth user id, and seed files have no vocabulary for
# auth users — `@users.someone` resolves nothing, because the seeder addresses
# app tables and the auth schema is not one of them. An invented id would not
# fail loudly either: it renders as an empty cell, which a reader interprets as a
# broken template rather than as absent data. Assign through
# `PATCH /api/tables/tasks/records/:id` once real accounts exist.
#
# All four `priority` options and both `done` states appear, for the same reason
# the projects file covers its whole enum.
records:
  - key: atlas-sandbox-creds
    fields:
      title: Chase the vendor for sandbox credentials
      description: Third request. Escalate to the account manager if nothing lands this week — Atlas cannot be integration-tested without it.
      project: '@projects.atlas'
      priority: Critical
      done: false
      due_date: '{{today-3d}}'

  - key: atlas-ledger-migration
    fields:
      title: Write the stock-ledger migration
      description: Backfill six years of movements into the new schema. Needs a dry run against a production copy before it goes anywhere near the real database.
      project: '@projects.atlas'
      priority: High
      done: false
      due_date: '{{today+11d}}'

  - key: atlas-cutover-plan
    fields:
      title: Draft the cutover plan
      description: Freeze window, rollback trigger, who is on call. One page, agreed by both teams.
      project: '@projects.atlas'
      priority: Medium
      done: false
      due_date: '{{today+25d}}'

  - key: beacon-invoice-endpoint
    fields:
