name: calendar
path: /
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Calendar
  description: The publishing month at a glance
components:
  - $ref: ./_nav.yaml
  - type: container
    element: section
    props:
      className: max-w-6xl mx-auto px-6 py-8
    children:
      - type: text
        element: h1
        props:
          className: text-2xl font-bold mb-1
        content: Calendar
      - type: text
        element: p
        props:
          className: text-sm mb-6
        content: Every piece with a publish date, laid out on the month. Consistency beats intensity.

      # `labelField` is optional in the schema but required in practice: without
      # it every piece renders as an unlabelled block, so the month shows that
      # something ships on the 12th but not what. `colorField` points at the
      # workflow status, whose option colours are record data — the one channel
      # ADR-024 A7 keeps coloured — so the calendar and the pipeline board tell
      # the same colour story about the same piece.
      - type: calendar
        dataSource:
          table: content
        labelField: title
        colorField: status
        dateField: publish_date
        defaultView: month
