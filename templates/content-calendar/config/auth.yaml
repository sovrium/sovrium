# Email and password sign-in, closed to strangers.
#
# The calendar holds unpublished work, so nobody signs themselves up: the
# first administrator comes from `AUTH_ADMIN_EMAIL` / `AUTH_ADMIN_PASSWORD` on
# the first start (see `.env.example`), and everyone else is added by an admin
# with `sovrium admin create <email>`. The demo accounts come from
# `seed/users.yaml`.
#
# Two roles: `member` for the people who plan and write, and `admin` for the
# lead, who approves what leaves Review and is the only one who deletes a
# piece. Each table's `permissions` block says which is which.
allowSignUp: false
defaultRole: member
strategies:
  - type: emailAndPassword
    minPasswordLength: 8
