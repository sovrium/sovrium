# Loomwork's four campaigns. Three run through September and October; the
# winter retrospective closed at the start of the month. Every date is
# relative to the day the seed runs, so the demo never ages; `--today
# <YYYY-MM-DD>` pins them to one day.
#
# `key` is file-local: it lets content.yaml name a campaign before either row
# has an id. It is never written to a column.
records:
  - key: launch
    fields:
      name: Platform launch
      starts: '{{today-20d}}'
      ends: '{{today+17d}}'
      budget: 12000
      status: Live
      goal: >-
        Put the new workspace in front of teams already running the beta.
        Success is fifty self-serve installs, not impressions.
  - key: conference
    fields:
      name: Conference push
      starts: '{{today-6d}}'
      ends: '{{today+32d}}'
      budget: 8000
      status: Live
      goal: >-
        Fill the call for papers and the room. Every piece ends on the
        conference page.
  - key: education
    fields:
      name: Always-on education
      starts: '{{today-23d}}'
      ends: '{{today+37d}}'
      budget: 3000
      status: Live
      goal: >-
        One useful thing a week, so people learn the product without a tour.
  - key: retrospective
    fields:
      name: Winter retrospective
      starts: '{{today-54d}}'
      ends: '{{today-19d}}'
      budget: 2000
      status: Closed
      goal: >-
        Look back at the year in public, including what we cut.
