name: app-starter
version: 1.0.0
description: >-
  A starting point for a business app: every sign-in way, a dashboard, settings
  and profile pages, and a list of records that each open on their own page.

auth:
  $ref: ./config/auth.yaml

env:
  - key: SSO_CLIENT_ID
    description: Client id your identity provider gave this app, for single sign-on.
    required: false
  - key: SSO_CLIENT_SECRET
    description: Client secret your identity provider gave this app, for single sign-on.
    required: false

tables:
  - $ref: ./config/tables/projects.yaml
  - $ref: ./config/tables/tasks.yaml
  - $ref: ./config/tables/activity.yaml
  - $ref: ./config/tables/clients.yaml
  - $ref: ./config/tables/people.yaml
  - $ref: ./config/tables/workspace-settings.yaml
  - $ref: ./config/tables/reminders.yaml
  - $ref: ./config/tables/bookings.yaml

# The page blocks below were installed with `sovrium library add`. Each file
# starts with the line naming the entry and version it came from.
components:
