name: project
path: /projects/:id
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Project · App starter
  description: One project.
dataSource:
  table: projects
  mode: single
  param: id
components:
  - $ref: ./_nav.yaml
  - type: container
    props:
      className: mx-auto flex w-full max-w-320 flex-col gap-6 px-4 py-6 sm:px-8 sm:py-8
    children:
      - component: record-header
      - type: grid
        props:
          className: grid grid-cols-1 gap-6 lg:grid-cols-12
        children:
          - type: container
            props:
              className: flex min-w-0 flex-col gap-6 lg:col-span-8 max-lg:order-2
            children:
              - component: record-related-list
              - component: record-comments
          - type: container
            props:
              className: min-w-0 lg:col-span-4 max-lg:order-1
            children:
              - component: record-meta-sidebar
