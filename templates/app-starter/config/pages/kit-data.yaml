name: kit-data
path: /kit/data
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: 'Data blocks · App starter'
  description: 'Figures, grids, cards, calendars and lists over the app tables.'
window:
  default: 30d
  presets:
    - { id: 7d }
    - { id: 30d }
    - { id: 90d }
components:
  - $ref: ./_nav.yaml
  - type: container
    element: section
    props:
      className: mx-auto flex w-full max-w-360 flex-col gap-1 px-4 pt-6 sm:px-8 sm:pt-8
    children:
      - type: text
        element: h1
        props:
          className: text-2xl font-semibold tracking-tight text-foreground
        content: 'Data blocks'
      - type: text
        element: p
        props:
          className: text-md text-foreground-muted
        content: 'Figures, grids, cards, calendars and lists, each bound to one of the app’s tables.'
  - component: kpi-row-trend
  - component: kpi-sparkline
  - component: table-with-actions
  - component: table-with-filters
  - component: gallery-cards
  - component: calendar-month
  - component: calendar-week
  - component: timeline-activity
  - component: list-avatars
  - component: modal-form
  - component: drawer-form
  - component: record-form-two-column
