# The settings sections, beside every settings page. Adapted from the
# `vertical-nav-settings` block. Each settings page declares which section it
# is, as the default of its `section` query parameter, and the link whose key
# matches `$query.section` gets `aria-current="page"` and the selected style.
# It is pulled in with `$ref` rather than as a component so that marking is
# resolved with the page. On a phone the list folds into one menu above the
# page.
#
# The workspace link opens the one row of `workspace_settings`, which the seed
# creates first, so its id is 1. If you create that row another way, point the
# link at its id.
type: container
props:
  className: w-full flex-none px-4 pt-6 sm:px-8 sm:pt-8 md:w-56 md:pr-0
children:
  - type: container
    props:
      className: md:hidden
    children:
      - type: dropdown-menu
        triggerLabel: Settings sections
        menuItems:
          - label: Account
            action: { type: navigate, path: '/settings' }
          - label: Security
            action: { type: navigate, path: '/settings/security' }
          - label: API keys
            action: { type: navigate, path: '/settings/api-keys' }
          - label: Team
            action: { type: navigate, path: '/settings/team' }
          - label: Workspace
            action: { type: navigate, path: '/settings/workspace/1' }
  - type: container
    element: nav
    props:
      aria-label: Settings
      className: hidden flex-col gap-1 md:flex
    children:
      - type: link
        content: Account
        props:
          href: '/settings'
          className: whitespace-nowrap rounded-md px-3 py-2 text-md text-foreground-muted hover:bg-background-subtle hover:text-foreground
        activeWhen: { value: $query.section, equals: account }
        activeProps:
          aria-current: page
          className: whitespace-nowrap rounded-md bg-background-subtle px-3 py-2 text-md font-medium text-foreground
      - type: link
        content: Security
        props:
          href: '/settings/security'
          className: whitespace-nowrap rounded-md px-3 py-2 text-md text-foreground-muted hover:bg-background-subtle hover:text-foreground
        activeWhen: { value: $query.section, equals: security }
        activeProps:
          aria-current: page
          className: whitespace-nowrap rounded-md bg-background-subtle px-3 py-2 text-md font-medium text-foreground
      - type: link
        content: API keys
        props:
          href: '/settings/api-keys'
          className: whitespace-nowrap rounded-md px-3 py-2 text-md text-foreground-muted hover:bg-background-subtle hover:text-foreground
        activeWhen: { value: $query.section, equals: api-keys }
        activeProps:
          aria-current: page
          className: whitespace-nowrap rounded-md bg-background-subtle px-3 py-2 text-md font-medium text-foreground
      - type: link
        content: Team
        props:
          href: '/settings/team'
          className: whitespace-nowrap rounded-md px-3 py-2 text-md text-foreground-muted hover:bg-background-subtle hover:text-foreground
        activeWhen: { value: $query.section, equals: team }
        activeProps:
          aria-current: page
          className: whitespace-nowrap rounded-md bg-background-subtle px-3 py-2 text-md font-medium text-foreground
      - type: link
        content: Workspace
        props:
          href: '/settings/workspace/1'
          className: whitespace-nowrap rounded-md px-3 py-2 text-md text-foreground-muted hover:bg-background-subtle hover:text-foreground
        activeWhen: { value: $query.section, equals: workspace }
        activeProps:
          aria-current: page
          className: whitespace-nowrap rounded-md bg-background-subtle px-3 py-2 text-md font-medium text-foreground
