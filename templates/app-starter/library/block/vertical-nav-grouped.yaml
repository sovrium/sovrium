# sovrium-library: block/vertical-nav-grouped@0.30.0
name: vertical-nav-grouped
type: container
props:
  className: w-full px-4 py-6 sm:px-10 sm:py-8
children:
  - type: sidebar
    props:
      className: w-64 rounded-lg border border-border bg-background-raised
    groups:
      - label: Workspace
        items:
          - label: Overview
            href: /
            icon: house
          - label: Invoices
            href: /invoices
            icon: file-text
            badge: '12'
            activeMatch: prefix
          - label: Clients
            href: /clients
            icon: users
            activeMatch: prefix
          - label: Automations
            href: /automations
            icon: workflow
            badge: '3'
            activeMatch: prefix
      - label: Reports
        items:
          - label: Revenue
            href: /reports/revenue
            icon: chart-column
          - label: Delays
            href: /reports/delays
            icon: clock
