# sovrium-library: block/auth-password-reset-new@0.30.0
name: auth-password-reset-new
type: container
element: main
props:
  className: flex min-h-screen justify-center bg-background-subtle px-4 pt-10 pb-12 sm:items-center sm:px-6
children:
  - type: container
    props:
      className: flex w-full max-w-96 flex-col gap-6 self-start sm:self-auto sm:rounded-lg sm:border sm:border-border sm:bg-background-raised sm:p-8
    children:
      - type: flex
        props:
          className: flex items-center gap-2 text-sm font-semibold text-foreground
        children:
          - type: icon
            props:
              name: box
              size: 14
              className: box-content rounded-sm bg-primary p-1 text-primary-foreground
          - type: text
            element: span
            content: $app.label
      - type: flex
        props:
          className: flex flex-col gap-1.5
        children:
          - type: text
            element: h1
            props:
              className: text-2xl font-semibold tracking-tight text-foreground
            content: Choose a new password
          - type: text
            element: p
            props:
              className: text-md text-foreground-muted
            content: Use at least eight characters. You sign in with it from now on.
      - type: form
        action:
          type: auth
          method: setNewPassword
          submitLabel: Save password
          fields:
            - name: password
              label: New password
          onSuccess:
            navigate: /sign-in
