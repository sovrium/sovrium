# sovrium-library: block/page-heading-actions@0.37.0
# sovrium-library-params: deleteHref=%2Fprojects%2F1&duplicateHref=%2Fworklist&editHref=%2Fprojects%2F1%2Fedit&primaryHref=%2Fprojects%2F1%2Fedit&primaryLabel=Edit%20project&secondaryHref=%2Fapi%2Ftables%2Fprojects%2Fexport%3Fformat%3Dcsv&secondaryLabel=Export%20CSV&title=Spring%20rebrand
name: page-heading-actions
type: container
props:
  className: w-full px-4 py-6 sm:px-10 sm:py-8 flex flex-col gap-4
children:
  - type: breadcrumb
    breadcrumbItems:
      - label: Projects
        href: /projects
      - label: Spring rebrand
  - type: flex
    props:
      className: flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between
    children:
      - type: flex
        props:
          className: flex flex-col gap-2
        children:
          - type: text
            element: h1
            props:
              className: text-3xl font-semibold tracking-tight text-foreground
            content: Spring rebrand
          - type: flex
            props:
              className: flex flex-wrap items-center gap-4
            children:
              - type: flex
                props:
                  className: flex items-center gap-1.5
                children:
                  - type: icon
                    props:
                      name: users
                      size: 14
                      className: text-muted-foreground
                  - type: text
                    element: span
                    props:
                      className: text-sm text-muted-foreground
                    content: Maison Lefort
              - type: flex
                props:
                  className: flex items-center gap-1.5
                children:
                  - type: icon
                    props:
                      name: calendar
                      size: 14
                      className: text-muted-foreground
                  - type: text
                    element: span
                    props:
                      className: text-sm text-muted-foreground
                    content: Due 14 Oct 2026
              - type: badge
                badgeVariant: outline
                content: Active
      - type: flex
        props:
          className: flex flex-wrap items-center gap-2
        children:
          - type: link
            props:
              href: /api/tables/projects/export?format=csv
              className: 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md border font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-ring)] no-underline hover:no-underline focus-visible:no-underline border-border-strong bg-card text-foreground hover:bg-muted hover:text-foreground h-8 px-3 text-base'
            content: Export CSV
          - type: dropdown-menu
            triggerLabel: More actions
            menuItems:
              - label: Edit
                icon: pencil
                action:
                  type: navigate
                  path: /projects/1/edit
              - label: Duplicate
                icon: copy
                action:
                  type: navigate
                  path: /worklist
              - separator: true
              - label: Delete
                icon: trash-2
                action:
                  type: navigate
                  path: /projects/1
                variant: destructive
          - type: link
            props:
              href: /projects/1/edit
              className: 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md border font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-ring)] no-underline hover:no-underline focus-visible:no-underline border-primary bg-primary text-primary-foreground hover:bg-primary-hover hover:text-primary-foreground h-8 px-3 text-base'
            content: Edit project
