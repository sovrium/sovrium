# sovrium-library: block/alert-inline@0.38.0
name: alert-inline
type: container
props:
  className: w-full px-4 py-6 sm:px-10 sm:py-8 flex flex-col gap-3
children:
  - type: alert
    alertVariant: info
    title: Your export is ready.
    props:
      className: w-full max-w-3xl
    children:
      - type: flex
        props:
          className: flex w-full items-start justify-between gap-4
        children:
          - type: text
            element: span
            props:
              className: min-w-0 flex-1
            content: It stays available for 7 days.
          - type: link
            props:
              href: /exports
              className: text-sm font-medium underline underline-offset-4
            content: Download
  - type: alert
    alertVariant: warning
    title: Two invoices have no client email.
    props:
      className: w-full max-w-3xl
    children:
      - type: flex
        props:
          className: flex w-full items-start justify-between gap-4
        children:
          - type: text
            element: span
            props:
              className: min-w-0 flex-1
            content: They will not receive reminders.
          - type: link
            props:
              href: /invoices
              className: text-sm font-medium underline underline-offset-4
            content: Review
  - type: alert
    alertVariant: destructive
    title: The bank sync failed.
    props:
      className: w-full max-w-3xl
    children:
      - type: flex
        props:
          className: flex w-full items-start justify-between gap-4
        children:
          - type: text
            element: span
            props:
              className: min-w-0 flex-1
            content: The connection token expired on 11 Sep.
          - type: link
            props:
              href: /settings
              className: text-sm font-medium underline underline-offset-4
            content: Reconnect
