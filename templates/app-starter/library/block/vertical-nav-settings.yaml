# sovrium-library: block/vertical-nav-settings@0.37.0
name: vertical-nav-settings
type: container
props:
  className: w-full px-4 py-6 sm:px-10 sm:py-8
children:
  - type: flex
    props:
      className: flex flex-col gap-6 md:flex-row md:gap-12
    children:
      - type: container
        props:
          className: md:hidden
        children:
          - type: dropdown-menu
            triggerLabel: Settings sections
            menuItems:
              - label: General
                action:
                  type: navigate
                  path: /settings?section=general
              - label: Members
                action:
                  type: navigate
                  path: /settings/members?section=members
              - label: Billing
                action:
                  type: navigate
                  path: /settings/billing?section=billing
              - label: Notifications
                action:
                  type: navigate
                  path: /settings/notifications?section=notifications
              - label: Danger zone
                action:
                  type: navigate
                  path: /settings/danger?section=danger
      - type: container
        element: nav
        props:
          aria-label: Settings
          className: hidden flex-none flex-col gap-1 md:flex md:w-50
        children:
          - type: link
            props:
              href: /settings?section=general
              className: inline-flex h-8 items-center justify-start rounded-lg px-2.5 text-sm font-medium whitespace-nowrap text-muted-foreground no-underline hover:bg-muted hover:text-foreground hover:no-underline
            activeWhen:
              value: $query.section
              equals: general
            activeProps:
              aria-current: page
              className: inline-flex h-8 items-center justify-start rounded-lg bg-muted px-2.5 text-sm font-medium whitespace-nowrap text-foreground no-underline hover:bg-muted hover:no-underline
            content: General
          - type: link
            props:
              href: /settings/members?section=members
              className: inline-flex h-8 items-center justify-start rounded-lg px-2.5 text-sm font-medium whitespace-nowrap text-muted-foreground no-underline hover:bg-muted hover:text-foreground hover:no-underline
            activeWhen:
              value: $query.section
              equals: members
            activeProps:
              aria-current: page
              className: inline-flex h-8 items-center justify-start rounded-lg bg-muted px-2.5 text-sm font-medium whitespace-nowrap text-foreground no-underline hover:bg-muted hover:no-underline
            content: Members
          - type: link
            props:
              href: /settings/billing?section=billing
              className: inline-flex h-8 items-center justify-start rounded-lg px-2.5 text-sm font-medium whitespace-nowrap text-muted-foreground no-underline hover:bg-muted hover:text-foreground hover:no-underline
            activeWhen:
              value: $query.section
              equals: billing
            activeProps:
              aria-current: page
              className: inline-flex h-8 items-center justify-start rounded-lg bg-muted px-2.5 text-sm font-medium whitespace-nowrap text-foreground no-underline hover:bg-muted hover:no-underline
            content: Billing
          - type: link
            props:
              href: /settings/notifications?section=notifications
              className: inline-flex h-8 items-center justify-start rounded-lg px-2.5 text-sm font-medium whitespace-nowrap text-muted-foreground no-underline hover:bg-muted hover:text-foreground hover:no-underline
            activeWhen:
              value: $query.section
              equals: notifications
            activeProps:
              aria-current: page
              className: inline-flex h-8 items-center justify-start rounded-lg bg-muted px-2.5 text-sm font-medium whitespace-nowrap text-foreground no-underline hover:bg-muted hover:no-underline
            content: Notifications
          - type: link
            props:
              href: /settings/danger?section=danger
              className: inline-flex h-8 items-center justify-start rounded-lg px-2.5 text-sm font-medium whitespace-nowrap text-muted-foreground no-underline hover:bg-muted hover:text-foreground hover:no-underline
            activeWhen:
              value: $query.section
              equals: danger
            activeProps:
              aria-current: page
              className: inline-flex h-8 items-center justify-start rounded-lg bg-muted px-2.5 text-sm font-medium whitespace-nowrap text-foreground no-underline hover:bg-muted hover:no-underline
            content: Danger zone
      - type: container
        props:
          className: flex w-full items-center justify-center rounded-lg border border-dashed border-border-strong bg-muted h-80 min-w-0 flex-1
        children:
          - type: text
            element: span
            props:
              className: font-mono text-sm text-muted-foreground
            content: '[Settings panel]'
