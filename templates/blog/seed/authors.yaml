# The three people who sign the essays, each with a portrait from
# `seed/assets/` — drawn shapes, not photographs, so you can replace them with
# your own without asking anyone.
records:
  - key: mireille
    fields:
      name: Mireille Baptiste
      slug: mireille-baptiste
      avatar: '@asset:avatar-mireille.png'
      bio: >-
        Writes about the unglamorous half of running software — migrations,
        backups, and the paperwork nobody demos. Ran platform teams for eleven
        years before deciding she preferred writing about it.

  - key: tomas
    fields:
      name: Tomás Delgado
      slug: tomas-delgado
      avatar: '@asset:avatar-tomas.png'
      bio: >-
        Former agency developer, now independent. Interested in the tools small
        teams reach for when they cannot afford a platform team, and in why so
        many of them stop fitting at exactly the same size.

  - key: aoife
    fields:
      name: Aoife Nwachukwu
      slug: aoife-nwachukwu
      avatar: '@asset:avatar-aoife.png'
      bio: >-
        Designer and reluctant sysadmin. Writes mostly about the seam where
        design decisions turn into operational ones, which is earlier than most
        teams expect.
