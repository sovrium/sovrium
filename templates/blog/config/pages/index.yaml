# The index: the publication's name, what it writes about, and every
# published essay — the latest one large across the top, the rest two by two.
# A card opens its essay.
name: essays
path: /
meta:
  title: Field Notes
  description: Essays on building and running software a small team owns — config, backups, licences and the first five minutes.
  favicon: ./favicon.svg
components:
  - type: container
    props:
      className: flex min-h-screen flex-col bg-background text-foreground
    children:
      - $ref: ./_site-header.yaml
      - type: container
        element: section
        props:
          className: mx-auto flex w-full max-w-[1120px] flex-1 flex-col gap-7 px-10 py-12 max-md:px-3.5 max-md:py-6
        children:
          - type: container
            props:
              className: flex flex-col gap-2.5 border-b border-border pb-[22px]
            children:
              - type: text
                element: p
                props:
                  className: font-mono text-[12px] font-medium uppercase tracking-wider text-foreground-subtle
                content: Essays · 5 published
              - type: text
                element: h1
                props:
                  className: text-[40px] leading-[1.1] font-semibold tracking-tight text-foreground max-md:text-[34px]
                content: Field Notes
              - type: text
                element: p
                props:
                  className: max-w-[640px] text-[19px] leading-[1.55] text-foreground-muted max-md:text-[16px]
                content: Essays on building and running software a small team owns — config, backups, licences and the first five minutes.
          # The essays, newest first. The first card is featured: it spans the
          # row with its cover on the left. The others go two by two, one per
          # row on a phone. A card opens its essay. The gallery's parts style
          # the grid, the cards and the covers; the card's own children carry
          # their classes, and a featured-only size follows the card's
          # `data-featured` through `group`.
          - type: gallery
            classes:
              parts:
                grid: '!gap-x-8 !gap-y-7 !p-0 max-md:!gap-y-2.5'
                # The featured card keeps 28px between its cover and its text.
                card: group !overflow-visible !rounded-none !border-0 !bg-transparent md:*:!gap-7
                cover: rounded-lg border border-border !bg-background-inset
                # Under a cover the text starts 12px below it (4px on a phone);
                # beside the featured cover it is centred instead.
                body: '!gap-2.5 !p-0 mt-3 max-md:!gap-1 max-md:mt-1 md:group-data-featured:mt-0'
            dataSource:
              table: posts
              filter:
                - field: status
                  operator: eq
                  value: Published
              sort:
                - field: publish_at
                  direction: desc
            gridColumns: { mobile: 1, md: 2 }
            featured: first
            galleryCard:
              coverImage: $record.cover
              aspectRatio: '16:9'
              onClick:
                type: navigate
                path: /blog/$record.slug
              children:
                - type: text
                  element: span
                  props:
                    className: self-start rounded-sm border border-border px-1.5 py-px text-[11.5px] leading-4 font-medium text-foreground-muted
                  content: $record.tags
                - type: text
                  element: h2
                  props:
                    className: >-
                      text-[19px] leading-[1.3] font-semibold text-foreground group-hover:text-primary
                      md:group-data-featured:text-[24px] md:group-data-featured:leading-[1.2]
                  content: $record.title
                - type: text
                  element: p
                  props:
                    className: text-[15px] leading-[1.6] text-foreground-muted
                  content: $record.excerpt
                - type: text
                  element: p
                  props:
                    className: text-[13px] leading-normal text-foreground-muted
                  content: $record.author_name · $record.date_label
          # The newsletter sign-up: the address goes to the `newsletter` form
          # (config/forms/newsletter.yaml) and lands in `subscribers`.
          - component: newsletter-inline
      - $ref: ./_site-footer.yaml
