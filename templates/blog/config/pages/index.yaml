# The index: the publication's name, what it writes about, and every
# published essay — the latest one large across the top, the rest two by two.
# A card opens its essay.
name: essays
path: /
meta:
  title: Field Notes
  description: Essays on building and running software a small team owns — config, backups, licences and the first five minutes.
  favicon: ./favicon.svg
components:
  - type: container
    props:
      className: flex min-h-screen flex-col bg-background text-foreground
    children:
      - $ref: ./_site-header.yaml
      - type: container
        element: section
        props:
          className: mx-auto flex w-full max-w-[1120px] flex-1 flex-col gap-7 px-10 py-12 max-md:px-3.5 max-md:py-6
        children:
          - type: container
            props:
              className: flex flex-col gap-2.5 border-b border-border pb-[22px]
            children:
              - type: text
                element: p
                props:
                  className: font-mono text-[12px] font-medium uppercase tracking-wider text-foreground-subtle
                content: Essays · 5 published
              - type: text
                element: h1
                props:
                  className: text-[40px] leading-[1.1] font-semibold tracking-tight text-foreground max-md:text-[34px]
                content: Field Notes
              - type: text
                element: p
                props:
                  className: max-w-[640px] text-[19px] leading-[1.55] text-foreground-muted max-md:text-[16px]
                content: Essays on building and running software a small team owns — config, backups, licences and the first five minutes.
          # The essays, newest first. The first card spans the row, cover on the
          # left; the others go two by two, one per row on a phone. A card opens
          # its essay: its content sits in one link, so the classes below reach
          # the card's parts through that link, and the grid of cards is the
          # gallery's first child (`[&>div]`).
          - type: gallery
            props:
              className: >-
                [&>div]:!gap-x-8 [&>div]:!gap-y-7 [&>div]:!p-0 max-md:[&>div]:!gap-y-2.5
                [&_[data-role=gallery-card]>a]:!flex [&_[data-role=gallery-card]>a]:!flex-col [&_[data-role=gallery-card]>a]:!gap-3 max-md:[&_[data-role=gallery-card]>a]:!gap-1 [&_[data-role=gallery-card]]:!overflow-visible [&_[data-role=gallery-card]]:!rounded-none [&_[data-role=gallery-card]]:!border-0 [&_[data-role=gallery-card]]:!bg-transparent
                [&_[data-aspect-ratio]]:rounded-lg [&_[data-aspect-ratio]]:border [&_[data-aspect-ratio]]:border-border [&_[data-aspect-ratio]]:!bg-background-inset
                [&_[data-role=gallery-card]_a>div:last-child]:!gap-2.5 [&_[data-role=gallery-card]_a>div:last-child]:!p-0 max-md:[&_[data-role=gallery-card]_a>div:last-child]:!gap-1
                [&_[data-role=gallery-card]_span]:self-start [&_[data-role=gallery-card]_span]:rounded-sm [&_[data-role=gallery-card]_span]:border [&_[data-role=gallery-card]_span]:border-border [&_[data-role=gallery-card]_span]:px-1.5 [&_[data-role=gallery-card]_span]:py-px [&_[data-role=gallery-card]_span]:text-[11.5px] [&_[data-role=gallery-card]_span]:leading-4 [&_[data-role=gallery-card]_span]:font-medium [&_[data-role=gallery-card]_span]:text-foreground-muted
                [&_[data-role=gallery-card]_h2]:text-[19px] [&_[data-role=gallery-card]_h2]:leading-[1.3] [&_[data-role=gallery-card]_h2]:font-semibold [&_[data-role=gallery-card]_h2]:text-foreground [&_[data-role=gallery-card]:hover_h2]:text-primary
                [&_[data-role=gallery-card]_p]:text-[15px] [&_[data-role=gallery-card]_p]:leading-[1.6] [&_[data-role=gallery-card]_p]:text-foreground-muted
                [&_[data-role=gallery-card]_p:last-child]:text-[13px] [&_[data-role=gallery-card]_p:last-child]:leading-normal
                md:[&_[data-role=gallery-card]:first-child]:col-span-2 md:[&_[data-role=gallery-card]:first-child>a]:!grid md:[&_[data-role=gallery-card]:first-child>a]:grid-cols-[1.25fr_1fr] md:[&_[data-role=gallery-card]:first-child>a]:!gap-7 md:[&_[data-role=gallery-card]:first-child>a]:items-center
                md:[&_[data-role=gallery-card]:first-child_h2]:text-[24px] md:[&_[data-role=gallery-card]:first-child_h2]:leading-[1.2]
            dataSource:
              table: posts
              filter:
                - field: status
                  operator: eq
                  value: Published
              sort:
                - field: publish_at
                  direction: desc
            gridColumns: { mobile: 1, md: 2 }
            galleryCard:
              coverImage: $record.cover
              aspectRatio: '16:9'
              onClick:
                type: navigate
                path: /blog/$record.slug
              children:
                - type: text
                  element: span
                  content: $record.tags
                - type: text
                  element: h2
                  content: $record.title
                - type: text
                  element: p
                  content: $record.excerpt
                - type: text
                  element: p
                  content: $record.author_name · $record.date_label
      - $ref: ./_site-footer.yaml
