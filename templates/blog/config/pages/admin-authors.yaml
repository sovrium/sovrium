# The people who sign the essays: a name, a short biography and a portrait.
name: admin-authors
path: /admin/authors
access:
  require: [admin]
  redirectTo: /admin/login
meta:
  title: Authors · Field Notes
  description: The people who sign the essays.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Authors
          - type: container
            props:
              className: flex min-w-0 flex-col gap-3 px-5 pb-5 pt-4
            children:
              - type: table
                dataSource:
                  table: authors
                  sort:
                    - { field: name, direction: asc }
                rowHeight: short
                columns:
                  - { field: name, label: Name }
                  - { field: slug, label: Slug }
                  - { field: bio, label: Biography }
                  - { field: avatar, label: Portrait }
                pagination:
                  pageSize: 50
                emptyMessage: An essay is signed by one of its authors. Add the first one with New record.
