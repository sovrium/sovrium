# The tags an essay can carry. Add one from the grid's own New record button;
# a tag in use cannot be deleted without first removing it from its posts.
name: admin-tags
path: /admin/tags
access:
  require: [admin]
  redirectTo: /admin/login
meta:
  title: Tags · Field Notes
  description: The tags an essay can carry.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Tags
          - type: container
            props:
              className: flex min-w-0 flex-col gap-3 px-5 pb-5 pt-4
            children:
              - type: table
                dataSource:
                  table: tags
                  sort:
                    - { field: name, direction: asc }
                rowHeight: short
                columns:
                  - { field: name, label: Name }
                  - { field: slug, label: Slug }
                pagination:
                  pageSize: 50
                emptyMessage: Tags say what an essay is about. Add the first one with New record.
