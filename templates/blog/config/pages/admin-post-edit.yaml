# One post, open for editing: its words on the left, its publishing on the
# right. The form opens with the post's own values. Giving a draft a publish
# date and pressing Schedule saves it, and the post becomes Scheduled
# (config/automations/schedule-on-date.yaml); it goes live at that hour.
name: admin-post-edit
path: /admin/posts/:id/edit
access:
  require: [admin]
  redirectTo: /admin/login
meta:
  title: Edit post · Field Notes
  description: Edit, schedule and publish a post.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Edit post
          - type: container
            props:
              className: flex min-w-0 flex-col gap-3 px-5 pb-5 pt-4
            children:
              # The words on the left, the publishing on the right: the status,
              # the date, the byline, the tags and Schedule sit in the narrow
              # aside column. One column on a phone.
              - type: form
                layout: main-aside
                asideWidth: 340px
                dataSource:
                  table: posts
                  mode: single
                  param: id
                fields:
                  - { field: title, label: Title }
                  - field: slug
                    label: URL slug
                    description: The essay's address, /blog/<slug>. Lowercase words joined by hyphens.
                  - { field: excerpt, label: Excerpt }
                  - { field: body, label: Body }
                  - { field: cover, label: Cover image }
                  - field: status
                    label: Status
                    region: aside
                    description: Draft stays on the desk; Published is on the site now.
                  - field: publish_at
                    label: Publish at
                    region: aside
                    description: Set a date on a draft and press Schedule — the post goes live at that hour.
                  - { field: author, label: Author, region: aside }
                  - { field: tags, label: Tags, region: aside }
                action:
                  type: crud
                  operation: update
                  table: posts
                  submitLabel: Schedule
                  onSuccess:
                    navigate: /admin
                    toast:
                      message: Saved. A draft with a publish date is now scheduled.
                      variant: success
