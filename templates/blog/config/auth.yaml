# Sign-in exists for the people who write: the readers never need an account.
#
# Nobody can open one from the site: the first editor comes from
# `AUTH_ADMIN_EMAIL` / `AUTH_ADMIN_PASSWORD` on the first start (see
# `.env.example`), and anyone else is added with `sovrium admin create
# <email>`. The demo editor comes from `seed/users.yaml`.
#
# The editor is an `admin`: the desk behind `/admin` is closed to every other
# role, and each table's `permissions` block says who may change what.
allowSignUp: false
defaultRole: member
strategies:
  - type: emailAndPassword
    minPasswordLength: 8
