# The design system of Field Notes, a publication a small studio owns.
#
# `baseline: extend` keeps Sovrium's built-in design system and changes only
# what is declared here. Two registers share it: a public reading surface — an
# index of essays and one essay at a time — and a desk behind `/admin` where
# the editor works. The first is set like a page, roomy and quiet; the second
# like a tool, denser, read many times a day.
#
# Type stays on the two faces the platform self-hosts (IBM Plex Sans and
# JetBrains Mono): a face pulled from a font CDN would hand every reader's
# address to a third party. A serif for the headings is a good next step —
# serve its woff2 from `public/` and name it under `typeScale.families`.
baseline: extend

# Follow the reader's operating system: light by day, dark by night.
# `darkColors` below is what the dark scheme paints.
colorScheme: system

# One accent, a purple, marks what a reader or an editor acts on: a link in an
# essay, the Publish button, the current entry of the desk, the focus ring. The
# neutrals lean toward the same hue at a whisper of chroma, a cool paper sheet.
#
# Every role is spelled out in BOTH schemes: a key missing from `darkColors`
# keeps its light value, and a pale dark-mode accent needs a dark label, so the
# dark block names every companion itself.
#
# `success`, `warning` and `error` each carry a consequence: a published post,
# a post scheduled for later or a draft waiting for approval, and a slug that
# is already taken. Tags are never coloured.
colors:
  primary: oklch(0.52 0.17 293)
  primary-hover: oklch(0.46 0.159 293)
  primary-active: oklch(0.42 0.15 293)
  primary-foreground: oklch(0.985 0.003 293)
  primary-subtle: oklch(0.95 0.03 293)
  primary-subtle-foreground: oklch(0.38 0.128 293)
  ring: oklch(0.6 0.17 293)
  background: oklch(0.985 0.003 293)
  background-subtle: oklch(0.967 0.005 293)
  background-raised: oklch(1 0 0)
  background-overlay: oklch(1 0 0)
  background-inset: oklch(0.925 0.008 293)
  foreground: oklch(0.21 0.008 293)
  foreground-muted: oklch(0.45 0.012 293)
  foreground-subtle: oklch(0.51 0.012 293)
  foreground-disabled: oklch(0.71 0.012 293)
  foreground-inverse: oklch(0.985 0.003 293)
  border: oklch(0.925 0.008 293)
  success: oklch(0.52 0.12 155)
  warning: oklch(0.5 0.12 75)
  error: oklch(0.53 0.17 25)
  destructive-foreground: oklch(0.985 0.003 293)

darkColors:
  primary: oklch(0.78 0.128 293)
  primary-hover: oklch(0.83 0.096 293)
  primary-active: oklch(0.87 0.074 293)
  primary-foreground: oklch(0.16 0.006 293)
  primary-subtle: oklch(0.28 0.064 293)
  primary-subtle-foreground: oklch(0.9 0.064 293)
  ring: oklch(0.72 0.138 293)
  background: oklch(0.16 0.006 293)
  background-subtle: oklch(0.19 0.007 293)
  background-raised: oklch(0.21 0.008 293)
  background-overlay: oklch(0.23 0.008 293)
  background-inset: oklch(0.13 0.005 293)
  foreground: oklch(0.95 0.005 293)
  foreground-muted: oklch(0.75 0.01 293)
  foreground-subtle: oklch(0.68 0.012 293)
  foreground-disabled: oklch(0.45 0.01 293)
  foreground-inverse: oklch(0.16 0.006 293)
  border: oklch(0.3 0.01 293)
  success: oklch(0.75 0.12 155)
  warning: oklch(0.8 0.12 75)
  error: oklch(0.72 0.14 25)
  destructive-foreground: oklch(0.16 0.006 293)

# Editorial proportions: a large h1, body text at 17 px with a long line
# height, so an essay reads at an even rhythm; mono for the small overline.
typeScale:
  families:
    sans:
      family: IBM Plex Sans Variable
      fallback: "'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    heading:
      family: IBM Plex Sans Variable
      fallback: "'IBM Plex Sans', system-ui, sans-serif"
    mono:
      family: "'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
  steps:
    display: { size: 3rem, lineHeight: 1.05, weight: 600, letterSpacing: -0.025em }
    h1: { size: 2.5rem, lineHeight: 1.1, weight: 600, letterSpacing: -0.02em }
    h2: { size: 1.5rem, lineHeight: 1.25, weight: 600, letterSpacing: -0.01em }
    h3: { size: 1.1875rem, lineHeight: 1.35, weight: 600 }
    lead: { size: 1.25rem, lineHeight: 1.55 }
    body: { size: 1.0625rem, lineHeight: 1.75 }
    bodySmall: { size: 0.875rem, lineHeight: 1.55 }
    caption: { size: 0.8125rem, lineHeight: 1.4 }
    overline: { size: 0.75rem, lineHeight: 1.3, weight: 500, letterSpacing: 0.04em, font: mono }

# One Shiki theme for the code an essay quotes.
codeBlock:
  theme: github-dark

# Standard corners: neither a ledger nor a toy.
radius:
  sm: 0.25rem
  md: 0.5rem
  lg: 0.75rem
  full: 9999px

# Flat: an essay is a page, not a card floating over one. Only the overlays
# (a menu, a dialog) lift.
elevation:
  none: none
  sm: none
  md: 0 1px 2px 0 rgb(0 0 0 / 0.05)
  lg: 0 10px 15px -3px rgb(0 0 0 / 0.1)

# A post's state is an outlined chip with a dot of its colour, so a column of
# states stays quiet and only the colour of the dot changes.
badgeForm: outline-dot

# What each colour is for. Writing the usage down is what stops the accent from
# becoming decoration.
colorRoles:
  primary:
    usage: The one accent. Links in an essay, the Publish button, the current entry of the desk, the focus ring.
    pairsWith: primary-foreground
  primary-subtle:
    usage: The current entry of the desk and the tag a reader has picked.
    pairsWith: primary-subtle-foreground
  success:
    usage: A published post.
    pairsWith: foreground
  warning:
    usage: A post scheduled for later, and a draft the assistant proposed that waits for approval.
    pairsWith: foreground
  error:
    usage: A slug already taken, a required field left empty, an essay that is not here.
    pairsWith: foreground

# Two steps, one per zone: the desk runs at `cozy`, the public pages at
# `roomy` (the `marketing` zone below). The three steps are the platform's own
# values, written out so one number can be tuned.
density:
  default: cozy
  byZone:
    marketing: roomy
  steps:
    compact: { rowY: 5px, controlH: 36px, buttonH: 28px, gap: 7px, text: 11px }
    cozy: { rowY: 8px, controlH: 40px, buttonH: 32px, gap: 10px, text: 13px }
    roomy: { rowY: 14px, controlH: 44px, buttonH: 36px, gap: 16px, text: 14px }

# How the publication speaks. Nothing reads these at runtime; they are the
# brief anyone writing a label, an empty state or an error message follows.
voice:
  personality:
    - warm
    - plain-spoken
    - never breathless
  pronoun: you
  prefer:
    - 'Lead a call to action with its verb: Publish, Schedule, Save.'
    - Every empty state names the one next action.
  avoid:
    - No exclamation marks in product chrome.
    - No unverifiable claims about reach or reading time.
  tone:
    empty: Say what this list will hold, then the action that fills it.
    loading: Name what is loading — the essays, the draft — never a bare spinner.
    error: State what stopped, then the one thing that unblocks it. Never accuse.
    success: Say what happened and where it now lives.
    destructive: Name what is deleted and whether it can be recovered.

# Where the line between the two registers runs. Order does not decide the
# winner — the most specific pattern does — so `/admin/*` governs the desk and
# the catch-all takes the public pages.
zones:
  # Behind sign-in: the working budget, and two more refusals for its voice.
  - pattern: /admin/*
    zone: product
    accentBudget: product
    voice:
      avoid:
        - No marketing superlatives behind sign-in.
        - Never call a destructive action "cleanup".
  # The public reading surface, with the accent budget of a page anyone reads.
  - pattern: everything else
    zone: marketing
    accentBudget: public

principles:
  - A reader reaches a full essay from the index in one click.
  - Every essay says who wrote it, when, and what it is about, before its first paragraph.
  - Colour means a post's state — published, scheduled, waiting — or it is not used.
  - Nothing the assistant writes is published without a person approving it.
