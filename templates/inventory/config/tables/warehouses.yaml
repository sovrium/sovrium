# Warehouses — the places stock physically sits.
#
# A warehouse holds no stock figure of its own: what it holds is the sum of the
# movements recorded against it, so the number can never drift from the ledger.
id: 2
name: warehouses
fields:
  - id: 1
    name: name
    type: single-line-text
    required: true
  - id: 2
    name: code
    type: single-line-text
  - id: 7
    name: city
    type: single-line-text
  - id: 5
    name: is_active
    type: checkbox
    default: true
  - id: 6
    name: created_at
    type: created-at

aiAccess:
  description: >-
    Storage locations. Use this when the user asks where stock is held.
  operations:
    - read
    - list
  fieldExposure: permissioned

permissions:
  read: authenticated
  create:
    - admin
  update:
    - admin
  delete:
    - admin
