# Products — the catalogue, and what each item is worth on the shelf.
#
# Nothing here holds a typed stock figure. `stock_on_hand` is the sum of the
# product's signed stock movements, `value_at_cost` multiplies it by the unit
# cost, and `stock_state` reads both against the reorder point. Record a
# movement and all three follow.
id: 3
name: products
fields:
  # ── Identity ────────────────────────────────────────────────────────
  - id: 1
    name: name
    type: single-line-text
    required: true
  - id: 2
    name: sku
    type: single-line-text
    required: true
    unique: true
  # The number printed under the product's label. It is a plain field: type
  # it, or paste it from a hand-held scanner, which types like a keyboard.
  - id: 3
    name: barcode
    type: barcode
    format: EAN-13
  - id: 6
    name: description
    type: long-text

  # ── Classification ──────────────────────────────────────────────────
  - id: 8
    name: category
    type: single-select
    options:
      - Hardware
      - Accessories
      - Consumables
      - Packaging
      - Spare parts
  # Where the product is in its life, not how much of it there is: stock
  # states come from `stock_state` below. None of these is an outcome, so none
  # carries a colour.
  - id: 10
    name: status
    type: status
    options:
      - value: Draft
      - value: Active
      - value: Discontinued
    default: Active

  # ── Money ───────────────────────────────────────────────────────────
  - id: 12
    name: unit_price
    type: currency
    currency: EUR
    precision: 2
  - id: 35
    name: unit_cost
    type: currency
    currency: EUR
    precision: 2
    required: true

  # ── Buying ──────────────────────────────────────────────────────────
  - id: 22
    name: supplier
    type: relationship
    relatedTable: suppliers
    relationType: many-to-one
    displayField: name
  # The quantity at which to buy again. At zero the product is never flagged,
  # which suits a draft or a discontinued item.
  - id: 36
    name: reorder_at
    type: integer
    min: 0
    default: 0
  # Days from order to delivery for THIS product; most follow their
  # supplier's usual delay, a few take longer.
  - id: 37
    name: lead_time_days
    type: integer
    min: 0

  # ── Stock, computed ─────────────────────────────────────────────────
  - id: 24
    name: movements
    type: relationship
    relatedTable: stock_movements
    relationType: one-to-many
  - id: 15
    name: stock_on_hand
    type: rollup
    relationshipField: movements
    relatedField: quantity
    aggregation: SUM
  # Priced in the same currency as `unit_cost`. Declared, never inherited: a
  # formula may touch several money fields, so nothing can pick the code for it.
  - id: 27
    name: value_at_cost
    type: formula
    formula: unit_cost * stock_on_hand
    resultType: number
    format: currency
    currency: EUR
    precision: 2
  # The one word the grid shows beside a product: its life stage when it is
  # not active, otherwise whether it is out of stock or under its reorder
  # point. A product with enough stock shows nothing.
  - id: 38
    name: stock_state
    type: formula
    formula: "CASE WHEN status <> 'Active' THEN status WHEN stock_on_hand <= 0 THEN 'Out of stock' WHEN stock_on_hand < reorder_at THEN 'Reorder' ELSE '' END"
    resultType: string

  # ── Audit ───────────────────────────────────────────────────────────
  - id: 29
    name: created_at
    type: created-at
  - id: 31
    name: updated_at
    type: updated-at

aiAccess:
  description: >-
    The product catalogue. Use this when the user asks about products, SKUs,
    prices, costs, stock on hand, reorder points or a product's supplier.
    `stock_on_hand` is computed from stock_movements and cannot be edited.
  operations:
    - read
    - list
    - create
    - update
  fieldExposure: permissioned

permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
    - member
  delete:
    - admin
