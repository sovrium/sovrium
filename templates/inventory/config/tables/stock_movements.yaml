# Stock movements — the ledger every stock figure is computed from.
#
# One row per quantity that moved, SIGNED: a receipt is positive, a pick is
# negative, a transfer is two rows (out of one warehouse, into another) and a
# count writes the difference it found. `products.stock_on_hand` is the sum of
# these rows, so correcting stock means recording a movement, never typing a
# new figure over the old one.
#
# The first row of each product in each warehouse is its opening balance: the
# quantity it held when the ledger started.
id: 4
name: stock_movements
fields:
  - id: 1
    name: reference
    type: single-line-text
    required: true
  - id: 2
    name: product
    type: relationship
    relatedTable: products
    relationType: many-to-one
    displayField: name
  - id: 3
    name: warehouse
    type: relationship
    relatedTable: warehouses
    relationType: many-to-one
    displayField: name
  # The warehouse's name, read through the relationship, for lists that show
  # a movement away from its warehouse (a product's drawer).
  - id: 11
    name: warehouse_name
    type: lookup
    relationshipField: warehouse
    relatedField: name
  - id: 4
    name: type
    type: single-select
    options:
      - Received
      - Picked
      - Transfer in
      - Transfer out
      - Count
      - Opening balance
    default: Received
  - id: 5
    name: quantity
    type: integer
    required: true
  - id: 7
    name: moved_at
    type: date
    required: true
  - id: 8
    name: note
    type: single-line-text
  - id: 9
    name: created_at
    type: created-at
  - id: 10
    name: created_by
    type: created-by

aiAccess:
  description: >-
    Stock in and out, signed: positive for a receipt or a transfer in, negative
    for a pick or a transfer out. Use this when the user asks about receipts,
    picks, transfers, counts or the stock history of a product.
  operations:
    - read
    - list
    - create
  fieldExposure: permissioned

# The operator records movements; only the stock manager may correct or remove
# one, because every stock figure is computed from this table.
permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
  delete:
    - admin
