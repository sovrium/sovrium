# Who the catalogue is bought from, with the usual lead time of each: the
# figure that decides how early a product has to be reordered.
name: suppliers
path: /suppliers
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Suppliers · Brunel Stock
  description: The suppliers of the catalogue, with their lead times.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Suppliers
          - type: container
            props:
              className: flex flex-col gap-3 px-5 pb-5 pt-4
            children:
              - type: table
                dataSource:
                  table: suppliers
                  sort:
                    - { field: name, direction: asc }
                rowHeight: short
                columns:
                  - { field: name, label: Supplier, sortable: true }
                  - { field: website, label: Website }
                  - { field: lead_time_days, label: Lead time (days), align: right, sortable: true }
                  - { field: phone, label: Phone }
                  - { field: contact_email, label: Email }
                rowExpand:
                  fields: [name, lead_time_days, contact_email, phone, website, notes]
                  title: Supplier
                emptyMessage: The suppliers you buy from appear here with their lead times. Add the first one.
