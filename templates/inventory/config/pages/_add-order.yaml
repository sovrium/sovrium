# The "Add order" dialog. A new order starts in Draft (the status default) and
# moves across the board as it is confirmed, picked and shipped.
type: dialog
props:
  id: add-order-dialog
  title: Add order
  description: Name the customer and what the order is worth; it starts in Draft.
children:
  - type: form
    dataSource:
      table: orders
    fields:
      - { field: order_number, label: Order number }
      - { field: customer, label: Customer }
      - { field: lines, label: Lines }
      - { field: units, label: Units }
      - { field: total, label: Total }
      - { field: placed_at, label: Placed on }
    action:
      type: crud
      operation: create
      table: orders
      submitLabel: Add order
      onSuccess:
        navigate: /orders
        toast:
          message: Order added
          variant: success
