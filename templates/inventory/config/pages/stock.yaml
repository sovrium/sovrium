# Every movement in and out, signed, grouped by warehouse with the net per
# warehouse: receipts, picks, a transfer written as a pair of rows and a count
# that recorded what it found. Opening balances stay out of the ledger view;
# they are the starting line, not something that happened this month.
name: stock
path: /stock
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Stock · Brunel Stock
  description: Every stock movement, signed, grouped by warehouse.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Stock
              - type: container
                props:
                  className: grow
              - type: button
                content: Record a movement
                props:
                  className: h-7 px-3 text-[13px]
                  interactions:
                    click:
                      modal: record-movement-dialog
          - $ref: ./_record-movement.yaml
          - type: container
            props:
              className: flex flex-col gap-3 px-5 pb-5 pt-4
            children:
              - type: filter-bar
                publishes:
                  bindTo: ledger-filter
                fields:
                  - { name: reference, label: Reference, kind: text }
                  - name: type
                    label: Type
                    kind: select
                    options:
                      - { value: Received, label: Received }
                      - { value: Picked, label: Picked }
                      - { value: Transfer in, label: Transfer in }
                      - { value: Transfer out, label: Transfer out }
                      - { value: Count, label: Count }
                  - { name: moved_at, label: Date, kind: date }
              - type: table
                dataSource:
                  table: stock_movements
                  view: ledger_by_warehouse
                  bindTo: ledger-filter
                  sharedFilter: {}
                rowHeight: short
                columns:
                  - { field: reference, label: Reference }
                  - { field: product, label: Product }
                  - { field: type, label: Type }
                  - { field: moved_at, label: Date, format: short-date }
                  - { field: note, label: Party / note }
                  # The signed quantity closes the row, right-aligned under the
                  # warehouse's net, so the column of figures is read at a glance.
                  - field: quantity
                    label: Qty
                    align: right
                    cellStyle:
                      - { when: { lt: 0 }, tone: muted }
                summary:
                  - { field: reference, function: count, label: Movements }
                  - { field: quantity, function: sum, label: Net }
                pagination:
                  pageSize: 100
                emptyMessage: Every receipt, pick, transfer and count appears here, signed and dated, per warehouse. Record your first delivery to start the ledger.
