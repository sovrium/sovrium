# Reusable table tabs across the top of the workspace — the Airtable shell.
#
# Included as a $ref array-item at the top of every page's `components` list
# (the same $ref mechanism app.yaml uses for tables/pages), so the tab bar is
# defined in exactly one place.
type: container
element: header
props:
  className: border-b
children:
  - type: container
    props:
      className: max-w-7xl mx-auto px-6 py-3 flex flex-wrap items-center justify-between gap-3
    children:
      - type: container
        props:
          className: flex flex-wrap items-center gap-x-6 gap-y-2
        children:
          - type: text
            element: span
            props:
              className: text-base font-semibold
            content: Inventory
          - type: container
            props:
              className: flex flex-wrap items-center gap-1 text-sm
            children:
              - type: link
                props:
                  href: /
                  className: px-3 py-1.5 rounded-md font-medium
                content: Products
              - type: link
                props:
                  href: /orders
                  className: px-3 py-1.5 rounded-md font-medium
                content: Orders
              - type: link
                props:
                  href: /stock
                  className: px-3 py-1.5 rounded-md font-medium
                content: Stock
              - type: link
                props:
                  href: /suppliers
                  className: px-3 py-1.5 rounded-md font-medium
                content: Suppliers
              - type: link
                props:
                  href: /assistant
                  className: px-3 py-1.5 rounded-md font-medium
                content: Assistant
      - type: button
        props:
          className: px-3 py-1.5 rounded-md border text-sm font-medium
        content: Sign out
        action:
          type: auth
          method: logout
          onSuccess:
            navigate: /sign-in
