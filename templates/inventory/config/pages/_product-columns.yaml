# The Products grid, shared by the two tabs of Products so their columns never
# drift apart: the eight facts a stock manager reads, grouped by category, with
# the stock and its value totalled per category and for the whole catalogue.
# Every other field of a product is one click away, in its drawer.
- { field: name, label: Product, sortable: true }
- { field: sku, label: SKU }
- field: stock_state
  label: Status
  cellStyle:
    - { when: { eq: Reorder }, className: 'font-medium text-warning [&_*]:text-warning' }
    - { when: { eq: Out of stock }, className: 'font-medium text-error [&_*]:text-error' }
    - {
        when: { in: [Draft, Discontinued] },
        className: 'text-foreground-muted [&_*]:text-foreground-muted',
      }
- { field: stock_on_hand, label: On hand, align: right, sortable: true }
- { field: reorder_at, label: Reorder at, align: right }
- { field: value_at_cost, label: Value at cost, format: currency, align: right, sortable: true }
- { field: supplier, label: Supplier }
