# The catalogue assistant: ask what to reorder and from whom, or have it draft
# the purchase order. It reads products, stock, orders and suppliers with a
# member's permissions. With no AI provider configured the chat says so and
# names the variable to set (`AI_PROVIDER`, see `.env.example`).
name: assistant
path: /assistant
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Assistant · Brunel Stock
  description: Ask about products, stock or orders.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Assistant
              - type: text
                element: span
                props:
                  className: text-xs text-foreground-muted
                content: Reads products, stock, orders and suppliers
          - type: container
            props:
              className: mx-auto flex w-full max-w-[760px] flex-1 flex-col px-5 py-4
            children:
              - type: ai-chat
                agent: catalog-assistant
                placeholder: Ask about products, stock or orders
                showHistory: true
