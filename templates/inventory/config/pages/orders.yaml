# Customer orders by status. Each card names the customer, what is on the
# order and what it is worth; drag a card to move the order on. Shipped and
# Cancelled are columns too, folded until someone opens them, so the board
# shows the work still to do.
name: orders
path: /orders
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Orders · Brunel Stock
  description: Customer orders by status, from draft to shipped.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Orders
              - type: container
                props:
                  className: grow
              - type: button
                content: Add order
                props:
                  className: h-7 px-3 text-[13px]
                  interactions:
                    click:
                      modal: add-order-dialog
          - $ref: ./_add-order.yaml
          - type: container
            props:
              className: flex flex-col gap-3 px-5 pb-5 pt-4
            children:
              - type: filter-bar
                publishes:
                  bindTo: orders-filter
                fields:
                  - { name: customer, label: Customer, kind: text }
                  - { name: order_number, label: Order, kind: text }
                  - { name: placed_at, label: Placed, kind: date }
              # The three open statuses share the width; each folded column
              # takes only what its heading needs.
              - type: container
                props:
                  className: '[&_[data-column]]:min-w-0 md:[&_[data-column]]:w-auto md:[&_[data-column]]:flex-1 md:[&_[data-column=Shipped]]:flex-[0_0_9.5rem]! md:[&_[data-column=Cancelled]]:flex-[0_0_9.5rem]!'
                children:
                  - type: kanban
                    dataSource:
                      table: orders
                      bindTo: orders-filter
                      sharedFilter: {}
                      sort:
                        - { field: placed_at, direction: desc }
                    kanbanGroupBy:
                      field: status
                      # Shipped and Cancelled are done with; they start folded.
                      collapsed: [Shipped, Cancelled]
                    drag:
                      enabled: true
                      persistAction:
                        type: crud
                        operation: update
                        table: orders
                    emptyColumnMessage: No order in this status. Drag one here as the order moves on.
                    card:
                      children:
                        - type: text
                          element: h3
                          props:
                            className: text-[13px] font-medium leading-snug text-foreground
                          content: '#$record.order_number · $record.customer'
                        - type: text
                          element: p
                          props:
                            className: font-mono text-xs text-foreground-muted
                          content: $record.lines lines · $record.units units
                      footer:
                        - { field: total, format: currency }
                        - { field: placed_at, format: short-date }
                        - { field: fulfilment, format: badge }
                        - { field: owner, format: avatar }
