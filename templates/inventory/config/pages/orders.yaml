name: orders
path: /orders
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Orders
  description: Customer orders and their line items
components:
  - $ref: ./_nav.yaml
  - type: container
    element: section
    props:
      className: max-w-7xl mx-auto px-6 py-8
    children:
      - type: text
        element: h1
        props:
          className: text-2xl font-bold mb-1
        content: Orders
      - type: text
        element: p
        props:
          className: text-sm mb-6
        content: >-
          What customers asked for. Totals roll up from the line items below, so
          they cannot drift.

      - type: data-table
        dataSource:
          table: orders
          sort:
            - field: placed_at
              direction: desc
        rowHeight: medium
        striped: true
        columns:
          - field: order_number
            label: Order
            frozen: true
            align: right
            sortable: true
          - field: customer_name
            label: Customer
            sortable: true
            filterable: true
            editable: true
          - field: status
            label: Status
            sortable: true
            filterable: true
            editable: true
          - field: channel
            label: Channel
            sortable: true
            filterable: true
            editable: true
          - field: fulfilment_flags
            label: Flags
          - field: line_count
            label: Lines
            align: right
          - field: units_ordered
            label: Units
            align: right
            sortable: true
          - field: shipping_cost
            label: Shipping
            align: right
            format: currency
          - field: placed_at
            label: Placed
            format: datetime
            sortable: true
          - field: pickup_time
            label: Pickup
          - field: customer_email
            label: Email
        selection:
          mode: multiple
        search:
          enabled: true
          placeholder: Search orders
        groupBy:
          field: status
          direction: asc
        summary:
          - field: order_number
            function: count
            label: Orders
          - field: units_ordered
            function: sum
            label: Units ordered
        toolbar:
          search: true
          filters: true
          sort: true
          groupBy: true
          views: true
          export: true
          columnToggle: true
          density: true
        pagination:
          pageSize: 25
          pageSizeOptions: [10, 25, 50]
        bulkActions:
          - label: Delete
            confirm: Delete the selected orders? They stay recoverable.
            action:
              type: crud
              operation: delete
              table: orders
        emptyMessage: No orders yet.
        noMatchMessage: No orders match "{query}".

      - type: text
        element: h2
        props:
          className: text-lg font-semibold mt-10 mb-1
        content: Order lines
      - type: text
        element: p
        props:
          className: text-sm mb-4
        content: One row per product on an order. Line totals are computed in the database.
      - type: data-table
        dataSource:
          table: order_lines
        rowHeight: short
        columns:
          - field: label
            label: Line
            frozen: true
            editable: true
          - field: sales_order
            label: Order
            sortable: true
            filterable: true
          - field: product
            label: Product
            sortable: true
            filterable: true
          - field: product_sku
            label: SKU
          - field: quantity
            label: Qty
            align: right
            editable: true
          - field: unit_price
            label: Unit price
            align: right
            format: currency
            editable: true
          - field: line_total
            label: Line total
            align: right
            format: currency
        search:
          enabled: true
          placeholder: Search lines
        summary:
          - field: quantity
            function: sum
            label: Units
          - field: line_total
            function: sum
            label: Units
        toolbar:
          search: true
          filters: true
          sort: true
          export: true
          columnToggle: true
        pagination:
          pageSize: 25
        emptyMessage: No order lines yet.
