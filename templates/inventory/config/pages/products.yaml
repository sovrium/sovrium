# The catalogue as a stock manager reads it: grouped by category, with the
# stock on hand and its value at cost totalled per category and for the whole
# grid, and the products under their reorder point marked.
#
# Two tabs over the same grid: every product, or only the ones to reorder. The
# tab is part of the address (`/?view=reorder`), so the reorder list can be
# bookmarked or sent to whoever places the orders. A row opens its product in a
# drawer over the grid; `/?record=<id>` opens it too.
name: products
path: /
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Products · Brunel Stock
  description: The catalogue with its stock on hand, value at cost and reorder list.
query:
  view:
    default: all
    enum: [all, reorder]
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Products
              - type: container
                props:
                  className: grow
              - type: button
                content: Add product
                props:
                  className: h-7 px-3 text-[13px]
                  interactions:
                    click:
                      modal: add-product-dialog
          - $ref: ./_add-product.yaml
          - type: container
            props:
              className: flex flex-col gap-3 px-5 pb-5 pt-4
            children:
              - type: filter-bar
                publishes:
                  bindTo: products-filter
                fields:
                  - { name: name, label: Product, kind: text }
                  - { name: sku, label: SKU, kind: text }
                  - name: category
                    label: Category
                    kind: select
                    options:
                      - { value: Hardware, label: Hardware }
                      - { value: Accessories, label: Accessories }
                      - { value: Consumables, label: Consumables }
                      - { value: Packaging, label: Packaging }
                      - { value: Spare parts, label: Spare parts }
                  - name: status
                    label: Status
                    kind: select
                    options:
                      - { value: Active, label: Active }
                      - { value: Draft, label: Draft }
                      - { value: Discontinued, label: Discontinued }
              - type: tabs
                defaultTab: $query.view
                panels:
                  - { id: all, label: All products }
                  - { id: reorder, label: Reorder list }
                children:
                  - type: table
                    dataSource:
                      table: products
                      bindTo: products-filter
                      sharedFilter: {}
                      sort:
                        - { field: name, direction: asc }
                    rowHeight: short
                    columns:
                      $ref: ./_product-columns.yaml
                    groupBy:
                      field: category
                    summary:
                      - { field: name, function: count, label: Products }
                      - { field: stock_on_hand, function: sum, label: Σ }
                      - { field: value_at_cost, function: sum }
                    pagination:
                      pageSize: 100
                    onRowClick:
                      action: openDrawer
                      component: product-detail
                    emptyMessage: Your catalogue appears here with its stock on hand and value, grouped by category. Add the first product, or import a CSV.
                  # The products to buy again: out of stock, or under their
                  # reorder point. The filter is part of the grid, so a reader
                  # cannot lift it by accident.
                  - type: table
                    dataSource:
                      table: products
                      bindTo: products-filter
                      sharedFilter: {}
                      filter:
                        - { field: stock_state, operator: in, value: [Reorder, Out of stock] }
                      sort:
                        - { field: stock_on_hand, direction: asc }
                    rowHeight: short
                    columns:
                      $ref: ./_product-columns.yaml
                    summary:
                      - { field: name, function: count, label: Products }
                      - { field: stock_on_hand, function: sum, label: Σ }
                      - { field: value_at_cost, function: sum }
                    onRowClick:
                      action: openDrawer
                      component: product-detail
                    emptyMessage: Nothing to reorder. Every active product holds more than its reorder point.
          # One product, opened over the grid: its figures, and where its stock
          # sits and how it got there — every movement with its warehouse.
          - type: drawer
            id: product-detail
            drawerSide: right
            drawerSize: md
            canEdit: false
            dataSource:
              table: products
            props:
              title: Product
            recordFields:
              - { name: name, type: single-line-text, label: Product }
              - { name: sku, type: single-line-text, label: SKU }
              - { name: stock_on_hand, type: integer, label: On hand }
              - { name: reorder_at, type: integer, label: Reorder at }
              - { name: unit_cost, type: currency, label: Unit cost }
              - { name: unit_price, type: currency, label: Unit price }
              - { name: lead_time_days, type: integer, label: Lead time (days) }
              - { name: supplier, type: relationship, label: Supplier }
              - { name: barcode, type: barcode, label: Barcode }
            related:
              - label: Movements
                table: stock_movements
                field: product
                columns:
                  - { field: reference, label: Reference }
                  - { field: warehouse_name, label: Warehouse }
                  - { field: quantity, label: Qty }
                  - { field: moved_at, label: Date }
                sort:
                  - { field: moved_at, direction: desc }
                emptyMessage: No movement yet. Receive stock to start this product's ledger.
