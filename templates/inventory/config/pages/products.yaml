name: products
path: /
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Products
  description: The product catalog, in a live database grid
components:
  - $ref: ./_nav.yaml
  - type: container
    element: section
    props:
      className: max-w-7xl mx-auto px-6 py-8
    children:
      - type: text
        element: h1
        props:
          className: text-2xl font-bold mb-1
        content: Products
      - type: text
        element: p
        props:
          className: text-sm mb-6
        content: >-
          Every product you sell. Group, sort, filter, and edit it like a
          spreadsheet — the data lives in your own database.

      - type: data-table
        dataSource:
          table: products
          sort:
            - field: name
              direction: asc
        rowHeight: medium
        striped: true
        showRowNumbers: true
        columns:
          - field: name
            label: Name
            frozen: true
            sortable: true
            filterable: true
            editable: true
            width: 220
          - field: sku
            label: SKU
            sortable: true
            filterable: true
            editable: true
          - field: status
            label: Status
            sortable: true
            filterable: true
            editable: true
          - field: category
            label: Category
            sortable: true
            filterable: true
            editable: true
          - field: tags
            label: Tags
            editable: true
          - field: unit_price
            label: Unit price
            align: right
            format: currency
            sortable: true
            editable: true
          - field: stock_on_hand
            label: In stock
            align: right
            sortable: true
            editable: true
          - field: stock_level
            label: Stock level
          - field: quality_rating
            label: Rating
            align: center
            editable: true
          - field: discontinued
            label: Discontinued
            align: center
            format: check-cross
            editable: true
          - field: barcode
            label: Barcode
          - field: spec_notes
            label: Spec notes
            editable: true
          - field: swatch
            label: Colour
            align: center
            editable: true
          - field: lead_time
            label: Lead time
            align: right
            editable: true
          - field: supplier_name
            label: Supplier
            sortable: true
          - field: movement_count
            label: Movements
            align: right
          - field: units_moved
            label: Units moved
            align: right
          - field: stock_value
            label: Stock value
            align: right
            format: currency
          - field: photo
            label: Photo
            editable: true
          - field: launch_date
            label: Launched
            format: short-date
            sortable: true
            editable: true
          - field: created_at
            label: Created
            format: relative-date
            sortable: true
        selection:
          mode: multiple
        search:
          enabled: true
          placeholder: Search products
        groupBy:
          field: category
          direction: asc
        summary:
          - field: name
            function: count
            label: Products
          - field: stock_on_hand
            function: sum
            label: Units in stock
          - field: stock_value
            function: sum
            label: Stock value
          - field: unit_price
            function: avg
            label: Average price
        # The four Airtable view types over one dataset. Each needs its own
        # binding: kanban needs the field whose values become columns, calendar
        # needs the date that positions each record. Declaring a view without
        # its binding is refused at validation rather than rendering empty.
        views: [grid, kanban, calendar, gallery]
        kanbanGroupBy:
          field: status
        dateField: launch_date
        toolbar:
          search: true
          filters: true
          sort: true
          groupBy: true
          views: true
          viewSwitcher: true
          export: true
          columnToggle: true
          density: true
          refresh: true
        pagination:
          pageSize: 25
          pageSizeOptions: [10, 25, 50, 100]
        bulkActions:
          - label: Delete
            confirm: Delete the selected products? They stay recoverable.
            action:
              type: crud
              operation: delete
              table: products
        emptyMessage: No products yet. Add your first one above.
        noMatchMessage: No products match "{query}".
        # Airtable's "Expand record": clicking a row opens the full record in a
        # side panel, so the wide grid stays scannable.
        onRowClick:
          action: openDrawer
          component: product-detail
          props:
            width: 620

      # The drawer renders exactly the fields listed here — it does NOT derive
      # them from the table. Omit `recordFields` and it opens as an empty shell
      # with a save button.
      - type: record-drawer
        id: product-detail
        dataSource:
          table: products
        canEdit: true
        props:
          title: Product
        recordFields:
          - { name: name, type: single-line-text }
          - { name: sku, type: single-line-text }
          - { name: status, type: status }
          - { name: category, type: single-select }
          - { name: tags, type: multi-select, renderAs: list }
          - { name: unit_price, type: currency }
          - { name: stock_on_hand, type: integer }
          - { name: reorder_point, type: integer }
          - { name: quality_rating, type: rating }
          - { name: barcode, type: barcode }
          - { name: launch_date, type: date }
          - { name: description, type: long-text }
          - { name: supplier_name, type: lookup }
          - { name: movement_count, type: count }
          - { name: stock_value, type: formula }
