# Brunel Stock — the design system of this app.
#
# `baseline: extend` keeps Sovrium's built-in design system and changes only
# what is declared here. Type stays on the two faces the platform already
# self-hosts (IBM Plex Sans and JetBrains Mono): no family is pulled from a
# font CDN, which would leak every visitor's address to a third party.
#
# One accent, a bronze at hue 70, and neutrals tinted toward it so the greys
# read as cardboard rather than slate. Colour otherwise means a stock outcome:
# an order shipped, a product under its reorder point, a product out of stock
# or an order cancelled. Active, Draft, Picking and every category are not
# outcomes, so they stay neutral.
baseline: extend

# Follow the operating system's light or dark preference. `darkColors` below is
# what the dark scheme paints; without `colorScheme` it would never render.
colorScheme: system

# Role keys repaint the prestyled components (grid, board, drawer, buttons,
# badges) with no class changes anywhere else in the config.
#
# Every role is spelled out in BOTH schemes. `primary` and friends derive a
# white `-foreground` companion in the light scheme only, which reads wrong on
# a pale dark-mode accent, so the dark block names every companion itself.
# `primary-active` and `destructive-foreground` are declared too: left out, a
# pressed button would fall back to the platform's achromatic default.
#
# `warning` sits on hue 45, away from the bronze accent at 70, so a "Reorder"
# badge never reads as the brand colour.
colors:
  primary: oklch(0.52 0.136 70)
  primary-hover: oklch(0.46 0.128 70)
  primary-active: oklch(0.42 0.119 70)
  primary-foreground: oklch(0.985 0.003 70)
  primary-subtle: oklch(0.95 0.025 70)
  primary-subtle-foreground: oklch(0.38 0.102 70)
  ring: oklch(0.6 0.136 70)
  background: oklch(0.985 0.003 70)
  background-subtle: oklch(0.967 0.005 70)
  background-raised: oklch(1 0 0)
  background-overlay: oklch(1 0 0)
  background-inset: oklch(0.925 0.008 70)
  foreground: oklch(0.21 0.008 70)
  foreground-muted: oklch(0.45 0.012 70)
  foreground-subtle: oklch(0.51 0.012 70)
  foreground-disabled: oklch(0.71 0.012 70)
  foreground-inverse: oklch(0.985 0.003 70)
  border: oklch(0.925 0.008 70)
  success: oklch(0.52 0.12 155)
  warning: oklch(0.55 0.14 45)
  error: oklch(0.53 0.17 25)
  destructive-foreground: oklch(0.985 0.003 70)

darkColors:
  primary: oklch(0.78 0.102 70)
  primary-hover: oklch(0.83 0.076 70)
  primary-active: oklch(0.87 0.06 70)
  primary-foreground: oklch(0.16 0.006 70)
  primary-subtle: oklch(0.28 0.051 70)
  primary-subtle-foreground: oklch(0.9 0.051 70)
  ring: oklch(0.72 0.111 70)
  background: oklch(0.16 0.006 70)
  background-subtle: oklch(0.19 0.007 70)
  background-raised: oklch(0.21 0.008 70)
  background-overlay: oklch(0.23 0.008 70)
  background-inset: oklch(0.13 0.005 70)
  foreground: oklch(0.95 0.005 70)
  foreground-muted: oklch(0.75 0.01 70)
  foreground-subtle: oklch(0.68 0.012 70)
  foreground-disabled: oklch(0.45 0.01 70)
  foreground-inverse: oklch(0.16 0.006 70)
  border: oklch(0.3 0.01 70)
  success: oklch(0.75 0.12 155)
  warning: oklch(0.78 0.12 50)
  error: oklch(0.72 0.14 25)
  destructive-foreground: oklch(0.16 0.006 70)

# What each colour is for. Writing the usage down is what stops the accent from
# drifting onto a stock state, and a stock colour from becoming decoration.
colorRoles:
  primary:
    usage: The one accent. Primary action fill, active nav item, focus ring, selected row edge. Never a stock state, never a category.
    pairsWith: primary-foreground
  primary-subtle:
    usage: Selected and current states on quiet surfaces — the current page, the selected row, the group being edited.
    pairsWith: primary-subtle-foreground
  success:
    usage: 'An order shipped, a purchase received in full. Never "Active".'
    pairsWith: foreground
  warning:
    usage: A product at or under its reorder point. Nothing else.
    pairsWith: foreground
  error:
    usage: A product out of stock, a cancelled order, a failed save, a destructive action.
    pairsWith: foreground

# A figure-forward type ladder: body text at 14px, and the monospace face for
# SKUs, quantities, money and overlines so a column of figures lines up.
typeScale:
  families:
    sans:
      family: "'IBM Plex Sans Variable', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    mono:
      family: "'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
  steps:
    display: { size: 2rem, lineHeight: 1.1, weight: 600, letterSpacing: -0.02em }
    h1: { size: 1.375rem, lineHeight: 1.2, weight: 600, letterSpacing: -0.01em }
    h2: { size: 1.0625rem, lineHeight: 1.3, weight: 600 }
    h3: { size: 0.875rem, lineHeight: 1.35, weight: 600 }
    lead: { size: 0.9375rem, lineHeight: 1.5 }
    body: { size: 0.875rem, lineHeight: 1.5 }
    bodySmall: { size: 0.8125rem, lineHeight: 1.45 }
    caption: { size: 0.75rem, lineHeight: 1.4 }
    overline: { size: 0.6875rem, lineHeight: 1.3, weight: 500, letterSpacing: 0.04em, font: mono }

# Sharp corners: this is a stock ledger, not a consumer app, and small radii
# keep a dense grid crisp.
radius:
  sm: 0.125rem
  md: 0.25rem
  lg: 0.375rem
  full: 9999px

# Cards carry a one-pixel lift; overlays float clearly above the page.
elevation:
  none: none
  sm: 0 1px 2px rgb(48 36 20 / 0.06)
  md: 0 4px 12px rgb(48 36 20 / 0.08)
  lg: 0 12px 32px rgb(48 36 20 / 0.14)

# A stock manager reads many rows at once, so the grids run compact. The three
# steps are the platform's own values, written out so one number can be tuned.
density:
  default: compact
  steps:
    compact: { rowY: 5px, controlH: 36px, buttonH: 28px, gap: 7px, text: 11px }
    cozy: { rowY: 8px, controlH: 40px, buttonH: 32px, gap: 10px, text: 13px }
    roomy: { rowY: 14px, controlH: 44px, buttonH: 36px, gap: 16px, text: 14px }

# How the app speaks. Nothing reads these at runtime; they are the brief anyone
# writing a label, an empty state or an error message for this app follows.
voice:
  personality:
    - exact
    - unhurried
    - counts first
  pronoun: you
  prefer:
    - 'Lead a button with its verb: Receive stock, Record a movement, Reorder.'
    - 'Name the quantity and the place: 34 in Lyon South, 120 to reorder.'
    - Every empty state names the one next action.
  avoid:
    - No exclamation marks, no alarm copy on a low-stock line.
    - 'No logistics jargon the operator did not choose (no "SKU velocity", no "3PL").'
    - Never round a quantity or hide a unit.
  tone:
    empty: Say what this view will hold, then the one action that fills it.
    loading: Name what is loading — products, movements — never a bare spinner.
    error: State what did not save and the one thing that fixes it; keep the quantity typed.
    success: 'Confirm the fact in past tense with the quantity and the place: 120 received into Paris Central.'
    destructive: Name the product or order and whether stock moves back.

principles:
  - Quantities, SKUs and money are mono and right-aligned; a column of figures is read, not scanned.
  - Colour means a stock outcome — under the reorder point, out, shipped — or it is not used.
  - Stock on hand is derived from movements, never typed.
  - A product opens without leaving the grid.
