# Sample catalog — the flagship grid.
#
# `key` is file-local — it exists so movements and order lines can name a
# product before any row has a database id. It is never written to a column.
#
# This table is the reference surface for Sovrium's field-type range, so the
# seed data is chosen to make each column mean something rather than merely be
# non-null:
#
#   - `status` spreads across all five options, `category` across all five, and
#     `tags` (maxSelections: 3) across the range without ever exceeding three.
#   - `stock_on_hand` sits BELOW `reorder_point` on exactly the rows whose
#     status says Low stock or Out of stock. The flag-low-stock automation and
#     the stock page both read that relationship; data where the two disagree
#     would make the demo look broken to anyone who checks.
#   - `stock_level` is a `progress` field (0–100). It is filled as stock against
#     a comfortable ceiling, so the bars are readable at a glance and the empty
#     ones are empty for a reason.
#   - `lead_time` is a `duration`, stored in SECONDS regardless of the `h:mm`
#     display format. 604800 renders as 168:00 — one week.
#   - `swatch` is a `color` field. The hexes are QUOTED: unquoted, YAML reads a
#     leading `#` as the start of a comment and the value silently becomes null.
#
# Left unseeded on purpose: `photo` and `gallery` (attachments need binary files
# this repository does not ship), `owner` (a `user` field needs an account id
# that does not exist until someone signs up), and every computed column —
# `supplier_name`, `movement_count`, `units_moved` and `stock_value` derive
# themselves, and the audit columns are written by the engine.
