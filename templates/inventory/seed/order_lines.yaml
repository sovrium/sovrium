# Sample order lines — the join between orders and products.
#
# These rows are what give the rest of the workspace its computed columns:
# `orders.line_count` counts them, `orders.units_ordered` rolls up their
# `quantity`, `order_lines.product_sku` looks through to the product, and
# `order_lines.line_total` is a formula over quantity × unit_price. Seed none of
# these and four columns across two tables render empty on every row.
#
# Line counts vary deliberately — one order has a single line, one has four —
# so `line_count` is a column with a range in it rather than a constant.
#
# `unit_price` is repeated onto the line rather than looked up, which is not
# redundancy: it is the price AT THE TIME OF SALE. Two of the lines below are
# priced under the current catalog price for exactly that reason (the Northwind
# contract rate, and the clearance on the legacy scanner), and a demo that
# copied today's list price everywhere would hide the one thing an order line
# exists to record.
records:
  # ── Northwind fit-out (4 lines) ─────────────────────────────────────
  - key: line-nw-1
    fields:
      label: Rack shelf 1200mm × 40
      sales_order: '@orders.ord-northwind-fitout'
      product: '@products.rack-shelf-1200'
      quantity: 40
      unit_price: 139.00

  - key: line-nw-2
    fields:
      label: Rack upright 2400mm × 24
      sales_order: '@orders.ord-northwind-fitout'
      product: '@products.rack-upright-2400'
      quantity: 24
      unit_price: 89.50

