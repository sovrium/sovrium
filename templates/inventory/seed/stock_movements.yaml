# Sample stock ledger — the append-only history behind every stock figure.
#
# This file is what makes `products.movement_count` and `products.units_moved`
# mean something: with no movements, both computed columns render 0 on every row
# and the demo silently shows nothing about count/rollup fields at all.
#
# `quantity` is a POSITIVE MAGNITUDE on every row, including outbound ones — the
# `direction` column carries the sign. That means the `units_moved` rollup is
# GROSS throughput (everything that ever crossed the door), not net stock on
# hand. Signing the outbound rows would make the rollup read as net and look
# tidier, but it would also make the same number mean two different things
# depending on which row you looked at, and a demo that teaches the wrong model
# is worse than one that teaches a plain one.
#
# Dates are relative and spread over roughly four months so the ledger has depth
# — a history where everything happened on the same day is not a history.
