# Sample orders.
#
# `key` is file-local — it exists so order_lines.yaml can name an order before
# either row has a database id. It is never written to a column.
#
# Eight orders, spread across all five statuses and all four channels, because
# the orders grid's whole point is grouping and filtering: a status column where
# every row says Confirmed groups into one bucket and demonstrates nothing.
#
# `placed_at` uses `{{now-Nd}}` rather than `{{today-Nd}}` — it is a `datetime`
# field, and `now` renders a full ISO instant where `today` renders a bare date.
# `pickup_time` is a separate `time` field in 24-hour form; only the four orders
# that are actually being collected carry one.
#
# Not seeded here: `line_count` and `units_ordered` are a count and a rollup
# over the lines in order_lines.yaml — they compute themselves once those rows
# exist.
#
# `order_number` IS seeded, and it should not have to be. It is an `autonumber`,
# which the domain lists in READONLY_COMPUTED_FIELD_TYPES with the note
# "system-managed: DB-assigned" — so a value here is, on paper, an error. Two
# platform defects make it necessary anyway, and both are worth knowing before
# anyone "cleans this up":
#
#   1. On SQLite (the zero-config default this preview and the demo fleet run),
#      a NON-PRIMARY-KEY autonumber column is emitted as a plain
#      `INTEGER NOT NULL` with no DEFAULT and no sequence — SQLite can only
#      auto-increment a rowid. Nothing on the create path fills it in.
#   2. `orders` is view-backed (it carries lookup/rollup/count fields), and the
#      INSTEAD OF INSERT trigger treats `autonumber` as an ordinary base column,
#      so it writes an explicit NULL. That one bites POSTGRES too.
#
#   Net effect: omitting the field fails the NOT NULL constraint, and supplying
#   it through the records API is rejected as a readonly write. The seed path
#   does not enforce that readonly rule, which is the only reason this file can
#   exist at all.
#
#   Numbers start at 1001 deliberately. On Postgres the column is a SERIAL whose
#   sequence still sits at 1, and seeding low values would collide with the very
#   first order created through the UI; starting high leaves a thousand-row
#   runway. Delete this block and these eight lines once the engine assigns the
#   value itself.
records:
  - key: ord-northwind-fitout
    fields:
      order_number: 1001
      customer_name: Northwind Trading
      customer_email: procurement@northwind.example
      status: Shipped
      channel: Wholesale
      fulfilment_flags: [signature required]
      placed_at: '{{now-63d}}'
      warehouse: '@warehouses.paris-central'
      shipping_cost: 240.00
      notes: >-
        Full warehouse fit-out. Delivered on a curtain-sider; the driver waited
        two hours for a forklift, so quote a longer slot next time.

