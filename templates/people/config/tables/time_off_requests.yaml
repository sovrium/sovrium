id: 2
name: time_off_requests
fields:
  - id: 1
    name: employee
    type: relationship
    relatedTable: employees
    relationType: many-to-one
    required: true
    # Names the column a human should see instead of the foreign key. Measured
    # against the running app: this reaches the `table` grid's inline record
    # PICKER (`record-picker-editor.tsx` searches and labels on it) but NOT the
    # read-only cell, which still renders the raw integer, and not a `form`
    # bound to this field, which renders a plain text input rather than a
    # picker. It is declared here anyway because it is the correct place to say
    # what identifies an employee, and the two render paths that ignore it are
    # platform gaps rather than a reason to leave the intent unstated.
    displayField: name
  - id: 2
    name: type
    type: single-select
    options:
      - Vacation
      - Sick leave
      - Remote work
      - Other
    default: Vacation
  - id: 3
    name: start_date
    type: date
    required: true
  - id: 4
    name: end_date
    type: date
    required: true
  - id: 5
    name: status
    type: status
    options:
      - value: Pending
        color: '#F59E0B'
      - value: Approved
        color: '#10B981'
      - value: Rejected
        color: '#EF4444'
    default: Pending
  - id: 6
    name: notes
    type: long-text
  - id: 7
    name: created_at
    type: created-at

permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
  delete:
    - admin
