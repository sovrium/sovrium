# The HR overview: how many people, how they split across teams, and where
# time off stands. Only an admin opens this page.
name: overview
path: /overview
access:
  require: [admin]
  redirectTo: /sign-in
meta:
  title: HR overview · Meridian People
  description: Headcount by team, and where time off stands.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: HR overview
          - type: container
            props:
              className: flex flex-col gap-3 px-5 pb-5 pt-4
            children:
              - type: grid
                props:
                  className: grid grid-cols-2 gap-3 lg:grid-cols-4
                children:
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Headcount
                    dataSource:
                      table: employees
                    kpiAggregate: { function: count }
                    kpiFormat: { type: number }
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Waiting on a decision
                    dataSource:
                      table: time_off_requests
                      filter:
                        - { field: status, operator: eq, value: Pending }
                    kpiAggregate: { function: count }
                    kpiFormat: { type: number }
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Approved requests
                    dataSource:
                      table: time_off_requests
                      filter:
                        - { field: status, operator: eq, value: Approved }
                    kpiAggregate: { function: count }
                    kpiFormat: { type: number }
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Calendar days approved
                    dataSource:
                      table: time_off_requests
                      filter:
                        - { field: status, operator: eq, value: Approved }
                    kpiAggregate: { function: sum, field: days }
                    kpiFormat: { type: number }
              - type: grid
                props:
                  className: grid grid-cols-1 items-start gap-3 lg:grid-cols-2
                children:
                  - type: container
                    element: section
                    props:
                      className: flex min-w-0 flex-col gap-2
                    children:
                      - type: text
                        element: h2
                        props:
                          className: text-[15px] font-semibold text-foreground
                        content: Headcount by team
                      # Teams in the order they are declared, each bar in the
                      # colour its option declares on the employees table.
                      - type: chart
                        chartType: bar
                        dataSource:
                          table: employees
                        chartAggregate:
                          function: count
                          groupBy: team
                          order: option
                  - type: container
                    element: section
                    props:
                      className: flex min-w-0 flex-col gap-2
                    children:
                      - type: text
                        element: h2
                        props:
                          className: text-[15px] font-semibold text-foreground
                        content: Approved days by type
                      - type: chart
                        chartType: bar
                        dataSource:
                          table: time_off_requests
                          filter:
                            - { field: status, operator: eq, value: Approved }
                        chartAggregate:
                          function: sum
                          field: days
                          groupBy: type
                          order: option
