# The app's persistent navigation, included at the top of every workspace page.
#
# A column holding the app's name, the `sidebar` and a sign-out control. The
# sidebar is drawn twice, once per role, and `visibility` keeps exactly one of
# them in each response: HR (the admin) gets the Requests queue and the HR
# overview under their own heading, everyone else the directory and time off.
# A member's page carries no link to a page they may not open — the pages
# themselves refuse a member too (`access` on requests.yaml and overview.yaml).
#
# On a laptop narrower than `lg` the sidebar shrinks to a column of icons, and
# on a phone (below `md`) it leaves the layout: a menu button opens the same
# entries in a drawer, so the page gets the whole width of the screen.
type: container
element: aside
props:
  className: flex w-[232px] flex-none flex-col gap-0.5 border-r border-border bg-background-subtle px-2.5 py-3 max-lg:w-auto max-md:contents
children:
  - type: container
    props:
      className: mb-2.5 flex h-9 items-center gap-2.5 px-2 text-sm font-semibold text-foreground max-lg:hidden
    children:
      - type: icon
        props:
          name: users
          size: 14
          className: box-content rounded-sm bg-primary p-1 text-primary-foreground
      - type: text
        element: span
        content: Meridian People
  - type: sidebar
    visibility:
      roles: [admin]
    rail:
      below: lg
    drawer:
      below: md
      label: Menu
    props:
      # Row metrics tuned to a short navigation: 30px rows, 13.5px labels, the
      # current page on the accent's quiet ground, and the HR heading as a
      # small monospace overline.
      className: flex min-h-0 flex-col gap-0.5 md:flex-1 [&_a]:h-[30px] [&_a]:gap-2.5 [&_a]:rounded-md [&_a]:px-2.5 [&_a]:text-[13.5px] [&_a]:text-foreground-muted [&_a[aria-current=page]]:bg-primary-subtle [&_a[aria-current=page]]:font-medium [&_a[aria-current=page]]:text-primary-subtle-foreground [&_h2]:px-2.5 [&_h2]:pt-3 [&_h2]:pb-1 [&_h2]:font-mono [&_h2]:text-[10.5px] [&_h2]:tracking-wider [&_h2]:text-foreground-subtle
    groups:
      - landmark: Workspace
        items:
          - { label: Directory, href: /, icon: users }
          - { label: Time off, href: /time-off, icon: calendar }
      - label: HR
        landmark: Workspace
        headingLevel: 2
        items:
          - { label: Requests, href: /requests, icon: inbox }
          - { label: Overview, href: /overview, icon: chart-column }
  - type: sidebar
    visibility:
      roles: [member]
    rail:
      below: lg
    drawer:
      below: md
      label: Menu
    props:
      className: flex min-h-0 flex-col gap-0.5 md:flex-1 [&_a]:h-[30px] [&_a]:gap-2.5 [&_a]:rounded-md [&_a]:px-2.5 [&_a]:text-[13.5px] [&_a]:text-foreground-muted [&_a[aria-current=page]]:bg-primary-subtle [&_a[aria-current=page]]:font-medium [&_a[aria-current=page]]:text-primary-subtle-foreground
    groups:
      - landmark: Workspace
        items:
          - { label: Directory, href: /, icon: users }
          - { label: Time off, href: /time-off, icon: calendar }
  - type: container
    props:
      className: mt-auto flex items-center justify-end gap-2.5 border-t border-border px-2 py-2.5 text-sm text-foreground-muted max-lg:hidden
    children:
      - type: button
        variant: ghost
        props:
          className: h-7 px-2 text-xs
        content: Sign out
        action:
          type: auth
          method: logout
          onSuccess:
            navigate: /sign-in
