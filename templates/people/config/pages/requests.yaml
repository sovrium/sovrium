# The HR queue: every request, what waits on a decision first. Only an admin
# opens this page. The note a person leaves for the approver is not a column:
# it stays inside the request, where only an admin reads it.
name: requests
path: /requests
access:
  require: [admin]
  redirectTo: /sign-in
meta:
  title: Requests · Meridian People
  description: Every time-off request, the ones waiting on a decision first.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Requests
          - type: container
            props:
              className: flex flex-col gap-3 px-5 pb-5 pt-4
            children:
              - type: filter-bar
                publishes:
                  bindTo: requests-filter
                fields:
                  - { name: employee_name, label: Person, kind: text }
                  - name: status
                    label: Decision
                    kind: select
                    options:
                      - { value: Pending, label: Pending }
                      - { value: Approved, label: Approved }
                      - { value: Rejected, label: Rejected }
                  - name: type
                    label: Type
                    kind: select
                    options:
                      - { value: Vacation, label: Vacation }
                      - { value: Remote work, label: Remote work }
                      - { value: Sick leave, label: Sick leave }
                      - { value: Parental leave, label: Parental leave }
                      - { value: Other, label: Other }
              # Bound to the `request_queue` view: pending first, then by date,
              # and read-only — a decision is a button, not a cell edit.
              - type: table
                readOnly: true
                props:
                  id: request-queue
                dataSource:
                  table: time_off_requests
                  view: request_queue
                  bindTo: requests-filter
                  sharedFilter: {}
                columns:
                  - { field: employee_name, label: Person }
                  - { field: type, label: Type }
                  - { field: start_date, label: From, format: short-date }
                  - { field: end_date, label: To, format: short-date }
                  - { field: days, label: Days }
                  - { field: status, label: Decision }
                  - type: actions
                    actions:
                      - label: Approve
                        icon: check
                        visibleWhen: { field: status, eq: Pending }
                        action:
                          type: fetch
                          url: /api/tables/time_off_requests/records/$record.id
                          method: PATCH
                          body:
                            fields:
                              status: Approved
                          onSuccess:
                            type: toast
                            message: Request approved
                            variant: success
                            refetch: request-queue
                      - label: Reject
                        icon: x
                        variant: ghost
                        visibleWhen: { field: status, eq: Pending }
                        confirm: Reject this request? Open it afterwards to write the reason.
                        action:
                          type: fetch
                          url: /api/tables/time_off_requests/records/$record.id
                          method: PATCH
                          body:
                            fields:
                              status: Rejected
                          onSuccess:
                            type: toast
                            message: Request rejected
                            variant: success
                            refetch: request-queue
                onRowClick:
                  action: openDrawer
                  component: request-decision
                pagination:
                  pageSize: 25
                emptyMessage: Nothing waits on you. Time-off requests from the team appear here until an admin decides.
              # A request filed in the app also starts an approval run that
              # waits on an admin. This list reads those runs, so a decision
              # can resume the run itself: approving marks the request
              # Approved, rejecting marks it Rejected — then open it above to
              # write the reason.
              - type: text
                element: h2
                props:
                  className: pt-3 font-mono text-[11px] font-medium uppercase tracking-wider text-foreground-subtle
                content: Approval runs waiting on you
              - type: table
                readOnly: true
                props:
                  id: approval-runs
                dataSource:
                  system:
                    endpoint: /api/automations/approvals
                    rowsKey: approvals
                    idKey: approvalId
                    query:
                      status: pending
                columns:
                  - { field: message, label: Request }
                  - { field: requestedAt, label: Asked, format: relative-date }
                  - { field: expiresAt, label: Rejected automatically, format: short-date }
                  - type: actions
                    actions:
                      - label: Approve
                        icon: check
                        action:
                          type: fetch
                          url: /api/automations/runs/$record.runId/approvals/$record.approvalId/approve
                          method: POST
                          onSuccess:
                            type: toast
                            message: Approved — the request is marked Approved
                            variant: success
                            refetch: [approval-runs, request-queue]
                      - label: Reject
                        icon: x
                        variant: ghost
                        confirm: Reject this request? Open it afterwards to write the reason.
                        action:
                          type: fetch
                          url: /api/automations/runs/$record.runId/approvals/$record.approvalId/reject
                          method: POST
                          onSuccess:
                            type: toast
                            message: Request rejected
                            variant: success
                            refetch: [approval-runs, request-queue]
                emptyMessage: No approval run waits on you. A request filed in the app appears here until an admin decides.
          # One request, opened from the queue: the decision and its reason,
          # editable by the admin reading this page.
          - type: drawer
            id: request-decision
            drawerSide: right
            drawerSize: md
            canEdit: true
            dataSource:
              table: time_off_requests
            props:
              title: '$record.employee_name · $record.type'
            recordFields:
              - { name: employee_name, type: single-line-text, label: Person }
              - { name: type, type: single-select, label: Type }
              - { name: start_date, type: date, label: From }
              - { name: end_date, type: date, label: To }
              - { name: note, type: long-text, label: Note for the approver }
              - { name: status, type: status, label: Decision }
              - { name: decision_note, type: long-text, label: Reason for the decision }
