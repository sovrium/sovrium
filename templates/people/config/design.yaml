# Meridian People — the design system of this app.
#
# `baseline: extend` keeps Sovrium's built-in design system and changes only
# what is declared here. Type stays on the two faces the platform already
# self-hosts (IBM Plex Sans and JetBrains Mono): no family is pulled from a
# font CDN, which would leak every visitor's address to a third party.
#
# An HR tool is read by people about people, so the design spends its emphasis
# on three things only: a person's name, the dates of an absence, and the one
# decision a request waits for. It is discreet about everything else — and
# visibly so about what a person may not read.
#
# One accent, an orchid held at a steady lightness, sits clear of the three
# decision colours (green, amber, red), so the accent never reads as a verdict
# and a verdict never reads as decoration.
baseline: extend

# Follow the operating system's light or dark preference. `darkColors` below is
# what the dark scheme paints; without `colorScheme` it would never render.
colorScheme: system

# Role keys repaint the prestyled components (gallery, calendar, grids,
# buttons, badges) with no class changes anywhere else in the config.
#
# Every role is spelled out in BOTH schemes. `primary` and friends derive a
# white `-foreground` companion in the light scheme only, which reads wrong on
# a pale dark-mode accent — so the dark block names every companion itself.
# `primary-active` is declared too: left out, a pressed button would fall back
# to the platform's achromatic default for a frame.
colors:
  primary: oklch(0.52 0.16 315)
  primary-hover: oklch(0.46 0.15 315)
  primary-active: oklch(0.42 0.14 315)
  primary-foreground: oklch(0.985 0.003 315)
  primary-subtle: oklch(0.95 0.03 315)
  primary-subtle-foreground: oklch(0.38 0.12 315)
  ring: oklch(0.6 0.16 315)
  background: oklch(0.985 0.003 315)
  background-subtle: oklch(0.967 0.005 315)
  background-raised: oklch(1 0 0)
  background-overlay: oklch(1 0 0)
  background-inset: oklch(0.925 0.008 315)
  foreground: oklch(0.21 0.008 315)
  foreground-muted: oklch(0.45 0.012 315)
  foreground-subtle: oklch(0.51 0.012 315)
  foreground-disabled: oklch(0.71 0.012 315)
  foreground-inverse: oklch(0.985 0.003 315)
  border: oklch(0.925 0.008 315)
  success: oklch(0.52 0.12 155)
  warning: oklch(0.5 0.12 75)
  error: oklch(0.53 0.17 25)
  destructive-foreground: oklch(0.985 0.003 315)

darkColors:
  primary: oklch(0.78 0.12 315)
  primary-hover: oklch(0.83 0.09 315)
  primary-active: oklch(0.87 0.07 315)
  primary-foreground: oklch(0.16 0.006 315)
  primary-subtle: oklch(0.28 0.06 315)
  primary-subtle-foreground: oklch(0.9 0.06 315)
  ring: oklch(0.72 0.13 315)
  background: oklch(0.16 0.006 315)
  background-subtle: oklch(0.19 0.007 315)
  background-raised: oklch(0.21 0.008 315)
  background-overlay: oklch(0.23 0.008 315)
  background-inset: oklch(0.13 0.005 315)
  foreground: oklch(0.95 0.005 315)
  foreground-muted: oklch(0.75 0.01 315)
  foreground-subtle: oklch(0.68 0.012 315)
  foreground-disabled: oklch(0.45 0.01 315)
  foreground-inverse: oklch(0.16 0.006 315)
  border: oklch(0.3 0.01 315)
  success: oklch(0.75 0.12 155)
  warning: oklch(0.8 0.12 75)
  error: oklch(0.72 0.14 25)
  destructive-foreground: oklch(0.16 0.006 315)

# What each colour is for. Writing the usage down is what stops the accent from
# becoming a team's colour, and a decision colour from becoming decoration.
colorRoles:
  primary:
    usage: The one accent. Primary action fill, the current nav entry, the focus ring, today on the calendar. Never a status and never a department.
    pairsWith: primary-foreground
  primary-subtle:
    usage: Selected and current states on quiet surfaces — the current page, the person selected in the directory.
    pairsWith: primary-subtle-foreground
  success:
    usage: A request marked Approved, and nothing else.
    pairsWith: foreground
  warning:
    usage: A request Pending — waiting on an admin's decision.
    pairsWith: foreground
  error:
    usage: A request Rejected, a failed save, a destructive action.
    pairsWith: foreground

# Sans for names and sentences, the monospace face for dates, day counts and
# overlines, so a column of date ranges lines up.
typeScale:
  families:
    sans:
      family: "'IBM Plex Sans Variable', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    mono:
      family: "'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
  steps:
    display: { size: 2rem, lineHeight: 1.1, weight: 600, letterSpacing: -0.02em }
    h1: { size: 1.375rem, lineHeight: 1.2, weight: 600, letterSpacing: -0.01em }
    h2: { size: 1.0625rem, lineHeight: 1.3, weight: 600 }
    h3: { size: 0.875rem, lineHeight: 1.35, weight: 600 }
    lead: { size: 0.9375rem, lineHeight: 1.5 }
    body: { size: 0.875rem, lineHeight: 1.5 }
    bodySmall: { size: 0.8125rem, lineHeight: 1.45 }
    caption: { size: 0.75rem, lineHeight: 1.4 }
    overline: { size: 0.6875rem, lineHeight: 1.3, weight: 500, letterSpacing: 0.04em, font: mono }

# Soft corners: a directory of people, not a ledger.
radius:
  sm: 0.5rem
  md: 0.75rem
  lg: 1rem
  full: 9999px

# Cards carry a one-pixel lift; overlays float clearly above the page.
elevation:
  none: none
  sm: 0 1px 2px rgb(20 20 30 / 0.06)
  md: 0 4px 12px rgb(20 20 30 / 0.08)
  lg: 0 12px 32px rgb(20 20 30 / 0.14)

# A directory card carries four facts and a request five, and nobody reads
# them in a hurry, so rows breathe: the cozy step. The three steps are the
# platform's own values, written out so one number can be tuned.
density:
  default: cozy
  steps:
    compact: { rowY: 5px, controlH: 36px, buttonH: 28px, gap: 7px, text: 11px }
    cozy: { rowY: 8px, controlH: 40px, buttonH: 32px, gap: 10px, text: 13px }
    roomy: { rowY: 14px, controlH: 44px, buttonH: 36px, gap: 16px, text: 14px }

# How the app speaks. Nothing reads these at runtime; they are the brief anyone
# writing a label, an empty state or an error message for this app follows.
voice:
  personality:
    - warm
    - discreet
    - clear
  pronoun: you
  prefer:
    - 'Lead a button with its verb: Request time off, Approve, Add person.'
    - Name the person and the dates; say who decides and when.
    - Every empty state names the one next action.
  avoid:
    - No exclamation marks, no "Yay, time off!" — an absence is not a celebration or a favour.
    - Never show a reason for sick leave beyond its type.
    - No HR jargon (no "FTE", no "human capital", no "resources" for people).
  tone:
    empty: Say what this list will hold, then the one action that fills it.
    loading: Name what is loading — the team, the calendar — never a bare spinner.
    error: State what did not save and the one thing that fixes it; keep what the person typed.
    success: Confirm in past tense with the person and the dates.
    destructive: Name the person or the request and whether it comes back.

principles:
  - Every absence shows whose it is and its dates.
  - A field a person may not read is shown as withheld, never as empty.
  - Colour means a decision — approved, pending, rejected — or it is not used.
  - The employee always knows who decides and when.
