# HR workspace theming.
#
# `baseline: extend` keeps Sovrium's built-in design system — the OKLCH neutral
# ramp and the self-hosted IBM Plex Sans / JetBrains Mono type that ships with
# the platform. There is deliberately no `fonts` block: the workhorse and mono
# families are already self-hosted, and pulling a family from a CDN would leak
# the operator's IP and Referer to a third party, which
# `docs/architecture/patterns/fonts.md` forbids outright. This template used to
# request Inter from Google Fonts, which achieved neither goal — the request
# leaked, AND naming an unserved family locks the shipped face out of its own
# stack, so the page silently fell to the OS default. Distinctiveness here comes
# from COLOUR, not from type.
#
# WHY THESE KEYS AND NOT OTHERS
#   `theme.colors` accepts any kebab-case key, but only the keys in
#   `COLOR_TO_SV_TOKEN` (src/infrastructure/css/theme/theme-generators.ts) emit
#   the `--sv-*` platform tokens as well as `--color-*`. Those are the ones every
#   prestyled island already consumes, so declaring them repaints the directory
#   gallery, the request grid and the time-off calendar with no class changes
#   anywhere in this config. A non-role key such as `brand-violet` emits
#   `--color-*` only and does nothing until something references it — which is
#   how a template can declare a page of pretty colours and still render
#   achromatic.
#
#   The map is NOT identity, and guessing the name is the trap: `muted` and
#   `background-subtle` both land on `--sv-bg-subtle`, `card` is `--sv-bg-raised`,
#   `popover` is `--sv-bg-overlay`, `ring` is `--sv-focus-ring`. The canonical
#   spellings are used below rather than the aliases, so the file reads as the
#   role it paints. `text` / `text-muted` / `background-alt` are NOT in the map
#   and would be inert.
#
#   Sovrium's own apps under `apps/` may NOT touch these keys without a
#   BRAND.md permit, because repainting the role tokens there would silently
#   reinstate the coloured ramp ADR-024 deleted from the Sovrium identity. That
#   lock is repo-local and deliberately does not extend here: a template exists
#   to look like the product a customer is building, not like sovrium.com.
#
# WHY VIOLET
#   Hues are assigned centrally across the nineteen templates so the demo fleet
#   stays distinguishable at a glance; violet is this one. It also sits clear of
#   all four semantic colours, which matters more here than elsewhere: the whole
#   point of the requests table is the Pending / Approved / Rejected traffic
#   light, and an accent inside that amber-green-red span would compete with the
#   decision the page exists to show. Violet reads as chrome, never as a verdict.
baseline: extend

colors:
  # `primary-foreground` is text ON the filled primary, never a themeable
  # surface — white is the only value that clears AA against violet-600, so it
  # is a literal rather than a token reference.
  primary: '#7c3aed'
  primary-hover: '#6d28d9'
  primary-foreground: '#ffffff'
  primary-subtle: '#ede9fe'
  ring: '#8b5cf6'

  background: '#ffffff'
  background-subtle: '#f5f4f9'
  background-raised: '#ffffff'
  background-overlay: '#ffffff'

  # Three text weights, not one. The islands read `--sv-fg-muted` for column
  # headers and `--sv-fg-subtle` for the secondary lines of a gallery card;
  # leaving them unset flattens the directory into one uniform contrast.
  foreground: '#1b1630'
  foreground-muted: '#524c6b'
  foreground-subtle: '#7a7392'

  border: '#e4e2ee'

  # The semantic four are claimed on purpose. A time-off queue is exactly the
  # case where colour carries consequence — an Approved request reading green
  # and a Rejected one reading red is the information, not decoration.
  success: '#047857'
  warning: '#b45309'
  error: '#be123c'
  info: '#0369a1'

# Rendered only when the app declares `theme.colorScheme` or ships a
# `theme-toggle`; the stylesheet carries it either way. The compiled selector is
# `html:is(.dark, [data-theme='dark'])`, which re-points BOTH channels — a dark
# key left out here keeps its light value, which is the documented way to say
# "this one does not change", not an oversight.
darkColors:
  # Primary inverts its relationship with its own foreground: a light violet
  # fill needs DARK text on it, so `primary-foreground` cannot simply stay white.
  primary: '#a78bfa'
  primary-hover: '#c4b5fd'
  primary-foreground: '#170f2b'
  primary-subtle: '#3b2d64'
  ring: '#8b5cf6'

  background: '#120e20'
  background-subtle: '#1c1733'
  background-raised: '#191430'
  background-overlay: '#191430'

  foreground: '#e9e4f7'
  foreground-muted: '#a79fc4'
  foreground-subtle: '#7d759b'

  border: '#302a4d'

  # Lifted a full step: the light-mode semantics are chosen for contrast against
  # white and go muddy on a near-black page.
  success: '#34d399'
  warning: '#fbbf24'
  error: '#fb7185'
  info: '#38bdf8'

borderRadius:
  sm: 0.25rem
  md: 0.5rem
  lg: 0.75rem
  full: 9999px
