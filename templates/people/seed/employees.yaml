# Sample employee directory.
#
# `key` is file-local — it exists so `time_off_requests.yaml` can name an
# employee before either row has a database id. It is never written to a column.
#
# All six departments are represented so the directory gallery does not look
# like one team, and start dates span several years so "who is new here" is
# answerable from the data.
#
# TWO FIELDS ARE DELIBERATELY UNSEEDED, both because `sovrium seed` refuses them
# rather than guessing:
#
#   `manager` is a `relationship` back to `employees` — a self-reference.
#   Resolving one needs a two-pass insert-then-patch that the seed command does
#   not do, so `checkSelfReferences` refuses the file outright rather than
#   writing half a hierarchy. Set reporting lines in the UI after seeding.
#
#   `photo` is a `single-attachment`. It could be seeded with an `@asset:` token
#   pointing into `seed/assets/`, but shipping a dozen invented headshots in the
#   template repository is a licensing and taste problem this demo does not need
#   — the gallery card renders its initials placeholder without one.
#
# `salary` IS seeded, because the field-level permission on it is the single
# most interesting thing this template demonstrates: sign in as a member and the
# column is not merely hidden, it is never sent. A directory with every salary
# null cannot show that.
#
# Addresses use `.example`, a reserved TLD that can never resolve.
