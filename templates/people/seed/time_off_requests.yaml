# Eleven requests, dated relative to the day the seed runs: four wait on a
# decision, five are approved (Aiko's parental leave among them) and two were
# rejected with a reason.
#
# `sovrium seed` writes rows and runs no automation, so these pending
# requests have no approval run behind them: an admin decides them from the
# Requests grid. A request filed in the app starts its approval run as well.
records:
  - key: r1
    fields:
      employee: '@employees.tomas'
      type: Remote work
      start_date: '{{today+5d}}'
      end_date: '{{today+19d}}'
      days: 15
      status: Pending
      note: Working from Lisbon, same hours.
