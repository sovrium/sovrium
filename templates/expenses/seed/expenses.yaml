# Seventeen claims filed at Halden over the last two months, each with its
# receipt from `seed/assets/` and the person whose money it is.
#
# Five wait on finance, five are approved and wait for the next transfer,
# five were repaid in an earlier transfer, and two were rejected with the
# policy they miss. Every date is relative to the day the seed runs, so the
# demo never ages; `--today <YYYY-MM-DD>` pins them to one day, so the same
# figures come back on any machine.
#
# `sovrium seed` writes rows and runs no automation, so the claims waiting here
# have no approval run behind them: finance decides them from the Approve and
# Reject buttons on the Review page. A claim filed in the app starts its
# approval run as well.
