# Sample expense claims.
#
# All five categories carry rows, because the spend-by-category chart on /review
# sums `amount` grouped by `category` — a data set concentrated in one category
# renders a single bar and proves nothing. All four statuses appear too, so the
# "Pending" and "Approved" KPI tiles are real numbers.
#
# `expense_date` straddles `{{today}}` so the grid's date sort has something to
# sort and a "this month" reading is never empty.
#
# TWO FIELDS ARE DELIBERATELY UNSEEDED:
#
#   `receipt` is a `single-attachment` bound to the `receipts` bucket. Signed
#   attachment URLs are always built against `/api/buckets/default/signed`
#   regardless of the field's declared bucket, so a seeded receipt would carry a
#   link that can never resolve — and `sovrium seed` refuses the whole file
#   rather than write one. Upload receipts through /my-expenses instead.
#
#   `submitted_by` is a `created-by` field: the platform writes it from the
#   session of whoever created the row. The CLI has no session, so every seeded
#   claim is attributed to `system` in the "Filed by" column — verified in the
#   running app, not assumed. That is left as-is deliberately, because it is
#   also what makes the row-level rule demonstrable: `rowLevelPermissions`
#   scopes reads to `submitted_by = $currentUser.id`, so a MEMBER sees NONE of
#   these seventeen rows while an ADMIN (unrestricted) sees all of them. Signing
#   in as each in turn is the clearest demonstration of row-level scoping this
#   template can offer, and a member's own claims are the ones they file
#   themselves through /my-expenses.
records:
  - key: berlin-flights
    fields:
      description: Return flights — Berlin customer visit
      amount: 412.60
      category: Travel
      expense_date: '{{today-4d}}'
      status: Pending

