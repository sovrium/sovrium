# sovrium-library: connection/qonto@0.30.0
name: qonto
type: apiKey
label: Qonto
description: 'Qonto Business API, authenticated with the organization login and secret key'
props:
  key: $env.QONTO_LOGIN:$env.QONTO_SECRET_KEY
  header: Authorization
baseUrl: https://thirdparty.qonto.com/v2
operations:
  - name: list-transactions
    method: GET
    path: /transactions
    summary: 'List the transactions of one bank account, completed ones by default'
    params:
      bank_account_id:
        in: query
        type: string
        description: Takes precedence over iban
      iban:
        in: query
        type: string
        format: iban
      'status[]':
        in: query
        type: array
        items:
          enum:
            - pending
            - completed
            - declined
      updated_at_from:
        in: query
        type: string
        format: date-time
      settled_at_from:
        in: query
        type: string
        format: date-time
      sort_by:
        in: query
        type: string
        enum:
          - settled_at:asc
          - settled_at:desc
      per_page:
        in: query
        type: integer
        description: At most 100
      current_page:
        in: query
        type: integer
    pagination:
      style: page
      pageParam: current_page
      itemsPath: transactions
      nextPath: meta.next_page
  - name: get-transaction
    method: GET
    path: '/transactions/{id}'
    summary: Retrieve one transaction
    params:
      id:
        in: path
        type: string
        required: true
  - name: get-organization
    method: GET
    path: /organization
    summary: 'Retrieve the organization and its bank accounts, with their ids and IBANs'
