# Finance's queue: what waits on a decision first, where the money went, then
# every claim with the person who filed it and its receipt. Only an admin opens
# this page; a member asking for it is sent away.
name: review
path: /review
access:
  require: [admin]
  redirectTo: /sign-in
meta:
  title: Review · Halden Expenses
  description: The claims waiting on finance, spend by category and by month, and the decision on each.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: font-mono text-[15px] font-semibold text-foreground
                content: Review
              - type: container
                props:
                  className: grow
              - type: link
                props:
                  href: /reimburse
                  className: inline-flex h-7 items-center rounded-md bg-primary px-3 text-[13px] font-medium text-primary-foreground hover:bg-primary-hover
                content: Mark repaid
          - type: container
            props:
              className: flex flex-col gap-3 px-5 pb-5 pt-4
            children:
              # Four figures, each summed from every claim on every visit.
              # Rejected money is never counted as spend.
              - type: grid
                props:
                  className: grid grid-cols-2 gap-3 lg:grid-cols-4
                children:
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Waiting on you
                    dataSource:
                      table: expenses
                      filter:
                        - { field: status, operator: eq, value: Pending }
                    kpiAggregate: { function: sum, field: amount }
                    kpiFormat: { type: currency, options: { currency: EUR } }
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Approved, to repay
                    dataSource:
                      table: expenses
                      filter:
                        - { field: status, operator: eq, value: Approved }
                    kpiAggregate: { function: sum, field: amount }
                    kpiFormat: { type: currency, options: { currency: EUR } }
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Spent this quarter
                    dataSource:
                      table: expenses
                      filter:
                        - { field: status, operator: in, value: [Pending, Approved, Reimbursed] }
                    kpiAggregate: { function: sum, field: amount }
                    kpiFormat: { type: currency, options: { currency: EUR } }
                  - type: kpi
                    size: { mobile: sm, md: md }
                    label: Rejected
                    dataSource:
                      table: expenses
                      filter:
                        - { field: status, operator: eq, value: Rejected }
                    kpiAggregate: { function: sum, field: amount }
                    kpiFormat: { type: currency, options: { currency: EUR } }
              - type: container
                props:
                  className: grid grid-cols-1 gap-3 lg:grid-cols-[minmax(0,1.1fr)_minmax(0,1fr)]
                children:
                  # Largest first, rejected claims left out. The slices take
                  # the category colours: one accent at different strengths.
                  - type: container
                    element: section
                    props:
                      className: flex min-w-0 flex-col gap-1
                      aria-label: Spend by category
                    children:
                      - type: text
                        element: h2
                        props:
                          className: text-[14px] font-semibold text-foreground
                        content: Spend by category
                      - type: text
                        element: p
                        props:
                          className: text-xs text-foreground-muted
                        content: Largest first · rejected claims left out
                      - type: chart
                        chartType: donut
                        # The slice labels collide on the small slices; the
                        # legend beside the ring names every category.
                        dataLabels: false
                        props:
                          className: h-[220px]
                        dataSource:
                          table: expenses
                          filter:
                            - {
                                field: status,
                                operator: in,
                                value: [Pending, Approved, Reimbursed],
                              }
                        chartAggregate:
                          function: sum
                          field: amount
                          groupBy: category
                          order: value-desc
                        legend:
                          position: right
                  - type: container
                    element: section
                    props:
                      className: flex min-w-0 flex-col gap-1
                      aria-label: Spend by month
                    children:
                      - type: text
                        element: h2
                        props:
                          className: text-[14px] font-semibold text-foreground
                        content: Spend by month
                      - type: text
                        element: p
                        props:
                          className: text-xs text-foreground-muted
                        content: Claims by the date they were spent
                      - type: chart
                        chartType: bar
                        props:
                          className: h-[220px]
                        dataSource:
                          table: expenses
                          filter:
                            - {
                                field: status,
                                operator: in,
                                value: [Pending, Approved, Reimbursed],
                              }
                        chartAggregate:
                          function: sum
                          field: amount
                          groupBy: expense_date
                          interval: month
                          # A date grouping has no option colours, so the bars
                          # are painted in the accent here.
                          color: primary
                        yAxis:
                          field: amount
                          format: currency
              - type: filter-bar
                publishes:
                  bindTo: review-filter
                fields:
                  - { name: description, label: Search claims, kind: text }
                  - name: status
                    label: Status
                    kind: select
                    options:
                      - { value: Pending, label: Pending }
                      - { value: Approved, label: Approved }
                  - name: category
                    label: Category
                    kind: select
                    options:
                      - { value: Software, label: Software }
                      - { value: Travel, label: Travel }
                      - { value: Meals, label: Meals }
                      - { value: Equipment, label: Equipment }
                      - { value: Other, label: Other }
              # Bound to the `review_queue` view: what waits first, then the
              # approved claims going out in the next transfer. Read-only — a
              # decision is a button, not a cell edit.
              - type: table
                readOnly: true
                props:
                  id: review-queue
                dataSource:
                  table: expenses
                  view: review_queue
                  bindTo: review-filter
                  sharedFilter: {}
                columns:
                  - { field: filer, label: Filed by }
                  - { field: description, label: Description }
                  - { field: expense_date, label: Date, format: short-date }
                  # A stored receipt name carries a unique prefix: the cell
                  # shows its start on one line and the link opens the file.
                  - { field: receipt, label: Receipt, truncate: true }
                  - { field: status, label: Status }
                  - { field: amount, label: Amount, format: currency }
                  - type: actions
                    actions:
                      - label: Approve
                        icon: check
                        visibleWhen: { field: status, eq: Pending }
                        action:
                          type: fetch
                          url: /api/tables/expenses/records/$record.id
                          method: PATCH
                          body:
                            fields:
                              status: Approved
                          onSuccess:
                            type: toast
                            message: Claim approved — it goes out in the next transfer
                            variant: success
                            refetch: review-queue
                      - label: Reject
                        icon: x
                        variant: ghost
                        visibleWhen: { field: status, eq: Pending }
                        action:
                          action: openDrawer
                          component: claim-reason
                onRowClick:
                  action: openDrawer
                  component: claim-decision
                pagination:
                  pageSize: 25
                emptyMessage: Nothing waits on you. Claims appear here the moment someone files one, with its receipt.
              # A claim filed in the app also starts an approval run that waits
              # on finance. This list reads those runs, so approving or rejecting
              # here resumes the run and decides the claim. A rejection from here
              # tells the person to ask finance why; to spell the reason out,
              # use Reject on the claim's row above instead. A run nobody answers
              # rejects the claim on its own, with a reason saying so, on the
              # date shown.
              - type: text
                element: h2
                props:
                  className: pt-3 font-mono text-[11px] font-medium uppercase tracking-wider text-foreground-subtle
                content: Approval runs waiting on you
              - type: table
                readOnly: true
                props:
                  id: approval-runs
                dataSource:
                  system:
                    endpoint: /api/automations/approvals
                    rowsKey: approvals
                    idKey: approvalId
                    query:
                      status: pending
                columns:
                  - { field: message, label: Claim }
                  - { field: requestedAt, label: Asked, format: relative-date }
                  - { field: expiresAt, label: Rejected automatically, format: short-date }
                  - type: actions
                    actions:
                      - label: Approve
                        icon: check
                        action:
                          type: fetch
                          url: /api/automations/runs/$record.runId/approvals/$record.approvalId/approve
                          method: POST
                          onSuccess:
                            type: toast
                            message: Approved — the claim is marked Approved
                            variant: success
                            refetch: [approval-runs, review-queue]
                      - label: Reject
                        icon: x
                        variant: ghost
                        confirm: Reject this claim? The person who filed it is told to ask finance why.
                        action:
                          type: fetch
                          url: /api/automations/runs/$record.runId/approvals/$record.approvalId/reject
                          method: POST
                          onSuccess:
                            type: toast
                            message: Rejected — the claim is marked Rejected
                            variant: success
                            refetch: [approval-runs, review-queue]
                emptyMessage: No approval run waits on you. A claim filed in the app appears here until finance decides.
          # One claim, from `/review?record=<id>` or a click on its row: who
          # filed it and the receipt beside the amount, with Approve in the
          # footer. Rejecting goes through Reject on the row, which asks why.
          # Declared first on purpose: when several drawers show the same
          # table, a `?record=` link opens the first one declared.
          - type: drawer
            id: claim-decision
            drawerSide: right
            drawerSize: md
            canEdit: false
            dataSource:
              table: expenses
            props:
              title: Claim
            recordFields:
              - { name: description, type: single-line-text, label: Description }
              - { name: filer, type: user, label: Filed by }
              - { name: amount, type: currency, label: Amount }
              - { name: receipt_name, type: single-line-text, label: Receipt }
              - { name: category, type: single-select, label: Category }
              - { name: expense_date, type: date, label: Date }
              - { name: policy, type: single-select, label: Policy }
              - { name: status, type: status, label: Decision }
              - { name: decision_reason, type: long-text, label: Why it was rejected }
            actions:
              - label: Approve
                action:
                  type: fetch
                  url: /api/tables/expenses/records/$record.id
                  method: PATCH
                  body:
                    fields:
                      status: Approved
                  onSuccess:
                    type: toast
                    message: Claim approved — it goes out in the next transfer
                    variant: success
                    refetch: review-queue
          # Rejecting a claim, from Reject on its row: write why and save. The
          # claim is then marked Rejected (config/automations/reject-with-reason.yaml),
          # and the person who filed it reads why on their own claim.
          - type: drawer
            id: claim-reason
            drawerSide: right
            drawerSize: md
            canEdit: true
            dataSource:
              table: expenses
            props:
              title: Reject this claim
            recordFields:
              - {
                  name: decision_reason,
                  type: long-text,
                  label: 'Why — the policy it misses and what to do next. Saving rejects the claim.',
                }
