# Halden Expenses — the design system of this app.
#
# `baseline: extend` keeps Sovrium's built-in design system and changes only
# what is declared here. Type stays on the two faces the platform already
# self-hosts (IBM Plex Sans and JetBrains Mono): no family is pulled from a
# font CDN, which would leak every visitor's address to a third party.
#
# Money spent for the company and owed back to a person. The design spends its
# emphasis on three things: the amounts, the receipt, and the one decision each
# claim waits for. Everything else stays quiet.
#
# One accent, an emerald. Emerald sits where a "done" green usually sits, so
# the decision colour for Approved moves to a teal-blue instead: a control and
# an outcome are never the same colour.
baseline: extend

# Follow the operating system's light or dark preference. `darkColors` below is
# what the dark scheme paints; without `colorScheme` it would never render.
colorScheme: system

# Role keys repaint the prestyled components (grids, charts, KPI cards,
# buttons, badges) with no class changes anywhere else in the config.
#
# Every role is spelled out in BOTH schemes. `primary` and friends derive a
# white `-foreground` companion in the light scheme only, which reads wrong on
# a pale dark-mode accent — so the dark block names every companion itself.
# `primary-active` is declared too: left out, a pressed button would fall back
# to the platform's achromatic default for a frame.
colors:
  primary: oklch(0.52 0.16 160)
  primary-hover: oklch(0.46 0.15 160)
  primary-active: oklch(0.42 0.14 160)
  primary-foreground: oklch(0.985 0.003 160)
  primary-subtle: oklch(0.95 0.03 160)
  primary-subtle-foreground: oklch(0.38 0.12 160)
  ring: oklch(0.6 0.16 160)
  background: oklch(0.985 0.003 160)
  background-subtle: oklch(0.967 0.005 160)
  background-raised: oklch(1 0 0)
  background-overlay: oklch(1 0 0)
  background-inset: oklch(0.925 0.008 160)
  foreground: oklch(0.21 0.008 160)
  foreground-muted: oklch(0.45 0.012 160)
  foreground-subtle: oklch(0.51 0.012 160)
  foreground-disabled: oklch(0.71 0.012 160)
  foreground-inverse: oklch(0.985 0.003 160)
  border: oklch(0.925 0.008 160)
  success: oklch(0.52 0.12 205)
  warning: oklch(0.5 0.12 75)
  error: oklch(0.53 0.17 25)
  destructive-foreground: oklch(0.985 0.003 160)

darkColors:
  primary: oklch(0.78 0.12 160)
  primary-hover: oklch(0.83 0.09 160)
  primary-active: oklch(0.87 0.07 160)
  primary-foreground: oklch(0.16 0.006 160)
  primary-subtle: oklch(0.28 0.06 160)
  primary-subtle-foreground: oklch(0.9 0.06 160)
  ring: oklch(0.72 0.13 160)
  background: oklch(0.16 0.006 160)
  background-subtle: oklch(0.19 0.007 160)
  background-raised: oklch(0.21 0.008 160)
  background-overlay: oklch(0.23 0.008 160)
  background-inset: oklch(0.13 0.005 160)
  foreground: oklch(0.95 0.005 160)
  foreground-muted: oklch(0.75 0.01 160)
  foreground-subtle: oklch(0.68 0.012 160)
  foreground-disabled: oklch(0.45 0.01 160)
  foreground-inverse: oklch(0.16 0.006 160)
  border: oklch(0.3 0.01 160)
  success: oklch(0.75 0.12 205)
  warning: oklch(0.8 0.12 75)
  error: oklch(0.72 0.14 25)
  destructive-foreground: oklch(0.16 0.006 160)

# What each colour is for. Writing the usage down is what stops the accent from
# becoming a category's colour, and a decision colour from becoming decoration.
colorRoles:
  primary:
    usage: The one accent. Primary action fill, the current nav entry, the focus ring, the first chart series. Never a status and never a category.
    pairsWith: primary-foreground
  primary-subtle:
    usage: Selected and current states on quiet surfaces — the current page, the claim opened in the drawer.
    pairsWith: primary-subtle-foreground
  success:
    usage: A claim Approved or Reimbursed, and nothing else.
    pairsWith: foreground
  warning:
    usage: A claim waiting on a decision.
    pairsWith: foreground
  error:
    usage: A claim Rejected, a field that failed, a destructive action.
    pairsWith: foreground

# Monospace for headings, amounts, dates and captions, so every column of money
# lines up and reads as a figure; sans for sentences, descriptions and names.
typeScale:
  families:
    sans:
      family: "'IBM Plex Sans Variable', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    mono:
      family: "'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
  steps:
    display: { size: 2rem, lineHeight: 1.1, weight: 600, letterSpacing: -0.02em, font: mono }
    h1: { size: 1.375rem, lineHeight: 1.2, weight: 600, letterSpacing: -0.01em, font: mono }
    h2: { size: 1.0625rem, lineHeight: 1.3, weight: 600, font: mono }
    h3: { size: 0.875rem, lineHeight: 1.35, weight: 600 }
    lead: { size: 0.9375rem, lineHeight: 1.5 }
    body: { size: 0.875rem, lineHeight: 1.5 }
    bodySmall: { size: 0.8125rem, lineHeight: 1.45 }
    caption: { size: 0.75rem, lineHeight: 1.4, font: mono }
    overline: { size: 0.6875rem, lineHeight: 1.3, weight: 500, letterSpacing: 0.04em, font: mono }

# Sharp corners: a ledger of money, not a gallery.
radius:
  sm: 0.125rem
  md: 0.25rem
  lg: 0.375rem
  full: 9999px

# Cards carry a one-pixel lift; overlays float clearly above the page.
elevation:
  none: none
  sm: 0 1px 2px rgb(20 20 30 / 0.06)
  md: 0 4px 12px rgb(20 20 30 / 0.08)
  lg: 0 12px 32px rgb(20 20 30 / 0.14)

# A coloured option is an outlined chip with a dot of its colour, so a column
# of states stays quiet and only the dot tells them apart.
badgeForm: outline-dot

# A reviewer scans a column of amounts and a queue of claims, and more rows on
# screen is what makes a review quick: the compact step. The three steps are
# the platform's own values, written out so one number can be tuned.
density:
  default: compact
  steps:
    compact: { rowY: 5px, controlH: 36px, buttonH: 28px, gap: 7px, text: 11px }
    cozy: { rowY: 8px, controlH: 40px, buttonH: 32px, gap: 10px, text: 13px }
    roomy: { rowY: 14px, controlH: 44px, buttonH: 36px, gap: 16px, text: 14px }

# How the app speaks. Nothing reads these at runtime; they are the brief anyone
# writing a label, an empty state or an error message for this app follows.
voice:
  personality:
    - exact
    - fair
    - brief
  pronoun: you
  prefer:
    - 'Lead a button with its verb: Add expense, Approve, Mark reimbursed.'
    - Every amount with its currency and two decimals; every claim with its date and who filed it.
    - Say why a claim was rejected and what to do next.
  avoid:
    - No exclamation marks, no "Great!" on an approved claim — it is the employee's money.
    - Never suggest a claim is suspicious; state the policy it misses.
    - No finance jargon on the employee's side (no "accrual", no "GL code").
  tone:
    empty: Say what this list will hold, then the one action that fills it.
    loading: Name what is loading — your claims, the review queue — never a bare spinner.
    error: State what did not save and the one thing that fixes it; keep what the person typed.
    success: Confirm in past tense with the amount and what happens next.
    destructive: Name the claim and its amount and whether it comes back.

principles:
  - Every amount shows its currency, two decimals, and aligns in a column.
  - An employee sees only their own claims, and the page says so plainly.
  - Colour means a decision — approved, waiting, rejected — or it is not used.
  - The receipt is one click from the claim, never a separate hunt.
