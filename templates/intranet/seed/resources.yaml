# Shared quick links, shown on /portal.
#
# All four categories are represented and unevenly weighted, because that is
# what a real link list looks like: a handful of tools everyone opens daily, a
# smaller set of policies nobody opens until they need to, and a long tail.
#
# URLs point at `example.com` paths on purpose. A template published to a public
# repository must not carry a real internal hostname, and a link that 404s in a
# demo is better than one that leaks where somebody's intranet actually lives.
records:
  - key: handbook
    fields:
      title: Company handbook
      url: https://intranet.example.com/handbook
      category: Guides

  - key: onboarding-checklist
    fields:
      title: New starter onboarding checklist
      url: https://intranet.example.com/handbook/onboarding
      category: Guides

  - key: expense-policy
