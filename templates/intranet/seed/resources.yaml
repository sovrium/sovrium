# The links everyone needs, in three groups.
#
# URLs point at `example.com` paths on purpose: a template published to a
# public repository must not carry a real internal hostname. Point them at
# your own tools.
records:
  - {
      key: handbook,
      fields:
        {
          title: Company handbook,
          category: Guides,
          url: 'https://intranet.example.com/handbook',
          note: 'How we work, from day one to leaving well',
        },
    }
  - {
      key: new-starter,
      fields:
        {
          title: New starter checklist,
          category: Guides,
          url: 'https://intranet.example.com/handbook/new-starters',
          note: 'Your first two weeks, step by step',
        },
    }
  - {
      key: style-guide,
      fields:
        {
          title: Writing style guide,
          category: Guides,
          url: 'https://intranet.example.com/handbook/style',
          note: 'How we write to customers and to each other',
        },
    }
  - {
      key: expense-policy,
      fields:
        {
          title: Expense policy,
          category: Policies,
          url: 'https://intranet.example.com/policies/expenses',
          note: 'What you can claim and how',
        },
    }
  - {
      key: time-off,
      fields:
        {
          title: Time off and public holidays,
          category: Policies,
          url: 'https://intranet.example.com/policies/time-off',
          note: "Allowances and each office's holidays",
        },
    }
  - {
      key: security-policy,
      fields:
        {
          title: Security policy,
          category: Policies,
          url: 'https://intranet.example.com/policies/security',
          note: 'Devices, passwords and reporting an incident',
        },
    }
  - {
      key: it-helpdesk,
      fields:
        {
          title: IT helpdesk,
          category: Tools,
          url: 'https://helpdesk.example.com',
          note: 'Report a problem or ask for a laptop',
        },
    }
  - {
      key: meeting-rooms,
      fields:
        {
          title: Book a meeting room,
          category: Tools,
          url: 'https://rooms.example.com',
          note: "Every office's rooms in one calendar",
        },
    }
  - {
      key: payslips,
      fields:
        {
          title: Payslips,
          category: Tools,
