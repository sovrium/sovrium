      url: https://intranet.example.com/policies/expenses
      category: Policies

  - key: security-policy
    fields:
      title: Information security policy
      url: https://intranet.example.com/policies/security
      category: Policies

  - key: time-off-policy
    fields:
      title: Time off and public holidays
      url: https://intranet.example.com/policies/time-off
      category: Policies

  - key: it-helpdesk
    fields:
      title: IT helpdesk
      url: https://helpdesk.example.com
      category: Tools

  - key: expense-tool
    fields:
      title: Submit an expense claim
