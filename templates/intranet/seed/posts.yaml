# Six announcements from the last two weeks, newest on top of Home.
#
# The security training is the must-read: its `must_read_by` date puts it
# first on Home with its acknowledge-by date and the count of people who
# have (seed/acknowledgements.yaml). Every date is relative to the day the
# seed runs, so the news always reads as this week's. No title or body
# names a calendar day: Home prints the dates beside them, and a day
# written into the text would contradict them a week later.
records:
  - key: security-training
    fields:
      title: Annual security training is now open
      topic: Security
      author: '@members.omar'
      published_at: '{{today-3d}}'
      must_read_by: '{{today+6d}}'
      audience: '@company.halden'
      excerpt: >-
        Forty minutes, entirely online, and it counts towards your compliance
        record. The phishing module has been rewritten since last year.
      body: >-
        Forty minutes, entirely online, and it counts towards your compliance
        record. The phishing module has been rewritten since last year and is
        genuinely better. If you joined in the last three months and already
        did it during onboarding, you are done — nothing to repeat.

  - key: office-move
    fields:
      title: London office moves to the third floor
      topic: Offices
      author: '@members.priya'
      published_at: '{{today-2d}}'
      audience: '@company.halden'
      excerpt: >-
        The move happens over one weekend. Pack your desk by Friday evening —
        crates are by the kitchen from Wednesday.
      body: >-
        The move happens over one weekend. Pack your desk by Friday evening —
        crates are by the kitchen from Wednesday. Monitors and docks stay;
        label anything else you want to find again. The second floor stays
        open for meetings for a week after the move.

  - key: expense-policy
    fields:
      title: 'Expense policy: two changes, one of them overdue'
      topic: Policy
      author: '@members.dan'
      published_at: '{{today-6d}}'
      audience: '@company.halden'
      excerpt: >-
        The receipt threshold rises from €20 to €50, and travel booked three
        weeks ahead no longer needs a second approval.
      body: >-
        The receipt threshold rises from €20 to €50, and travel booked three
        weeks ahead no longer needs a second approval. Both apply to claims
        filed from Monday; the policy on Resources has the full text.

  - key: new-starters
    fields:
      title: Three new starters join the support and data teams
      topic: People
      author: '@members.hannah'
      published_at: '{{today-8d}}'
      audience: '@company.halden'
      excerpt: >-
        Keiko joins data and reporting, and two support engineers start on the
        same Monday. Expect shadowing requests this week.
      body: >-
        Keiko joins data and reporting in Berlin, and two support engineers
        start in Lyon on the same Monday. Expect shadowing requests this week,
        and say hello if you pass them in the kitchen.

  - key: outage-review
    fields:
      title: "Friday's outage: what happened and what changes"
      topic: Engineering
      author: '@members.mateo'
      published_at: '{{today-10d}}'
      audience: '@company.halden'
      excerpt: >-
        About forty minutes of slow search on Friday afternoon, caused by a
        migration that held a lock longer than expected. No data was lost.
      body: >-
        About forty minutes of slow search on Friday afternoon, caused by a
        migration that held a lock longer than expected. No data was lost.
        Migrations now run in smaller batches, and the on-call rota gets an
        alert after five minutes instead of fifteen.

  - key: q3-numbers
    fields:
      title: Q3 numbers and what they change
      topic: Company
      author: '@members.dan'
      published_at: '{{today-14d}}'
      audience: '@company.halden'
      excerpt: >-
        Revenue landed slightly ahead of plan and support volume grew faster
        than headcount — the number worth watching.
      body: >-
        Revenue landed slightly ahead of plan and support volume grew faster
        than headcount — the number worth watching. The coming all-hands
        goes through both, with time for questions.
