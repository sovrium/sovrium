# The people directory, shown in the manager-tools panel on /portal.
#
# Eight members across five locations, because the Location column is the one
# that makes the directory look like a real company rather than a fixture — a
# roster where everyone sits in the same city has nothing to sort by.
#
# `joined_at` is a `created-at` field, so the database stamps it at insert time
# and a seed value would be ignored. The Joined column therefore reads as
# "everyone joined the day you seeded", which is honest about what a
# `created-at` field is rather than pretending otherwise.
