# Publish: a manager writes an announcement, optionally with a date by which
# everyone should acknowledge it. Only managers and IT open this page; an
# employee asking for it is sent to sign in, and their navigation never
# offers it.
name: publish
path: /publish
access:
  require: [admin, managers]
  redirectTo: /sign-in
meta:
  title: Publish · Halden
  description: Publish an announcement to everyone at Halden.
components:
  - $ref: ./_shell.yaml
  - type: container
    element: header
    props:
      className: flex h-12 items-center gap-3 border-b border-border px-5 md:ml-[57px] lg:ml-[232px]
    children:
      - type: text
        element: p
        props:
          className: font-mono text-[11px] uppercase tracking-wider text-foreground-subtle
        content: Managers
      - type: text
        element: p
        props:
          className: text-[15px] font-semibold text-foreground
        content: Publish
  # The form prints its own title as the page heading. Beside it, the
  # directory a manager keeps an eye on: who is here, in which office, since
  # when.
  - type: container
    element: main
    props:
      className: flex items-start gap-5 px-5 py-5 md:ml-[57px] lg:ml-[232px] max-lg:flex-col
    children:
      - type: container
        props:
          className: flex w-[440px] max-w-full flex-none flex-col gap-4 rounded-lg border border-border bg-background-raised p-5
        children:
          - type: form
            formRef: publish-announcement
            classes:
              parts:
                title: text-[17px] font-semibold
                description: text-sm text-foreground-muted
      - type: container
        element: section
        props:
          aria-label: Directory
          className: flex min-w-0 flex-1 flex-col gap-2.5 max-lg:w-full
        children:
          - type: text
            element: h2
            props:
              className: text-[17px] font-semibold text-foreground
            content: Directory
          - type: table
            readOnly: true
            dataSource:
              table: members
              sort:
                - { field: name, direction: asc }
            toolbar:
              search: true
            columns:
              - { field: name, label: Name, sortable: true }
              - { field: title, label: Role }
              - { field: office, label: Location }
              - { field: joined_label, label: Joined }
            pagination:
              pageSize: 10
            emptyMessage: The directory is empty. IT adds each colleague.
