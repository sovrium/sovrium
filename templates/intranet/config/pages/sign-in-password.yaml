# The fallback: a work email and a password. It is the way in until mail is
# configured (the link needs SMTP), and for anyone who prefers a password.
name: sign-in-password
path: /sign-in/password
meta:
  title: Sign in with a password · Halden
  description: Sign in to Halden with your work email and password.
components:
  - $ref: ./_site-header.yaml
  - type: container
    element: main
    props:
      className: flex justify-center px-5 pt-12 pb-16 max-md:pt-8
    children:
      - type: container
        props:
          className: flex w-full max-w-[440px] flex-col gap-5
        children:
          - type: container
            props:
              className: flex flex-col gap-1.5 text-center
            children:
              - type: text
                element: h1
                props:
                  className: text-[28px] font-semibold tracking-tight text-foreground
                content: Sign in with a password
              - type: text
                element: p
                props:
                  className: text-foreground-muted
                content: Your work email and the password IT gave you.
          - type: container
            props:
              className: flex flex-col gap-4 rounded-lg border border-border bg-background-raised p-5 shadow-sm
            children:
              - type: form
                props:
                  id: password-sign-in-form
                action:
                  type: auth
                  method: login
                  strategy: email
                  onSuccess:
                    navigate: /portal
              - type: container
                props:
                  className: flex items-center justify-center gap-2 text-sm text-foreground-muted
                children:
                  - type: icon
                    props:
                      name: mail
                      size: 14
                  - type: link
                    props:
                      href: /sign-in
                      className: underline hover:text-foreground
                    content: Email me a link instead
  - $ref: ./_site-footer.yaml
