# The way in: a work email, and a link sent to it. The password is one click
# away, on its own page (sign-in-password.yaml), so this page never shows two
# forms side by side. Sign-up is closed (config/auth.yaml); a new colleague is
# added by IT.
name: sign-in
path: /sign-in
meta:
  title: Sign in · Halden
  description: Sign in to Halden with your work email.
components:
  - $ref: ./_site-header.yaml
  - type: container
    element: main
    props:
      className: flex justify-center px-5 pt-12 pb-16 max-md:pt-8
    children:
      - type: container
        props:
          className: flex w-full max-w-[440px] flex-col gap-5
        children:
          - type: container
            props:
              className: flex flex-col gap-1.5 text-center
            children:
              - type: text
                element: h1
                props:
                  className: text-[28px] font-semibold tracking-tight text-foreground
                content: Sign in to Halden
              - type: text
                element: p
                props:
                  className: text-foreground-muted
                content: We email you a link that signs you in.
          - type: container
            props:
              className: flex flex-col gap-4 rounded-lg border border-border bg-background-raised p-5 shadow-sm
            children:
              - type: form
                props:
                  id: magic-link-form
                action:
                  type: auth
                  method: login
                  strategy: magicLink
                  submitLabel: Email me a sign-in link
                  onSuccess:
                    navigate: /portal
              - type: container
                props:
                  className: flex items-center justify-center gap-2 text-sm text-foreground-muted
                children:
                  - type: icon
                    props:
                      name: lock
                      size: 14
                  - type: link
                    props:
                      href: /sign-in/password
                      className: underline hover:text-foreground
                    content: Use a password instead
          - type: text
            element: p
            props:
              className: text-center text-xs text-foreground-muted
            content: Only people with a Halden email can sign in. New here? Ask your manager to add you.
  - $ref: ./_site-footer.yaml
