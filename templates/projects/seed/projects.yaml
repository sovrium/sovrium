# The six projects of Fernhill, a small digital agency: one finished, three
# under way, one on hold and one not started, so the Dashboard's figures and
# the Timeline both have something to say.
#
# Dates are relative to the day the seed runs (`{{today+21d}}`), so the plan
# always straddles today: work already finished, work in flight and work not
# started yet. `key` names a record inside the seed files so `tasks.yaml` can
# point at a project before either has an id; it is never written to a column.
#
# `owner` names a sign-in account from `users.yaml` as `@user:<email>`.
records:
  - key: quarry
    fields:
      name: Quarry — warehouse stock sync
      status: Done
      start_date: '{{today-134d}}'
      end_date: '{{today-23d}}'
      owner: '@user:camille.roux@fernhill.example'
      progress: 100
      budget: 58000
  - key: ledger
    fields:
      name: Ledger — finance data migration
      status: Active
      start_date: '{{today-61d}}'
      end_date: '{{today+9d}}'
      owner: '@user:aicha.diallo@fernhill.example'
      progress: 80
      budget: 74000
  - key: atlas
    fields:
      name: Atlas — replatform the ordering flow
      status: Active
      start_date: '{{today-38d}}'
      end_date: '{{today+52d}}'
      owner: '@user:camille.roux@fernhill.example'
      progress: 45
      budget: 180000
  - key: harbor
    fields:
      name: Harbor — GDPR compliance review
      status: On hold
      start_date: '{{today-27d}}'
      end_date: '{{today+40d}}'
      owner: '@user:jonas.weber@fernhill.example'
      progress: 30
      budget: 32000
  - key: nomad
    fields:
      name: Nomad — mobile companion app
      status: Active
      start_date: '{{today-12d}}'
      end_date: '{{today+96d}}'
      owner: '@user:yann.kerbrat@fernhill.example'
      progress: 15
      budget: 240000
  - key: beacon
    fields:
      name: Beacon — self-hosted analytics rollout
      status: Planned
      start_date: '{{today+21d}}'
      end_date: '{{today+112d}}'
      owner: '@user:marta.silva@fernhill.example'
      progress: 0
      budget: 46000
