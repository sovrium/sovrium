# Sample task list, linked to projects by their file-local key.
#
# Every one of the four statuses carries several cards, so the kanban board on
# /board reads as a working board rather than a single loaded column, and the
# "Tasks by status" bar chart on the dashboard has four bars.
#
# `estimate` is a `duration` field, which stores a COUNT OF SECONDS — the
# `displayFormat: 'h:mm'` on the field is presentation only. 14400 is four
# hours. Writing `4:00` here would store a string in an integer column.
#
# `due_date` straddles `{{today}}` on purpose: the calendar view needs work in
# both directions of the current month, and a few overdue cards are what make
# the relative-date footer on a kanban card ("3 days ago") worth rendering.
#
# `assignee` is deliberately unseeded — see the note in `projects.yaml`.
