# The eighteen tasks behind the six projects: thirteen open (seven to do, four
# in progress, two blocked) and five done.
#
# Every task has a person and a date. Due dates are relative to the day the
# seed runs, so two tasks are always a few days late and the Board, the
# Timeline and the Calendar show what a late task looks like.
#
# `predecessor` names the task a task waits on, by its key in this same file —
# a task may name one defined further down; the link is written once both
# exist. Three tasks are milestones: the dates the team has promised.
