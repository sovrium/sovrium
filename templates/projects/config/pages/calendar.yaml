name: calendar
path: /calendar
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Calendar
  description: Task deadlines on a month view
components:
  - $ref: ./_nav.yaml
  - type: container
    element: section
    props:
      className: max-w-6xl mx-auto px-6 py-8
    children:
      - type: text
        element: h1
        props:
          className: text-2xl font-bold mb-1
        content: Calendar
      - type: text
        element: p
        props:
          className: text-sm mb-6
        content: Every task with a due date, laid out on the month.

      # `colorField: status` paints each deadline with the option colour declared
      # on the task's `status` field, so an overdue Blocked task reads as red
      # without opening it. There is deliberately no `endDateField`: a task has a
      # deadline, not a span, and drawing it as a bar would imply work is
      # scheduled across those days when nothing in the model says so.
      - type: calendar
        dataSource:
          table: tasks
        dateField: due_date
        colorField: status
        defaultView: month
