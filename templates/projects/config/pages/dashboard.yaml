# The home page. It answers "what needs me this week" before "how are we
# doing": four figures, open work by status and by person, the tasks already
# late, and then every project with its owner, dates, progress and budget.
name: dashboard
path: /
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Dashboard · Fernhill Projects
  description: What needs the team this week, and how every project is doing.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Dashboard
              - type: container
                props:
                  className: grow
              - type: button
                content: Add task
                props:
                  className: h-7 px-3 text-[13px]
                  interactions:
                    click:
                      modal: add-task-dialog
          - $ref: ./_add-task.yaml
          - type: dialog
            props:
              id: new-project-dialog
              title: New project
              description: It starts as Planned. Give it an owner and its dates.
            children:
              - type: form
                dataSource:
                  table: projects
                fields:
                  - { field: name, label: Name }
                  - { field: owner, label: Owner }
                  - { field: start_date, label: Start date }
                  - { field: end_date, label: End date }
                  - { field: budget, label: Budget }
                action:
                  type: crud
                  operation: create
                  table: projects
                  submitLabel: Create project
                  onSuccess:
                    navigate: /
                    toast:
                      message: Project created
                      variant: success
          - type: container
            props:
              className: flex flex-col gap-4 px-5 pb-5 pt-4
            children:
              # Four figures, each computed from the tables on every visit,
              # never typed in.
              - type: grid
                props:
                  className: grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-4
                children:
                  - type: kpi
                    label: Active projects
                    dataSource:
                      table: projects
                      filter:
                        - { field: status, operator: eq, value: Active }
                    kpiAggregate: { function: count }
                    kpiFormat: { type: number }
                  - type: kpi
                    label: Open tasks
                    dataSource:
                      table: tasks
                      filter:
                        - { field: status, operator: neq, value: Done }
                    kpiAggregate: { function: count }
                    kpiFormat: { type: number }
                  - type: kpi
                    label: Overdue
                    dataSource:
                      table: tasks
                      filter:
                        - { field: schedule, operator: eq, value: Overdue }
                    kpiAggregate: { function: count }
                    kpiFormat: { type: number }
                  # The KPI restates the budget field's currency: a figure does
                  # not inherit it from the column it sums.
                  - type: kpi
                    label: Budget committed
                    dataSource:
                      table: projects
                    kpiAggregate: { function: sum, field: budget }
                    kpiFormat: { type: currency, options: { currency: EUR } }
              - type: grid
                props:
                  className: grid grid-cols-1 items-start gap-3 lg:grid-cols-[minmax(0,1.2fr)_minmax(0,1fr)_minmax(0,1.25fr)]
                children:
                  # Open work only, in the order work moves: the chart follows
                  # the status field's options and paints Blocked in its colour.
                  - type: container
                    element: section
                    props:
                      className: flex min-w-0 flex-col gap-2.5 rounded-lg border border-border bg-background-raised px-4 py-3.5
                    children:
                      - type: text
                        element: h2
                        props:
                          className: text-sm font-semibold text-foreground
                        content: Open tasks by status
                      - type: text
                        element: p
                        props:
                          className: -mt-2 text-xs text-foreground-muted
                        content: In the order work moves
                      - type: chart
                        chartType: bar
                        dataSource:
                          table: tasks
                          filter:
                            - { field: status, operator: neq, value: Done }
                        chartAggregate:
                          function: count
                          groupBy: status
                          order: option
                        emptyMessage: Open tasks appear here by status. Add a task to start.
                  - type: container
                    element: section
                    props:
                      className: flex min-w-0 flex-col gap-2.5 rounded-lg border border-border bg-background-raised px-4 py-3.5
                    children:
                      - type: text
                        element: h2
                        props:
                          className: text-sm font-semibold text-foreground
                        content: Open tasks per person
                      - type: text
                        element: p
                        props:
                          className: -mt-2 text-xs text-foreground-muted
                        content: Who carries the work
                      - type: chart
                        chartType: bar
                        dataSource:
                          table: tasks
                          filter:
                            - { field: status, operator: neq, value: Done }
                        chartAggregate:
                          function: count
                          groupBy: assignee
                          order: value-desc
                        emptyMessage: Each person's open tasks appear here once tasks have an assignee.
                  - type: container
                    element: section
                    props:
                      className: flex min-w-0 flex-col gap-2.5 rounded-lg border border-border bg-background-raised px-4 py-3.5
                    children:
                      - type: text
                        element: h2
                        props:
                          className: text-sm font-semibold text-foreground
                        content: Needs attention
                      - type: text
                        element: p
                        props:
                          className: -mt-2 text-xs text-foreground-muted
                        content: Open tasks past their due date, oldest first
                      - type: list
                        dataSource:
                          table: tasks
                          filter:
                            - { field: schedule, operator: eq, value: Overdue }
                          sort:
                            - { field: due_date, direction: asc }
                          limit: 5
                        listDisplay:
                          emptyMessage: Nothing is late. Tasks past their due date appear here first.
                          itemTemplate:
                            title: $record.title
                            subtitle: $record.project_name
                            metadata:
                              - { field: assignee, format: text }
                              - { field: due_date, format: short-date }
              - type: container
                props:
                  className: flex items-center gap-3 pt-2
                children:
                  - type: text
                    element: h2
                    props:
                      className: grow text-[17px] font-semibold text-foreground
                    content: Projects
                  - type: button
                    variant: outline
                    content: New project
                    props:
                      className: h-7 px-3 text-[13px]
                      interactions:
                        click:
                          modal: new-project-dialog
              - type: table
                dataSource:
                  table: projects
                  view: portfolio
                columns:
                  - { field: name, label: Project, sortable: true }
                  - { field: status, label: Status, sortable: true }
                  - { field: owner, label: Owner }
                  - { field: start_date, label: Start, format: short-date, sortable: true }
                  - { field: end_date, label: End, format: short-date, sortable: true }
                  - { field: progress, label: Progress }
                  - { field: budget, label: Budget, format: currency }
                emptyMessage: Your projects appear here with their dates, progress and budget. Create the first one to start.
