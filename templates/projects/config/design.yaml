# Fernhill Projects — the design system of this app.
#
# `baseline: extend` keeps Sovrium's built-in design system and changes only
# what is declared here. Type stays on the two faces the platform already
# self-hosts (IBM Plex Sans and JetBrains Mono): no family is pulled from a
# font CDN, which would leak every visitor's address to a third party.
#
# One accent, a calm blue at hue 255, and neutrals tinted toward it so the
# greys belong to this app rather than to every app. Colour otherwise means an
# outcome: a task done, a project at risk, a task blocked or overdue. Planned,
# Active, In progress and To do are not outcomes, so they stay neutral.
baseline: extend

# Follow the operating system's light or dark preference. `darkColors` below is
# what the dark scheme paints; without `colorScheme` it would never render.
colorScheme: system

# Role keys repaint the prestyled components (board, timeline, grid, charts,
# buttons, badges) with no class changes anywhere else in the config.
#
# Every role is spelled out in BOTH schemes. `primary` and friends derive a
# white `-foreground` companion in the light scheme only, which reads wrong on
# a pale dark-mode accent — so the dark block names every companion itself.
# `primary-active` is declared too: left out, a pressed button would fall back
# to the platform's achromatic default for a frame.

colors:
  primary: oklch(0.52 0.16 255)
  primary-hover: oklch(0.46 0.15 255)
  primary-active: oklch(0.42 0.14 255)
  primary-foreground: oklch(0.985 0.003 255)
  primary-subtle: oklch(0.95 0.03 255)
  primary-subtle-foreground: oklch(0.38 0.12 255)
  ring: oklch(0.6 0.16 255)
  background: oklch(0.985 0.003 255)
  background-subtle: oklch(0.967 0.005 255)
  background-raised: oklch(1 0 0)
  background-overlay: oklch(1 0 0)
  background-inset: oklch(0.925 0.008 255)
  foreground: oklch(0.21 0.008 255)
  foreground-muted: oklch(0.45 0.012 255)
  foreground-subtle: oklch(0.51 0.012 255)
  foreground-disabled: oklch(0.71 0.012 255)
  foreground-inverse: oklch(0.985 0.003 255)
  border: oklch(0.925 0.008 255)
  success: oklch(0.52 0.12 155)
  warning: oklch(0.55 0.12 70)
  error: oklch(0.53 0.17 25)
  destructive-foreground: oklch(0.985 0.003 255)

darkColors:
  primary: oklch(0.78 0.12 255)
  primary-hover: oklch(0.83 0.09 255)
  primary-active: oklch(0.87 0.07 255)
  primary-foreground: oklch(0.16 0.006 255)
  primary-subtle: oklch(0.28 0.06 255)
  primary-subtle-foreground: oklch(0.9 0.06 255)
  ring: oklch(0.72 0.13 255)
  background: oklch(0.16 0.006 255)
  background-subtle: oklch(0.19 0.007 255)
  background-raised: oklch(0.21 0.008 255)
  background-overlay: oklch(0.23 0.008 255)
  background-inset: oklch(0.13 0.005 255)
  foreground: oklch(0.95 0.005 255)
  foreground-muted: oklch(0.75 0.01 255)
  foreground-subtle: oklch(0.68 0.012 255)
  foreground-disabled: oklch(0.45 0.01 255)
  foreground-inverse: oklch(0.16 0.006 255)
  border: oklch(0.3 0.01 255)
  success: oklch(0.75 0.12 155)
  warning: oklch(0.8 0.12 75)
  error: oklch(0.72 0.14 25)
  destructive-foreground: oklch(0.16 0.006 255)

# What each colour is for. Writing the usage down is what stops the accent from
# drifting onto statuses, and a status colour from becoming decoration.
colorRoles:
  primary:
    usage: The one accent. Primary action fill, active nav item, focus ring, the today line on the timeline. Never a status, never a bar colour.
    pairsWith: primary-foreground
  primary-subtle:
    usage: Selected and current states on quiet surfaces — the current page, the column a card is dragged over, the week that holds today.
    pairsWith: primary-subtle-foreground
  success:
    usage: A task or milestone marked Done, and nothing else.
    pairsWith: foreground
  warning:
    usage: A project at risk — behind its planned progress — and a task due today.
    pairsWith: foreground
  error:
    usage: A Blocked task, an overdue task, a failed save, a destructive action.
    pairsWith: foreground

# A calm type ladder: body text at 14px, headings close to it, and the
# monospace face for dates, counts and overlines so a column of due dates
# lines up.
typeScale:
  families:
    sans:
      family: "'IBM Plex Sans Variable', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    mono:
      family: "'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
  steps:
    display: { size: 2rem, lineHeight: 1.1, weight: 600, letterSpacing: -0.02em }
    h1: { size: 1.375rem, lineHeight: 1.2, weight: 600, letterSpacing: -0.01em }
    h2: { size: 1.0625rem, lineHeight: 1.3, weight: 600 }
    h3: { size: 0.875rem, lineHeight: 1.35, weight: 600 }
    lead: { size: 0.9375rem, lineHeight: 1.5 }
    body: { size: 0.875rem, lineHeight: 1.5 }
    bodySmall: { size: 0.8125rem, lineHeight: 1.45 }
    caption: { size: 0.75rem, lineHeight: 1.4 }
    overline: { size: 0.6875rem, lineHeight: 1.3, weight: 500, letterSpacing: 0.04em, font: mono }

# Standard corners: small enough to keep a grid crisp, round enough that a card
# reads as something you can pick up and move.
radius:
  sm: 0.25rem
  md: 0.5rem
  lg: 0.75rem
  full: 9999px

# Cards carry a one-pixel lift; overlays float clearly above the page.
elevation:
  none: none
  sm: 0 1px 2px rgb(20 30 56 / 0.06)
  md: 0 4px 12px rgb(20 30 56 / 0.08)
  lg: 0 12px 32px rgb(20 30 56 / 0.14)

# A coloured option is an outlined chip with a dot of its colour, so a column
# of states stays quiet and only the dot tells them apart.
badgeForm: outline-dot

# A team reads a week of work, and a card carries four facts: title, project,
# date and person. The cozy step gives each row the height that keeps those
# legible at a glance. The three steps are the platform's own values, written
# out so one number can be tuned.
density:
  default: cozy
  steps:
    compact: { rowY: 5px, controlH: 36px, buttonH: 28px, gap: 7px, text: 11px }
    cozy: { rowY: 8px, controlH: 40px, buttonH: 32px, gap: 10px, text: 13px }
    roomy: { rowY: 14px, controlH: 44px, buttonH: 36px, gap: 16px, text: 14px }

# How the app speaks. Nothing reads these at runtime; they are the brief anyone
# writing a label, an empty state or an error message for this app follows.
voice:
  personality:
    - calm
    - plain
    - "on the team's side"
  pronoun: you
  prefer:
    - 'Lead a button with its verb: Add task, Move to Done, Plan project.'
    - 'Name the date and the person: a task is who does it and when it is due.'
    - Every empty state names the one next action.
  avoid:
    - No exclamation marks, no celebration copy on a finished project.
    - 'No productivity jargon (no "velocity", no "synergy", no "crush it").'
    - Never blame a person for a blocked task; name what it waits on.
  tone:
    empty: Say what this view will hold, then the one action that fills it.
    loading: Name what is loading — tasks, the timeline — never a bare spinner.
    error: State what did not save and the one thing that fixes it.
    success: Confirm the fact in past tense, with the task or project name.
    destructive: Name the task or project and whether it comes back from the trash.

principles:
  - Every task has a person and a date, and the screen shows both.
  - Colour means an outcome — done, at risk, blocked, overdue — or it is not used.
  - Today is always visible on a time surface.
  - 'The dashboard answers "what needs me this week" before "how are we doing".'
