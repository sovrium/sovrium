# Default Sovrium theming.
#
# `baseline: extend` inherits Sovrium's built-in design system — the achromatic
# OKLCH neutral ramp (`--sv-*`) plus the self-hosted IBM Plex Sans / JetBrains
# Mono type that IS the Sovrium visual identity. Colour is reserved for
# consequence (see ADR-024), so a template that needs an accent declares its own
# colour key rather than borrowing one from the engine.
#
# No `fonts` block: the workhorse and mono families ship self-hosted with the
# platform. This template previously pulled Inter from the Google Fonts CDN,
# which contradicted the no-CDN-ever rule in
# `docs/architecture/patterns/fonts.md` — every such request leaks the
# operator's IP and Referer to a third party, which an internal tool cannot
# accept. Author a `fonts` block here only for a genuinely self-hosted family.
baseline: extend

borderRadius:
  sm: 0.25rem
  md: 0.5rem
  lg: 0.75rem
  full: 9999px
