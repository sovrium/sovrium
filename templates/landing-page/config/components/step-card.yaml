# One step to get started: its number in the accent, a title, one sentence.
name: step-card
type: card
props:
  className: flex flex-col items-start gap-2.5 border-0 bg-transparent p-0 text-left shadow-none
children:
  - type: text
    element: span
    props:
      className: flex size-9 items-center justify-center rounded-full border-[1.5px] border-primary font-mono text-[15px] font-semibold text-primary
    content: $number
  - type: text
    element: h3
    props:
      className: text-[20px] leading-[1.35] font-semibold text-foreground
    content: $title
  - type: text
    element: p
    props:
      className: text-[15px] leading-[1.6] text-foreground-muted
    content: $text
