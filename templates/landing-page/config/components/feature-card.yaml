# One thing the product does: an icon, a title, one sentence. Declared once
# and used three times on the page, each with its own `vars`.
name: feature-card
type: card
props:
  className: flex flex-col gap-2.5 rounded-lg border border-border bg-background-raised p-6 text-left shadow-sm
children:
  - type: container
    props:
      className: flex size-10 items-center justify-center rounded-md bg-primary-subtle text-primary-subtle-foreground
    children:
      - type: icon
        props:
          name: $icon
          size: 20
  - type: text
    element: h3
    props:
      className: text-[20px] leading-[1.3] font-semibold text-foreground
    content: $title
  - type: text
    element: p
    props:
      className: text-[15px] leading-[1.6] text-foreground-muted
    content: $text
