# The last section: the call to action and the demo request itself, so the
# section links and both calls to action land on the form. The form is
# config/forms/demo-request.yaml; its title is set one level below this
# section's heading, so the page keeps one h1.
type: container
element: section
props:
  id: demo
  className: mx-10 mb-[72px] flex scroll-mt-4 flex-col items-center gap-4 rounded-lg bg-primary-subtle p-12 text-center max-md:mx-4 max-md:mb-10 max-md:px-[18px] max-md:py-7
children:
  - type: text
    element: h2
    props:
      className: text-[32px] leading-[1.2] font-semibold tracking-[-0.015em] text-foreground
    content: $t:band.title
  - type: text
    element: p
    props:
      className: text-[16px] text-foreground-muted
    content: $t:band.lead
  # The card around the form. The form lays its four fields out two by two
  # through its own parts: the heading, the fields' grid, the controls, the
  # submit button and the error line.
  - type: container
    props:
      className: mt-2 w-full max-w-[680px] rounded-lg border border-border bg-background-raised p-6 text-left shadow-sm
    children:
      - type: form
        formRef: demo-request
        props:
          headingLevel: h3
        classes:
          parts:
            root: '!block'
            title: text-[20px] leading-[1.35] font-semibold text-foreground
            description: mt-1 mb-4 text-[15px] text-foreground-muted
            body: grid grid-cols-2 gap-x-4 gap-y-3.5 max-md:grid-cols-1
            input: w-full h-10
            label: text-[13px] leading-[19px]
            submit: col-span-full justify-self-end h-9 text-[13px] leading-5 max-md:w-full
            error: text-[13px] text-error
      - type: text
        element: p
        props:
          className: mt-3 text-[13px] text-foreground-subtle
        content: $t:form.note
