# The last section: the call to action and the demo request itself, so the
# section links and both calls to action land on the form. The form is
# config/forms/demo-request.yaml; its title is set one level below this
# section's heading, so the page keeps one h1.
type: container
element: section
props:
  id: demo
  className: mx-10 mb-[72px] flex scroll-mt-4 flex-col items-center gap-4 rounded-lg bg-primary-subtle p-12 text-center max-md:mx-4 max-md:mb-10 max-md:px-[18px] max-md:py-7
children:
  - type: text
    element: h2
    props:
      className: text-[32px] leading-[1.2] font-semibold tracking-[-0.015em] text-foreground
    content: $t:band.title
  - type: text
    element: p
    props:
      className: text-[16px] text-foreground-muted
    content: $t:band.lead
  # The card around the form lays its four fields out two by two; the classes
  # reach into the form the engine draws, by its own class names.
  - type: container
    props:
      className: >-
        mt-2 w-full max-w-[680px] rounded-lg border border-border bg-background-raised p-6 text-left shadow-sm
        [&_.embedded-form]:!block [&_.form-title]:text-[20px] [&_.form-title]:leading-[1.35] [&_.form-title]:font-semibold
        [&_.form-title]:text-foreground [&_.form-description]:mt-1 [&_.form-description]:mb-4
        [&_.form-description]:text-[15px] [&_.form-description]:text-foreground-muted
        [&_form]:grid [&_form]:grid-cols-2 [&_form]:gap-x-4 [&_form]:gap-y-3.5 max-md:[&_form]:grid-cols-1
        [&_form_input]:w-full [&_form_select]:w-full [&_form>button]:col-span-full [&_form>button]:justify-self-end
        [&_form>button]:h-9 [&_form>button]:text-[13px] max-md:[&_form>button]:w-full
        [&_form_input]:h-10 [&_form_select]:h-10 [&_form_label]:text-[13px]
        [&_.field-error]:text-[13px] [&_.field-error]:text-error
    children:
      - type: form
        formRef: demo-request
        props:
          headingLevel: h3
      - type: text
        element: p
        props:
          className: mt-3 text-[13px] text-foreground-subtle
        content: $t:form.note
