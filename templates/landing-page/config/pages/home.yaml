# The page at `/`, served at `/en/` and `/fr/` in that language. Its words are
# the `$t:` keys of config/languages.yaml; its body is _body.yaml. A visitor
# whose browser asks for French is sent to `/fr/`.
path: /
name: home
meta:
  title: $t:meta.title
  description: $t:meta.description
  # `./` is read from the page's own address, and the page also answers
  # `/en/` and `/fr/`: `./../` reaches the icon at the root of `public/` from
  # all of them.
  favicon: ./../favicon.svg
  # One sharing card per language: the image is a `$t:` key, so the English
  # page shares `og-en.png` and the French one `og-fr.png`. A path starting
  # with `/` is sent as a full address on the host the site is served at.
  # A PNG, not an AVIF: link previews on the social networks and in chat apps
  # do not render AVIF.
  openGraph:
    type: website
    title: $t:meta.title
    description: $t:meta.description
    image: $t:meta.image
    imageAlt: $t:meta.imageAlt
    siteName: Tablée
  # X reads the card's image from `openGraph` when this block names none.
  twitter:
    card: summary_large_image
    title: $t:meta.title
    description: $t:meta.description
components:
  $ref: ./_body.yaml
