# English and French. The page is written once, in config/pages/home.yaml,
# with a `$t:` key wherever it speaks; each language fills the keys below.
# `/en/` and `/fr/` serve the page in that language, and `/` in the visitor's
# own (their earlier choice, then their browser, then English).
#
# The French is written in French, not translated from the English: it
# addresses the reader as `tu`, the way a small restaurant talks to its
# suppliers.
default: en
supported:
  - code: en
    locale: en-GB
    label: English
    direction: ltr
  - code: fr
    locale: fr-FR
    label: Français
    direction: ltr
fallback: en
detectBrowser: true
persistSelection: true
translations:
  en:
