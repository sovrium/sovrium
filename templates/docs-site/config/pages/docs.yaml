# The documentation: one page definition, one route per markdown file under
# `content/docs/`.
#
# The sidebar is built from the files themselves — grouped by their
# `category`, ordered by their `order` — and previous / next at the foot of a
# page follow the sidebar, across sections. `introduction.md` is the `index`:
# it is what `/docs` answers.
name: docs
path: /docs/:path*

contentDir:
  directory: content/docs
  # `content/docs/guides/deployment.md` is served at `/docs/guides/deployment`:
  # the folder is part of the address.
  slugFrom: filepath
  index: introduction
  # A page with `draft: true` in its front matter is left out of the sidebar,
  # the search and the build until the line is removed.
  filter:
    draft: false
  sort:
    field: order
    direction: asc
  nav:
    enabled: true
    groupBy: category
    labelFrom: title
    # The folder-style keys each page writes in `category`, and how the
    # sidebar and the breadcrumb spell them.
    groupLabels:
      getting-started: Getting started
      guides: Guides
  # "Edit this page" under every article. `{path}` is the file, relative to
  # `content/docs/` (`guides/deployment.md`). Point it at your own repository.
  editUrl: https://github.com/your-org/my-docs/edit/main/content/docs/{path}

# The documentation layout: the sidebar, the article at a reading measure, the
# outline of its headings, "Last updated" from each file's `updated` date, and
# previous / next.
markdown:
  layout: docs
  toc:
    maxDepth: 2
    position: sidebar

# The first component renders above the article, the rest below it.
components:
  - $ref: ./_docs-header.yaml

meta:
  title: $frontmatter.title · Docs
  description: $frontmatter.description
