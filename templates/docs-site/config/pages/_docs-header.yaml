# The bar above every documentation page: the site's name, the search box and
# the way back to the landing page.
#
# On a markdown page the FIRST component renders above the article and the
# rest below it, so this bar is always the first entry of `components`.
#
# On a phone the sections sit behind the layout's menu button; the classes
# below lift that button into the bar, left of the site's name.
#
# It also tunes the reading frame that follows it: the `[&~div_…]` classes
# reach the sidebar, the article, the outline and the callouts rendered after
# the bar, so the current page and the links carry the accent and each kind of
# callout sits on its own ground in light and dark. Delete them and the pages
# fall back to the built-in docs look.
#
# `#0d0d0d` is the ground of the `github-dark` code theme (`codeBlock.theme` in
# design.yaml): the bar naming each code block — "terminal", or the file it
# belongs in — is painted the same, so block and bar read as one dark panel.
# Change the code theme, change this colour with it.
type: container
element: header
props:
  className: >-
    sticky top-0 z-30 border-b border-border bg-background
    max-lg:[&~div_article]:px-0 max-lg:[&~div_article]:pt-0 max-lg:[&~div>div]:pt-0
    [&~div_[data-component=docs-article-header]]:mb-3.5
    max-lg:[&~div>div>[data-component-type=container]>button]:fixed max-lg:[&~div>div>[data-component-type=container]>button]:top-2
    max-lg:[&~div>div>[data-component-type=container]>button]:left-2 max-lg:[&~div>div>[data-component-type=container]>button]:z-40
    max-lg:[&~div>div>[data-component-type=container]>button]:h-9 max-lg:[&~div>div>[data-component-type=container]>button]:border-0
    max-lg:[&~div>div>[data-component-type=container]>button]:bg-transparent max-lg:[&~div>div>[data-component-type=container]>button]:px-2
    max-lg:[&~div>div>[data-component-type=container]>button]:text-[0px]
    max-lg:[&~div>div>[data-component-type=container]]:contents
    lg:[&~div>div]:max-w-none lg:[&~div>div]:gap-0 lg:[&~div>div]:px-0
    lg:[&~div_nav[data-component=docs-sidebar-nav]]:top-14
    lg:[&~div_nav[data-component=docs-sidebar-nav]]:h-[calc(100dvh-3.5rem)]
    lg:[&~div_nav[data-component=docs-sidebar-nav]]:w-[248px]
    lg:[&~div_nav[data-component=docs-sidebar-nav]]:px-3.5
    lg:[&~div_nav[data-component=docs-sidebar-nav]]:py-5
    [&~div_nav_[data-nav-group]]:mb-0.5 [&~div_nav_[data-nav-group]]:border-t-0
    [&~div_nav_[data-nav-group]]:pt-0
    [&~div_nav_[data-nav-group]>p]:font-mono [&~div_nav_[data-nav-group]>p]:text-[12px]
    [&~div_nav_[data-nav-group]>p]:mb-0.5 [&~div_nav_[data-nav-group]>p]:pb-1.5
