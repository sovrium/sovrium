    [&~div_nav[data-component=docs-sidebar-nav]_a]:border-l-0
    lg:[&~div_article]:px-12 lg:[&~div_article]:pt-8
    lg:[&~div_[data-component=markdown-toc]]:block
    lg:[&~div_[data-component=markdown-toc]]:w-[220px]
    lg:[&~div_[data-component=markdown-toc]]:top-14
    lg:[&~div_[data-component=markdown-toc]]:max-h-[calc(100dvh-6rem)]
    lg:[&~div_[data-component=markdown-toc]]:py-8
    lg:[&~div_[data-component=markdown-toc]]:self-stretch
