# The bar above every documentation page: the site's name, the search box and
# the way back to the landing page.
#
# On a markdown page the FIRST component renders above the article and the
# rest below it, so this bar is always the first entry of `components`.
#
# On a phone the sections sit behind the layout's menu button, which the
# reading frame lifts into this bar, left of the site's name.
#
# The reading frame below it (the sidebar, the article, the outline and the
# callouts) is measured and styled by part in `docs.yaml`'s `markdown` block.
#
# `#0d0d0d` is the ground of the `github-dark` code theme (`codeBlock.theme` in
# design.yaml): the bar naming each code block — "terminal", or the file it
# belongs in — is painted the same, so block and bar read as one dark panel.
# Change the code theme, change this colour with it.
type: container
element: header
props:
  className: sticky top-0 z-30 border-b border-border bg-background
children:
  - $ref: ./_brand-bar.yaml
