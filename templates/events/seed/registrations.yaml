# Sample attendee list.
#
# Registrations cluster unevenly on purpose. Two events carry a waitlist because
# they are Sold out, one carries a cancellation, and the Draft and Cancelled
# events carry none at all — which is what makes the registrations grid worth
# looking at: filtering by event or by status actually changes what you see.
#
# `@events.<key>` resolves to the event's database id at write time. Emails use
# `.example`, a reserved TLD that can never receive mail, so a demo re-seed can
# never send a stranger a confirmation.
records:
  - key: reg-winter-nadia
    fields:
      event: '@events.winter-summit'
      name: Nadia Bouchard
      email: nadia.bouchard@northwind.example
      status: Confirmed

  - key: reg-winter-tomas
    fields:
      event: '@events.winter-summit'
      name: Tomás Ferreira
      email: t.ferreira@lumen-analytics.example
      status: Confirmed

