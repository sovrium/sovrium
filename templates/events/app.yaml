# Fieldday Events — a community's workshops and meetups in one config.
#
# Visitors see what is on, when, where and how full, and register in under a
# minute with no account; a full event offers its waitlist. The organizers
# read the month and the seats taken on one Overview, find everyone grouped
# by event, and check people in at the door. This is the file you diff, fork
# and redeploy.
name: fieldday-events
version: 2.0.0
description: >-
  A community's events: a public page listing what is on with the seats left,
  registration with no account and a waitlist when an event is full, an
  Overview of the month and the seats taken, and every registration grouped
  by event with a check-in at the door.

auth:
  $ref: ./config/auth.yaml

design:
  $ref: ./config/design.yaml

# The address the links in the emails point at. Set it to your own domain in
# production.
env:
  - key: BASE_URL
    description: The public address of this app, used in the links the emails carry.
    required: false
    default: http://localhost:3000
    secret: false
  # Optional: a Discord bot token and a channel id turn on the post of each
  # event as it opens to the community's channel
  # (config/automations/announce-event.yaml, through
  # library/connection/discord.yaml). Without them the app runs as before.
  - key: DISCORD_BOT_TOKEN
    description: Token of your Discord bot, for the post of each event as it opens.
    required: false
  - key: DISCORD_CHANNEL_ID
    description: Id of the Discord channel the events are announced in.
    required: false
  # Optional: a Google OAuth client lets an organizer connect the shared Google
  # calendar, whose events are then filed into calendar_events every hour
  # (library/recipe/google-calendar-events-to-table.yaml). Without it the app
  # runs as before and that table stays empty.
  - key: GOOGLE_CLIENT_ID
    description: OAuth client id of your Google Cloud project, for the shared calendar.
    required: false
  - key: GOOGLE_CLIENT_SECRET
    description: OAuth client secret of your Google Cloud project, for the shared calendar.
    required: false

tables:
  - $ref: ./config/tables/events.yaml
  - $ref: ./config/tables/registrations.yaml
  - $ref: ./config/tables/calendar_events.yaml

# The two public forms render on `/register` and `/waitlist/<event>`; the third opens
# in a dialog on the Overview.
forms:
  - $ref: ./config/forms/register.yaml
  - $ref: ./config/forms/join-waitlist.yaml
  - $ref: ./config/forms/new-event.yaml

# First-party analytics: page views of the public pages and one event per
# registration (config/automations/track-registration.yaml), counted on this
# server with no cookie and no outside service. The organizers' own pages are
# left out, so the figures are the community's, not the staff's.
analytics:
  excludedPaths:
    - /calendar
    - /registrations
    - /sign-in

# Automations run on the server, with their history kept in your own database.
automations:
  - $ref: ./config/automations/confirm-registration.yaml
  - $ref: ./config/automations/recount-seats.yaml
  - $ref: ./config/automations/announce-event.yaml
  - $ref: ./config/automations/track-registration.yaml
  - $ref: ./library/recipe/google-calendar-events-to-table.yaml

# Listed in the order of the sidebar, then the public pages.
pages:
  - $ref: ./config/pages/calendar.yaml
  - $ref: ./config/pages/registrations.yaml
  - $ref: ./config/pages/home.yaml
  - $ref: ./config/pages/register.yaml
  - $ref: ./config/pages/waitlist.yaml
  - $ref: ./config/pages/thanks.yaml
  - $ref: ./config/pages/thanks-event.yaml
  - $ref: ./config/pages/on-the-waitlist.yaml
  - $ref: ./config/pages/sign-in.yaml

# A small "Built with Sovrium" line after each page's content rather than a
# floating pill, so it never sits over the last card.
badge:
  placement: footer

connections:
  - $ref: ./library/connection/discord.yaml
  - $ref: ./library/connection/google.yaml
