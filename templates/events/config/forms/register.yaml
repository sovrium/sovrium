# The public registration form. It renders on `/register`
# (config/pages/register.yaml) and needs no account. Each event card links
# here with its event already chosen — `/register?event=<id>` fills the Event
# select from the link — so a visitor types a name and an email, answers one
# question and is done.
#
# A submission becomes a Confirmed registration, which starts
# config/automations/confirm-registration.yaml. The page that follows names
# the event: the redirect carries the event the visitor chose, and
# `/thanks/<id>` reads it back. The honeypot silently drops naive bots.
#
# Capacity is advisory. Nothing refuses a registration once an event is full;
# the public page simply stops linking a full event to this form and offers
# its waitlist instead.
id: 1
name: register
title: Register
description: No account needed, and it is free. Your confirmation goes to your email.
access:
  require: all
submitTo:
  table: registrations
antiSpam:
  honeypot: true
display:
  submitLabel: Register
onSuccess:
  type: redirect
  url: /thanks/$record.event
  delaySeconds: 0
prefill:
  event: $query.event
fields:
  - kind: table-field
    column: event
    required: true
    label: Event
  - kind: table-field
    column: name
    required: true
    label: Your name
  - kind: table-field
    column: email
    required: true
    label: Email
    helpText: Your confirmation goes here.
  - kind: table-field
    column: answer
    label: What will you bring?
