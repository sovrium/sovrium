name: calendar
path: /calendar
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Calendar
  description: The event schedule on a month view
components:
  - $ref: ./_nav.yaml
  - type: container
    element: section
    props:
      className: max-w-6xl mx-auto px-6 py-8
    children:
      - type: text
        element: h1
        props:
          className: text-2xl font-bold mb-1
        content: Calendar
      - type: text
        element: p
        props:
          className: text-sm mb-6
        content: Every event on the schedule, drafts included.

      - type: container
        props:
          className: border rounded-lg p-5 mb-8
        children:
          - type: text
            element: h2
            props:
              className: text-base font-semibold mb-4
            content: New event
          - type: form
            dataSource:
              table: events
            fields:
              - field: name
              - field: event_date
              - field: location
              - field: capacity
              - field: status
            action:
              type: crud
              operation: create
              table: events
              onSuccess:
                navigate: /calendar
                toast:
                  message: Event created
                  variant: success

      # `labelField` is optional in the schema but required in practice: without
      # it every event renders as an unlabelled block, so the month view shows
      # WHERE the events are and refuses to say WHAT they are. `colorField`
      # points at the status field, whose option colours are record data — the
      # one channel ADR-024 A7 keeps coloured — so a Cancelled event reads as
      # cancelled at a glance instead of matching every other block on the grid.
      - type: calendar
        dataSource:
          table: events
        dateField: event_date
        labelField: name
        colorField: status
        defaultView: month
