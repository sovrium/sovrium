# The Overview, the organizers' home: how many are registered, who waits, which
# event is full; the month with every event on it; and the seats taken per
# open event. New event opens a dialog; the event starts as a draft.
name: calendar
path: /calendar
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Overview · Fieldday
  description: Registrations, the waitlist and the month of events.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Overview
              - type: container
                props:
                  className: grow
              - type: button
                content: New event
                props:
                  data-testid: new-event
                  className: h-7 px-3 text-[13px]
                  interactions:
                    click:
                      modal: new-event-dialog
          - type: dialog
            formRef: new-event
            props:
              id: new-event-dialog
              title: New event
              description: It starts as a draft, off the public page, until you open it.
          - type: container
            props:
              className: flex flex-col gap-4 px-5 pb-5 pt-4
            children:
              # Four figures, computed from the events and their registrations
              # on every visit, drawn a size smaller on a phone.
              - type: grid
                props:
                  className: grid grid-cols-2 gap-3 lg:grid-cols-4
                children:
                  - type: kpi
                    label: Registered
                    size: { mobile: sm, md: md }
                    dataSource:
                      table: events
                      filter:
                        - { field: status, operator: eq, value: Open }
                    kpiAggregate: { function: sum, field: seats_taken }
                    kpiFormat: { type: number }
                  - type: kpi
                    label: Coming today
                    size: { mobile: sm, md: md }
                    dataSource:
                      table: events
                      filter:
                        - { field: status, operator: eq, value: Open }
                    kpiAggregate: { function: sum, field: coming_today }
                    kpiFormat: { type: number }
                  - type: kpi
                    label: On a waitlist
                    size: { mobile: sm, md: md }
                    tone: warning
                    dataSource:
                      table: events
                      filter:
                        - { field: status, operator: eq, value: Open }
                    kpiAggregate: { function: sum, field: on_waitlist }
                    kpiFormat: { type: number }
                  - type: kpi
                    label: Full
                    size: { mobile: sm, md: md }
                    tone: error
                    dataSource:
                      table: events
                    kpiAggregate: { function: sum, field: is_full }
                    kpiFormat: { type: number }
              - type: container
                props:
                  className: flex items-start gap-4 max-lg:flex-col
                children:
                  - type: container
                    props:
                      className: min-w-0 flex-1 max-lg:w-full
                    children:
                      # Events are quiet outlined chips: the page spends its
                      # colour on the figures above, not on the month.
                      - type: calendar
                        classes:
                          parts:
                            event: '!border-border !bg-background-raised !text-foreground'
                        dataSource:
                          table: events
                          filter:
                            - { field: status, operator: neq, value: Cancelled }
                        dateField: starts_at
                        labelField: name
                        defaultView: month
                  # The seats taken per open event, soonest first.
                  - type: container
                    element: section
                    props:
                      className: flex w-[300px] flex-none flex-col gap-2 max-lg:w-full
                      aria-label: Seats taken
                    children:
                      - type: text
                        element: h2
                        props:
                          className: font-mono text-[11px] font-medium uppercase tracking-wider text-foreground-subtle
                        content: Seats taken
                      - type: list
                        # The column is narrow: each event's name takes the row's
                        # full width and its seats sit on the line below.
                        classes:
                          parts:
                            item: gap-y-1
                            title: text-[13px] leading-[var(--text-base--line-height)]
                        dataSource:
                          table: events
                          filter:
                            - { field: status, operator: eq, value: Open }
                          sort:
                            - { field: starts_at, direction: asc }
                        listDisplay:
                          itemLayout: stacked
                          emptyMessage: Open events appear here with their seats taken. Create one with New event, then open it.
                          itemTemplate:
                            title: $record.name
                            metadata:
                              - { field: starts_at, format: short-date }
                              - { field: place, format: text }
                              - { field: taken_label, format: text }
