# The way in for the organizers. Sign-up is closed (config/auth.yaml), so this
# page only signs people in; an admin adds new organizers with
# `sovrium admin create`. Every organizer lands on the Overview.
name: sign-in
path: /sign-in
meta:
  title: Organizer sign-in · Fieldday
  description: Sign in to run Fieldday's events.
components:
  - type: container
    element: main
    props:
      className: flex min-h-screen items-center justify-center bg-background-subtle px-5 py-12
    children:
      - type: container
        props:
          className: flex w-full max-w-sm flex-col gap-6 rounded-lg border border-border bg-background-raised p-6 shadow-sm
        children:
          - type: container
            props:
              className: flex items-center gap-2.5 text-sm font-semibold text-foreground
            children:
              - type: icon
                props:
                  name: ticket
                  size: 14
                  className: box-content rounded-sm bg-primary p-1 text-primary-foreground
              - type: text
                element: span
                content: Fieldday
          - type: text
            element: h1
            props:
              className: text-[22px] font-semibold tracking-tight text-foreground
            content: Organizer sign-in
          - type: form
            props:
              id: sign-in-form
            action:
              type: auth
              method: login
              strategy: email
              onSuccess:
                navigate: /calendar
          - type: link
            props:
              href: /
              className: text-xs text-foreground-muted hover:text-foreground
            content: Looking for an event? See what's on.
