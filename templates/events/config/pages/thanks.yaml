# The confirmation with no event named — what `/thanks` shows when the link
# carries no event. A registration lands on `/thanks/<event>` instead
# (thanks-event.yaml), which names it.
name: thanks
path: /thanks
meta:
  title: You are registered · Fieldday
  description: Your registration is confirmed. A confirmation is on its way to your inbox.
components:
  - type: container
    props:
      className: flex min-h-screen flex-col bg-background text-foreground
    children:
      - $ref: ./_site-header.yaml
      - type: container
        element: main
        props:
          className: mx-auto flex w-full max-w-[640px] flex-1 flex-col gap-4 px-6 pt-16 pb-10 max-md:px-4 max-md:pt-8
        children:
          - type: icon
            props:
              name: circle-check
              size: 28
              className: text-success
          - type: text
            element: h1
            props:
              className: text-[30px] font-semibold leading-tight tracking-tight text-foreground max-md:text-2xl
            content: You are registered
          - type: text
            element: p
            props:
              className: text-base text-foreground-muted
            content: A confirmation with the date and the place is on its way to your inbox.
          - type: container
            children:
              - type: link
                props:
                  href: /
                  className: inline-flex h-8 items-center gap-1.5 rounded-md border border-border px-3 text-[13px] font-medium text-foreground hover:bg-background-subtle
                content: See the other events
      - $ref: ./_site-footer.yaml
