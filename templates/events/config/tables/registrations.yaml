# Everyone who registered, one row per person per event.
#
# A visitor registers from the public page with no account, through the
# hosted forms in config/forms/: those forms are the only way in for someone
# who is not signed in. Attendee details stay with the organizers — nobody
# else reads this table.
id: 2
name: registrations
fields:
  - id: 1
    name: event
    type: relationship
    relatedTable: events
    relationType: many-to-one
    # The form's Event select and the grid's group headers show the event's
    # name; the stored value stays the event's id.
    displayField: name
    required: true
  - id: 2
    name: name
    type: single-line-text
    required: true
  - id: 3
    name: email
    type: email
    required: true
  # Confirmed while there are seats; Waitlist once the event is full. An
  # organizer moves someone off the waitlist by changing this one word.
  - id: 4
    name: status
    type: single-select
    options:
      - value: Confirmed
        color: '#6B6B76'
      - value: Waitlist
        color: '#6B6B76'
      - value: Cancelled
        color: '#6B6B76'
    default: Confirmed
  # The one question the registration form asks.
  - id: 7
    name: answer
    type: single-select
    options:
      - value: A spreadsheet we use every week
        color: '#6B6B76'
      - value: A process we still run by hand
        color: '#6B6B76'
      - value: Nothing yet, just curious
        color: '#6B6B76'
  # Ticked at the door (config/pages/registrations.yaml).
  - id: 6
    name: checked_in
    type: checkbox
    default: false
  # When the person registered. Written by the app, never typed.
  - id: 5
    name: registered_at
    type: created-at

# Organizers read and update attendees; only an admin removes one. A
# signed-in member who tries to delete gets the same 404 as a missing row.
permissions:
  read:
    - admin
    - member
  create:
    - admin
    - member
  update:
    - admin
    - member
  delete:
    - admin
