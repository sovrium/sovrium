# Sample asset register.
#
# Fourteen rows, weighted the way a real register is: mostly laptops and
# monitors, a long tail of everything else, and a handful of things that are
# broken, lost to the storeroom, or already written off. Spreading `status`
# across all four options is what makes `/board` worth opening — a kanban whose
# cards all sit in one column demonstrates nothing.
#
# `barcode` is a `format: EAN-13` field, so these are real thirteen-digit codes
# with correct check digits rather than plausible-looking digits. A scanner app
# pointed at the demo will accept them, and a barcode that fails validation in a
# demo is worse than no barcode at all.
#
# `purchase_date` is relative, so the register ages with the clock — the oldest
# kit is always genuinely old, and `value` reads as a plausible book value for
# something bought that long ago rather than as a list price.
#
# `photo` (an attachment) and `assigned_to` (a `user` field) are left unseeded
# on purpose: the first needs binary files this repository does not ship, and
# the second needs a real account id that does not exist until someone signs up.
