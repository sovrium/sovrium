name: arden-assets
version: 2.0.0
description: >-
  An asset register for a small firm: everything it owns grouped by category,
  with the tag, the holder and the place of each asset, check-outs with their
  return dates, the assets missing at the last count, a lifecycle board, cards
  to walk the floor with, and the locations.

auth:
  $ref: ./config/auth.yaml

# Optional: a Microsoft 365 OAuth client and a Teams channel turn on the post of
# each asset event — a check-out, a repair, a return — to that channel
# (library/recipe/record-to-teams-channel.yaml). Without them the app runs as
# before and that one automation cannot reach Teams.
env:
  - key: MICROSOFT_CLIENT_ID
    description: Client id of your Microsoft Entra app registration, for the Teams posts.
    required: false
  - key: MICROSOFT_CLIENT_SECRET
    description: Client secret of the same app registration.
    required: false
  - key: TEAMS_TEAM_ID
    description: Id of the team whose channel receives each asset event.
    required: false
  - key: TEAMS_CHANNEL_ID
    description: Id of that channel.
    required: false

design:
  $ref: ./config/design.yaml

tables:
  - $ref: ./config/tables/locations.yaml
  - $ref: ./config/tables/assets.yaml
  - $ref: ./config/tables/check_outs.yaml
  - $ref: ./config/tables/asset_events.yaml

# The register as a CSV file in storage on the first of each month, and the
# library recipe that posts each asset event to a Teams channel.
automations:
  - $ref: ./config/automations/register-export.yaml
  - $ref: ./library/recipe/record-to-teams-channel.yaml

# The forms the app's "Add" dialogs open, each placed with `formRef`.
forms:
  - $ref: ./config/forms/register-asset.yaml

# Listed in the order of the sidebar: the Register is the home page.
pages:
  - $ref: ./config/pages/register.yaml
  - $ref: ./config/pages/lifecycle.yaml
  - $ref: ./config/pages/gallery.yaml
  - $ref: ./config/pages/locations.yaml
  - $ref: ./config/pages/sign-in.yaml

# A small "Built with Sovrium" line after each page's content rather than a
# floating pill, so it never sits over the last row of a grid.
badge:
  placement: footer

connections:
  - $ref: ./library/connection/microsoft-365.yaml
