# The "Register asset" dialog. A new asset starts In storage with no holder:
# handing it to someone is a check-out, recorded afterwards. A field left empty
# is simply not sent, so an asset may be registered before its serial or its
# warranty date is known.
type: dialog
props:
  id: register-asset-dialog
  title: Register asset
  description: Give it the tag printed on its label, so it can be found and counted.
formRef: register-asset
