# The "Register asset" dialog. A new asset starts In storage with no holder:
# handing it to someone is a check-out, recorded afterwards. A field left empty
# is simply not sent, so an asset may be registered before its serial or its
# warranty date is known.
type: dialog
props:
  id: register-asset-dialog
  title: Register asset
  description: Give it the tag printed on its label, so it can be found and counted.
children:
  - type: form
    dataSource:
      table: assets
    fields:
      - { field: asset_tag, label: Asset tag }
      - { field: name, label: Asset }
      - { field: category, label: Category }
      - { field: location, label: Location }
      - { field: serial, label: Serial }
      - { field: barcode, label: Barcode }
      - { field: purchased_on, label: Purchased }
      - { field: value, label: Value }
      - { field: warranty_end, label: Warranty ends }
    action:
      type: crud
      operation: create
      table: assets
      submitLabel: Register asset
      onSuccess:
        navigate: /
        toast:
          message: Asset registered
          variant: success
