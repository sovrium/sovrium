# The register as cards, to walk the floor with: each asset in service with its
# category, its tag, its place and who has it. Pick a location to see only what
# should be there. Retired assets are left out.
name: gallery
path: /gallery
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Gallery · Arden Assets
  description: The assets in service as cards, by location.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Gallery
              - type: container
                props:
                  className: grow
              - type: button
                content: Register asset
                props:
                  className: h-7 px-3 text-[13px]
                  interactions:
                    click:
                      modal: register-asset-dialog
          - $ref: ./_register-asset.yaml
          - type: container
            props:
              className: flex flex-col gap-3 px-5 pb-5 pt-4
            children:
              - type: filter-bar
                publishes:
                  bindTo: gallery-filter
                fields:
                  - { name: name, label: Asset, kind: text }
                  - name: location_name
                    label: Location
                    kind: select
                    options:
                      - { value: Paris HQ, label: Paris HQ }
                      - { value: Lyon office, label: Lyon office }
                      - { value: Storeroom, label: Storeroom }
                      - { value: Remote, label: Remote }
                      - { value: Ateliers Rémi, label: Ateliers Rémi }
              - type: gallery
                dataSource:
                  table: assets
                  bindTo: gallery-filter
                  sharedFilter: {}
                  filter:
                    - { field: status, operator: neq, value: Retired }
                  sort:
                    - { field: asset_tag, direction: asc }
                gridColumns: { mobile: 1, sm: 2, lg: 4 }
                galleryCard:
                  children:
                    - type: text
                      element: p
                      props:
                        className: font-mono text-xs uppercase tracking-wide text-foreground-muted
                      content: $record.category
                    # h2: the page's h1 is Gallery, and each card is a section of it.
                    - type: text
                      element: h2
                      props:
                        className: text-[13px] font-medium leading-[18px] text-foreground
                      content: $record.name
                    - type: text
                      element: p
                      props:
                        className: text-xs text-foreground-muted
                      content: $record.asset_tag · $record.location_name
                    - type: text
                      element: p
                      props:
                        className: text-xs text-foreground
                      content: $record.flag
                    # The same QR label the drawer shows, so a card can be
                    # checked against the sticker on the asset. A card draws the
                    # label at the card's width; a sticker is a small square, so
                    # the class holds it at 72 px.
                    - type: qr-code
                      value: $record.asset_tag
                      props:
                        className: mt-2 w-18
                        aria-label: QR label for $record.asset_tag
                emptyMessage: Cards appear here for every asset at the chosen location. Pick another location, or register an asset here.
