# Email and password sign-in, closed to strangers.
#
# What a firm owns, and who holds it, is its own business, so nobody signs
# themselves up: the first administrator comes from `AUTH_ADMIN_EMAIL` /
# `AUTH_ADMIN_PASSWORD` on the first start (see `.env.example`), and everyone
# else is added by an admin with `sovrium admin create <email>`. The demo
# accounts come from `seed/users.yaml`.
#
# Two roles: `member` for everyone who holds kit — reads the register, hands
# assets over and takes them back — and `admin` for the office manager, who
# may also delete. Each table's `permissions` block says which is which.
allowSignUp: false
defaultRole: member
strategies:
  - type: emailAndPassword
    minPasswordLength: 8
