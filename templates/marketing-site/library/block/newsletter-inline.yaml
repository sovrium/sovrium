# sovrium-library: block/newsletter-inline@0.30.0
name: newsletter-inline
type: container
element: section
props:
  className: px-5 py-14 sm:px-8 sm:py-20 lg:px-16 lg:py-24
children:
  - type: container
    props:
      className: mx-auto w-full max-w-6xl
    children:
      - type: card
        props:
          className: flex flex-col gap-8 p-6 sm:p-8 lg:flex-row lg:items-center lg:justify-between
        children:
          - type: flex
            props:
              className: flex flex-col max-w-md gap-2
            children:
              - type: text
                element: h3
                props:
                  className: text-xl font-semibold text-foreground
                content: '[Newsletter name]'
              - type: text
                element: p
                props:
                  className: text-md text-foreground-muted
                content: 'What arrives, how often, and that one click unsubscribes.'
          - type: flex
            props:
              className: flex flex-col w-full max-w-md gap-2
            children:
              - type: form
                props:
                  className: '!border-0 !bg-transparent !p-0 sm:flex-row sm:items-end *:first:flex-1'
                classes:
                  parts:
                    submit: h-10 px-4
                endpoint:
                  url: /api/forms/newsletter/submissions
                  method: POST
                  submitLabel: Subscribe
                  onSuccess:
                    type: toast
                    variant: success
                    message: You are subscribed.
                  onError:
                    type: toast
                    variant: destructive
                    message: The address could not be saved. Try again.
                fields:
                  - field: email
                    control: email
                    label: Email
                    placeholder: you@example.com
              - type: text
                element: p
                props:
                  className: text-sm text-foreground-subtle
                content: '[Privacy line — link to the policy]'
