# sovrium-library: block/feature-alternating@0.30.0
name: feature-alternating
type: container
element: section
props:
  className: px-5 py-14 sm:px-8 sm:py-20 lg:px-16 lg:py-24
children:
  - type: container
    props:
      className: mx-auto w-full max-w-6xl
    children:
      - type: flex
        props:
          className: flex flex-col gap-20 lg:gap-24
        children:
          - type: grid
            props:
              className: grid grid-cols-1 items-center gap-10 lg:grid-cols-2 lg:gap-16
            children:
              - type: flex
                props:
                  className: flex flex-col gap-4
                children:
                  - type: flex
                    props:
                      className: flex items-center gap-2
                    children:
                      - type: container
                        props:
                          className: size-1.5 rounded-sm bg-primary
                      - type: text
                        element: span
                        props:
                          className: font-mono text-sm text-foreground-subtle
                        content: '[01]'
                  - type: text
                    element: h2
                    props:
                      className: 'text-3xl font-semibold tracking-tight text-balance text-foreground sm:text-5xl sm:leading-[1.1] sm:text-4xl'
                    content: 'First benefit, stated as an outcome'
                  - type: text
                    element: p
                    props:
                      className: text-md leading-relaxed text-pretty text-foreground-muted
                    content: 'Two or three sentences that show how it works in practice, with one concrete example.'
                  - type: container
                    props:
                      className: mt-2
                    children:
                      - type: link
                        props:
                          href: /features
                          className: inline-flex items-center gap-1.5 text-md font-medium text-foreground underline-offset-4 hover:underline
                        children:
                          - type: text
                            element: span
                            content: '[Learn how]'
                          - type: icon
                            props:
                              name: arrow-right
                              size: 16
              - type: container
                props:
                  className: 'flex w-full items-center justify-center rounded-lg border border-border bg-background-inset aspect-[4/3]'
                  role: img
                  aria-label: 'First benefit, stated as an outcome'
                children:
                  - type: text
                    element: span
                    props:
                      className: font-mono text-sm text-foreground-subtle
                    content: image · 4:3
          - type: grid
            props:
              className: grid grid-cols-1 items-center gap-10 lg:grid-cols-2 lg:gap-16
            children:
              - type: flex
                props:
                  className: flex flex-col gap-4 lg:order-2
                children:
                  - type: flex
                    props:
                      className: flex items-center gap-2
                    children:
                      - type: container
                        props:
                          className: size-1.5 rounded-sm bg-primary
                      - type: text
                        element: span
                        props:
                          className: font-mono text-sm text-foreground-subtle
                        content: '[02]'
                  - type: text
                    element: h2
                    props:
                      className: 'text-3xl font-semibold tracking-tight text-balance text-foreground sm:text-5xl sm:leading-[1.1] sm:text-4xl'
                    content: 'Second benefit, stated as an outcome'
                  - type: text
                    element: p
                    props:
                      className: text-md leading-relaxed text-pretty text-foreground-muted
                    content: 'Same rhythm as the first. The image changes sides, the copy keeps its length.'
                  - type: container
                    props:
                      className: mt-2
                    children:
