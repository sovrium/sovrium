# sovrium-library: block/cta-split@0.30.0
name: cta-split
type: container
element: section
props:
  className: px-5 py-14 sm:px-8 sm:py-20 lg:px-16 lg:py-24
children:
  - type: container
    props:
      className: mx-auto w-full max-w-6xl
    children:
      - type: grid
        props:
          className: grid grid-cols-1 items-end gap-8 border-t border-border pt-12 lg:grid-cols-2 lg:pt-14
        children:
          - type: flex
            props:
              className: flex flex-col gap-3
            children:
              - type: text
                element: h2
                props:
                  className: 'text-3xl font-semibold tracking-tight text-balance text-foreground sm:text-5xl sm:leading-[1.1]'
                content: Ready when you are
              - type: text
                element: p
                props:
                  className: text-lg text-pretty text-foreground-muted sm:text-xl
                content: A sentence that says exactly what happens after the click.
          - type: flex
            props:
              className: flex flex-col gap-3 sm:flex-row sm:items-center lg:justify-end
            children:
              - type: link
                props:
                  href: /about
                  className: 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md border font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-focus-ring)] no-underline hover:no-underline focus-visible:no-underline border-border-strong bg-background-raised text-foreground hover:bg-background-subtle hover:text-foreground h-12 px-5 text-md'
                content: '[Secondary]'
              - type: link
                props:
                  href: /contact
                  className: 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md border font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--color-focus-ring)] no-underline hover:no-underline focus-visible:no-underline border-primary bg-primary text-primary-fg hover:bg-primary-hover hover:text-primary-fg h-12 px-5 text-md'
                content: '[Primary action]'
