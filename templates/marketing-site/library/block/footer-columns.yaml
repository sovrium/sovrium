# sovrium-library: block/footer-columns@0.30.0
name: footer-columns
# The landmark sits one level down, named outright: a block's outermost
# element is drawn as a group, and a footer inside the page's main region is not a
# landmark unless it says so.
type: container
children:
  - type: container
    element: footer
    props:
      role: contentinfo
      className: border-t border-border px-5 pb-10 pt-14 sm:px-8 lg:px-16 lg:pt-16
    children:
      - type: container
        props:
          className: mx-auto w-full max-w-6xl
        children:
          - type: grid
            props:
              className: 'grid grid-cols-1 grid-cols-2 gap-x-6 gap-y-10 lg:grid-cols-[1.6fr_repeat(4,minmax(0,1fr))] lg:gap-8'
            children:
              - type: flex
                props:
                  className: flex flex-col col-span-2 gap-3 lg:col-span-1
                children:
                  - type: link
                    props:
                      href: /
                      className: inline-flex items-center gap-2.5 text-lg font-semibold text-foreground
                    children:
                      - type: container
                        props:
                          className: size-5 rounded bg-foreground
                          aria-hidden: 'true'
                      - type: text
                        element: span
                        content: $t:brand
                  - type: text
                    element: p
                    props:
                      className: text-md leading-relaxed text-pretty text-foreground-muted max-w-xs text-sm sm:text-md
                    content: $t:footer.tagline
              - type: flex
                props:
                  className: flex flex-col gap-3
                children:
                  - type: text
                    element: h3
                    props:
                      className: font-mono text-sm font-normal text-foreground-subtle
                    content: $t:footer.product
                  - type: link
                    props:
                      href: /product-1
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link1
                  - type: link
                    props:
                      href: /product-2
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link2
                  - type: link
                    props:
                      href: /product-3
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link3
                  - type: link
                    props:
                      href: /product-4
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link4
              - type: flex
                props:
                  className: flex flex-col gap-3
                children:
                  - type: text
                    element: h3
                    props:
                      className: font-mono text-sm font-normal text-foreground-subtle
                    content: $t:footer.resources
                  - type: link
                    props:
                      href: /resources-1
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link1
                  - type: link
                    props:
                      href: /resources-2
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link2
                  - type: link
                    props:
                      href: /resources-3
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link3
                  - type: link
                    props:
                      href: /resources-4
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link4
              - type: flex
                props:
                  className: flex flex-col gap-3
                children:
                  - type: text
                    element: h3
                    props:
                      className: font-mono text-sm font-normal text-foreground-subtle
                    content: $t:footer.company
                  - type: link
                    props:
                      href: /company-1
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link1
                  - type: link
                    props:
                      href: /company-2
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link2
                  - type: link
                    props:
                      href: /company-3
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link3
                  - type: link
                    props:
                      href: /company-4
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link4
              - type: flex
                props:
                  className: flex flex-col gap-3
                children:
                  - type: text
                    element: h3
                    props:
                      className: font-mono text-sm font-normal text-foreground-subtle
                    content: $t:footer.legal
                  - type: link
                    props:
                      href: /legal-1
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link1
                  - type: link
                    props:
                      href: /legal-2
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link2
                  - type: link
                    props:
                      href: /legal-3
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link3
                  - type: link
                    props:
                      href: /legal-4
                      className: text-md text-foreground-muted hover:text-foreground
                    content: $t:footer.link4
          - type: flex
            props:
              className: flex mt-12 flex-wrap items-center justify-between gap-4 border-t border-border pt-6
            children:
              - type: text
                element: p
                props:
                  className: text-sm text-foreground-subtle
                content: $t:footer.copyright
              - type: flex
                props:
                  className: flex items-center gap-2
                children:
                  - type: theme-toggle
                    variant: icon
                    label: $t:footer.theme
