              - - '[Feature one]'
                - Included
                - Included
                - Included
              - - '[Feature two]'
                - —
                - Included
                - Included
              - - '[Limit]'
                - '[n]'
                - '[n]'
                - Unlimited
              - - '[Feature four]'
                - —
                - —
                - Included
              - - '[Support]'
                - Email
                - Email
                - '[Named contact]'
              - - Price
                - '[PRICE]'
                - '[PRICE]'
                - '[PRICE]'
            tableColumns:
              - className: font-medium
              - {}
              - {}
              - {}
            props:
              className: '!table !w-full !rounded-none !border-0 !bg-transparent min-w-[36rem] text-left text-md text-foreground'
            classes:
              parts:
                header: border-b border-border px-4 py-3 text-sm font-medium text-foreground-subtle
                row: '*:border-b *:border-border last:*:border-b-0'
                cell: px-4 py-3
