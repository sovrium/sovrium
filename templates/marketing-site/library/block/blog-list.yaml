# sovrium-library: block/blog-list@0.30.0
name: blog-list
type: container
element: section
props:
  className: px-5 py-14 sm:px-8 sm:py-20 lg:px-16 lg:py-24
children:
  - type: container
    props:
      className: mx-auto w-full max-w-3xl
    children:
      - type: flex
        props:
          className: flex flex-col gap-8
        children:
          - type: text
            element: h2
            props:
              className: 'text-3xl font-semibold tracking-tight text-balance text-foreground sm:text-5xl sm:leading-[1.1]'
            content: '[Writing]'
          - type: list
            dataSource:
              table: posts
              sort:
                - field: published_at
                  direction: desc
              limit: 10
            listDisplay:
              itemTemplate:
                title: $record.title
                subtitle: $record.excerpt
                metadata:
                  - field: published_at
                    format: short-date
              emptyMessage: No post published yet.
              loadMore: button
