                    props:
                      name: mail
                      size: 20
                      className: flex-none text-foreground-subtle
                  - type: flex
                    props:
                      className: flex min-w-0 flex-1 flex-col
                    children:
                      - type: text
                        element: span
                        props:
                          className: text-md font-semibold text-foreground
                        content: '[Contact]'
                      - type: text
                        element: span
                        props:
                          className: text-sm text-foreground-subtle
                        content: '[Who answers]'
                  - type: icon
                    props:
                      name: chevron-right
                      size: 18
                      className: flex-none text-foreground-subtle
