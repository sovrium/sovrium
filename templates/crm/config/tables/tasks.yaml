id: 4
name: tasks
fields:
  - id: 1
    name: title
    type: single-line-text
    required: true
  - id: 2
    name: deal
    type: relationship
    relatedTable: deals
    relationType: many-to-one
    # Show the deal's name wherever the link is displayed, not its id.
    displayField: name
  - id: 3
    name: due_date
    type: date
  - id: 4
    name: status
    type: status
    options:
      - value: Todo
      - value: Doing
      - value: Done
    default: Todo
  - id: 5
    name: done
    type: checkbox
    default: false
  - id: 6
    name: priority
    type: single-select
    options:
      - Low
      - Medium
      - High
    default: Medium
  - id: 7
    name: created_by
    type: created-by
  # Whose task it is. The Tasks page lists the signed-in rep's open ones.
  - id: 8
    name: owner
    type: user
    allowMultiple: false
  # The person the task is about, so a contact's drawer shows their next step.
  - id: 9
    name: contact
    type: relationship
    relatedTable: contacts
    relationType: many-to-one
    displayField: name

aiAccess:
  description: >-
    Follow-up tasks linked to deals. Use this when the user asks about to-dos,
    due dates, overdue work, or task status.
  operations:
    - read
    - list
    - create
    - update
  fieldExposure: permissioned

# Every signed-in rep reads and edits tasks; only an admin deletes one.
permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
    - member
  delete:
    - admin
