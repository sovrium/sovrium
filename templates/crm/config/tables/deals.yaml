id: 3
name: deals
fields:
  - id: 1
    name: name
    type: single-line-text
    required: true
  - id: 2
    name: company
    type: relationship
    relatedTable: companies
    relationType: many-to-one
    # What a human should see instead of the foreign key, and what the picker
    # searches on.
    displayField: name
    # A deal often arrives before its company is in the CRM. With this on, the
    # picker offers to create the company from what was typed and links it in
    # one step, instead of sending the salesperson to another table first.
    allowCreate: true
  - id: 3
    name: stage
    type: single-select
    options:
      - Prospect
      - Qualified
      - Proposal
      - Negotiation
      - Won
      - Lost
    default: Prospect
  - id: 4
    name: value
    type: currency
    currency: EUR
    thousandsSeparator: space
    precision: 0
  - id: 5
    name: probability
    type: percentage
    precision: 0
    min: 0
    max: 100
  - id: 6
    name: close_date
    type: date
  - id: 7
    name: priority
    type: rating
    max: 3
  - id: 8
    name: created_at
    type: created-at
  # Who carries the deal. The pipeline shows it on the card, and "my tasks"
  # reads the same kind of field on tasks.
  - id: 9
    name: owner
    type: user
    allowMultiple: false
  # The person on the buyer's side. It is what lets a contact's drawer list the
  # deals they are part of.
  - id: 10
    name: contact
    type: relationship
    relatedTable: contacts
    relationType: many-to-one
    displayField: name
  # "Stalled" when an open deal is past its expected close date. Computed each
  # time the deal is saved, so moving the close date or the stage clears it.
  - id: 11
    name: health
    type: formula
    formula: "CASE WHEN stage NOT IN ('Won', 'Lost') AND close_date < CURRENT_DATE THEN 'Stalled' ELSE '' END"
    resultType: string
  # The value the pipeline can count on: the deal's value times its chance of
  # closing. Summed on the Pipeline page as the weighted forecast.
  - id: 12
    name: weighted_value
    type: formula
    formula: value * probability / 100
    resultType: number
    format: currency
    currency: EUR
    precision: 0
    thousandsSeparator: space

aiAccess:
  description: >-
    The sales pipeline. Use this when the user asks about deals, stages,
    pipeline value, probabilities, or close dates.
  operations:
    - read
    - list
    - create
    - update
  fieldExposure: permissioned

# Every signed-in rep reads and moves deals; only an admin deletes one. A rep
# who tries is answered 404, the same answer as for a deal that does not exist.
permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
    - member
  delete:
    - admin
