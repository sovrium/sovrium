# Email and password sign-in, closed to strangers.
#
# A CRM holds a company's customers, so nobody signs themselves up: the first
# administrator comes from `AUTH_ADMIN_EMAIL` / `AUTH_ADMIN_PASSWORD` on the
# first start (see `.env.example`), and everyone else is added by an admin with
# `sovrium admin create <email>`. The demo accounts come from `seed/users.yaml`.
#
# Two roles cover a small sales team: `member` for a rep, who reads everything
# and creates or edits records, and `admin` for the founder or sales lead, who
# may also delete them. Each table's `permissions` block says which is which.
allowSignUp: false
defaultRole: member
strategies:
  - type: emailAndPassword
    minPasswordLength: 8
