# The Add task dialog on Tasks opens this form.
#
# A form placed on an app page with `formRef` writes its table row and no
# entry in the Submissions inbox: that inbox is for intake forms, and adding
# a record from inside the app is ordinary work, not an intake.
id: 1
name: add-task
title: Add task
access:
  require: authenticated
  redirectTo: /sign-in
submitTo:
  table: tasks
display:
  submitLabel: Add task
# The page reloads on the new record, as the list or board it lands on
# reads it on load.
onSuccess:
  type: redirect
  url: /tasks
  delaySeconds: 0
fields:
  - kind: table-field
    column: title
  - kind: table-field
    column: deal
  - kind: table-field
    column: contact
  - kind: table-field
    column: due_date
  - kind: table-field
    column: priority
  - kind: table-field
    column: owner
