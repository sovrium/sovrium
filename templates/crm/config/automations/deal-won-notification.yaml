# When a deal moves to Won, tell the sales inbox. The filter step checks the new
# stage, so a drag on the pipeline board and an edit anywhere else both count.
# Change `to` to your own inbox; it needs SMTP configured (see .env.example).
name: deal-won-notification
label: Deal won — notify the team
description: Email the sales inbox whenever a deal reaches the Won stage.
enabled: true
trigger:
  type: record
  table: deals
  events:
    - update
  watchFields:
    - stage
actions:
  - name: onlyWhenWon
    type: filter
    operator: continue
    props:
      condition:
        logic: and
        conditions:
          - field: '{{trigger.data.record.stage}}'
            operator: equals
            value: Won
      onFalse: stop
  - name: emailTeam
    type: email
    operator: send
    props:
      to: sales@example.com
      subject: 'Deal won: {{trigger.data.record.name}}'
      body: |
        <p><strong>{{trigger.data.record.name}}</strong> was marked Won.</p>
        <p>Value: €{{trigger.data.record.value}}</p>
