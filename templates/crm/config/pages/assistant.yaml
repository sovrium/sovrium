# The records assistant: ask it which deals went quiet, then have it add the
# follow-up. It works on the four tables through its own permissions (see
# config/agents/records-assistant.yaml) and needs an AI provider — without
# `AI_PROVIDER` the rest of the CRM runs and this page says what to set.
name: assistant
path: /assistant
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Assistant · Kestrel CRM
  description: Ask about deals, contacts and tasks, and act on the answer.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Assistant
              - type: text
                element: span
                props:
                  className: font-mono text-xs text-foreground-subtle
                content: Reads and edits deals, contacts, companies and tasks
          - type: container
            props:
              className: mx-auto flex w-full max-w-[760px] flex-1 flex-col px-5 pb-5 pt-4
            children:
              - type: ai-chat
                agent: records-assistant
                placeholder: Ask about deals, contacts or tasks
                showHistory: true
                chatHeight: 520
