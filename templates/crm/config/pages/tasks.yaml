# What the team owes, by date. The calendar carries every task; the list beside
# it answers "what do I do now" for whoever is signed in.
name: tasks
path: /tasks
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Tasks · Kestrel CRM
  description: Follow-ups by date, and the ones you owe next.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Tasks
              - type: container
                props:
                  className: grow
              - type: button
                content: Add task
                props:
                  className: h-7 px-3 text-[13px]
                  interactions:
                    click:
                      modal: add-task-dialog
          - type: dialog
            props:
              id: add-task-dialog
              title: Add task
              description: Link it to a deal so it shows on the deal too.
            children:
              - type: form
                dataSource:
                  table: tasks
                fields:
                  - field: title
                  - field: deal
                  - field: contact
                  - field: due_date
                  - field: priority
                  - field: owner
                action:
                  type: crud
                  operation: create
                  table: tasks
                  submitLabel: Add task
                  onSuccess:
                    navigate: /tasks
                    toast:
                      message: Task added
                      variant: success
          - type: container
            props:
              className: flex items-start gap-4 px-5 pb-5 pt-4 max-lg:flex-col
            children:
              - type: container
                props:
                  className: min-w-0 grow
                children:
                  - type: calendar
                    dataSource:
                      table: tasks
                    dateField: due_date
                    labelField: title
                    defaultView: month
              # The rep's own open tasks, oldest due date first, so an overdue one
              # is always on top. `$currentUser.id` is resolved on the server for
              # whoever is signed in, so each rep sees their own list.
              - type: container
                element: section
                props:
                  className: flex w-[300px] flex-none flex-col gap-2 max-lg:w-full
                  aria-label: My tasks
                children:
                  - type: text
                    element: h2
                    props:
                      className: font-mono text-[11px] font-medium uppercase tracking-wider text-foreground-subtle
                    content: My tasks
                  - type: list
                    dataSource:
                      table: tasks
                      filter:
                        - { field: owner, operator: eq, value: $currentUser.id }
                        - { field: done, operator: eq, value: false }
                      sort:
                        - { field: due_date, direction: asc }
                      # The four nearest due dates; the calendar holds the rest.
                      limit: 4
                    listDisplay:
                      itemTemplate:
                        title: $record.title
                        metadata:
                          - { field: due_date, format: short-date }
