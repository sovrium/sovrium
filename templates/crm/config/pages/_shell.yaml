# The app's persistent navigation, included at the top of every workspace page.
#
# A column holding the app's name, the `sidebar` and the signed-in account. The
# `sidebar` renders the entries as one navigation landmark of real links and
# marks the current page with `aria-current`, so "where am I" is answered for a
# screen reader too, not only by colour.
#
# Below the `md` breakpoint (a phone) the sidebar leaves the layout and a menu
# button opens the same entries in a drawer, so the pipeline gets the whole
# width of the screen.
type: container
element: aside
props:
  className: flex w-[232px] flex-none flex-col gap-0.5 border-r border-border bg-background-subtle px-2.5 py-3 max-md:contents
children:
  - type: container
    props:
      className: mb-2.5 flex h-9 items-center gap-2.5 px-2 text-sm font-semibold text-foreground max-md:hidden
    children:
      - type: icon
        props:
          name: kanban
          size: 14
          className: box-content rounded-sm bg-primary p-1 text-primary-foreground
      - type: text
        element: span
        content: Kestrel CRM
  - type: sidebar
    drawer:
      below: md
      label: Menu
    # Sidebar clicks swap only the main region; revisited views open from cache.
    clientSideNavigation: true
    props:
      className: flex min-h-0 flex-col gap-0.5 md:flex-1
    # Row metrics tuned to a five-entry navigation: 32px rows, 13.5px labels,
    # and the current page on the accent's quiet ground. Each key names a part
    # the sidebar draws, so the look survives a change to its markup.
    classes:
      parts:
        link: h-8 gap-2.5 rounded-md px-2.5 text-[13.5px] leading-[var(--text-md--line-height)] text-foreground-muted
        groupLabel: px-2.5 pt-0 pb-1.5 font-mono text-[10.5px] leading-[14px] tracking-wider
      states:
        current:
          link: bg-primary-subtle font-medium text-primary-subtle-foreground
    groups:
      - landmark: Workspace
        items:
          # Each count reads the records endpoint of the page it links to: the
          # deals still in play, every contact and company, the tasks not done.
          - label: Pipeline
            href: /
            icon: kanban
            badge:
              endpoint: /api/tables/deals/records?limit=1&view=open_deals
              valuePath: pagination.total
          - label: Contacts
            href: /contacts
            icon: users
            badge:
              endpoint: /api/tables/contacts/records?limit=1
              valuePath: pagination.total
          - label: Companies
            href: /companies
            icon: building-2
            badge:
              endpoint: /api/tables/companies/records?limit=1
              valuePath: pagination.total
          - label: Tasks
            href: /tasks
            icon: square-check
            badge:
              endpoint: /api/tables/tasks/records?limit=1&filter=status:Todo
              valuePath: pagination.total
      - label: Tools
        landmark: Workspace
        headingLevel: 2
        items:
          - { label: Assistant, href: /assistant, icon: sparkles }
  - type: container
    props:
      className: mt-auto flex items-center justify-end gap-2.5 border-t border-border px-2 py-2.5 text-sm text-foreground-muted max-md:hidden
    children:
      - type: button
        variant: ghost
        props:
          className: h-7 px-2 text-xs
        content: Sign out
        action:
          type: auth
          method: logout
          onSuccess:
            navigate: /sign-in
