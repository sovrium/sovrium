# The accounts. Opening one lists its people and its deals, so a rep sees the
# whole relationship before a call.
name: companies
path: /companies
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Companies · Kestrel CRM
  description: Your accounts, with their people and their deals.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Companies
          - type: container
            props:
              className: flex flex-col gap-4 px-5 pb-5 pt-4
            children:
              - type: table
                dataSource:
                  table: companies
                  view: companies_directory
                columns:
                  - { field: name, label: Company, sortable: true }
                  - { field: industry, label: Industry, filterable: true }
                  - { field: size, label: Size }
                  - { field: website, label: Website }
                  - { field: annual_revenue, label: Annual revenue, format: currency, align: right }
                search:
                  enabled: true
                  placeholder: Search companies
                toolbar:
                  search: true
                  filters: true
                  export: true
                pagination:
                  pageSize: 25
                onRowClick:
                  action: openDrawer
                  component: company-detail
                emptyMessage: No companies yet. Add an account, then link its people to it.
              - type: drawer
                id: company-detail
                drawerSide: right
                drawerSize: md
                canEdit: false
                dataSource:
                  table: companies
                props:
                  title: Company
                recordFields:
                  - { name: name, type: single-line-text, label: Company }
                  - { name: industry, type: single-select, label: Industry }
                  - { name: size, type: single-select, label: Size }
                  - { name: website, type: url, label: Website }
                  - { name: annual_revenue, type: currency, label: Annual revenue }
                related:
                  - label: People
                    table: contacts
                    field: company
                    columns:
                      - { field: name, label: Name }
                      - { field: title, label: Title }
                    sort:
                      - { field: name, direction: asc }
                    emptyMessage: No contact at this company yet.
                  - label: Deals
                    table: deals
                    field: company
                    columns:
                      - { field: name, label: Deal }
                      - { field: stage, label: Stage }
                      - { field: value, label: Value }
                    emptyMessage: No deal with this company yet.
