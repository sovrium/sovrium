name: kestrel-crm
version: 3.0.0
description: >-
  A sales CRM for a small team: a pipeline board with the figures a sales lead
  asks for, contacts and companies that open in place, tasks by date, and an
  assistant that reads and edits the records.

auth:
  $ref: ./config/auth.yaml

design:
  $ref: ./config/design.yaml

tables:
  - $ref: ./config/tables/companies.yaml
  - $ref: ./config/tables/contacts.yaml
  - $ref: ./config/tables/deals.yaml
  - $ref: ./config/tables/tasks.yaml

# The records assistant on /assistant. It needs an AI provider at runtime
# (AI_PROVIDER, for example ollama for a local model); validating the config
# does not.
agents:
  - $ref: ./config/agents/records-assistant.yaml

# Automations run on the server, with their history kept in your own database.
automations:
  - $ref: ./config/automations/deal-won-notification.yaml

# Listed in the order of the sidebar: the pipeline is the home page.
pages:
  - $ref: ./config/pages/pipeline.yaml
  - $ref: ./config/pages/contacts.yaml
  - $ref: ./config/pages/companies.yaml
  - $ref: ./config/pages/tasks.yaml
  - $ref: ./config/pages/assistant.yaml
  - $ref: ./config/pages/sign-in.yaml

# A small "Built with Sovrium" line after each page's content rather than a
# floating pill, so it never sits over the last row of a grid.
badge:
  placement: footer
