name: kestrel-crm
version: 3.0.0
description: >-
  A sales CRM for a small team: a pipeline board with the figures a sales lead
  asks for, contacts and companies that open in place, tasks by date, and an
  assistant that reads and edits the records.

auth:
  $ref: ./config/auth.yaml

# Optional: a Slack bot token turns on the new-deal post to your sales channel
# (library/recipe/record-to-slack.yaml), and a HubSpot token copies each contact
# added from the Contacts page into HubSpot (library/recipe/form-to-hubspot.yaml;
# a contact here has one name, sent as HubSpot's first name). Without them the
# app runs as before and those automations simply cannot reach either service.
env:
  - key: SLACK_BOT_TOKEN
    description: Bot token of your Slack app, for the new-deal post to the sales channel.
    required: false
  - key: HUBSPOT_ACCESS_TOKEN
    description: Private app token of your HubSpot account, to copy each contact added here.
    required: false

design:
  $ref: ./config/design.yaml

tables:
  - $ref: ./config/tables/companies.yaml
  - $ref: ./config/tables/contacts.yaml
  - $ref: ./config/tables/deals.yaml
  - $ref: ./config/tables/tasks.yaml

# The records assistant on /assistant. It needs an AI provider at runtime
# (AI_PROVIDER, for example ollama for a local model); validating the config
# does not.
agents:
  - $ref: ./config/agents/records-assistant.yaml

# Automations run on the server, with their history kept in your own database.
automations:
  - $ref: ./config/automations/deal-won-notification.yaml
  - $ref: ./library/recipe/record-to-slack.yaml
  - $ref: ./library/recipe/form-to-hubspot.yaml

# The forms the app's "Add" dialogs open, each placed with `formRef`.
forms:
  - $ref: ./config/forms/add-task.yaml
  - $ref: ./config/forms/add-deal.yaml
  - $ref: ./config/forms/add-contact.yaml

# Listed in the order of the sidebar: the pipeline is the home page.
pages:
  - $ref: ./config/pages/pipeline.yaml
  - $ref: ./config/pages/contacts.yaml
  - $ref: ./config/pages/companies.yaml
  - $ref: ./config/pages/tasks.yaml
  - $ref: ./config/pages/assistant.yaml
  - $ref: ./config/pages/sign-in.yaml

# A small "Built with Sovrium" line after each page's content rather than a
# floating pill, so it never sits over the last row of a grid.
badge:
  placement: footer

connections:
  - $ref: ./library/connection/slack.yaml
  - $ref: ./library/connection/hubspot.yaml
