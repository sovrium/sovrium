# Company OS theming — deep navy.
#
# The file used to carry `baseline: extend` and nothing else, so the largest
# template in the tree — eight tables, three automations, seven pages —
# rendered in the same achromatic baseline as the smallest. Deep navy is
# assigned centrally: it reads as institutional software rather than as a
# consumer product, which is what an all-in-one back office should look like,
# and it sits far enough from the knowledge base's sky blue that the two are
# not mistaken for each other in the gallery.
#
# WHY THESE KEY NAMES
#   `theme.colors` accepts any kebab-case key, but only the keys in
#   `COLOR_TO_SV_TOKEN` (src/infrastructure/css/theme/theme-generators.ts) emit
#   the `--sv-*` platform tokens every prestyled island consumes. Everything
#   else emits `--color-*` and does nothing until something cites it — and this
#   template cites nothing, because it carries no inline styles at all. Every
#   surface it shows is a prestyled island: data tables on five pages, an agent
#   chat, a sign-in form. So an off-map key here would be pure decoration in a
#   file nobody reads.
#
#   The mapping is not identity, and the traps are worth naming:
#   `background-raised` → `bg-raised`, `background-overlay` → `bg-overlay`,
#   `ring` → `focus-ring`, `success` → `success-solid`. `foreground-muted` → `fg-muted`,
#   which the baseline registers as `--color-muted-foreground`, so the
#   `text-muted-foreground` utility resolves from it without a second key.
#
# WHY THERE IS NO `muted` KEY
#   `muted` and `background-subtle` BOTH map to `--sv-bg-subtle`, and the
#   compiler emits one `--sv-*` line per authored key in declaration order — so
#   declaring both means the later one silently overwrites the earlier, and the
#   config gives no hint which. Only `background-subtle` is declared. Nothing is
#   lost: the baseline registers `--color-muted: var(--sv-bg-subtle)`, so the
#   `bg-muted` utility still resolves, now unambiguously.
#
#
# WHY `background-raised` / `background-overlay` AND NOT `card` / `popover`
#   The two pairs map to the SAME role tokens (`--sv-bg-raised`,
#   `--sv-bg-overlay`), so this is not a behaviour change — but `card`, `popover`
#   and `muted` are listed in `COLORS_NEEDING_FOREGROUND`, which auto-derives a
#   `<key>-foreground: #ffffff` companion whenever the base key is declared
#   without one. On a white card that companion is white text on white. Worse,
#   the derivation runs over the LIGHT block only and is never mirrored into
#   `darkColors`, so it is a light-surface guess that silently persists into
#   dark mode. The `background-*` spellings carry no such companion.
#
# WHY `primary-foreground` IS SPELLED OUT IN BOTH BLOCKS
#   `primary` IS in `COLORS_NEEDING_FOREGROUND`, so omitting it derives
#   `#ffffff` — correct here in light mode, and wrong in dark, where `primary`
#   lightens and white-on-light is unreadable. The derived companion is not
#   mirrored into `darkColors`, so the only way to get a legible on-primary ink
#   in both schemes is to name it twice, which is what happens below.
# THE SEMANTIC TRIO IS CLAIMED DELIBERATELY
#   Four of the eight tables carry a `status` field, and `success` / `warning` /
#   `error` are what a Won deal, a pending time-off request and a rejected one
#   read as. That is consequence, not decoration — the case ADR-024 reserves
#   colour for.
#
#   Note the per-option `color:` hexes in `config/tables/*.yaml` are a DIFFERENT
#   channel and are left alone: those are record data (the chip colour of one
#   select option), not chrome, and they are authored per option rather than per
#   role. Rewriting them as `var(--color-*)` would collapse five distinct
#   pipeline stages onto three semantic tokens and lose the distinction the
#   board is drawn to show.
#
# NO `fonts` BLOCK
#   Only IBM Plex Sans Variable and JetBrains Mono Variable ship self-hosted.
#   Naming any other family emits `font-family: X, …` with no matching
#   `@font-face`, dropping the page onto the OS default and locking the shipped
#   face out of its own stack. Distinctiveness here comes from colour, not type.
baseline: extend

colors:
  primary: '#1e3a8a'
  primary-hover: '#1e40af'
  primary-foreground: '#ffffff'
  primary-subtle: '#dbeafe'
  ring: '#3b5bdb'
  background: '#ffffff'
  background-subtle: '#f6f8fc'
  foreground: '#0b1220'
  foreground-muted: '#475372'
  foreground-subtle: '#78829c'
  background-raised: '#ffffff'
  background-overlay: '#ffffff'
  border: '#dde3ef'
  success: '#047857'
  warning: '#b45309'
  error: '#be123c'

# Rendered only when the app declares `theme.colorScheme` or ships a
# `theme-toggle`; the stylesheet carries it either way, under
# `html:is(.dark, [data-theme='dark'])`. `primary` lightens sharply here: navy
# on a near-black background is unreadable, so dark mode borrows the lighter end
# of the same hue rather than the brand value.
darkColors:
  primary: '#93b4fd'
  primary-hover: '#bfd4fe'
  primary-foreground: '#080c15'
  primary-subtle: '#16244a'
  ring: '#60a5fa'
  background: '#080c15'
  background-subtle: '#101725'
  foreground: '#e6ebf5'
  foreground-muted: '#a7b2ca'
  foreground-subtle: '#7d879f'
  background-raised: '#101725'
  background-overlay: '#101725'
  border: '#212c42'
  success: '#34d399'
  warning: '#fbbf24'
  error: '#fb7185'

borderRadius:
  sm: 0.25rem
  md: 0.5rem
  lg: 0.75rem
  full: 9999px
