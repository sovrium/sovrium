# The Add deal dialog, shared by Home and the Pipeline, opens this form.
#
# A form placed on an app page with `formRef` writes its table row and no
# entry in the Submissions inbox: that inbox is for intake forms, and adding
# a record from inside the app is ordinary work, not an intake.
id: 1
name: add-deal
title: Add deal
access:
  require: authenticated
  redirectTo: /sign-in
submitTo:
  table: deals
display:
  submitLabel: Add deal
# The page reloads on the new record, as the list or board it lands on
# reads it on load.
onSuccess:
  type: redirect
  url: /sales
  delaySeconds: 0
fields:
  - kind: table-field
    column: name
    label: Deal
  - kind: table-field
    column: company
    label: Client
  - kind: table-field
    column: stage
    label: Stage
  - kind: table-field
    column: value
    label: Value
  - kind: table-field
    column: close_date
    label: Expected close
  - kind: table-field
    column: owner
    label: Owner
