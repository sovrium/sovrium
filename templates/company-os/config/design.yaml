# Orrin OS — the design system of this app.
#
# `baseline: extend` keeps Sovrium's built-in design system and changes only
# what is declared here. Type stays on the two faces the platform already
# self-hosts (IBM Plex Sans and JetBrains Mono): no family is pulled from a
# font CDN, which would leak every visitor's address to a third party.
#
# This app puts four modules in one place — sales, delivery, support and the
# team — and the design's first job is to keep them looking like ONE product:
# one accent for every module (never one colour per module), one density, one
# radius. The accent is a navy held at low chroma, so it stays calm across a
# screen full of figures.
#
# Colour otherwise means an outcome, and it means the same outcome in every
# module: a deal won, a task done, a ticket resolved, a request approved; a
# close date passed or a request waiting on a decision; a deal lost, an overdue
# task, an urgent ticket still open.
baseline: extend

# Follow the operating system's light or dark preference. `darkColors` below is
# what the dark scheme paints; without `colorScheme` it would never render.
colorScheme: system

# Role keys repaint the prestyled components (boards, grids, charts, buttons,
# badges) with no class changes anywhere else in the config.
#
# Every role is spelled out in BOTH schemes. `primary` and friends derive a
# white `-foreground` companion in the light scheme only, which reads wrong on
# a pale dark-mode accent — so the dark block names every companion itself.
# `primary-active` is declared too: left out, a pressed button would fall back
# to the platform's achromatic default for a frame.
colors:
  primary: oklch(0.52 0.12 260)
  primary-hover: oklch(0.46 0.112 260)
  primary-active: oklch(0.42 0.105 260)
  primary-foreground: oklch(0.985 0.003 260)
  primary-subtle: oklch(0.95 0.03 260)
  primary-subtle-foreground: oklch(0.38 0.09 260)
  ring: oklch(0.6 0.12 260)
  background: oklch(0.985 0.003 260)
  background-subtle: oklch(0.967 0.005 260)
  background-raised: oklch(1 0 0)
  background-overlay: oklch(1 0 0)
  background-inset: oklch(0.925 0.008 260)
  foreground: oklch(0.21 0.008 260)
  foreground-muted: oklch(0.45 0.012 260)
  foreground-subtle: oklch(0.51 0.012 260)
  foreground-disabled: oklch(0.71 0.012 260)
  foreground-inverse: oklch(0.985 0.003 260)
  border: oklch(0.925 0.008 260)
  success: oklch(0.52 0.12 155)
  warning: oklch(0.5 0.12 75)
  error: oklch(0.53 0.17 25)
  destructive-foreground: oklch(0.985 0.003 260)

darkColors:
  primary: oklch(0.78 0.09 260)
  primary-hover: oklch(0.83 0.068 260)
  primary-active: oklch(0.87 0.053 260)
  primary-foreground: oklch(0.16 0.006 260)
  primary-subtle: oklch(0.28 0.045 260)
  primary-subtle-foreground: oklch(0.9 0.045 260)
  ring: oklch(0.72 0.098 260)
  background: oklch(0.16 0.006 260)
  background-subtle: oklch(0.19 0.007 260)
  background-raised: oklch(0.21 0.008 260)
  background-overlay: oklch(0.23 0.008 260)
  background-inset: oklch(0.13 0.005 260)
  foreground: oklch(0.95 0.005 260)
  foreground-muted: oklch(0.75 0.01 260)
  foreground-subtle: oklch(0.68 0.012 260)
  foreground-disabled: oklch(0.45 0.01 260)
  foreground-inverse: oklch(0.16 0.006 260)
  border: oklch(0.3 0.01 260)
  success: oklch(0.75 0.12 155)
  warning: oklch(0.8 0.12 75)
  error: oklch(0.72 0.14 25)
  destructive-foreground: oklch(0.16 0.006 260)

# What each colour is for. Writing the usage down is what stops the accent from
# becoming a module's colour, and a status colour from becoming decoration.
colorRoles:
  primary:
    usage: The one accent, shared by every module. Primary action fill, the current nav entry, the focus ring, the first chart series, today on the calendar. Never a module's colour and never a status.
    pairsWith: primary-foreground
  primary-subtle:
    usage: Selected and current states on quiet surfaces — the current page, the record opened in a drawer.
    pairsWith: primary-subtle-foreground
  success:
    usage: A deal Won, a task Done, a ticket Resolved, a request Approved — the outcome each module calls finished.
    pairsWith: foreground
  warning:
    usage: A close date passed on an open deal, a request waiting on a decision.
    pairsWith: foreground
  error:
    usage: A deal Lost, an overdue task, an Urgent ticket still open, a failed save, a destructive action.
    pairsWith: foreground

# A calm type ladder: body text at 14px, headings close to it, and the
# monospace face for amounts, dates and counts so a column of figures lines up.
typeScale:
  families:
    sans:
      family: "'IBM Plex Sans Variable', 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
    mono:
      family: "'JetBrains Mono Variable', 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
  steps:
    display: { size: 2rem, lineHeight: 1.1, weight: 600, letterSpacing: -0.02em }
    h1: { size: 1.375rem, lineHeight: 1.2, weight: 600, letterSpacing: -0.01em }
    h2: { size: 1.0625rem, lineHeight: 1.3, weight: 600 }
    h3: { size: 0.875rem, lineHeight: 1.35, weight: 600 }
    lead: { size: 0.9375rem, lineHeight: 1.5 }
    body: { size: 0.875rem, lineHeight: 1.5 }
    bodySmall: { size: 0.8125rem, lineHeight: 1.45 }
    caption: { size: 0.75rem, lineHeight: 1.4 }
    overline: { size: 0.6875rem, lineHeight: 1.3, weight: 500, letterSpacing: 0.04em, font: mono }

# Standard corners: small enough to keep a dense grid crisp, round enough that a
# card reads as something you can pick up and move.
radius:
  sm: 0.25rem
  md: 0.5rem
  lg: 0.75rem
  full: 9999px

# Cards carry a one-pixel lift; overlays float clearly above the page.
elevation:
  none: none
  sm: 0 1px 2px rgb(20 20 30 / 0.06)
  md: 0 4px 12px rgb(20 20 30 / 0.08)
  lg: 0 12px 32px rgb(20 20 30 / 0.14)

# The person running the company reads four modules on one screen, so rows are
# tight: the compact step. The three steps are the platform's own values,
# written out so one number can be tuned.
density:
  default: compact
  steps:
    compact: { rowY: 5px, controlH: 36px, buttonH: 28px, gap: 7px, text: 11px }
    cozy: { rowY: 8px, controlH: 40px, buttonH: 32px, gap: 10px, text: 13px }
    roomy: { rowY: 14px, controlH: 44px, buttonH: 36px, gap: 16px, text: 14px }

# How the app speaks. Nothing reads these at runtime; they are the brief anyone
# writing a label, an empty state or an error message for this app follows.
voice:
  personality:
    - composed
    - direct
    - cross-functional
  pronoun: you
  prefer:
    - 'Lead a button with its verb: Add deal, Open project, Approve.'
    - Name the client by name in every module, never by a number.
    - Every empty state names the one next action.
  avoid:
    - No exclamation marks, no "all-in-one" boasting on the page itself.
    - Never a module's internal jargon on another module's page.
    - No ids in place of names — not a client number, not a project number.
  tone:
    empty: Say what this module will hold, then the one action that fills it.
    loading: Name what is loading — the pipeline, the projects — never a bare spinner.
    error: State what did not save and the one thing that fixes it; keep what the person typed.
    success: Confirm in past tense with the record's name and what moved in the other modules.
    destructive: Name the record, the modules it appears in and whether it comes back.

principles:
  - One client, one name, seen the same way from every module.
  - The home answers "what needs me" across modules before "how are we doing".
  - Colour means an outcome — won, done, resolved, approved, late, lost — in every module the same way.
  - Modules are grouped in the navigation, never flattened into one row of links.
