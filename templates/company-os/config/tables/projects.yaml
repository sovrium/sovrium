# Delivery: one row per project, for a client, with an owner and dates. A won
# deal opens one here by itself, for the same client.
id: 4
name: projects
fields:
  - id: 1
    name: name
    type: single-line-text
    required: true
  - id: 2
    name: client
    type: relationship
    relatedTable: companies
    relationType: many-to-one
    displayField: name
  # Done is the one outcome; the other states are a neutral grey.
  - id: 3
    name: status
    type: status
    options:
      - value: Planned
        color: '#6F737A'
      - value: Active
        color: '#6F737A'
      - value: On hold
        color: '#6F737A'
      - value: Done
        color: '#187C49'
    default: Planned
  - id: 4
    name: start_date
    type: date
  - id: 5
    name: end_date
    type: date
  - id: 6
    name: owner
    type: user
    allowMultiple: false
  - id: 7
    name: created_at
    type: created-at
  # How far along the project is, drawn as a thin bar in the grid.
  - id: 8
    name: progress
    type: progress

# The list the Projects page reads, newest first: the project a won deal just
# opened is on top.
views:
  - id: delivery_portfolio
    name: Portfolio
    sorts:
      - { field: start_date, direction: desc }

aiAccess:
  description: >-
    Delivery projects for clients. Use this when the user asks what is being
    delivered, for whom, by whom and by when.
  operations:
    - read
    - list
    - create
    - update
  fieldExposure: permissioned

permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
    - member
  delete:
    - admin
