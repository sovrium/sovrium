# One assistant across every module: ask about a client and get its deals,
# projects and tickets in one answer, then have it act. It works through its
# own permissions (see config/agents/ops-assistant.yaml) and needs an AI
# provider — without `AI_PROVIDER` the rest of the app runs and this page says
# what to set.
name: assistant
path: /assistant
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: Assistant · Orrin OS
  description: Ask one question across sales, delivery, support and the team.
components:
  - type: container
    props:
      className: flex h-screen overflow-hidden bg-background text-foreground max-md:flex-col
    children:
      - $ref: ./_shell.yaml
      - type: container
        element: main
        props:
          className: flex min-w-0 flex-1 flex-col overflow-y-auto
        children:
          - type: container
            props:
              className: flex h-12 flex-none items-center gap-3 border-b border-border bg-background px-5
            children:
              - type: text
                element: h1
                props:
                  className: text-[15px] font-semibold text-foreground
                content: Assistant
              - type: text
                element: span
                props:
                  className: font-mono text-xs text-foreground-subtle
                content: Reads every module; edits clients, deals, projects and tickets
          - type: container
            props:
              className: mx-auto flex w-full max-w-[760px] flex-1 flex-col px-5 pb-5 pt-4
            children:
              - type: ai-chat
                agent: ops-assistant
                placeholder: Ask about a client, a project or a ticket
                showHistory: true
                chatHeight: 520
