# A new time-off request asks the admins for a decision. The run pauses on the
# approval step; once an admin approves, the next step marks the request
# Approved. On a rejection or after seven days without an answer the run
# stops, and the request stays Pending on the People page until someone
# decides.
name: approve-time-off
label: Time off — ask for approval
description: Ask an admin to approve each new time-off request, then mark it Approved.
enabled: true
trigger:
  type: record
  table: time_off_requests
  events:
    - create
actions:
  - name: askAdmins
    type: approval
    operator: request
    props:
      approvers: all-admins
      message: >-
        Time off requested from {{trigger.data.record.start_date}} to
        {{trigger.data.record.end_date}}. Approve?
      timeout: 7d
      onTimeout: reject
  - name: markApproved
    type: record
    operator: update
    props:
      table: time_off_requests
      filter:
        conditions:
          - field: id
            operator: equals
            value: '{{trigger.data.record.id}}'
      data:
        status: Approved
