# A new time-off request asks the admins for a decision. The run pauses on the
# approval step; `onReject: continue` resumes it whatever the answer, and the
# step records which in `decision`. Approved, the request is marked Approved;
# rejected, or left seven days without an answer, it is marked Rejected. Both
# writes only touch a request still Pending, so a decision already written on
# the People page stands.
name: approve-time-off
label: Time off — ask for approval
description: Ask an admin to decide each new time-off request, then mark it Approved or Rejected.
enabled: true
trigger:
  type: record
  table: time_off_requests
  events:
    - create
actions:
  - name: askAdmins
    type: approval
    operator: request
    props:
      approvers: all-admins
      message: >-
        Time off requested from {{trigger.data.record.start_date}} to
        {{trigger.data.record.end_date}}. Approve?
      timeout: 7d
      onTimeout: reject
      onReject: continue
  - name: recordDecision
    type: path
    operator: branch
    props:
      mode: first-match
      paths:
        - name: approved
          condition:
            conditions:
              - field: '{{askAdmins.decision}}'
                operator: equals
                value: approved
          actions:
            - name: markApproved
              type: record
              operator: update
              props:
                table: time_off_requests
                filter:
                  logic: and
                  conditions:
                    - field: id
                      operator: equals
                      value: '{{trigger.data.record.id}}'
                    - field: status
                      operator: equals
                      value: Pending
                data:
                  status: Approved
        - name: rejected
          actions:
            - name: markRejected
              type: record
              operator: update
              props:
                table: time_off_requests
                filter:
                  logic: and
                  conditions:
                    - field: id
                      operator: equals
                      value: '{{trigger.data.record.id}}'
                    - field: status
                      operator: equals
                      value: Pending
                data:
                  status: Rejected
