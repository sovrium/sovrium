# The internal roster on /people. Admin-only to write, which is why the seed
# exists at all: a member signing in to look at the demo cannot populate this
# table themselves.
#
# All four departments are used, weighted the way a services business actually
# staffs — engineering largest, operations smallest.
#
# `start_date` is a `date`, and these run from three years back to next month.
# The future one matters: `time_off_requests.yaml` has nothing for that person,
# which is what a not-yet-started employee should look like.
records:
  - key: priya
    fields:
      name: Priya Raghunathan
      email: priya.raghunathan@example.com
      job_title: Head of Operations
      department: Operations
      start_date: '{{today-1140d}}'

