# Task-level detail under the projects. Fourteen rows across five of the six
# projects, weighted towards the two Active ones — an even spread would suggest
# a dormant project has as much live work as a running one.
#
# Task status tracks project status honestly: everything under Fernbank (Done)
# is Done, the On hold project's remaining work sits in To do, and the two
# Active projects carry a genuine mix. A seed set where a finished project still
# has open tasks is the kind of small inconsistency that makes a demo feel fake.
#
# `assignee` is a `user` field, left unset for the same reason as `owner` in
# `projects.yaml`: no user account exists at seed time.
#
# `due_date` straddles today, so the delivery view shows overdue, imminent and
# upcoming work rather than one flat cluster.
records:
  - key: lumen-field-mapping
    fields:
      title: Map legacy spreadsheet columns to table fields
      project: '@projects.lumen-migration'
      status: Done
      due_date: '{{today-3d}}'

  - key: lumen-import-dry-run
    fields:
      title: Dry-run the import against a copy of production
      project: '@projects.lumen-migration'
      status: In progress
      due_date: '{{today+2d}}'

  - key: lumen-cutover-plan
    fields:
      title: Agree the cutover window with Inès
      project: '@projects.lumen-migration'
      status: To do
      due_date: '{{today+9d}}'

  - key: lumen-handover-docs
    fields:
      title: Write the handover notes for the Lumen team
      project: '@projects.lumen-migration'
      status: To do
      due_date: '{{today+28d}}'

  - key: helios-curriculum
