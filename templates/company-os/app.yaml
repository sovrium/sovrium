# Orrin OS — a small company's sales, delivery, support and team in one config.
#
# The four modules share one database and one list of clients: a won deal
# opens its delivery project for the same client, a ticket names the client's
# contact, and one assistant answers across all of it. This is the file you
# diff, fork and redeploy — no per-module licence, no integration glue.
name: orrin-os
version: 2.0.0
description: >-
  A small company's operations in one app: a sales pipeline, delivery projects
  and their tasks, support tickets, the team and its time off, all around one
  list of clients, with one assistant across every module.

auth:
  $ref: ./config/auth.yaml

design:
  $ref: ./config/design.yaml

tables:
  # Sales
  - $ref: ./config/tables/companies.yaml
  - $ref: ./config/tables/contacts.yaml
  - $ref: ./config/tables/deals.yaml
  # Delivery
  - $ref: ./config/tables/projects.yaml
  - $ref: ./config/tables/project_tasks.yaml
  # Support
  - $ref: ./config/tables/tickets.yaml
  # People
  - $ref: ./config/tables/employees.yaml
  - $ref: ./config/tables/time_off_requests.yaml

# The assistant on /assistant. It needs an AI provider at runtime
# (AI_PROVIDER, for example ollama for a local model); validating the config
# does not.
agents:
  - $ref: ./config/agents/ops-assistant.yaml

# Automations run on the server, with their history kept in your own database.
# Each one reaches across modules: that is the point of one config.
automations:
  - $ref: ./config/automations/open-project-on-won-deal.yaml
  - $ref: ./config/automations/notify-contact-on-resolved-ticket.yaml
  - $ref: ./config/automations/approve-time-off.yaml

# Listed in the order of the sidebar: Home first, then one module at a time.
pages:
  - $ref: ./config/pages/home.yaml
  - $ref: ./config/pages/sales.yaml
  - $ref: ./config/pages/companies.yaml
  - $ref: ./config/pages/delivery.yaml
  - $ref: ./config/pages/support.yaml
  - $ref: ./config/pages/people.yaml
  - $ref: ./config/pages/assistant.yaml
  - $ref: ./config/pages/sign-in.yaml

# A small "Built with Sovrium" line after each page's content rather than a
# floating pill, so it never sits over the last row of a grid.
badge:
  placement: footer
