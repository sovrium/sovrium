# The four subjects a document is filed under. An assistant reads them to
# group or narrow its answer; it cannot invent new ones.
name: tags
fields:
  - id: 1
    name: name
    type: single-line-text
    required: true
  - id: 2
    name: color
    type: single-select
    options:
      - gray
      - blue
      - green
      - red
  - id: 3
    name: created_at
    type: created-at

# Every role reads the tags; only an admin changes the list.
permissions:
  read: authenticated
  create: [admin]
  update: [admin]
  delete: [admin]
  # Every role reads the colour too; without this line a `viewer` would read
  # the name only.
  fields:
    - field: color
      read: authenticated

# Read-only to an assistant: a taxonomy is decided by people.
aiAccess:
  description: >-
    The subjects documents are filed under: Runbooks, Decisions, Incidents and
    Onboarding. Read them to group or narrow an answer.
  operations:
    - list
    - read
