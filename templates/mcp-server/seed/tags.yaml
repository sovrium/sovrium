# The four subjects of the knowledge base.
#
# `key` is file-local — it exists so `documents.yaml` can name a tag before this
# row has a database id, and it is never written to a column. `sovrium seed`
# orders tables parent-first from the links between them, so file order on
# disk does not matter.
#
# `created_at` is absent: the engine stamps it on insert.
#
# `tags` sets no field list for the model, so `mcp-server-example_tags_list`
# returns every field the caller's role may read — `color` included.
records:
  - key: runbooks
    fields:
      name: Runbooks
      color: blue

  - key: decisions
    fields:
      name: Decisions
      color: green

  - key: incidents
    fields:
      name: Incidents
      color: red

  - key: onboarding
    fields:
      name: Onboarding
      color: gray
