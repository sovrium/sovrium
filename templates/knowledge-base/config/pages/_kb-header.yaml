# The bar above every handbook page: the handbook's name, the search box, the
# assistant and sign-out.
#
# On a markdown page the FIRST component renders above the article and the
# rest below it, so this bar is always the first entry of `components`.
#
# Below `lg` the sections sit behind the layout's menu button, which the
# reading frame lifts into this bar, left of the handbook's name.
#
# The reading frame below it (the sidebar, the article, the outline and the
# callouts) is measured and styled by part in `_reading-frame.yaml`, which both
# handbook pages share.
#
# The search asks the server as the reader types (`index: session`), and the
# server answers only with the pages that reader may open: a member never sees
# the managers' articles in the results, and nothing is written to a public
# index file.
type: container
element: header
props:
  className: sticky top-0 z-30 border-b border-border bg-background
children:
  - type: container
    props:
      className: flex h-14 items-center gap-4 px-6 max-md:h-[52px] max-md:gap-2 max-md:pr-2.5 max-lg:pl-12
    children:
      - type: link
        props:
          href: /kb
          className: flex items-center gap-2.5 whitespace-nowrap text-sm font-semibold text-foreground
        children:
          - type: icon
            props:
              name: book-open
              size: 14
              className: box-content rounded-sm bg-primary p-1 text-primary-foreground
          - type: text
            element: span
            content: Corvel handbook
      - type: search-input
        scope: page
        index: session
        placeholder: Search the handbook
        props:
          aria-label: Search the handbook
          className: w-[280px] max-md:hidden
      - type: container
        props:
          className: grow
      - type: link
        props:
          href: /assistant
          className: inline-flex h-8 items-center gap-1.5 rounded-md px-2.5 text-sm text-foreground-muted hover:bg-background-subtle hover:text-foreground
        children:
          - type: icon
            props:
              name: message-circle
              size: 14
          - type: text
            element: span
            props:
              className: max-md:sr-only
            content: Ask the handbook
      - type: button
        variant: ghost
        props:
          className: h-8 px-2.5 text-sm
        content: Sign out
        action:
          type: auth
          method: logout
          onSuccess:
            navigate: /
