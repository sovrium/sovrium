# The handbook: one page definition, one route per markdown file under
# `content/kb/`.
#
# The sidebar is built from the files themselves — grouped by their
# `category`, ordered by their `order` — and previous / next at the foot of an
# article follow the sidebar, across sections. `start.md` is the `index`:
# it is what `/kb` answers, the handbook's start page.
#
# Everyone signed in reads it; a visitor is sent to sign in, and neither the
# search, the sitemap nor `/llms.txt` lists a gated article.
name: kb
path: /kb/:path*
access:
  require: authenticated
  redirectTo: /sign-in

contentDir:
  directory: content/kb
  # `content/kb/policies/expense-policy.md` is served at
  # `/kb/policies/expense-policy`: the folder is the section in the URL.
  slugFrom: filepath
  index: start
  sort:
    field: order
    direction: asc
  nav:
    enabled: true
    groupBy: category
    labelFrom: title
    # The folder-style keys in each article's `category`, and how the
    # sidebar and the breadcrumb spell them.
    groupLabels:
      getting-started: Getting started
      it: IT
      policies: Policies

markdown:
  $ref: ./_reading-frame.yaml

# The first component renders above the article, the rest below it.
components:
  - $ref: ./_kb-header.yaml
  - $ref: ./_managers-nav.yaml

meta:
  title: $frontmatter.title · Corvel handbook
  description: How Corvel works, written down — onboarding, IT and the policies we keep.
