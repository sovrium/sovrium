# When finance marks a claim Reimbursed, write the day it was repaid, so the
# person who filed it reads when the money went out.
name: mark-reimbursed
label: Expense — date the repayment
description: Write today's date on a claim the moment it is marked Reimbursed.
enabled: true
trigger:
  type: record
  table: expenses
  events:
    - update
  watchFields:
    - status
  condition:
    conditions:
      - field: '{{trigger.data.record.status}}'
        operator: equals
        value: Reimbursed
actions:
  - name: dateRepayment
    type: record
    operator: update
    props:
      table: expenses
      filter:
        conditions:
          - field: id
            operator: equals
            value: '{{trigger.data.record.id}}'
      data:
        reimbursed_at: '{{today}}'
