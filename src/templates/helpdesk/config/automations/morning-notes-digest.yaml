# Weekday mornings at 08:30, the notes collected since the last digest
# (collect-ticket-notes.yaml) go to the team's inbox in one email: one line per
# note, with the ticket it sits on and who wrote it.
#
# Releasing empties the bucket, so a morning the server was down loses nothing:
# the next run carries every note since. A morning with no new note sends
# nothing — the filter stops the run as a success, not a failure.
# Replace support@example.com with your own team's address.
name: morning-notes-digest
label: Weekday mornings — email the notes digest
description: Every weekday at 08:30, email the team one digest of the internal notes written since the last one.
enabled: true
trigger:
  type: cron
  expression: '30 8 * * 1-5'
  timezone: Europe/Paris
actions:
  - name: drain
    type: digest
    operator: release
    props:
      digestKey: ticket-notes
      limit: 100
  - name: onlyWhenNotes
    type: filter
    operator: continue
    props:
      condition:
        conditions:
          - field: '{{drain.items}}'
            operator: isNotEmpty
      onFalse: stop
  - name: emailTeam
    type: email
    operator: send
    props:
      to: support@example.com
      subject: 'Notes on tickets: {{count drain.items}} new'
      body: |
        <p>The internal notes written on tickets since the last digest:</p>
        <p>{{join drain.items "<br>"}}</p>
        <p>Open a ticket from All tickets to read its notes in full.</p>
