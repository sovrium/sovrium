# sovrium-library: block/vertical-nav-grouped@0.30.0
name: vertical-nav-grouped
type: container
props:
  className: w-full px-4 py-6 sm:px-10 sm:py-8
children:
  - type: sidebar
    props:
      className: w-64 rounded-lg border border-border bg-card
    groups:
      - label: Workspace
        items:
          - label: Overview
            href: /
            icon: house
          - label: Projects
            href: /projects
            icon: folder
            badge: '12'
            activeMatch: prefix
          - label: Worklist
            href: /worklist
            icon: list-checks
            activeMatch: prefix
      - label: Reports
        items:
          - label: Metrics
            href: /metrics
            icon: chart-column
