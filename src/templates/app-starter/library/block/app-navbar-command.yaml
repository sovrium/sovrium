# sovrium-library: block/app-navbar-command@0.38.0
# sovrium-library-params: ctaHref=%2Fworklist&ctaLabel=New%20project
name: app-navbar-command
type: container
element: header
props:
  className: border-b border-border bg-background px-4 sm:px-6
children:
  - type: flex
    props:
      className: flex h-14 items-center justify-between gap-4
    children:
      - type: breadcrumb
        separator: ›
        breadcrumbItems:
          - label: Workspace
            href: /
          - label: Invoices
      - type: flex
        props:
          className: flex items-center gap-4
        children:
          - type: flex
            props:
              className: flex hidden items-center gap-2 md:flex
            children:
              - type: text
                element: span
                props:
                  className: text-sm text-muted-foreground
                content: Search
              - type: kbd
                keys:
                  - ⌘
                  - K
          - type: link
            props:
              href: /worklist
              className: inline-flex shrink-0 items-center justify-center gap-1.5 rounded-lg border border-transparent bg-clip-padding text-sm font-medium whitespace-nowrap no-underline transition-all outline-none select-none hover:no-underline focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 bg-primary text-primary-foreground hover:bg-primary/80 hover:text-primary-foreground h-8 px-2.5
            content: New project
