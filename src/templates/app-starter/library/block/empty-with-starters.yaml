# sovrium-library: block/empty-with-starters@0.37.0
# sovrium-library-params: description=Pick%20a%20starting%20point.%20You%20can%20change%20everything%20afterwards.&scratchHref=%2Fworklist&scratchLabel=Start%20from%20scratch&title=Start%20your%20first%20project
name: empty-with-starters
type: container
props:
  className: w-full px-4 py-6 sm:px-10 sm:py-8
children:
  - type: flex
    props:
      className: flex flex-col max-w-2xl gap-2
    children:
      - type: text
        element: h2
        props:
          className: text-xl font-semibold text-foreground
        content: Start your first project
      - type: text
        element: p
        props:
          className: text-md text-muted-foreground
        content: Pick a starting point. You can change everything afterwards.
  - type: grid
    props:
      className: grid grid-cols-1 mt-6 max-w-4xl gap-3 sm:grid-cols-3
    children:
      - type: link
        props:
          href: /kit/clients/1
          className: flex flex-col gap-2 rounded-lg border border-border bg-card p-5 text-foreground hover:border-border-strong hover:bg-muted
        children:
          - type: icon
            props:
              name: users
              size: 20
          - type: text
            element: span
            props:
              className: mt-2 text-md font-semibold text-foreground
            content: From a client
          - type: text
            element: span
            props:
              className: text-sm text-muted-foreground
            content: Start from what you already know about them.
      - type: link
        props:
          href: /worklist
          className: flex flex-col gap-2 rounded-lg border border-border bg-card p-5 text-foreground hover:border-border-strong hover:bg-muted
        children:
          - type: icon
            props:
              name: list-checks
              size: 20
          - type: text
            element: span
            props:
              className: mt-2 text-md font-semibold text-foreground
            content: From the worklist
          - type: text
            element: span
            props:
              className: text-sm text-muted-foreground
            content: 'Turn open tasks into a project.'
      - type: link
        props:
          href: /metrics
          className: flex flex-col gap-2 rounded-lg border border-border bg-card p-5 text-foreground hover:border-border-strong hover:bg-muted
        children:
          - type: icon
            props:
              name: chart-column
              size: 20
          - type: text
            element: span
            props:
              className: mt-2 text-md font-semibold text-foreground
            content: From the numbers
          - type: text
            element: span
            props:
              className: text-sm text-muted-foreground
            content: 'See where time and budget went first.'
  - type: container
    props:
      className: mt-6
    children:
      - type: link
        props:
          href: /worklist
          className: inline-flex items-center gap-1.5 text-md font-medium text-foreground underline-offset-4 hover:underline
        children:
          - type: text
            element: span
            content: Start from scratch
          - type: icon
            props:
              name: arrow-right
              size: 16
