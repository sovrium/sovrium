# The team directory a member list reads, kept apart from the sign-in accounts
# so it can hold people who never sign in.
id: 5
name: people
fields:
  - { id: 1, name: name, type: single-line-text }
  - { id: 2, name: role, type: single-line-text }
  - { id: 3, name: status, type: single-line-text }
  - { id: 4, name: photo, type: url }
  - { id: 5, name: email, type: email }
permissions:
  read: authenticated
  create: authenticated
