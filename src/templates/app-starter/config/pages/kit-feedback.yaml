name: kit-feedback
path: /kit/feedback
access:
  require: authenticated
  redirectTo: /sign-in
meta:
  title: 'Feedback blocks · App starter'
  description: 'Alerts, empty states, progress, confirmations and paging.'
  favicon: ./favicon.svg
components:
  - $ref: ./_nav.yaml
  - type: container
    element: section
    props:
      className: mx-auto flex w-full max-w-360 flex-col gap-1 px-4 pt-6 sm:px-8 sm:pt-8
    children:
      - type: text
        element: h1
        props:
          className: text-2xl font-semibold tracking-tight text-foreground
        content: 'Feedback blocks'
      - type: text
        element: p
        props:
          className: text-md text-muted-foreground
        content: 'Alerts, empty states, progress, confirmations and paging, each one block of the library.'
  - component: alert-inline
  - component: alert-validation-summary
  # The fields the summary above points at. Each link names a field by its id,
  # so following one moves focus to the control that needs fixing.
  - type: container
    element: section
    props:
      aria-label: 'Client details'
      className: w-full max-w-3xl px-4 pb-6 sm:px-10 sm:pb-8
    children:
      - type: flex
        props:
          className: flex flex-col gap-4
        children:
          - type: field
            fieldLabel: 'Legal name'
            fieldError: 'Legal name is required'
            required: true
            children:
              - { type: input, props: { id: legal-name, name: legal_name } }
          - type: field
            fieldLabel: 'VAT number'
            fieldError: 'VAT number must start with a country code'
            children:
              - { type: input, props: { id: vat-number, name: vat_number, value: '12345678901' } }
          - type: field
            fieldLabel: 'Payment terms (days)'
            fieldError: 'Payment terms must be between 0 and 90 days'
            children:
              - {
                  type: input,
                  inputType: number,
                  props: { id: payment-terms, name: payment_terms, value: '120' },
                }
  - component: empty-basic
  - component: empty-with-starters
  - component: progress-bar
  - component: steps-horizontal
  - component: toast-confirm
  - component: modal-confirm-destructive
  - component: pagination-numbered
  - component: pagination-simple
