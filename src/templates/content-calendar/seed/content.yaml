# Loomwork's content: fifteen pieces from a published retrospective to two
# ideas without a date. Four went out earlier this month, four are scheduled,
# two wait for the lead in Review, three are drafts and one of them is late.
#
# Every date is relative to the day the seed runs, so the demo never ages;
# `--today <YYYY-MM-DD>` pins them to one day. A relative date carries no time
# of day, so the hour a piece goes out is written as words in `time_label`.
# Ideas have no date, which keeps them off the calendar.
#
# `channels` is every channel a piece goes out on; `channel` is the first of
# them, the one the calendar colours it by. `owner` names a seeded account.
# The screen recording carries its thumbnail from `seed/assets/`, the same
# file among its attachments, and its name beside it for the drawer.
records:
  - key: year
    fields:
      title: 'What we shipped this year, and what we did not'
      content_type: Blog post
      channels: [Website, Email]
      channel: Website
      status: Published
      publish_at: '{{today-21d}}'
      owner: '@user:tomas.ruiz@loomwork.example'
      campaign: '@campaigns.retrospective'
      brief: 'An honest ledger, including the two things we cut. The cut list is the part people share.'
  - key: migrating
    fields:
      title: 'Migrating 40,000 rows off a spreadsheet'
      content_type: Blog post
      channels: [Website, LinkedIn]
      channel: Website
      status: Published
      publish_at: '{{today-14d}}'
      owner: '@user:nadia.brandt@loomwork.example'
      campaign: '@campaigns.education'
      brief: 'One real migration, step by step, with the three columns that did not map cleanly.'
  - key: shortcuts
    fields:
      title: 'Weekly tip: keyboard shortcuts in the grid'
      content_type: Social post
      channels: [LinkedIn, X]
      channel: LinkedIn
      status: Published
      publish_at: '{{today-9d}}'
      owner: '@user:nadia.brandt@loomwork.example'
      campaign: '@campaigns.education'
      brief: 'Five shortcuts, one short clip each. No more than one line of text per shortcut.'
  - key: live
    fields:
      title: 'The new workspace is live'
      content_type: Newsletter
      channels: [Email, Website]
      channel: Email
      status: Published
      publish_at: '{{today-7d}}'
      owner: '@user:tomas.ruiz@loomwork.example'
      campaign: '@campaigns.launch'
      brief: 'What changed, why, and the one link to try it. Sent to everyone on the beta list.'
  - key: highlights
    fields:
      title: 'Office-hours highlights, cut to 90 seconds'
      content_type: Social post
      channels: [Instagram, LinkedIn]
      channel: Instagram
      status: Draft
      publish_at: '{{today-2d}}'
      time_label: '11:00'
      owner: '@user:nadia.brandt@loomwork.example'
      campaign: '@campaigns.conference'
      brief: 'The three best questions from office hours, one per clip, captions on.'
  - key: comment
    fields:
      title: 'Weekly tip: comment on any record'
      content_type: Social post
      channels: [LinkedIn]
      channel: LinkedIn
      status: Scheduled
      publish_at: '{{today}}'
      time_label: '09:00'
      owner: '@user:nadia.brandt@loomwork.example'
      campaign: '@campaigns.education'
      brief: 'One screenshot of a thread on a record, and the sentence that explains why it beats email.'
  - key: install
    fields:
      title: 'Install in four minutes (screen recording)'
      content_type: Video
      channels: [YouTube, Website]
      channel: YouTube
      status: Scheduled
      publish_at: '{{today+1d}}'
      time_label: '10:00'
      owner: '@user:tomas.ruiz@loomwork.example'
      campaign: '@campaigns.launch'
      brief: 'No narration — captions only, so it works muted in a feed. Start on the empty terminal, end on the running app. Under four minutes or it is not the promise.'
      thumbnail: '@asset:thumbnail-install.png'
      assets: ['@asset:thumbnail-install.png']
      asset_names: thumbnail-install.png
  - key: cfp
    fields:
      title: 'Speak at the annual conference — CFP is open'
      content_type: Social post
      channels: [LinkedIn, X]
      channel: LinkedIn
      status: Scheduled
      publish_at: '{{today+4d}}'
      time_label: '09:30'
      owner: '@user:nadia.brandt@loomwork.example'
      campaign: '@campaigns.conference'
      brief: 'The deadline, the three tracks, and one line on what a good talk looks like.'
  - key: views
    fields:
      title: 'Weekly tip: saved views beat filters you retype'
      content_type: Social post
      channels: [LinkedIn]
      channel: LinkedIn
      status: Scheduled
      publish_at: '{{today+7d}}'
      time_label: '09:00'
      owner: '@user:nadia.brandt@loomwork.example'
      campaign: '@campaigns.education'
      brief: 'Before and after: the same filter typed five times, then one saved view.'
  - key: agenda
    fields:
      title: 'The full conference agenda'
      content_type: Newsletter
      channels: [Email]
      channel: Email
      status: Review
      publish_at: '{{today+8d}}'
      time_label: '08:00'
      owner: '@user:tomas.ruiz@loomwork.example'
      campaign: '@campaigns.conference'
      brief: 'Every talk with its speaker and room. Link each title to its abstract.'
  - key: selfhost
    fields:
      title: 'Self-hosting without a platform team'
      content_type: Blog post
      channels: [Website, LinkedIn]
      channel: Website
      status: Review
      publish_at: '{{today+14d}}'
      owner: '@user:nadia.brandt@loomwork.example'
      campaign: '@campaigns.education'
      brief: 'What it takes to run it yourself, in plain words: one server, backups, updates.'
  - key: free
    fields:
      title: 'Why the engine is free and the hosting is not'
      content_type: Blog post
      channels: [Website]
      channel: Website
      status: Draft
      publish_at: '{{today+20d}}'
      owner: '@user:tomas.ruiz@loomwork.example'
      campaign: '@campaigns.launch'
      brief: 'The model in four paragraphs. No pricing table; link to the page that has one.'
  - key: cardinal
    fields:
      title: 'How Cardinal Freight replaced six spreadsheets'
      content_type: Podcast
      channels: [YouTube, Website]
      channel: YouTube
      status: Draft
      publish_at: '{{today+27d}}'
      owner: '@user:nadia.brandt@loomwork.example'
      campaign: '@campaigns.education'
