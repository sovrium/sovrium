# Fieldday's autumn: four open events from today to late October, one being
# prepared, and two that already happened. The Design Review Jam is full.
#
# Every date is relative to the day the seed runs, so the demo never ages;
# `--today <YYYY-MM-DD>` pins them to one day. A relative date carries no time
# of day, so each event's hours are written as words in `time_label` and its
# end is the midnight after it.
#
# Seeding runs no automation, so each event's `seats_taken` and `on_waitlist`
# are written here to match seed/registrations.yaml; from then on the
# recount-seats automation keeps them current.
records:
  - key: office-hours
    fields:
      name: Open Office Hours
      description: An hour online with the team. Bring a question about your own app, or just watch.
      starts_at: '{{today}}'
      ends_at: '{{today+1d}}'
      time_label: 17:00 – 18:00
      place: Online
      capacity: 60
      status: Open
      seats_taken: 38
      on_waitlist: 0
  - key: workshop
    fields:
      name: Migration Workshop
      description: Bring a real spreadsheet. By the end of the afternoon it is an app your team can use — we pair you with someone who has done it.
      starts_at: '{{today+6d}}'
      ends_at: '{{today+7d}}'
      time_label: 14:00 – 17:30
      place: Station F, Paris
      capacity: 90
      status: Open
      seats_taken: 83
      on_waitlist: 0
  - key: jam
    fields:
      name: Design Review Jam
      description: A day of short reviews. Show a screen you are unsure about and leave with three concrete changes.
      starts_at: '{{today+13d}}'
      ends_at: '{{today+14d}}'
      time_label: 10:00 – 16:00
      place: Atelier Nord, Lille
      capacity: 45
      status: Open
      seats_taken: 45
      on_waitlist: 3
  - key: meetup
    fields:
      name: Community Meetup
      description: Three short talks from teams running their own apps, then drinks.
      starts_at: '{{today+27d}}'
      ends_at: '{{today+28d}}'
      time_label: 18:30 – 21:00
      place: La Halle, Nantes
      capacity: 120
      status: Open
      seats_taken: 42
      on_waitlist: 0
  - key: conference
    fields:
      name: Annual Conference
      description: The whole community for a day. The programme is being written.
      starts_at: '{{today+41d}}'
      ends_at: '{{today+42d}}'
      time_label: 09:00 – 18:00
      place: Palais des Congrès, Bordeaux
      capacity: 600
      status: Draft
      seats_taken: 0
      on_waitlist: 0
  - key: clinic
    fields:
      name: Onboarding Clinic
      description: New to Fieldday tools? An hour to set up your first table with someone beside you.
      starts_at: '{{today-13d}}'
      ends_at: '{{today-12d}}'
      time_label: 12:30 – 13:30
      place: Online
      capacity: 40
      status: Past
      seats_taken: 36
      on_waitlist: 0
  - key: breakfast
    fields:
      name: Partner Breakfast
      description: Coffee with the partners who build on Fieldday, and what they need next.
      starts_at: '{{today-6d}}'
      ends_at: '{{today-5d}}'
      time_label: 08:30 – 10:00
      place: Le Comptoir, Lyon
      capacity: 25
      status: Past
      seats_taken: 22
      on_waitlist: 0
