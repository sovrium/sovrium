# Ten tasks of one engineering team, linked to their projects by the projects
# file's keys: eight open, two done.
#
# `@projects.<key>` resolves to the id the projects file's row was written with,
# and `@user:<email>` to the account `users.yaml` creates. Both resolve within
# one `sovrium seed` run only — the token itself is never stored.
#
# `due_date` is relative to the day the seed runs, so the backlog never ages
# into a wall of overdue work; `--today 2026-09-24` pins it to that day. The
# dates straddle today on purpose: one open task is three days late, so the
# call `?filter=done:false&sort=due_date:asc` puts it first.
#
# Every open task has someone holding it. All four priorities and both `done`
# states appear, so one page of JSON shows the whole shape of the table.
records:
  - key: atlas-sandbox-creds
    fields:
      title: Chase the vendor for sandbox credentials
      description: Third request. Escalate to the account manager if nothing lands this week — Atlas cannot be integration-tested without it.
      project: '@projects.atlas'
      priority: Critical
      done: false
      due_date: '{{today-3d}}'
      assigned_to: '@user:samir.haddad@taskapi.example'

  - key: atlas-ledger-migration
    fields:
      title: Write the stock-ledger migration
      description: Backfill six years of movements into the new schema. Needs a dry run against a production copy before it goes anywhere near the real database.
      project: '@projects.atlas'
      priority: High
      done: false
      due_date: '{{today+11d}}'
      assigned_to: '@user:samir.haddad@taskapi.example'

  - key: atlas-cutover-plan
    fields:
      title: Draft the cutover plan
      description: Freeze window, rollback trigger, who is on call. One page, agreed by both teams.
      project: '@projects.atlas'
      priority: Medium
      done: false
      due_date: '{{today+25d}}'
      assigned_to: '@user:nora.lindqvist@taskapi.example'

  - key: beacon-invoice-endpoint
    fields:
      title: Specify the invoice endpoint
      description: Shape of the response, pagination, and what a customer is allowed to see about their own account. Blocks the front-end estimate.
      project: '@projects.beacon'
      priority: High
      done: false
      due_date: '{{today+4d}}'
      assigned_to: '@user:nora.lindqvist@taskapi.example'

  - key: beacon-design-signoff
    fields:
      title: Collect design sign-off
      description: Portal screens approved by support and by legal.
      project: '@projects.beacon'
      priority: Medium
      done: true
      due_date: '{{today-16d}}'
      assigned_to: '@user:nora.lindqvist@taskapi.example'

  - key: relay-rate-card-parser
    fields:
      title: Parse the third carrier's rate card
      description: They publish a fixed-width text file with a header that changes shape by region. Ask whether an API exists before writing a parser for it.
      project: '@projects.relay'
      priority: High
      done: false
      due_date: '{{today+2d}}'
      assigned_to: '@user:samir.haddad@taskapi.example'

  - key: relay-retry-policy
    fields:
      title: Agree a retry policy for carrier timeouts
      description: Two carriers time out under load and we currently retry forever. Cap it and surface the failure.
      project: '@projects.relay'
      priority: Medium
      done: false
      due_date: '{{today+18d}}'
      assigned_to: '@user:samir.haddad@taskapi.example'

  - key: relay-webhook-signing
    fields:
      title: Verify inbound webhook signatures
      description: Shipped for carriers one and two. The third follows once its rate card parses.
      project: '@projects.relay'
      priority: Critical
      done: false
      due_date: '{{today+9d}}'
      assigned_to: '@user:nora.lindqvist@taskapi.example'

  - key: harbour-variance-report
    fields:
      title: Publish the variance report
      description: Signed and circulated. Archived with the audit pack.
      project: '@projects.harbour'
      priority: Low
      done: true
      due_date: '{{today-48d}}'
      assigned_to: '@user:samir.haddad@taskapi.example'

  - key: kestrel-hardware-writeoff
    fields:
      title: Write off the pilot handhelds
      description: Eleven units, supplier discontinued the model. Finance needs the asset numbers before quarter end.
      project: '@projects.kestrel'
      priority: Low
      done: false
      due_date: '{{today+37d}}'
      assigned_to: '@user:nora.lindqvist@taskapi.example'
