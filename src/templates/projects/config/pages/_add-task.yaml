# The "Add task" dialog, shared by every page whose bar carries the button, so
# the fields, their order and the success step never drift between pages.
#
# A new task starts in To do (the status field's default) and lands on the
# Board, which is where the reader goes next. A field left empty is simply not
# sent, so a task may be added before its project or person is known.
type: dialog
props:
  id: add-task-dialog
  title: Add task
  description: Give it a person and a date so it shows on the timeline and the calendar.
formRef: add-task
