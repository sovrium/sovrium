# One row per project: its status, the person who leads it, its dates, how far
# along it is and what it may spend. The Dashboard reads its figures from here.
id: 1
name: projects
fields:
  - id: 1
    name: name
    type: single-line-text
    required: true
  # Only Done is an outcome, so only Done carries a colour; the other three are
  # states of work and stay neutral.
  - id: 2
    name: status
    type: status
    options:
      - value: Planned
      - value: Active
      - value: On hold
      - value: Done
        color: '#15803D'
    default: Planned
  - id: 3
    name: start_date
    type: date
  - id: 4
    name: end_date
    type: date
  # The project lead. A `user` field points at a sign-in account, so the grid
  # prints the person's name and a filter can match the signed-in person.
  - id: 5
    name: owner
    type: user
    allowMultiple: false
  - id: 6
    name: progress
    type: progress
  - id: 7
    name: budget
    type: currency
    currency: EUR
    thousandsSeparator: space
    precision: 0
  - id: 8
    name: created_at
    type: created-at

# The portfolio in the order it runs, oldest start first. The Dashboard's grid
# reads through this view, which also makes it read-only: a project is created
# from the New project dialog and edited where it lives, not typed into a cell.
views:
  - id: portfolio
    name: Portfolio
    sorts:
      - { field: start_date, direction: asc }

# Everyone signed in reads and edits projects; only an admin deletes one. A
# member who tries is answered 404, the same answer as for a project that does
# not exist.
permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
    - member
  delete:
    - admin
