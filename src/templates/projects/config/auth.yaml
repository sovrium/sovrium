# Email and password sign-in, closed to strangers.
#
# A team's plans are its own, so nobody signs themselves up: the first
# administrator comes from `AUTH_ADMIN_EMAIL` / `AUTH_ADMIN_PASSWORD` on the
# first start (see `.env.example`), and everyone else is added by an admin with
# `sovrium admin create <email>`. The demo accounts come from `seed/users.yaml`.
#
# Two roles cover a small team: `member` for someone who works their tasks —
# reads everything, creates and edits projects and tasks — and `admin` for the
# project lead, who may also delete them. Each table's `permissions` block says
# which is which.
allowSignUp: false
defaultRole: member
strategies:
  - type: emailAndPassword
    minPasswordLength: 8
