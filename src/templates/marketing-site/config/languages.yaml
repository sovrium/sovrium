# English and French. The words that change with the language live here, each
# under a key, and the pages and blocks cite them as `$t:<key>`. `/en/…` and
# `/fr/…` serve a page in that language, and an address without a prefix in
# the visitor's own: their earlier choice, then their browser, then English.
#
# The square-bracketed values are placeholders in both languages. Replace them
# with your own words, one language at a time.
default: en
supported:
  - code: en
    locale: en-GB
    label: English
    direction: ltr
  - code: fr
    locale: fr-FR
    label: Français
    direction: ltr
fallback: en
detectBrowser: true
persistSelection: true
