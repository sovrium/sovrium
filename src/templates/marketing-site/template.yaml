title: 'Marketing site'
tagline: |
  A marketing website built from every marketing block of the library.
intro: |
  Marketing site — a website made entirely of the library's marketing blocks: a home page, a
  features page, a product tour, pricing, an about page, a blog and a single article, a
  long-form guide, a contact page and two pages for lost visitors. Every piece of copy in square brackets is a placeholder to replace
  with your own.
glance:
  - |-
    **Tables** (4): posts (the blog sections read it), orders (the live figures read it, through a
    public view), messages (the contact form writes it; only the owner reads it),
    subscribers (the newsletter form writes it; only the owner reads it)
  - '**Forms** (2): contact and newsletter — the contact and newsletter blocks post to them'
  - '**Languages**: English and French, keys in `config/languages.yaml`, cited as `$t:<key>`'
  - '**Auth**: one owner from `AUTH_ADMIN_*`, no sign-up'
  - '**Pages** (11): home (`/`), features, product, pricing, about, blog, article, guide, contact, moved, 404'
  - |-
    **Library blocks** (39): under `library/block/`, each starting with a `sovrium-library:`
    line naming the entry and version it was installed from
  - '**Seed data**: `seed/` — four blog posts and a few orders'
  - '**Static assets**: `public/` (served at the site root)'
glanceClose: |
  Config is pre-split: `app.yaml` is the entry point and `$ref`s the files under `config/`
  and `library/`.
assistant: |
  Run `sovrium skills` in this directory to write the Agent Skills for the Sovrium version you
  run into `.claude/skills/`; start from `sovrium-app` for any change to the config. Replace
  the bracketed copy block by block, and remove the blocks a page does not need — `sovrium
  library list` shows the others you can add.
whatsInside: |
  Eleven pages, each a stack of blocks from the Sovrium library — heroes, logo walls, feature
  grids, figures, testimonials, pricing tables, FAQs, team, blog lists, a long read with its
  outline, contact forms, a newsletter sign-up and two pages for lost visitors. Each file
  under [`library/block/`](./library/block) starts with the line naming the block and the
  version it came from.

  Copy in square brackets — `[Product]`, `[Primary action]` — is a placeholder: replace it
  with your own words, and delete the blocks a page does not need. The blog sections read the
  `posts` table and the live figures read `orders`; point them at your own tables with
  `sovrium library add block/<name> --set table=<yours>`.

  The site speaks English and French. Every word that changes with the language is a key in
  [`config/languages.yaml`](./config/languages.yaml), and the blocks cite it as `$t:<key>`:
  `/en/…` and `/fr/…` serve a page in that language, and the switcher in the header opens the
  same page in the other one. The home hero, the pricing page, the headers and the footers
  are translated; add a key and its two values to translate the rest.

  The contact forms post to the `contact` form in [`config/forms/`](./config/forms), which
  writes each message to the `messages` table. Only the owner reads it: sign in at `/login`
  with the `AUTH_ADMIN_EMAIL` and `AUTH_ADMIN_PASSWORD` you set, then open the admin. The
  newsletter blocks post to the `newsletter` form the same way, into a `subscribers` table.
env: []
