title: 'Docs'
tagline: |
  A documentation website from markdown files: a sidebar in sections, an outline, last-updated dates, an edit link and highlighted code.
intro: |
  Docs — a documentation website whose every page is a markdown file in the repository. A
  landing page with the one command that starts it and three ways in; behind it the
  documentation itself: a sidebar of sections, the page with its outline, the date it was last
  updated, a link to edit its source, previous and next across sections, typed callouts and
  highlighted code. Every page is public; there is no database content and no sign-in.
glance:
  - |-
    **Pages** (3): docs (`/docs/:path*`, one route per file under `content/docs/`, `/docs`
    itself is `introduction.md`), home (`/`), not-found (`/404`, served for any address that
    answers nothing)
  - |-
    **Markdown content**: `content/docs/` — two sections, `getting-started` at the root and
    `guides/` in a folder of its own; each page's frontmatter carries `title`, `description`,
    `category`, `order` and `updated`. `guides/theming.md` is a draft, left out until its
    `draft: true` line is removed
  - '**Singletons**: design'
  - |-
    **Static assets**: `public/` (served at the site root; the introduction's picture is in
    `public/docs/`)
glanceClose: |
  Config is pre-split: `app.yaml` is the entry point and `$ref`s the files under `config/`.
assistant: |
  Run `sovrium skills` in this directory to write the Agent Skills for the Sovrium version you
  run into `.claude/skills/`; start from `sovrium-app` for any change to the config. A page is a
  markdown file: add one under `content/docs/` with a `category` the sidebar already knows
  (`config/pages/docs.yaml`, `groupLabels`), an `order` that places it where previous and next
  should find it, and an `updated` date. Point `contentDir.editUrl` in `config/pages/docs.yaml`
  at the real repository. The design system is in `config/design.yaml`: read its comments
  before changing a colour, keep one accent, and keep colour for what a callout means (a tip, a
  warning, a page that is not here). Start a step with its verb and show the command before
  explaining it.
whatsInside: |
  - **The landing page** (`/`) — what the site is in two sentences, the one command that
    starts it, and three ways into the documentation.
  - **The documentation** (`/docs`) — opens on the introduction. Beside every page, the
    sections; above it, a search box; in it, the outline, the date it was last updated, a link
    to edit its source, and previous / next that follow the sidebar across sections. Notes,
    tips and warnings are set apart as callouts, and code is highlighted on the server.
  - **A page that is not here** — an old address answers 404 with the way back.

  Every page is a plain markdown file under [`content/docs/`](./content/docs), versioned with
  the rest of the app. Everything else is declared in [`app.yaml`](./app.yaml) and the
  [`config/`](./config) tree — no application code. Edit a file, restart, done.
whatToTry: |
  1. Open `/` and copy the command, or follow **Read the introduction**.
  2. Open **Quick Start**: the outline beside it, the date it was last updated, **Edit this
     page**, and next — **Configuration**, in the Guides section.
  3. Add a page: remove the `draft: true` line from `content/docs/guides/theming.md` and
     restart. It appears under Guides, after Deployment.
  4. Open `/docs/configuration`, an old address: the page says so and links to where it moved.

  To add a page, write a markdown file under `content/docs/` with a `title`, a `category`, an
  `order` and an `updated` date in its frontmatter. Point "Edit this page" at your own
  repository with `editUrl` in [`config/pages/docs.yaml`](./config/pages/docs.yaml).
env:
  - name: 'SOVRIUM_SELF_SEED'
    section: 'Demo data'
    description: |-
      The nightly-reset automation resets a hosted demo at 04:07 each night, and
      only when this is set — leave it unset on an app you keep data in.
    example: 'reset'
