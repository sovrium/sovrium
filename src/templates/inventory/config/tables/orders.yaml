# Orders — what customers asked for, from draft to shipped.
#
# `lines` and `units` summarise the order for the board card; `total` is what
# it is worth. `fulfilment` marks an order that ships in more than one go.
id: 5
name: orders
fields:
  - id: 1
    name: order_number
    type: single-line-text
    required: true
  - id: 2
    name: customer
    type: single-line-text
    required: true
  - id: 3
    name: customer_email
    type: email
  # Only the two ends of an order are outcomes: Shipped and Cancelled carry a
  # colour, the working states stay neutral.
  - id: 4
    name: status
    type: status
    options:
      - value: Draft
        color: '#8a8378'
      - value: Confirmed
        color: '#8a8378'
      - value: Picking
        color: '#8a8378'
      - value: Shipped
        color: '#2f7d4f'
      - value: Cancelled
        color: '#b3261e'
    default: Draft
  - id: 6
    name: fulfilment
    type: single-select
    options:
      - Complete
      - Partial
  - id: 17
    name: lines
    type: integer
    min: 0
  - id: 18
    name: units
    type: integer
    min: 0
  # The line under the order on the board card, counted in words: "1 line",
  # "3 lines". A formula keeps the grammar in one place instead of in every
  # card that prints it.
  - id: 21
    name: card_summary
    type: formula
    formula: "CASE WHEN lines IS NULL THEN '' ELSE CAST(lines AS TEXT) || CASE WHEN lines = 1 THEN ' line' ELSE ' lines' END || ' · ' || CAST(COALESCE(units, 0) AS TEXT) || CASE WHEN units = 1 THEN ' unit' ELSE ' units' END END"
    resultType: string
  - id: 19
    name: total
    type: currency
    currency: EUR
    precision: 2
  - id: 7
    name: placed_at
    type: date
  - id: 20
    name: owner
    type: user
    allowMultiple: false
  - id: 14
    name: notes
    type: long-text
  - id: 15
    name: created_at
    type: created-at
  - id: 16
    name: updated_at
    type: updated-at

views:
  # The orders still to ship — drafted, confirmed or being picked. The
  # sidebar counts them beside Orders.
  - id: open_orders
    name: Open orders
    filters:
      and:
        - { field: status, operator: in, value: [Draft, Confirmed, Picking] }

aiAccess:
  description: >-
    Customer orders. Use this when the user asks about orders, their status,
    their value, or what shipped.
  operations:
    - read
    - list
    - create
    - update
  fieldExposure: permissioned

permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
    - member
  delete:
    - admin
