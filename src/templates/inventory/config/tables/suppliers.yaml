# Suppliers — who the catalogue is bought from.
#
# `lead_time_days` is the supplier's usual delay between a purchase order and
# its delivery. A product may override it with its own `lead_time_days` when
# one item from a supplier takes longer than the rest.
id: 1
name: suppliers
fields:
  - id: 1
    name: name
    type: single-line-text
    required: true
  - id: 2
    name: contact_email
    type: email
  - id: 3
    name: phone
    type: phone-number
  - id: 4
    name: website
    type: url
  - id: 19
    name: lead_time_days
    type: integer
    min: 0
  - id: 5
    name: notes
    type: long-text
  - id: 11
    name: created_at
    type: created-at

aiAccess:
  description: >-
    Vendors that supply the catalogue. Use this when the user asks whom to buy
    a product from, a supplier's lead time or its contact details.
  operations:
    - read
    - list
    - create
    - update
  fieldExposure: permissioned

permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
    - member
  delete:
    - admin
