# Purchase orders — what has been bought from a supplier, and whether it came.
#
# A purchase order starts in Draft (the assistant can draft one from the
# reorder list), is Sent to the supplier, and is Received once the delivery is
# booked into stock as a movement.
id: 7
name: purchase_orders
fields:
  - id: 1
    name: reference
    type: single-line-text
    required: true
  - id: 2
    name: supplier
    type: relationship
    relatedTable: suppliers
    relationType: many-to-one
    displayField: name
  - id: 3
    name: status
    type: status
    options:
      - value: Draft
        color: '#8a8378'
      - value: Sent
        color: '#8a8378'
      - value: Received
        color: '#2f7d4f'
    default: Draft
  - id: 4
    name: summary
    type: single-line-text
  - id: 5
    name: units
    type: integer
    min: 0
  - id: 6
    name: total
    type: currency
    currency: EUR
    precision: 2
  - id: 7
    name: ordered_at
    type: date
  - id: 8
    name: expected_at
    type: date
  - id: 9
    name: created_at
    type: created-at

aiAccess:
  description: >-
    Purchase orders to suppliers, in Draft, Sent or Received. Use this when the
    user asks what is on order, or asks you to draft an order to a supplier.
  operations:
    - read
    - list
    - create
    - update
  fieldExposure: permissioned

permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
    - member
  delete:
    - admin
