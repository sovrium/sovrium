# The "Add product" dialog. A new product starts Active with no stock: stock
# arrives by recording a movement, never by typing a figure. A field left empty
# is simply not sent, so a product may be added before its supplier is known.
type: dialog
props:
  id: add-product-dialog
  title: Add product
  description: Give it a unit cost and a reorder point so it is valued and flagged from its first movement.
formRef: add-product
