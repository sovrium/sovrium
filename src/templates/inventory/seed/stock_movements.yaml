# The stock ledger: every quantity that moved, signed.
#
# A receipt is positive, a pick negative; a transfer is a pair of rows under one
# reference, out of one warehouse and into the other; a count writes the
# difference it found. Each product's stock on hand is the sum of its rows, so
# the figures on the Products grid come from here and nowhere else.
#
# The opening balances come first, dated the day before the month began: what
# each warehouse held when the ledger started. The Stock page leaves them out
# and shows what happened since. Dates are relative to the day the seed runs.
records:
  - key: open-01
    fields:
      reference: OPEN-01
      product: '@products.rack-shelf'
      warehouse: '@warehouses.paris'
      type: Opening balance
      quantity: 180
      moved_at: '{{today-24d}}'
      note: Balance when the ledger started
