# The five places an asset can sit.
#
# `key` names a record inside the seed files so other files can point at it; it
# is never written to a column. "Remote" is not an address: it holds the kit of
# people who work from home, so a count of the offices still balances.
records:
  - key: paris-hq
    fields:
      name: Paris HQ
      kind: Office
      address: |-
        14 rue de la Fontaine au Roi
        75011 Paris
  - key: lyon-office
    fields:
      name: Lyon office
      kind: Office
      address: |-
        22 quai Perrache
        69002 Lyon
  - key: storeroom
    fields:
      name: Storeroom
      kind: Storeroom
      address: Paris HQ, level -1
  - key: remote
    fields:
      name: Remote
      kind: Remote
      address: At the holder's home
  - key: ateliers-remi
    fields:
      name: Ateliers Rémi
      kind: Repair shop
      address: |-
        8 avenue Jean Jaurès
        93500 Pantin
