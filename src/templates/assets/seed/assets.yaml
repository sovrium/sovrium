# The fourteen assets of Arden & Co, a design studio in Paris and Lyon.
#
# Mostly laptops and monitors, a long tail of everything else, and the states a
# real register holds: two assets away for repair, three in storage, one
# written off. Each holder is a sign-in account from `users.yaml`, named as
# `@user:<email>` — never written into the asset's name. The support phone
# passes around a rota, so it names the team in `holder_note` instead.
#
# `barcode` is `format: EAN-13`, so each code is thirteen digits and
# ends with the tag's number. Dates are relative to the day the seed runs:
# purchases age with the clock, the van's warranty always ends in eighteen
