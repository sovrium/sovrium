# The Add contact dialog on Contacts opens this form.
#
# A form placed on an app page with `formRef` writes its table row and no
# entry in the Submissions inbox: that inbox is for intake forms, and adding
# a record from inside the app is ordinary work, not an intake.
id: 3
name: add-contact
title: Add contact
access:
  require: authenticated
  redirectTo: /sign-in
submitTo:
  table: contacts
display:
  submitLabel: Add contact
# The page reloads on the new record, as the list or board it lands on
# reads it on load.
onSuccess:
  type: redirect
  url: /contacts
  delaySeconds: 0
fields:
  - kind: table-field
    column: name
  - kind: table-field
    column: email
  - kind: table-field
    column: company
  - kind: table-field
    column: title
  - kind: table-field
    column: status
