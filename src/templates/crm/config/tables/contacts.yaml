id: 2
name: contacts
fields:
  - id: 1
    name: name
    type: single-line-text
    required: true
  - id: 2
    name: email
    type: email
    required: true
    # One person, one record. A second contact with an email already on file is
    # refused, so the same buyer never splits across two records.
    unique: true
  - id: 3
    name: phone
    type: phone-number
  - id: 4
    name: avatar
    type: single-attachment
  - id: 5
    name: company
    type: relationship
    relatedTable: companies
    relationType: many-to-one
    # Show the company's name wherever the link is displayed, not its id.
    displayField: name
  - id: 6
    name: title
    type: single-line-text
  - id: 7
    name: status
    type: status
    options:
      - value: Lead
      - value: Active
      - value: Inactive
    default: Lead
  - id: 8
    name: tags
    type: multi-select
    options:
      - Decision Maker
      - Champion
      - Technical
      - Billing
      - Newsletter
  - id: 9
    name: last_contacted
    type: date
  - id: 10
    name: created_by
    type: created-by
  # The rep who looks after this person. A user field points at a sign-in
  # account, so it offers the team rather than free text.
  - id: 11
    name: owner
    type: user
    allowMultiple: false

aiAccess:
  description: >-
    People at the companies you work with. Use this when the user asks about
    contacts, leads, statuses, or who to follow up with.
  operations:
    - read
    - list
    - create
    - update
  fieldExposure: permissioned

# Every signed-in rep reads and edits contacts; only an admin deletes one.
permissions:
  read: authenticated
  create:
    - admin
    - member
  update:
    - admin
    - member
  delete:
    - admin
