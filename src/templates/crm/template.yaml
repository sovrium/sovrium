title: 'Kestrel CRM'
tagline: |
  A sales CRM for a small team: pipeline board, contacts, tasks, assistant.
intro: |
  Kestrel CRM — a sales CRM for a small team. The pipeline board is the home page, with the
  four figures a sales lead asks for; contacts and companies open in a drawer without leaving
  their list; tasks sit on a calendar beside what is due next; and a records assistant reads
  and edits all four tables.
glance:
  - '**Tables** (4): companies, contacts, deals, tasks'
  - '**Pages** (6): pipeline (`/`), contacts, companies, tasks, assistant, sign-in'
  - |-
    **Automations** (3): deal-won-notification, and two library recipes (`library/recipe/`, each
    with its connection in `library/connection/`): record-to-slack posts each new deal to a
    Slack channel once `SLACK_BOT_TOKEN` is set, form-to-hubspot copies each contact added
    through the add-contact form into HubSpot once `HUBSPOT_ACCESS_TOKEN` is set
  - '**AI agents** (1): records-assistant'
  - '**Singletons**: auth, design'
  - |-
    **Seed data**: `seed/` — two sign-in accounts, eight companies, ten contacts, thirteen
    deals and eleven tasks, dated relative to the day you seed
  - '**Static assets**: `public/` (served at the site root)'
glanceClose: |
  Config is pre-split: `app.yaml` is the entry point and `$ref`s the files under `config/`.
assistant: |
  Run `sovrium skills` in this directory to write the Agent Skills for the Sovrium version you
  run into `.claude/skills/`; start from `sovrium-app` for any change to the config. The
  design system is in `config/design.yaml`: read its comments before changing a colour, and
  keep colour for outcomes (won, stalled, lost, overdue).
whatsInside: |
  A sales CRM for a team of two to ten, built around the pipeline:

  - **Pipeline** (`/`) — open deals by stage, with value, close date and owner on every card, and
    four figures above the board: open pipeline, weighted forecast, won and stalled deals.
    Won and Lost are folded columns; drag a card to move a deal on.
  - **Contacts** and **Companies** — grids that open a record in a drawer, with the person's
    deals and tasks (or the company's people and deals) listed beneath.
  - **Tasks** — every follow-up on a month calendar, with your own open tasks beside it.
  - **Assistant** — a records assistant that reads and edits the four tables.
  - A deal-won email to the sales inbox, and sign-up closed: an admin adds each account.
  - Optional: each new deal posted to your Slack sales channel. It is the `record-to-slack`
    recipe from the Sovrium library (`sovrium library add recipe/record-to-slack`); set
    `SLACK_BOT_TOKEN` to turn it on — without it the app runs exactly the same.
  - Optional: each contact added from the Contacts page copied into HubSpot. It is the
    `form-to-hubspot` recipe (`sovrium library add recipe/form-to-hubspot`); set
    `HUBSPOT_ACCESS_TOKEN` to turn it on.

  Everything is declared in [`app.yaml`](./app.yaml) and the [`config/`](./config) tree —
  no application code. Edit the config, restart, done.
whatToTry: |
  Load the demo data first. It creates two accounts and a month of sales work, dated
  relative to today:

  ```bash
  SOVRIUM_SEED_PASSWORD=choose-a-password sovrium seed app.yaml
  sovrium start app.yaml
  ```

  Sign in as **ines.moreau@kestrel.example** (admin) or **tom.achebe@kestrel.example**
  (member), with the password you chose. Then:

  1. On the **Pipeline**, read the four figures, open the folded Won column, and drag a deal
     into the next stage.
  2. Open **Contacts**, select Aisha Nwosu, and see her open deal and her next task.
  3. Open **Tasks**: two are overdue and one is due today.
  4. Sign in as Tom: a member moves and edits deals, but only an admin deletes one.

  > The assistant needs an AI provider (`AI_PROVIDER` + `AI_API_KEY`, or a local
  > [Ollama](https://ollama.com) via `AI_BASE_URL`). Without one, deploy anyway — the rest of
  > the app works and the Assistant page says what to set.
env:
  - name: 'SLACK_BOT_TOKEN'
    section: 'Slack (optional)'
    description: |-
      The bot token of your Slack app turns on the new-deal post to the sales
      channel. Without it the app runs and only that automation is idle.
  - name: 'HUBSPOT_ACCESS_TOKEN'
    section: 'HubSpot (optional)'
    description: |-
      The token of a HubSpot private app (contacts write scope) copies each
      contact added from the Contacts page into HubSpot. Without it the app runs
      and only that automation is idle.
