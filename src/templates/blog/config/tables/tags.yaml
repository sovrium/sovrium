# What an essay is about. Tags are read by everyone and changed by the editor.
# A tag is never given a colour: the only colour on a post is its state.
id: 2
name: tags
permissions:
  read: all
  create: [admin]
  update: [admin]
  delete: [admin]
fields:
  - id: 1
    name: name
    type: single-line-text
    required: true
  - id: 2
    name: slug
    type: single-line-text
    required: true
    unique: true
    indexed: true
