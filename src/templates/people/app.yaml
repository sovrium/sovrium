# Meridian People — a small company's HR workspace in one config.
#
# Who works here, who is away, and who decides. The directory withholds each
# salary from everyone but an admin, on the server; a time-off request is
# filed by the person it concerns and waits on an admin's decision, taken in
# the app. This is the file you diff, fork and redeploy.
name: meridian-people
version: 2.0.0
description: >-
  A small company's HR workspace: a directory of the team with each salary
  withheld from everyone but an admin, a calendar of who is away by name, time
  off requested for oneself, and a queue where an admin decides.

auth:
  $ref: ./config/auth.yaml

design:
  $ref: ./config/design.yaml

# Optional: a Google app and a Google Docs template turn on the welcome
# document for each new hire (library/recipe/record-to-google-doc.yaml).
# Without them the app runs as before and that one automation cannot reach
# Google.
env:
  - key: GOOGLE_CLIENT_ID
    description: Client id of your Google Cloud OAuth app, for the Google connection.
    required: false
    secret: false
  - key: GOOGLE_CLIENT_SECRET
    description: Client secret of your Google Cloud OAuth app, for the Google connection.
    required: false
  - key: ONBOARDING_DOC_TEMPLATE_ID
    description: Id of the Google Docs document copied as each new hire's welcome document.
    required: false
    secret: false

# Contract PDFs, signatures and the signed files live here, private to the app.
buckets:
  - name: contracts

tables:
  - $ref: ./config/tables/employees.yaml
  - $ref: ./config/tables/time_off_requests.yaml
  - $ref: ./config/tables/contracts.yaml

# Signing flows: who signs a record's PDF, in what order, how each signer is
# verified, and how long the evidence is kept.
signatures:
  - $ref: ./config/signatures/employment-contract.yaml

# Automations run on the server, with their history kept in your own database.
automations:
  - $ref: ./config/automations/approve-time-off.yaml
  - $ref: ./config/automations/join-new-account-to-directory.yaml
  - $ref: ./config/automations/nightly-reset.yaml
  - $ref: ./config/automations/send-contract-for-signature.yaml
  - $ref: ./library/recipe/record-to-google-doc.yaml

# The forms the app's "Add" dialogs open, each placed with `formRef`.
forms:
  - $ref: ./config/forms/add-person.yaml
  - $ref: ./config/forms/request-time-off.yaml
  - $ref: ./config/forms/add-contract.yaml

# Listed in the order of the sidebar: the directory first, then time off, then
# the three pages only an admin opens. The signing page is last: it is never in
# the sidebar, only reached from a signer's email.
pages:
  - $ref: ./config/pages/directory.yaml
  - $ref: ./config/pages/time-off.yaml
  - $ref: ./config/pages/requests.yaml
  - $ref: ./config/pages/overview.yaml
  - $ref: ./config/pages/contracts.yaml
  - $ref: ./config/pages/sign-in.yaml
  - $ref: ./config/pages/contract-signing.yaml

# A small "Built with Sovrium" line after each page's content rather than a
# floating pill, so it never sits over the calendar or the last row of a grid.
badge:
  placement: footer

# The Google account the welcome documents are copied from, installed from the
# Sovrium library. Its credentials come from the environment, never this file.
connections:
  - $ref: ./library/connection/google.yaml
