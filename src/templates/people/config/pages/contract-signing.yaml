# The page a signer opens from her email. It needs no account: the link
# carries a token, the server trades it for a short signing session, and the
# page reads only what the flow exposes (the contract's title, the statement,
# the frozen document). Opened without a valid link, it shows a neutral
# not-found page that names nothing.
#
# The `signature-pad` signs for the flow, as the person the link was sent to:
# it shows the statement and a link to the PDF, and offers Decline to sign
# beside Sign. When the flow turns on `verify`, it first asks for the code
# mailed to her.
name: contract-signing
path: /sign/:token
meta:
  title: Sign your contract · Meridian People
  description: Read and sign your employment contract.
  favicon: ./favicon.svg
components:
  - type: container
    element: div
    props:
      className: flex min-h-screen items-center justify-center bg-muted px-5 py-12
    children:
      - type: container
        props:
          className: flex w-full max-w-lg flex-col gap-6 rounded-lg border border-border bg-card p-6 shadow-sm
        children:
          - type: container
            props:
              className: flex items-center gap-2.5 text-sm font-semibold text-foreground
            children:
              - type: icon
                props:
                  name: users
                  size: 14
                  className: box-content rounded-sm bg-primary p-1 text-primary-foreground
              - type: text
                element: span
                content: Meridian People
          - type: container
            props:
              className: flex flex-col gap-1.5
            children:
              - type: text
                element: h1
                props:
                  className: text-[22px] font-semibold tracking-tight text-foreground
                content: $signing.record.title
              - type: text
                element: p
                props:
                  className: text-sm text-muted-foreground
                content: For $signing.signer.displayName. Read the contract, then sign below.
          - type: signature-pad
            field: employee_signature
            statement: $signing.statement
