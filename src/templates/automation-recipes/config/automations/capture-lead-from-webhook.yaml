# Recipe 1 — a webhook becomes a lead.
#
# POST a JSON body with `name` and `email` (and `company` and `message` if you
# have them) to
#   /api/automations/capture-lead-from-webhook/webhook
# with the header `Authorization: Bearer <LEADS_WEBHOOK_TOKEN>`. A request
# without the token is refused with a 401 and writes nothing, so a form, a
# shop or any system you give the token to can post leads, and nobody else
# can.
#
# The last step adds this run's line to the activity log. The lead it writes
# then runs recipe 2, exactly as a lead typed in or posted to the records API
# does: a record an automation writes starts the record triggers of its table.
name: capture-lead-from-webhook
label: Webhook → record
description: Turn an authenticated webhook POST into a lead.
enabled: true
trigger:
  type: webhook
  method: POST
  auth:
    type: bearer
    token: $env.LEADS_WEBHOOK_TOKEN
actions:
  - name: createLead
    type: record
    operator: create
    props:
      table: leads
      data:
        name: '{{trigger.data.body.name}}'
        email: '{{trigger.data.body.email}}'
        company: '{{trigger.data.body.company}}'
        message: '{{trigger.data.body.message}}'
        source: Webhook
        captured_at: '{{now}}'
  - name: logRun
    type: record
    operator: create
    props:
      table: activity_log
      data:
        logged_at: '{{now}}'
        recipe: capture-lead-from-webhook
        outcome: Succeeded
        attempts: 1
        detail: 'POST · lead created: {{trigger.data.body.name}}'
