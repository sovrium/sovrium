# Sofia Ricci is lead #6, whose notification email failed, and Nadia Okonkwo is
# lead #8, the one that came in a few minutes ago.
#
# `captured_at` is written relative to the moment the seed runs — `{{now-138m}}`
# is 2 hours 18 minutes earlier — so a demo re-seeded every night always shows
# a week that ends today. Run `sovrium seed --today <YYYY-MM-DD>` to pin the
# day; the time of day follows your clock.
#
# Two came from an import, one from a referral, and five through the webhook
