# The team: one row per person, with their role, team and start date. The
# directory the People page lists and the time-off requests point at.
id: 7
name: employees
fields:
  - id: 1
    name: name
    type: single-line-text
    required: true
  - id: 2
    name: email
    type: email
  - id: 3
    name: job_title
    type: single-line-text
  - id: 4
    name: department
    type: single-select
    options:
      - Operations
      - Engineering
      - Sales
      - Support
  - id: 5
    name: start_date
    type: date
  - id: 6
    name: created_at
    type: created-at

views:
  - id: team_directory
    name: Team
    sorts:
      - { field: start_date, direction: asc }

aiAccess:
  description: >-
    The people on the team. Use this when the user asks who does what, who is in
    which team, or when someone joined.
  operations:
    - read
    - list
  fieldExposure: permissioned

# Everyone reads the team; only an admin adds, edits or removes a person.
permissions:
  read: authenticated
  create:
    - admin
  update:
    - admin
  delete:
    - admin
