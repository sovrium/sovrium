# Five absences: Mateo's parental leave earlier this month and Hannah's long
# weekend are approved; three requests wait on a decision.
records:
  - key: off-1
    fields:
      employee: '@employees.mf'
      type: Parental leave
      start_date: '{{today-21d}}'
      end_date: '{{today-7d}}'
      status: Approved
  - key: off-2
    fields:
      employee: '@employees.kt'
      type: Moving day
      start_date: '{{today+2d}}'
      end_date: '{{today+2d}}'
      status: Pending
  - key: off-3
    fields:
      employee: '@employees.oh'
      type: Family
      start_date: '{{today+5d}}'
      end_date: '{{today+6d}}'
      status: Pending
  - key: off-4
    fields:
      employee: '@employees.sl'
      type: Holiday
      start_date: '{{today+19d}}'
      end_date: '{{today+26d}}'
      status: Pending
  - key: off-5
    fields:
      employee: '@employees.ho'
      type: Holiday
      start_date: '{{today+11d}}'
      end_date: '{{today+13d}}'
      status: Approved
