blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/sovrium/sovrium/security/advisories/new
    about: Privately, through a security advisory. Never open a public issue for a vulnerability.
  - name: Ask a question
    url: https://sovrium.com/docs
    about: Start with the manual, which also ships offline in the binary as `sovrium docs`. Still stuck? Open a bug report or a feature request saying what you were trying to do.
  - name: Sovrium Cloud support
    url: https://sovrium.com
    about: For an app hosted on Sovrium Cloud, contact support from your account.
