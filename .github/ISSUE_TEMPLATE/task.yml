name: Task
description: Maintenance, documentation or tooling work with a clear end.
title: '<area>: <the outcome>'
type: Task
labels:
  - status:needs-triage
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerability?** Do not file it here. Report it privately at https://github.com/sovrium/sovrium/security/advisories/new instead.
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      description: The part of Sovrium this is about. Pick the closest one; triage can correct it.
      options:
        - accessibility
        - account
        - admin
        - ai
        - analytics
        - api
        - assets
        - authentication
        - automations
        - buckets
        - cli
        - design
        - design-system
        - ecoconception
        - footprint
        - forms
        - infrastructure
        - internationalization
        - links
        - migrations
        - pages
        - records-api
        - security
        - tables
        - templates
        - theming
        - user-management
        - desktop
        - docs
        - toolchain
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome, and why it matters.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and what is not.
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of done
      description: The observable state that closes this issue.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Agent brief (optional)

        Leave these empty if you are unsure: a maintainer completes them during triage. An issue is marked ready only once they are complete, so that anyone, a person or an automated agent, can start work from the issue alone. Write behaviour, not internals.
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Numbered Given / When / Then lines, in plain behaviour terms.
      placeholder: |
        1. Given an app with ..., when I ..., then ...
  - type: textarea
    id: affected-paths
    attributes:
      label: Affected paths
      description: Source paths under src/ that are likely involved, when known.
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: The CLI commands or HTTP requests that prove it is done.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue deliberately does not cover.
  - type: textarea
    id: related
    attributes:
      label: Related issues
      description: Dependencies, duplicates or follow-ups, as #numbers.
  - type: checkboxes
    id: validated
    attributes:
      label: Validation
      options:
        - label: I ran `sovrium validate` on my configuration
  - type: checkboxes
    id: ai-drafted
    attributes:
      label: AI assistance
      options:
        - label: This report was drafted with an AI assistant
