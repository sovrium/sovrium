name: Release

# Triggered when Forgejo mirrors a release tag to GitHub
on:
  push:
    tags:
      - 'v*'

# Prevent parallel releases
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  packages: write
  # Build provenance for the desktop installers. An installer is downloaded by
  # someone who has no way to rebuild it, so "this file came out of this
  # workflow, from this commit" is the only thing they can check.
  attestations: write

jobs:
  # ── Create GitHub Release (entry point for all other jobs) ───
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # Extract this version's section from CHANGELOG.md.
          #
          # The previous `awk "/^## ${VERSION}/,/^## [0-9]/"` range never matched:
          # analyze-commits.ts writes headers as `## [0.15.2](compare-url) (date)`,
          # so the literal `^## 0.15.2` pattern missed the leading `[`. NOTES came
          # back empty every time and the fallback below stamped "Release vX.Y.Z" —
          # every published release since the beginning had empty notes.
          #
          # A `pat1,pat2` range cannot fix it either: awk tests the end pattern on
          # the start line too, and `## [0.15.2]` matches both, collapsing the range
          # to a single line. Hence the explicit flag form, which also removes the
          # fragile `head -n -1 | tail -n +2` trimming.
          #
          # The section goes to a FILE and is passed with `--notes-file`, never as
          # `--notes "$NOTES"`. Linux caps ONE argv entry at MAX_ARG_STRLEN =
          # 131072 bytes, so an argument-borne release body stops working the day a
          # single version's public changelog crosses 128 KiB — and it would fail
          # with E2BIG after the tag is already public, which is the worst possible
          # moment to discover it. The same class of defect blocked release 0.25.0
          # on the Forgejo side, where the INTERNAL changelog reached 310 048 bytes.
          # This file sees only the public one — 27 736 bytes for that same 4392-commit
          # window, comfortable today, and not a reason to leave the hazard armed.
          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release-notes.md"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?" v "\\]" { found = 1; next }
            found && /^## \[?[0-9]/  { exit }
            found                     { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ]; then
            printf 'Release %s\n' "$TAG" > "$NOTES_FILE"
          fi
          # Created as a draft so binary jobs can append .tar.gz assets —
          # immutable releases reject asset uploads once published. The
          # publish-release job flips --draft=false after all assets land.
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file "$NOTES_FILE" \
            --verify-tag \
            --draft

  # ── npm publish: RETIRED, and it is not coming back ─────────
  # Nothing is published to npm. TypeScript config types ship INSIDE the binary and
  # are written out by `sovrium types` (scripts/build/generate-embedded-config-types.ts).
  # The @sovrium/types package that used to be published here has been deleted from
  # the tree entirely.
  #
  # The full argument for why a published types package CANNOT deliver zero-npm
  # TypeScript authoring — and why its `defineConfig` value export type-checked clean
  # and then failed at boot — is recorded in
  # docs/user-stories/as-developer/infrastructure/binary-packaging-tier.md. Read it
  # before proposing to republish.
  #
  # The existing npm versions are NOT unpublished: 36 versions with live weekly
  # downloads, and unpublishing hard-breaks every lockfile naming the package.
  # Deprecation is a deliberate manual step, run by hand — never from CI.

  # ── Build macOS binaries on native runners ──────────────────
  build-binary-macos:
    name: Build macOS Binaries
    needs: [release]
    # Both darwin arches build on ONE Apple-Silicon runner: arm64 native, x64
    # cross-compiled via `bun build --target=bun-darwin-x64`. This removes the
    # dependency on the retired Intel `macos-13` runner, which left the
    # darwin-x64 job stuck in queue indefinitely and blocked every release
    # (the publish gate needs all 5 platform assets present).
    runs-on: macos-14
    # Cap runtime so a wedged GitHub macOS runner cannot hang the run and hold
    # the `concurrency: release` lock indefinitely.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build binaries (arm64 native + x64 cross-compile)
        run: |
          bun run build:binary -- --target darwin-arm64
          bun run build:binary -- --target darwin-x64

      - name: Ad-hoc code sign (macOS)
        run: |
          codesign --force --sign - sovrium-darwin-arm64
          codesign --force --sign - sovrium-darwin-x64

      # Release gate for issue #19: the compiled binary must serve theme-aware
      # CSS without the native lightningcss/oxide addons. Smoke-test the native
      # arm64 build — the x64 binary is the same source cross-compiled, so this
      # exercises the identical CSS pipeline code path. A failure blocks the
      # release (publish jobs depend on this job succeeding).
      - name: Smoke test - binary serves compiled CSS
        env:
          # Smoke test validates the CSS pipeline only; the binary is
          # secure-by-default and refuses to boot without an encryption key.
          # Opt into the deterministic dev key so boot reaches the CSS route.
          SOVRIUM_ALLOW_DEV_KEY: '1'
        run: |
          PORT=3210 ./sovrium-darwin-arm64 start templates/landing-page/app.yaml &
          SERVER_PID=$!
          CSS=""
          for _ in $(seq 1 30); do
            CSS=$(curl -sf "http://localhost:3210/assets/output.css" || true)
            [ -n "$CSS" ] && break
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          if [ -z "$CSS" ]; then
            echo "FAIL: binary did not serve /assets/output.css (CSS pipeline crashed - see issue #19)"
            exit 1
          fi
          if ! echo "$CSS" | grep -q '@layer'; then
            echo "FAIL: binary served no Tailwind CSS (@layer missing)"
            exit 1
          fi
          if echo "$CSS" | grep -qi 'compilation failed'; then
            echo "FAIL: binary CSS compilation failed"
            exit 1
          fi
          echo "OK: binary served $(printf '%s' "$CSS" | wc -c) bytes of compiled CSS"

      - name: Package, checksum, and upload both arches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          for TARGET in darwin-arm64 darwin-x64; do
            # Tar a bare `sovrium` so every platform's tarball shares the same
            # inner name (matches the Linux rename + the Homebrew formula's
            # `bin.install "sovrium"`).
            cp "sovrium-${TARGET}" sovrium
            tar czf "sovrium-${VERSION}-${TARGET}.tar.gz" sovrium
            shasum -a 256 "sovrium-${VERSION}-${TARGET}.tar.gz" > "sovrium-${VERSION}-${TARGET}.sha256"
            rm -f sovrium
            gh release upload "${TAG}" \
              "sovrium-${VERSION}-${TARGET}.tar.gz" \
              "sovrium-${VERSION}-${TARGET}.sha256" \
              --clobber
          done

      # The desktop bundle embeds this same binary as its sidecar. Handed over
      # as a WORKFLOW ARTIFACT rather than re-downloaded from the release: the
      # release is still a draft at this point, and GitHub serves 404 on draft
      # assets to unauthenticated clients — the same trap that already forces
      # update-homebrew to wait for publish-release. An artifact has no such
      # rule, costs one upload, and keeps `build-desktop` independent of when
      # the release stops being a draft.
      - name: Upload the engines for the desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: engine-darwin
          if-no-files-found: error
          retention-days: 1
          path: |
            sovrium-darwin-arm64
            sovrium-darwin-x64

  # ── Build Linux binaries (cross-compile on ubuntu) ──────────
  build-binary-linux:
    name: Build Linux Binary (${{ matrix.target }})
    needs: [release]
    strategy:
      matrix:
        include:
          - target: linux-x64
          - target: linux-arm64
    runs-on: ubuntu-latest
    # Cap runtime so a wedged runner cannot hang the run and hold the
    # `concurrency: release` lock indefinitely.
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: bun run build:binary -- --target ${{ matrix.target }}

      # Release gate for issue #19: verify the compiled binary serves CSS
      # without native addons. Runs only for linux-x64, the one target the
      # x64 ubuntu runner can execute (linux-arm64 is cross-compiled).
      - name: Smoke test - binary serves compiled CSS
        if: matrix.target == 'linux-x64'
        env:
          # Smoke test validates the CSS pipeline only; the binary is
          # secure-by-default and refuses to boot without an encryption key.
          # Opt into the deterministic dev key so boot reaches the CSS route.
          SOVRIUM_ALLOW_DEV_KEY: '1'
        run: |
          PORT=3210 ./sovrium-linux-x64 start templates/landing-page/app.yaml &
          SERVER_PID=$!
          CSS=""
          for _ in $(seq 1 30); do
            CSS=$(curl -sf "http://localhost:3210/assets/output.css" || true)
            [ -n "$CSS" ] && break
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          if [ -z "$CSS" ]; then
            echo "FAIL: binary did not serve /assets/output.css (CSS pipeline crashed - see issue #19)"
            exit 1
          fi
          if ! echo "$CSS" | grep -q '@layer'; then
            echo "FAIL: binary served no Tailwind CSS (@layer missing)"
            exit 1
          fi
          if echo "$CSS" | grep -qi 'compilation failed'; then
            echo "FAIL: binary CSS compilation failed"
            exit 1
          fi
          echo "OK: binary served $(printf '%s' "$CSS" | wc -c) bytes of compiled CSS"

      # BEFORE the packaging step below, which renames the file to a bare
      # `sovrium`. Only x64: the desktop bundle has no Linux arm64 lane yet.
      # See the macOS job for why this is an artifact and not a release download.
      - name: Upload the engine for the desktop bundle
        if: matrix.target == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: engine-linux-x64
          if-no-files-found: error
          retention-days: 1
          path: sovrium-linux-x64

      - name: Package binary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Rename to the bare `sovrium` so the tarball matches the macOS layout.
          # The Homebrew formula (`bin.install "sovrium"`), the curl installer, and
          # the `sovrium update` self-replace extractor all expect the bare name.
          mv "sovrium-${{ matrix.target }}" sovrium
          tar czf "sovrium-${VERSION}-${{ matrix.target }}.tar.gz" sovrium

      - name: Generate checksum
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sha256sum "sovrium-${VERSION}-${{ matrix.target }}.tar.gz" > "sovrium-${VERSION}-${{ matrix.target }}.sha256"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release upload "${TAG}" \
            "sovrium-${VERSION}-${{ matrix.target }}.tar.gz" \
            "sovrium-${VERSION}-${{ matrix.target }}.sha256" \
            --clobber

  # ── Build Windows binary (NATIVE on windows-latest) ─────────
  #
  # Moved off the ubuntu cross-compile on 2026-09-22, and the reason is a
  # documented Bun limitation rather than a preference. Bun's executable
  # metadata flags — `--windows-title`, `--windows-publisher`,
  # `--windows-version`, `--windows-description`, `--windows-copyright`,
  # `--windows-icon` — set PE version resources through Windows APIs, and
  # bun.com/docs/bundler/executables says in as many words: "Except for
  # `hideConsole`, you do not have access to these flags when cross-compiling
  # because they depend on Windows APIs."
  #
  # A cross-compiled `sovrium.exe` therefore ships with Bun's own file
  # properties and no version at all. That was cosmetic while the binary was
  # something a developer downloaded deliberately; it stops being cosmetic the
  # moment the same file is bundled INSIDE a signed desktop installer, where an
  # unnamed, unversioned executable is what a user is shown when Windows asks
  # them to approve it.
  #
  # `scripts/build/build-binary.ts` applies the flags only when it is RUNNING on
  # Windows, so a cross-compile still succeeds and simply omits them — moving
  # this job is what makes them take effect.
  build-binary-windows:
    name: Build Windows Binary
    needs: [release]
    runs-on: windows-latest
    # Cap runtime so a wedged runner cannot hang the run and hold the
    # `concurrency: release` lock indefinitely.
    timeout-minutes: 45
    defaults:
      run:
        # One shell across every lane of this workflow. `windows-latest` defaults
        # to pwsh, and the steps below are the same `$VAR`/`sha256sum` shell as
        # their macOS and Linux siblings — a per-OS dialect here is how a release
        # step works on two platforms and silently does nothing on the third.
        #
        # One shell is NOT one toolbox, and v0.27.1 is what that costs. Git Bash
        # here is Git for Windows, which bundles only `sed awk grep findutils
        # coreutils` + `unzip`; the rest of what a step calls has to come from
        # the runner image's PATH. So `sha256sum`, `cp`, `rm`, `chmod`, `find`
        # and `basename` are safe because coreutils/findutils ship WITH bash,
        # `jq`/`gh`/`7z` are safe because the image installs them, and `zip` is
        # in neither. Check a new command against both lists before adding it —
        # every step in this job is Windows-only and nothing else exercises it.
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build binary
        run: bun run build:binary -- --target windows-x64

      # See the macOS job for why this is an artifact and not a release download.
      - name: Upload the engine for the desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: engine-windows-x64
          if-no-files-found: error
          retention-days: 1
          path: sovrium-windows-x64.exe

      # `7z`, NOT `zip`. Git Bash on `windows-latest` is a Git for Windows
      # install, whose bundled MSYS2 subset is `sed awk grep findutils coreutils`
      # plus `unzip` — and no `zip` at any point
      # (git-for-windows/build-extra `make-file-list.sh`, `UTIL_PACKAGES`). So
      # `sha256sum`, `cp`, `chmod` and friends resolve here and `zip` does not,
      # which is the asymmetry that took v0.27.1's release down with
      # `zip: command not found` AFTER the engine had already built and uploaded.
      # 7-Zip is a first-class entry in the runner image's own software report
      # ("7zip 26.03" under Tools) and that report calls it as a bare `7z`, so it
      # is on the PATH the Actions runner hands to Git Bash — the same
      # inheritance that already makes `jq` work in `Read version` above.
      #
      # The archive layout is load-bearing and is guaranteed by construction
      # rather than asserted: 7z stores each operand's path AS GIVEN, and the
      # operand here is a bare filename with no directory component, so the
      # `.exe` can only land at the archive root. That is what Scoop's
      # `"bin": "sovrium-windows-x64.exe"` (scripts/build/scoop/sovrium.json.template)
      # resolves against, and a wrapper folder would break `scoop install` while
      # leaving every other job in this workflow green.
      #
      # `rm -f` first because `a` ADDS to an existing archive instead of
      # replacing it. The workspace is fresh today, so this only makes the
      # single-file guarantee unconditional rather than incidental.
      - name: Package binary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          rm -f "sovrium-${VERSION}-windows-x64.zip"
          7z a -tzip "sovrium-${VERSION}-windows-x64.zip" "sovrium-windows-x64.exe"

      # `sha256sum` is coreutils, so it ships with Git Bash itself — unlike
      # `zip` above, and unlike macOS, whose lane uses `shasum -a 256` because
      # it has no `sha256sum` at all. The operand is a bare filename with no
      # directory component, which is what keeps the emitted line
      # `<hash>  sovrium-<version>-windows-x64.zip` free of any backslash:
      # `sha256sum` echoes its operand verbatim, so a Windows-style path handed
      # in here would be copied straight into the file that
      # `aggregate-checksums` concatenates and that a user runs
      # `sha256sum -c` against.
      - name: Generate checksum
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sha256sum "sovrium-${VERSION}-windows-x64.zip" > "sovrium-${VERSION}-windows-x64.sha256"
          cat "sovrium-${VERSION}-windows-x64.sha256"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release upload "${TAG}" \
            "sovrium-${VERSION}-windows-x64.zip" \
            "sovrium-${VERSION}-windows-x64.sha256" \
            --clobber

  # ── Build the desktop installers ────────────────────────────
  #
  # The free downloadable app. It is a window and a tray around the SAME engine
  # binary the three jobs above just built — which is why this job `needs` them
  # and reuses their output as a sidecar rather than compiling a second copy.
  #
  # Signing is gated on the secrets EXISTING, and the reason is that this whole
  # pipeline had to work before the founder's Apple and Azure enrolments
  # completed (each has a lead time measured in weeks). An unsigned lane still
  # produces a real, installable, smoke-tested bundle; it simply produces one
  # the operating system will warn about. The alternative — a job that fails
  # until a certificate exists — would have meant no desktop CI at all for the
  # entire enrolment window, which is exactly when it is most needed.
  #
  # `secrets` is NOT available in a job-level or step-level `if`, so presence is
  # detected in a step that reads the secret through `env` and writes a plain
  # output. Every gated step then keys off that output. This is the documented
  # workaround, not a preference.
  build-desktop:
    name: Build Desktop (${{ matrix.label }})
    needs: [build-binary-macos, build-binary-linux, build-binary-windows]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        # One shell for four lanes. See build-binary-windows for why.
        shell: bash
    strategy:
      # A red Windows lane must not cancel a macOS one that was about to
      # produce a perfectly good dmg. The publish gate below decides what a
      # partial result means; this flag only decides what gets built.
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            slug: mac-arm64
            engine-artifact: engine-darwin
            engine-file: sovrium-darwin-arm64
            rust-target: aarch64-apple-darwin
            bundles: app,dmg
            updater-platform: darwin-aarch64
          - label: macOS x64
            runner: macos-14
            slug: mac-x64
            engine-artifact: engine-darwin
            engine-file: sovrium-darwin-x64
            rust-target: x86_64-apple-darwin
            bundles: app,dmg
            updater-platform: darwin-x86_64
          - label: Windows x64
            runner: windows-latest
            slug: windows-x64
            engine-artifact: engine-windows-x64
            engine-file: sovrium-windows-x64.exe
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis
            updater-platform: windows-x86_64
          # 22.04, not latest: an AppImage links against the glibc of the machine
          # that built it, so the oldest supported runner is the correct choice —
          # building on a newer one ships an installer that refuses to start on
          # every older distribution.
          - label: Linux x64
            runner: ubuntu-22.04
            slug: linux-x64
            engine-artifact: engine-linux-x64
            engine-file: sovrium-linux-x64
            rust-target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            updater-platform: linux-x86_64
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            xvfb

      - name: Add the Rust target
        run: rustup target add ${{ matrix.rust-target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.rust-target }}

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          bun install --frozen-lockfile --cwd desktop

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The engine, as built by this same run. Never rebuilt here: a second
      # compile would produce a second binary, and "the installer contains the
      # binary we published" would stop being a fact about the release.
      - name: Download the engine
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.engine-artifact }}
          path: .

      - name: Stage the sidecar
        run: |
          chmod +x "./${{ matrix.engine-file }}" || true
          bun run scripts/build/stage-desktop-sidecar.ts \
            --from "./${{ matrix.engine-file }}" \
            --triple ${{ matrix.rust-target }}

      # Which secrets are present. Read through `env` because `secrets` is not
      # available in an `if` — the value itself is never printed, only whether
      # it is empty.
      - name: Detect signing secrets
        id: secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          have() { [ -n "$1" ] && echo true || echo false; }
          {
            echo "apple=$(have "$APPLE_CERTIFICATE")"
            echo "azure=$(have "$AZURE_CLIENT_ID")"
            echo "updater=$(have "$TAURI_SIGNING_PRIVATE_KEY")"
          } >> "$GITHUB_OUTPUT"
          echo "apple=$(have "$APPLE_CERTIFICATE") azure=$(have "$AZURE_CLIENT_ID") updater=$(have "$TAURI_SIGNING_PRIVATE_KEY")"

      # A dedicated, throwaway keychain rather than the login one: the login
      # keychain on a GitHub runner is shared with whatever else the job does,
      # and `set-key-partition-list` on it would unlock more than this build
      # needs. The keychain is created here rather than left to the Tauri CLI
      # because the SIDECAR has to be signed before `tauri build` runs, which
      # means the identity must already be findable.
      - name: Import the Apple certificate
        if: runner.os == 'macOS' && steps.secrets.outputs.apple == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="${RUNNER_TEMP}/sovrium-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${KEYCHAIN}" -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          # Put it on the search list WITHOUT dropping the system keychains,
          # which hold the Apple intermediate certificates the signature chains
          # to. Replacing the list outright is how a signature comes out valid
          # locally and untrusted everywhere else.
          EXISTING=()
          while IFS= read -r line; do
            EXISTING+=("$(printf '%s' "${line}" | tr -d '" ')")
          done < <(security list-keychains -d user)
          security list-keychain -d user -s "${KEYCHAIN}" "${EXISTING[@]}"
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security find-identity -v -p codesigning "${KEYCHAIN}"

      # The entitlements are the load-bearing part, and they are why the sidecar
      # is signed separately rather than by a `--deep` pass over the bundle: a
      # deep signature does NOT apply entitlements to a nested Mach-O, and
      # JavaScriptCore is a JIT. Without `allow-jit` and
      # `allow-unsigned-executable-memory` the hardened runtime has the kernel
      # kill the engine at launch, with no message — which reaches the user as
      # "the app does nothing when I open it".
      - name: Sign the sidecar (macOS)
        if: runner.os == 'macOS'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          SIDECAR="desktop/src-tauri/sovrium-${{ matrix.rust-target }}"
          # `-` is codesign's own spelling for ad-hoc, which is what an
          # unsigned release candidate gets.
          SIGN_AS="${IDENTITY:--}"
          codesign --force --options runtime --timestamp \
            --entitlements desktop/src-tauri/entitlements.plist \
            --sign "${SIGN_AS}" "${SIDECAR}"
          codesign -d --entitlements - "${SIDECAR}"

      - name: Install the Windows signing tool
        if: runner.os == 'Windows' && steps.secrets.outputs.azure == 'true'
        run: cargo install artifact-signing-cli --locked

      # The sidecar again, for the same reason as on macOS: Tauri's own
      # `signCommand` covers the executables IT produces, and the engine is a
      # file it copies rather than builds. An unsigned nested .exe inside a
      # signed installer is what SmartScreen reports on.
      - name: Sign the sidecar (Windows)
        if: runner.os == 'Windows' && steps.secrets.outputs.azure == 'true'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          artifact-signing-cli -e "${ENDPOINT}" -a "${ACCOUNT}" -c "${PROFILE}" -d Sovrium \
            "desktop/src-tauri/sovrium-${{ matrix.rust-target }}.exe"

      # One overlay file rather than three variants of the build command.
      # `createUpdaterArtifacts` is deliberately NOT in the committed
      # tauri.conf.json: with it on and no signing key, `tauri build` fails
      # outright, which would break every unsigned build including the PR
      # workflow and a developer's local one. It belongs to the lane that has
      # the key, and nowhere else.
      - name: Compose the build config overlay
        id: overlay
        env:
          # The three that NAME the signing account — not the three that
          # authenticate to it, which reach `artifact-signing-cli` through the
          # build step's own environment. Nothing here is a credential.
          ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          OVERLAY="${RUNNER_TEMP}/tauri.overlay.json"
          echo '{}' > "${OVERLAY}"
          if [ "${{ steps.secrets.outputs.updater }}" = "true" ]; then
            jq '.bundle.createUpdaterArtifacts = true' "${OVERLAY}" > "${OVERLAY}.tmp"
            mv "${OVERLAY}.tmp" "${OVERLAY}"
          fi
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ steps.secrets.outputs.azure }}" = "true" ]; then
            # `%1` is Tauri's placeholder for the file being signed.
            jq --arg cmd "artifact-signing-cli -e ${ENDPOINT} -a ${ACCOUNT} -c ${PROFILE} -d Sovrium %1" \
              '.bundle.windows.signCommand = $cmd' "${OVERLAY}" > "${OVERLAY}.tmp"
            mv "${OVERLAY}.tmp" "${OVERLAY}"
          fi
          cat "${OVERLAY}"
          echo "path=${OVERLAY}" >> "$GITHUB_OUTPUT"

      # Notarization happens INSIDE this step when the Apple API key is present:
      # the Tauri CLI submits the bundle to Apple's notary service and staples
      # the ticket. `APPLE_API_KEY_PATH` points at a file written from a secret
      # rather than being a secret itself — a path is not a credential, and the
      # .p8 has to exist on disk for `notarytool`.
      - name: Build the bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "${{ runner.os }}" = "macOS" ] && [ -n "${APPLE_API_KEY_P8}" ]; then
            printf '%s' "${APPLE_API_KEY_P8}" | base64 --decode > "${RUNNER_TEMP}/AuthKey.p8"
            export APPLE_API_KEY_PATH="${RUNNER_TEMP}/AuthKey.p8"
          fi
          # An ad-hoc identity when there is no certificate, so the unsigned
          # lane still produces a bundle macOS will at least launch locally.
          if [ "${{ runner.os }}" = "macOS" ] && [ -z "${APPLE_SIGNING_IDENTITY}" ]; then
            export APPLE_SIGNING_IDENTITY='-'
          fi
          bun run --cwd desktop tauri build \
            --target ${{ matrix.rust-target }} \
            --bundles ${{ matrix.bundles }} \
            --config "${{ steps.overlay.outputs.path }}"
          rm -f "${RUNNER_TEMP}/AuthKey.p8"

      # Signature, notarization ticket, Gatekeeper verdict — asserted rather
      # than assumed. Each answers a different question, and a release that
      # skipped these would discover a broken signature from a user.
      - name: Verify the macOS signature
        if: runner.os == 'macOS' && steps.secrets.outputs.apple == 'true'
        run: |
          APP="desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos/Sovrium.app"
          codesign --verify --deep --strict --verbose=2 "${APP}"
          spctl -a -vv "${APP}"
          xcrun stapler validate "${APP}"
          DMG=$(find "desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)
          xcrun stapler validate "${DMG}"

      # ── Smoke test: run the artefact, not the crate ──────────
      - name: Smoke test the bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/macos/Sovrium.app"
          test -x "$APP/Contents/MacOS/sovrium" \
            || { echo "FAIL: no sidecar at $APP/Contents/MacOS/sovrium"; exit 1; }
          # The main executable is read from Info.plist rather than guessed. It
          # is `sovrium-desktop` (the crate name), NOT `Sovrium` — and that
          # distinction is load-bearing on macOS, whose default filesystem is
          # case-INSENSITIVE: a path of `Contents/MacOS/Sovrium` silently
          # resolves to the SIDECAR `sovrium` sitting beside it. Doing exactly
          # that is how this step first "ran the app" and got
          # `Error: No configuration provided` from the engine.
          #
          # It also means `bundle.mainBinaryName` must never be set to
          # `Sovrium`: the shell and the sidecar would then be the same path.
          EXE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          if [ "$(printf '%s' "$EXE_NAME" | tr '[:upper:]' '[:lower:]')" = "sovrium" ]; then
            echo "FAIL: the shell executable is named '${EXE_NAME}', which collides with the"
            echo "      sidecar 'sovrium' on a case-insensitive filesystem. One has overwritten"
            echo "      the other. Do not set bundle.mainBinaryName to the product name."
            exit 1
          fi
          bun run scripts/build/smoke-desktop-app.ts --exe "$APP/Contents/MacOS/${EXE_NAME}"

      - name: Smoke test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path "desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis" -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "no NSIS installer was produced" }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          # The SIDECAR is the anchor, not the shell. Its name is ours —
          # `externalBin: ["sovrium"]` — whereas the shell's comes from Tauri's
          # `mainBinaryName`, which defaults to the crate name and is exactly the
          # kind of thing a Tauri release changes. Finding the install directory
          # by the file we named, then taking the other executable in it, is
          # correct whatever the shell ends up being called.
          $sidecar = Get-ChildItem -Path $env:LOCALAPPDATA -Filter 'sovrium.exe' -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sidecar) { throw "the installer shipped no sidecar under $env:LOCALAPPDATA" }
          $shell = Get-ChildItem -Path $sidecar.Directory.FullName -Filter '*.exe' | Where-Object { $_.Name -ne $sidecar.Name } | Select-Object -First 1
          # Windows is case-insensitive, so a shell named `Sovrium.exe` would BE
          # the sidecar `sovrium.exe` — one would have overwritten the other and
          # there would be exactly one .exe here. That is the failure this
          # branch names rather than letting the smoke test report a confusing
          # engine error.
          if (-not $shell) {
            throw "only one executable in $($sidecar.Directory.FullName) — the shell and the sidecar have collided on a case-insensitive filesystem. Do not set bundle.mainBinaryName to the product name."
          }
          Write-Host "installed shell: $($shell.FullName)"
          bun run scripts/build/smoke-desktop-app.ts --exe $shell.FullName

      - name: Smoke test the AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          BUNDLE="desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          APPIMAGE=$(find "$BUNDLE/appimage" -maxdepth 1 -name '*.AppImage' | head -n 1)
          test -n "$APPIMAGE" || { echo "FAIL: no AppImage was produced"; exit 1; }
          chmod +x "$APPIMAGE"
          # Extracted rather than executed: ubuntu-22.04 runners have no FUSE 2,
          # so running it directly fails on the mount rather than on anything
          # this test is about.
          (cd "$(dirname "$APPIMAGE")" && "./$(basename "$APPIMAGE")" --appimage-extract > /dev/null)
          ROOT="$(dirname "$APPIMAGE")/squashfs-root"
          test -x "$ROOT/usr/bin/sovrium" \
            || { echo "FAIL: no sidecar at $ROOT/usr/bin/sovrium"; ls -la "$ROOT/usr/bin"; exit 1; }
          # The sidecar is the anchor; the shell is whatever else is in there.
          # Its name comes from Tauri's `mainBinaryName` (the crate name today),
          # which is not ours to depend on.
          EXE=$(find "$ROOT/usr/bin" -maxdepth 1 -type f ! -name 'sovrium' | head -n 1)
          test -n "$EXE" || { echo "FAIL: no shell executable beside the sidecar in $ROOT/usr/bin"; ls -la "$ROOT/usr/bin"; exit 1; }
          xvfb-run -a bun run scripts/build/smoke-desktop-app.ts --exe "$EXE"

      # ── Name the assets ─────────────────────────────────────
      # Tauri names its output after the product and the Rust arch
      # (`Sovrium_0.25.0_aarch64.dmg`). The download page and the installed base
      # need two other names: a VERSIONED one, which is immutable and is what
      # `latest.json` and the checksums reference, and a VERSION-LESS one, which
      # is what `sovrium.com/download/...` redirects to and therefore must keep
      # working across releases without the page being edited.
      - name: Name the assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE="desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          OUT="${RUNNER_TEMP}/release"
          mkdir -p "${OUT}"
          # The checksum patterns go to a FILE rather than to a step output.
          # An output interpolated into a shell command is glob-expanded by the
          # shell before the script ever sees it, and `Sovrium-1.2.3-mac-arm64.*`
          # is exactly the shape that would silently resolve against the checkout
          # instead of being passed through.
          PATTERNS="${RUNNER_TEMP}/checksum-patterns.txt"
          : > "${PATTERNS}"
          take() { # take <source> <versioned> [version-less]
            [ -f "$1" ] || { echo "FAIL: expected artefact missing: $1"; exit 1; }
            cp "$1" "${OUT}/$2"
            # An `if` rather than `[ -n ... ] && cp`: under `bash -e` a trailing
            # AND-list that evaluates false is a failed statement, and the two
            # `take` calls with no third argument are the common case.
            if [ -n "${3:-}" ]; then cp "$1" "${OUT}/$3"; fi
            echo "  $(basename "$1") -> $2${3:+ + $3}"
          }
          case "${{ matrix.slug }}" in
            mac-*)
              ARCH="${{ matrix.slug }}"
              take "$(find "${BUNDLE}/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)" \
                "Sovrium-${VERSION}-${ARCH}.dmg" "Sovrium-${ARCH}.dmg"
              if [ -f "${BUNDLE}/macos/Sovrium.app.tar.gz" ]; then
                take "${BUNDLE}/macos/Sovrium.app.tar.gz" "Sovrium-${VERSION}-${ARCH}.app.tar.gz"
                take "${BUNDLE}/macos/Sovrium.app.tar.gz.sig" "Sovrium-${VERSION}-${ARCH}.app.tar.gz.sig"
              fi
              printf '%s\n' "Sovrium-${VERSION}-${ARCH}.*" >> "${PATTERNS}"
              ;;
            windows-x64)
              SETUP=$(find "${BUNDLE}/nsis" -maxdepth 1 -name '*-setup.exe' | head -n 1)
              take "${SETUP}" "Sovrium-${VERSION}-windows-x64-setup.exe" "Sovrium-windows-x64-setup.exe"
              if [ -f "${SETUP}.sig" ]; then
                take "${SETUP}.sig" "Sovrium-${VERSION}-windows-x64-setup.exe.sig"
              fi
              printf '%s\n' "Sovrium-${VERSION}-windows-x64-setup.*" >> "${PATTERNS}"
              ;;
            linux-x64)
              APPIMAGE=$(find "${BUNDLE}/appimage" -maxdepth 1 -name '*.AppImage' | head -n 1)
              take "${APPIMAGE}" "Sovrium-${VERSION}-linux-x64.AppImage" "Sovrium-linux-x64.AppImage"
              if [ -f "${APPIMAGE}.sig" ]; then
                take "${APPIMAGE}.sig" "Sovrium-${VERSION}-linux-x64.AppImage.sig"
              fi
              take "$(find "${BUNDLE}/deb" -maxdepth 1 -name '*.deb' | head -n 1)" \
                "sovrium-${VERSION}-linux-amd64.deb" "sovrium-linux-amd64.deb"
              printf '%s\n' "Sovrium-${VERSION}-linux-x64.*" "sovrium-${VERSION}-linux-amd64.deb" >> "${PATTERNS}"
              ;;
          esac
          ls -la "${OUT}"

      # `generate-checksums.ts` rather than an inline `shasum` loop: it fails
      # LOUDLY and by name on a pattern that matches nothing, where a glob that
      # matches nothing produces an empty file and a green step. The output name
      # is chosen so the existing `sovrium-${VERSION}-*.sha256` aggregation
      # picks it up without a second mechanism.
      - name: Checksum the assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARGS=()
          while IFS= read -r pattern; do
            [ -n "${pattern}" ] && ARGS+=(--pattern "${pattern}")
          done < "${RUNNER_TEMP}/checksum-patterns.txt"
          bun run scripts/build/generate-checksums.ts \
            --dir "${RUNNER_TEMP}/release" \
            --output "sovrium-${VERSION}-desktop-${{ matrix.slug }}.sha256" \
            "${ARGS[@]}"
          cat "${RUNNER_TEMP}/release/sovrium-${VERSION}-desktop-${{ matrix.slug }}.sha256"

      # An installer is downloaded by someone with no way to rebuild it. The
      # attestation is what lets them check that the file came out of this
      # workflow, from this commit, rather than from a mirror that was edited.
      #
      # One glob over the whole staging directory rather than four per-extension
      # ones: this lane produces two of the four, and a `subject-path` entry
      # matching nothing is how the step fails on the lane it was written for.
      # It therefore attests the checksum file and any updater signature too,
      # which is correct — they are published assets as well.
      - name: Attest the installers
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/release/*

      # To the DRAFT release, like every other asset in this workflow: a
      # published GitHub release is immutable and rejects uploads, and
      # `latest.json` in particular has to land before the draft is flipped.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          cd "${RUNNER_TEMP}/release"
          gh release upload "${TAG}" ./* --repo "${{ github.repository }}" --clobber

      # The updater signatures, handed to `assemble-updater-manifest` as an
      # artifact. `ignore` rather than `error`: an unsigned lane legitimately
      # produces none, and the manifest job refuses on its own terms when a
      # platform is missing.
      - name: Upload the updater signatures
        uses: actions/upload-artifact@v4
        with:
          name: updater-sigs-${{ matrix.slug }}
          if-no-files-found: ignore
          retention-days: 1
          path: ${{ runner.temp }}/release/*.sig

  # ── Assemble the updater manifest ───────────────────────────
  #
  # ONE job rather than a step in each matrix lane, and that is the whole reason
  # it exists separately: four lanes appending to one `latest.json` is a
  # read-modify-write race with no lock, and the loser's platform silently stops
  # receiving updates. Here the four signatures arrive as artifacts and one
  # process writes one file.
  #
  # It runs while the release is still a draft, because a published GitHub
  # release rejects new assets — and an updater manifest that cannot be uploaded
  # after the fact is an updater that never starts.
  assemble-updater-manifest:
    name: Assemble Updater Manifest
    needs: [build-desktop]
    if: always() && needs.build-desktop.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Detect the updater signing key
        id: secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            echo "No TAURI_SIGNING_PRIVATE_KEY secret — no updater artifacts were built,"
            echo "so there is no manifest to assemble. The installers in this release are"
            echo "complete and installable; they simply will not self-update."
            echo "See docs/infrastructure/release/release-script.md for the key custody rule."
          fi

      - name: Download the updater signatures
        if: steps.secrets.outputs.updater == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: updater-sigs-*
          merge-multiple: true
          path: sigs

      # Every platform or none. A manifest missing one key is not a smaller
      # manifest — it is an updater that reports "you are up to date" forever to
      # everyone on that platform, which is indistinguishable from working.
      - name: Write latest.json
        if: steps.secrets.outputs.updater == 'true'
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          # A two-column table read line by line rather than an associative
          # array. `declare -A` needs bash 4, which this runner has and macOS's
          # system bash (3.2) does not — and a release-critical script nobody can
          # run on their own machine is one nobody checks before it matters.
          #
          # Note which artefact each platform points at. On Windows and Linux the
          # updater downloads the same file a human would; on macOS it does NOT —
          # it replaces the .app bundle from a tarball, so the .dmg is the
          # download and the .app.tar.gz is the update.
          PLATFORMS='{}'
          MISSING=0
          while read -r KEY ASSET; do
            [ -n "${KEY}" ] || continue
            FILE="sigs/${ASSET}.sig"
            if [ ! -s "${FILE}" ]; then
              echo "MISSING: ${FILE}"
              MISSING=1
              continue
            fi
            PLATFORMS=$(jq -n \
              --argjson acc "${PLATFORMS}" \
              --arg key "${KEY}" \
              --arg sig "$(cat "${FILE}")" \
              --arg url "${BASE}/${ASSET}" \
              '$acc + {($key): {signature: $sig, url: $url}}')
          done <<EOF
          darwin-aarch64 Sovrium-${VERSION}-mac-arm64.app.tar.gz
          darwin-x86_64 Sovrium-${VERSION}-mac-x64.app.tar.gz
          windows-x86_64 Sovrium-${VERSION}-windows-x64-setup.exe
          linux-x86_64 Sovrium-${VERSION}-linux-x64.AppImage
          EOF
          if [ "${MISSING}" -ne 0 ]; then
            echo "FAIL: at least one platform has no updater signature. A partial latest.json"
            echo "      would leave that platform silently un-updatable, so none is written."
            exit 1
          fi

          jq -n \
            --arg version "${VERSION}" \
            --arg notes "https://github.com/${{ github.repository }}/releases/tag/${TAG}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "${PLATFORMS}" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' \
            > latest.json
          cat latest.json

      - name: Upload latest.json to the draft release
        if: steps.secrets.outputs.updater == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" latest.json \
            --repo "${{ github.repository }}" --clobber

  # ── Aggregate checksums after all binaries are built ────────
  aggregate-checksums:
    name: Aggregate Checksums
    needs: [build-binary-macos, build-binary-linux, build-binary-windows, build-desktop]
    # `always()` so a red desktop lane still produces the combined checksums for
    # the five binaries. The per-target downloads below are already `|| true`,
    # so a missing desktop file shortens the list rather than failing the job —
    # which is the right trade for a convenience artefact that nothing gates on.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Read version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all checksum files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          for TARGET in darwin-x64 darwin-arm64 linux-x64 linux-arm64 windows-x64; do
            gh release download "${TAG}" \
              --repo "${{ github.repository }}" \
              --pattern "sovrium-${VERSION}-${TARGET}.sha256" \
              --clobber || true
          done
          # The desktop installers. Named `sovrium-<version>-desktop-<slug>.sha256`
          # precisely so the `cat sovrium-${VERSION}-*.sha256` below picks them up
          # with no second mechanism.
          for SLUG in mac-arm64 mac-x64 windows-x64 linux-x64; do
            gh release download "${TAG}" \
              --repo "${{ github.repository }}" \
              --pattern "sovrium-${VERSION}-desktop-${SLUG}.sha256" \
              --clobber || true
          done

      - name: Create combined checksums file
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat sovrium-${VERSION}-*.sha256 > "sovrium-${VERSION}-checksums.txt" 2>/dev/null || true
          if [ -s "sovrium-${VERSION}-checksums.txt" ]; then
            echo "Combined checksums:"
            cat "sovrium-${VERSION}-checksums.txt"
          else
            echo "No checksums found to aggregate"
            exit 0
          fi

      - name: Upload combined checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.version.outputs.version }}"
          if [ -s "sovrium-${VERSION}-checksums.txt" ]; then
            gh release upload "${TAG}" \
              "sovrium-${VERSION}-checksums.txt" \
              --repo "${{ github.repository }}" \
              --clobber
          fi

  # ── Update Homebrew tap formula ─────────────────────────────
  # Depends on publish-release: update-homebrew-formula.ts fetches each
  # binary's .sha256 over plain HTTPS, and GitHub serves 404 on public
  # download URLs while a release is still a draft. By the time we run,
  # publish-release has flipped --draft=false so the URLs are servable.
  update-homebrew:
    name: Update Homebrew Formula
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sovrium repo
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bun run scripts/build/update-homebrew-formula.ts \
            --version "${VERSION}" \
            --output sovrium.rb

      - name: Verify tap token is configured
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set — cannot push to sovrium/homebrew-tap. Configure it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout homebrew-tap repo
        uses: actions/checkout@v5
        with:
          repository: sovrium/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula and push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p homebrew-tap/Formula
          cp sovrium.rb homebrew-tap/Formula/sovrium.rb

          cd homebrew-tap
          git config user.name "Sovrium CI"
          git config user.email "ci@sovrium.com"
          git add Formula/sovrium.rb
          git diff --cached --quiet && echo "No changes to formula" && exit 0
          git commit -m "sovrium ${VERSION}"
          git push

  # ── Update Scoop bucket for Windows ─────────────────────────
  # See update-homebrew for the publish-release dependency rationale.
  update-scoop:
    name: Update Scoop Manifest
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sovrium repo
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate Scoop manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bun run scripts/build/update-scoop-manifest.ts \
            --version "${VERSION}" \
            --output sovrium.json

      - name: Verify tap token is configured
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN secret is not set — cannot push to sovrium/scoop-bucket. Configure it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Checkout scoop-bucket repo
        uses: actions/checkout@v5
        with:
          repository: sovrium/scoop-bucket
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: scoop-bucket

      - name: Update manifest and push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p scoop-bucket/bucket
          cp sovrium.json scoop-bucket/bucket/sovrium.json

          cd scoop-bucket
          git config user.name "Sovrium CI"
          git config user.email "ci@sovrium.com"
          git add bucket/sovrium.json
          git diff --cached --quiet && echo "No changes to manifest" && exit 0
          git commit -m "sovrium ${VERSION}"
          git push

  # ── Publish templates/ to standalone sovrium/<slug>-template repos ──
  # Mirrors only ever reflect a PUBLISHED release: this job runs after
  # publish-release, from the tag's own tree (CI validated these configs
  # against this exact binary), and stamps .sovrium-version to match — a
  # mirror can never be newer than the binary it pins. The publisher loop is
  # resilient (one bad repo does not skip the rest) and fails LOUD: if any
  # mirror fails, the job exits non-zero and this run turns red. The binary
  # release itself already published (publish-release ran earlier), so
  # distribution is never blocked — a red here flags a post-release sync gap.
  publish-templates:
    name: Publish template repositories
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sovrium repo
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify templates publish token is configured
        env:
          TEMPLATES_PUBLISH_TOKEN: ${{ secrets.TEMPLATES_PUBLISH_TOKEN }}
        run: |
          if [ -z "${TEMPLATES_PUBLISH_TOKEN}" ]; then
            echo "TEMPLATES_PUBLISH_TOKEN secret is not configured — skipping template repo publish."
            exit 1
          fi

      - name: Publish template repositories
        env:
          GH_TOKEN: ${{ secrets.TEMPLATES_PUBLISH_TOKEN }}
        run: |
          bun run scripts/build/publish-template-repos.ts \
            --version "${{ steps.version.outputs.version }}"

  # ── Verify every template mirror landed at this release ─────
  # Gates the demo deploy: asserts each sovrium/<slug>-template repo carries the
  # v<version> tag AND a .sovrium-version matching this release. Fails red on any
  # lagging mirror (no continue-on-error).
  verify-mirrors:
    name: Verify template mirrors
    needs: [publish-templates]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sovrium repo
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Assert each mirror is at this release
        env:
          GH_TOKEN: ${{ secrets.TEMPLATES_PUBLISH_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          MISLAG=0
          for slug in $(jq -r 'keys[]' templates/catalog.json); do
            repo="sovrium/${slug}-template"
            stamped=$(gh api "repos/${repo}/contents/.sovrium-version" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null | tr -d '[:space:]' || true)
            tagged=$(gh api "repos/${repo}/git/refs/tags/${TAG}" --jq '.ref' 2>/dev/null || true)
            if [ "$stamped" != "$VERSION" ] || [ -z "$tagged" ]; then
              echo "MISLAG: ${repo} (stamped='${stamped}' tag='${tagged}', expected ${VERSION}/${TAG})"
              MISLAG=1
            else
              echo "OK: ${repo} @ ${VERSION}"
            fi
          done
          if [ "$MISLAG" -ne 0 ]; then
            echo "FAIL: one or more mirrors lag ${VERSION}"
            exit 1
          fi
          echo "OK: all template mirrors at ${VERSION}"

  # ── Auto-deploy the demo fleet to this release ──────────────
  # Runs after mirrors verify. SSHes to sovrium-demos-01 and runs
  # upgrade-fleet.sh (sha256-verified binary install + per-app tag checkout +
  # staggered restart + per-app health check + binary auto-rollback). Fails red
  # if any demo does not come back (no continue-on-error). ubuntu-latest has open
  # egress; the demo host's security group already allows inbound SSH.
  #
  # upgrade-fleet.sh is executed HOST-RESIDENT (/root/upgrade-fleet.sh on
  # sovrium-demos-01), never read from this job's checkout: docs/ is excluded
  # from the public GitHub mirror (scripts/filtered-mirror.sh), so a checkout of
  # this repo on GitHub can never contain it — piping it from `< docs/...` here
  # 404s every single run. The host copy (+ /root/manifest.json) is provisioned
  # and refreshed by the scaleway-infra-maintainer agent straight from the
  # Forgejo repo; see docs/development/demo-fleet/operations.md for the
  # "any script/manifest change must be scp'd before the next release" runbook.
  deploy-demos:
    name: Deploy demo fleet
    needs: [verify-mirrors]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sovrium repo
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify demo fleet SSH key is configured
        env:
          DEMO_FLEET_SSH_KEY: ${{ secrets.DEMO_FLEET_SSH_KEY }}
        run: |
          if [ -z "${DEMO_FLEET_SSH_KEY}" ]; then
            echo "::error::DEMO_FLEET_SSH_KEY secret is not set — cannot deploy the demo fleet."
            exit 1
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEMO_FLEET_SSH_KEY }}" > ~/.ssh/demo_fleet
          chmod 600 ~/.ssh/demo_fleet
          # TODO: pin the host key instead of TOFU keyscan.
          ssh-keyscan -H 163.172.175.246 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upgrade fleet to this release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Runs the HOST-RESIDENT copy of upgrade-fleet.sh (see the job
          # comment above for why: docs/ is stripped from the public mirror,
          # so this checkout never has the script). Its exit code is the job's
          # gate (staggered restart + health check + auto-rollback happen
          # host-side).
          ssh -i ~/.ssh/demo_fleet -o IdentitiesOnly=yes root@163.172.175.246 "
            set -e
            test -x /root/upgrade-fleet.sh || {
              echo 'upgrade-fleet.sh missing (or not executable) on the host at /root/upgrade-fleet.sh —'
              echo 'scp docs/development/demo-fleet/host/upgrade-fleet.sh to /root/ on sovrium-demos-01 first.'
              echo 'See: docs/development/demo-fleet/operations.md'
              exit 1
            }
            VERSION=${VERSION} bash /root/upgrade-fleet.sh
          "

  # ── Build and push multi-arch Docker image ──────────────────
  build-docker:
    name: Build Docker Image
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Linux binaries for Docker
        run: |
          bun run build:binary -- --target linux-x64
          bun run build:binary -- --target linux-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU for multi-arch
        uses: docker/setup-qemu-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

  # ── Publish the draft release once all assets are present ───
  # The release job creates a DRAFT so binary jobs can append assets
  # (immutable releases reject uploads to a published release). This job
  # verifies all 5 platform archives uploaded, then flips the draft to
  # published. If any archive is missing it exits without publishing,
  # leaving a recoverable draft. Homebrew/Scoop are best-effort tap pushes
  # and must NOT gate publication — hence `if: always()`.
  publish-release:
    name: Publish GitHub Release
    # Runs as soon as all binary archives + the aggregate checksums file
    # are uploaded so the release is non-draft *before* update-homebrew /
    # update-scoop fire — those jobs fetch .sha256 assets over plain HTTPS
    # and GitHub serves 404 on draft assets to unauthenticated clients.
    needs:
      - build-binary-macos
      - build-binary-linux
      - build-binary-windows
      - aggregate-checksums
      - build-desktop
      - assemble-updater-manifest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all binary assets present
        env:
          GH_TOKEN: ${{ github.token }}
          # The desktop installers are required only when the job that builds
          # them SUCCEEDED. The alternative — requiring them unconditionally —
          # would mean a broken desktop lane blocks the engine release too, and
          # the engine is what every existing install and every Docker pull
          # depends on. A failed lane still turns the whole run red; it just
          # does not hold the binaries hostage.
          #
          # This IS a product trade-off and it is worth naming: a release can
          # publish with five binaries and no installers, and the download page
          # would then serve the previous version's installers through its
          # version-less redirects. The run being red is the only signal.
          DESKTOP_RESULT: ${{ needs.build-desktop.result }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          REQUIRED=(
            "sovrium-${VERSION}-darwin-x64.tar.gz"
            "sovrium-${VERSION}-darwin-arm64.tar.gz"
            "sovrium-${VERSION}-linux-x64.tar.gz"
            "sovrium-${VERSION}-linux-arm64.tar.gz"
            "sovrium-${VERSION}-windows-x64.zip"
          )
          if [ "${DESKTOP_RESULT}" = "success" ]; then
            REQUIRED+=(
              "Sovrium-${VERSION}-mac-arm64.dmg"
              "Sovrium-mac-arm64.dmg"
              "Sovrium-${VERSION}-mac-x64.dmg"
              "Sovrium-mac-x64.dmg"
              "Sovrium-${VERSION}-windows-x64-setup.exe"
              "Sovrium-windows-x64-setup.exe"
              "Sovrium-${VERSION}-linux-x64.AppImage"
              "Sovrium-linux-x64.AppImage"
              "sovrium-${VERSION}-linux-amd64.deb"
              "sovrium-linux-amd64.deb"
            )
            echo "Desktop lane succeeded — its 10 installer assets are required."
          else
            echo "Desktop lane result is '${DESKTOP_RESULT}' — installers are not required."
            echo "The release will publish the engine binaries only, and this run is red."
          fi
          ASSETS=$(gh release view "${TAG}" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name')
          MISSING=0
          for ASSET in "${REQUIRED[@]}"; do
            if ! echo "${ASSETS}" | grep -qxF "${ASSET}"; then
              echo "MISSING: ${ASSET}"
              MISSING=1
            fi
          done
          if [ "${MISSING}" -ne 0 ]; then
            echo "FAIL: one or more required assets are missing — release stays a recoverable draft"
            exit 1
          fi
          echo "OK: ${#REQUIRED[@]} required assets present"

      - name: Publish release (un-draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release edit "${TAG}" \
            --repo "${{ github.repository }}" \
            --draft=false
