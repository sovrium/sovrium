name: Manual template repos publish (bootstrap & backfill)

# Manually-triggered companion to release.yml's publish-templates job.
# Use cases:
#   - the supervised first run that CREATES the 18 sovrium/<slug> template
#     repos (check "create missing repositories"),
#   - re-publishing a release whose automatic publish failed,
#   - repairing a single template repo (set "only").
#
# The checked-out tree is the tag's own tree and the stamped .sovrium-version
# is that same version — a mirror can never be newer than the binary it pins.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version whose tree to publish (e.g. 0.13.0 — checks out v0.13.0)'
        required: true
      only:
        description: 'Publish a single template slug (empty = all)'
        required: false
        default: ''
      create:
        description: 'Create missing repositories (bootstrap run)'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Dry run (build trees + plan, no mutations)'
        type: boolean
        required: false
        default: false

# Nothing at the top level; the one job states its own block.
permissions: {}

jobs:
  publish-templates:
    name: Publish template repositories (manual)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Dispatch inputs travel through `env:` and are validated before anything
      # uses them — never an expression inside `run:`, the expression-injection shape.
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          ONLY: ${{ inputs.only }}
        run: |
          if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'${VERSION}' is not a release version (expected e.g. 0.13.0, no leading v)"
            exit 1
          fi
          if [ -n "${ONLY}" ] && ! printf '%s' "${ONLY}" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "::error::'${ONLY}' is not a template slug"
            exit 1
          fi

      - name: Checkout tagged tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish template repositories
        env:
          GH_TOKEN: ${{ secrets.TEMPLATES_PUBLISH_TOKEN }}
          VERSION: ${{ inputs.version }}
          ONLY: ${{ inputs.only }}
          CREATE: ${{ inputs.create }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -- --version "${VERSION}"
          if [ -n "${ONLY}" ]; then set -- "$@" --only "${ONLY}"; fi
          if [ "${CREATE}" = "true" ]; then set -- "$@" --create; fi
          if [ "${DRY_RUN}" = "true" ]; then set -- "$@" --dry-run; fi
          bun run scripts/build/publish-template-repos.ts "$@"
